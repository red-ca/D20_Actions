# ============================================================================
# EXAMPLE ACTIONS PACK for D20 Actions
# ============================================================================
# WHERE TO PUT IT
#   Documents\inZOI\Mods\InGame\D20_Actions_1680C648\ui\d20_data\saved\actions\my_mod.cfg
#   Name the file after YOUR mod so it never collides with another pack. It is applied within about 20 seconds, no restart.
#
# HOW FILES ARE COMBINED
#   actions/base first, then every other file here in alphabetical order. A row with the same key replaces the earlier one,
#   a row with a new key is added. Never edit base: it is rewritten on every mod update.
#
# THE FORMAT
#   One row per line:  key=value        Lines starting with # are comments.  No spaces around the = sign.
#   This file has NO player-facing text. Every text lives in the matching language file (languages/english.my_mod.cfg).
#
# REPLACE the ids marked REPLACE with the real interaction bag ids of your mod. Skill, stat and buff names must be real
# game or D20 ids (examples below exist). Sections: 1 exact actions, 2 name patterns, 3 a new category, 4 failure outcomes,
# 5 modifiers, 6 rewards.

# ----------------------------------------------------------------------------
# 1. PUT ONE EXACT ACTION IN A CATEGORY THAT ALREADY EXISTS
# ----------------------------------------------------------------------------
# bag.<InteractionBagId>=<category>
# Existing categories: art chat conflict cooking dance dating dining etiquette family finance fitness games gaming housework humor
# kiss laundry logic media medicine mood_lover mood_spouse mourning music passion performance photo programming repair romance
# selfcare shower sink spa toilet tv
bag.REPLACE_MyMod_Workout=fitness

# An action that must NEVER roll (an exact bag row beats every pattern):
bag.REPLACE_MyMod_OpenMenu=none

# ----------------------------------------------------------------------------
# 2. CATCH A WHOLE FAMILY OF ACTIONS BY NAME
# ----------------------------------------------------------------------------
# pattern.<category>.match = Lua patterns, separated by " || "   (^ start of name, $ end, %d digit, %a letter, . any character)
# pattern.<category>.skip  = plain text parts that exclude an action (also separated by " || ")
# pattern.<category>.target=1 = only when the action has another character (partner actions)
# You may repeat a match line; every line in the same file is kept.
pattern.cooking.match=^REPLACE_MyMod_Cook
pattern.cooking.skip=Clean || Menu

# ----------------------------------------------------------------------------
# 3. OR MAKE A NEW CATEGORY (one kind of check)
# ----------------------------------------------------------------------------
# cat.<id>.label  = name shown in the settings panel. Keep the {cat.<id>.label} form: the real text is in the language file.
# cat.<id>.check  = name of the check shown on the roll widget (same rule).
# cat.<id>.dc     = difficulty class the d20 plus modifiers must reach (5 to 30).
# cat.<id>.cooldown = seconds before this category can roll again.
# cat.<id>.bonus  = buff given on a success that earned the bonus.
# Optional: cancel=0 (a failure never interrupts), chain=N (same action restarting within N seconds is one action),
# tolerant=1 (partner actions), dyn=0 (no dynamic difficulty), passBuff / failBuff, critFailMoney=-100, critWinMoney=500.
cat.my_mod.label={cat.my_mod.label}
cat.my_mod.check={cat.my_mod.check}
cat.my_mod.dc=13
cat.my_mod.cooldown=20
cat.my_mod.bonus=D20_Buff_FlowBody
pattern.my_mod.match=^REPLACE_MyMod_

# ----------------------------------------------------------------------------
# 4. WHAT CAN GO WRONG (failure outcomes of the new category)
# ----------------------------------------------------------------------------
# pool.<category>.<key>=attribute;attribute;...      One entry is picked by weight every time a roll fails.
# The message shown comes from the language file row  <category>.<key>  (here my_mod.exhausted and my_mod.mess).
#   w=30            weight (higher = more often)
#   anim=A,B        animations, one is played
#   buffs=Buff:30   buffs with minutes (Buff:30,Buff2:60). critBuffs= the same but only on a natural 1
#   crit=1          may also be picked on a natural 1.   critonly=1 only on a natural 1
#   money=-300..-100  takes a random amount (skipped if the household cannot pay).  money=20..80 gives money. Use ${m} in the text.
#   lethal=1        dangerous: only runs when the player turned Lethal hazards ON
pool.my_mod.exhausted=w=30;anim=Stand_Sigh;buffs=D20_Buff_Drained:30
pool.my_mod.mess=w=20;anim=EmoReact_Cringing_Embarassed;buffs=D20_Buff_Filth:30;crit=1
pool.my_mod.costly=w=10;anim=EmoReact_Sad_Heartbroken;money=-60..-20;critonly=1

# ----------------------------------------------------------------------------
# 5. WHAT ADDS TO OR TAKES FROM THE D20 (modifiers)
# ----------------------------------------------------------------------------
# profile.<category>.skill   = the Zoi's skill; its level adds up to +5
# profile.<category>.stats   = needs that help or hurt, Need:weight,...
# profile.<category>.pos / neg = traits that give +1 / -1.   buffPos / buffNeg = buffs that give +1 / -1
profile.my_mod.skill=Cooking
profile.my_mod.stats=Energy:0.5
profile.my_mod.pos=Achiever,Cheerful
profile.my_mod.neg=Lazy,Gloomy

# ----------------------------------------------------------------------------
# 6. A PRIZE ON A SUCCESS
# ----------------------------------------------------------------------------
# reward.<id>=cat=<category>;match=<patterns>;money=<amount or low..high>;chance=<percent>;on=bonus|crit_success
# on=crit_success pays on a natural 20, on=bonus when the roll earned the bonus. List crit_success rewards first.
# The message is the language row  <category>.<id>  (here my_mod.my_mod_tip). ${m} in the text is the amount.
reward.my_mod_tip=cat=my_mod;match=.;money=20..80;on=crit_success
