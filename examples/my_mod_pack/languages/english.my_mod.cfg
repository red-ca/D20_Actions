# ============================================================================
# EXAMPLE LANGUAGE FILE for D20 Actions (texts of the actions pack)
# ============================================================================
# WHERE TO PUT IT
#   Documents\inZOI\Mods\InGame\D20_Actions_1680C648\ui\d20_data\saved\languages\english.my_mod.cfg
#   The name is  <language>.<your_pack>. Texts load as: english.base, other english files, then the player's chosen language on top.
#   A row a language does not have falls back to English.
#
# THE FORMAT
#   key=text            One row per line. Nothing after a # at the start of a line is read.
#   Variants: separate several texts of one message with " || " (space, two bars, space). One is picked at random.
#   Give every key at least 3 variants so the messages stay fresh. No line breaks inside a row.
#   Placeholders (keep them exactly as written):
#     {a} your Zoi's first name    {t} the other character's first name (partner actions)    ${m} a money amount, with separators
#     ${t} the taxes in the finance toast    {k} a relative word (parent, sibling...)
#   Write for any gender: avoid he and she.
#
# TRANSLATING THIS PACK: copy the file to <language>.my_mod.cfg (for example español.my_mod.cfg), keep every key and every
# placeholder, and translate only what comes after the first = sign.
#
# WHICH KEYS A CATEGORY NEEDS
#   cat.<id>.label / cat.<id>.check   names in the settings panel and on the roll widget
#   <id>.bonus          a success that earned the bonus (the cat.<id>.bonus buff)
#   <id>.crit_success   natural 20
#   <id>.soft_fail      an ordinary failure with no effect
#   <id>.crit_fail      natural 1
#   <id>.<key>          one row for every pool.<id>.<key> in the actions file
#   <id>.<rewardId>     one row for every reward.<rewardId> of the category

# ----------------------------------------------------------------------------
# Category names
# ----------------------------------------------------------------------------
cat.my_mod.label=My Mod
cat.my_mod.check=My Mod Check

# ----------------------------------------------------------------------------
# Result texts (every category has these four)
# ----------------------------------------------------------------------------
my_mod.bonus=It all comes together. You feel like you could do it again. || A smooth run and a quiet smile. || Everything lands. Even the cat looks impressed.
my_mod.crit_success=A perfect one. The kind you tell stories about. || Nat 20. Somebody should write this down. || Flawless, and the room knows it.
my_mod.soft_fail=Not your best attempt, but nothing breaks. || It does not go well, and it does not go badly. || A shrug, a sigh and on you go.
my_mod.crit_fail=Spectacularly wrong. You will remember this one. || Everything that could go wrong tried to go wrong at once. || The universe takes a bow. It was not on your side.

# ----------------------------------------------------------------------------
# One row per failure outcome (pool.my_mod.<key>)
# ----------------------------------------------------------------------------
my_mod.exhausted=You run out of steam halfway through. || Your energy leaves quietly through the back door. || That took more out of you than expected.
my_mod.mess=A small disaster, tidily contained. Mostly. || Something got on something else. || The cleanup will take a while.
my_mod.costly=That mistake cost you ${m}. || ${m} gone, and a lesson learned. || A very small mistake at a very large price: ${m}.

# ----------------------------------------------------------------------------
# One row per reward (reward.my_mod_tip). ${m} is the amount paid.
# ----------------------------------------------------------------------------
my_mod.my_mod_tip=Someone leaves a tip: ${m}. Nobody knows why. || A passer-by hands you ${m} and nods. || ${m} appears from somewhere. Take it.
