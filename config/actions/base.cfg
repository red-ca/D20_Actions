# ============================================================================
# REWARDS (extra prizes on a success)
# ============================================================================
# reward.<id>=cat=<category>;match=<patterns>;skip=<parts>;money=<amount or low..high>;chance=<percent>;on=bonus|crit_success
# When a roll of that category earns the bonus (on=bonus) or is a natural 20 (on=crit_success) and the action name matches, the household receives the money
# and the message <cat>.<id> from the language file is shown ({m} in the message = the amount).  money=100..300 is a random amount in that range.
# chance = percent of the time the prize is paid (default 100); a miss lets the next reward of the category try. List a crit_success reward before the bonus one.
# rel = Friendship:3 adds to the relationship with the other character (partner actions).  buffs = Buff:minutes gives extra buffs with the prize.

