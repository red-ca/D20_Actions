# ============================================================================
# FAILURE POOLS (what happens when a roll fails)
# ============================================================================
# Each category has a pool of outcomes; one is picked by weight (w) every time a roll fails. Rows: pool.<cat>.<key>=attribute;attribute;...
# w = weight.  anim = animations (comma separated, one is played).  buffs = Buff:minutes,Buff2:minutes.  critBuffs = same, only on a natural 1.
# money = -300..-100 takes a random amount from the household (the entry is skipped when it cannot pay); money = 50 or 20..80 gives money. Give the message {m} for the amount.
# bag = patterns (||): the entry only fits those actions.  social = 1: only in actions with another character, social = 0: only alone.  rel = Friendship:-3,Romance:2 changes the relationship with the other character.
# crit=1 = may also be picked on a natural 1.  critonly=1 = only on a natural 1.  lethal=1 = dangerous: only when Lethal hazards is ON in the settings, otherwise
# the safe twin runs (the 4th part of obj) or nothing is spawned.  obj = object effect: row@target|self@delay@saferow (the rows are the mod's own, for example D20_Puddle_Here).
# cancelat = seconds the action keeps playing before the cancel.  react / animat = reaction of the target character in partner actions.  fire=1 is ignored now.
# chance = percent: the outcome is rolled first and replaces the normal pick (critonly=1 = only on a natural 1).  gate = relationship conditions with the other character, all must hold:
# nofamily, family, Friendship<=25, Romance<=25, Business>10 (values -100..100).  die = LifeTrigger@percent: with Lethal hazards ON the character may die (ElectricShock, Fire, Explosion, Slipped, Heatstroke, Overwork, Poison).
# fireout = seconds until a real fire is put out (0 = never).  react = fight = the game's fight talk, react = punch = a knock-down punch (pair it with die=Slipped@5 for a small chance of death), lethalonly = 1 = only with Lethal hazards ON, kind = electric | water = only for those repairs, report = 1 raises an Assault report on you.  A message <key>_safe is used when lethal hazards are off.
# The message shown comes from the language file: <cat>.<key> (see ROLL MESSAGES in languages/english.base).

