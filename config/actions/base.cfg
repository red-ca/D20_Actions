# ============================================================================
# ABOUT THIS FILE
# ============================================================================
# This file says WHICH actions the mod rolls a D20 for and WHAT happens after the roll (failure outcomes, rewards, modifiers).
#
# How it is generated: the mod writes this file itself the first time it runs and rewrites it when the version number above changes (a mod update).
# Do not edit it, your changes would be replaced. Put your own rows in another file next to it, for example actions/my_pack.
#
# How files are combined: base first, then every other file in alphabetical order. A row with the same key replaces the earlier one, a row with a new key
# is added. The mod rereads this folder every 20 seconds or so: save the file and it is applied, no restart needed.
#
# Format: one row per line, key=value. Lines starting with # are comments. Names of actions are the game's interaction bag ids (for example Use_PullUpBar).
# All player-facing text (category names, roll messages) lives in the language files (languages/english.base), never here.
#
# To add a whole new category (for example police): cat.police.* + pattern.police.match (or bag.* rows) + pool.police.* + profile.police.*,
# then its texts in a language file: cat.police.label, cat.police.check and one police.<key> row per outcome.
#
# Sections: Categories, Bag IDs, Name patterns, Mood versions, Failure pools, Rewards, Modifier profiles.

# ============================================================================
# CATEGORIES
# ============================================================================
# A category is one kind of check; every action belongs to exactly one. Rows: cat.<id>.<field>=<value>
# label = name shown in the settings ({key} = a language text).  dc = difficulty the d20 + modifiers must reach.  cooldown = seconds before the category can roll again.
# check = name of the check on the roll widget.  bonus = buff given on a success that earned the bonus.  passBuff / failBuff = buff given on every success / failure (passBoth / failBoth = 1 also gives it to the other character).
# cancel = 0: a failure never interrupts the action (its effect plays when the action ends).  chain = N: the same action restarting within N seconds is the same
# action, no new roll (dances repeat).  tolerant = 1: keep waiting when the game swaps the action (partner actions).  followup = pattern of the game's chained
# dyn = 0 turns Dynamic difficulty off for this category.  next action to hold back after a lethal outcome.  messChance / cleanAllChance = housework extras.
# critFailMoney = a negative amount: a natural 1 takes it from the household when it has the funds.  critWinMoney = a natural 20 pays this amount.

