# ============================================================================
# DYNAMIC DIFFICULTY (optional: the Settings panel has a button for it)
# ============================================================================
# With it ON the difficulty of a roll (DC) changes: a stacked roll (high modifier) gets harder, a weak one gets a little easier, and the main emotion of the Zoi moves it.
# The DC never goes below 5 or above 30. cat.<cat>.dyn=0 turns it off for one category.
# free = the modifier that counts as normal (above it the DC rises by up per point, below it it falls by down per point, at most downCap).
# emo + per * (modifiers that count) = how much one emotion level moves the DC (a positive emotion lowers it, a negative one raises it), at most emoCap levels.
# good / bad = the emotions that count as positive / negative, separated by commas.

dyn.free=6
dyn.up=1
dyn.down=0.5
dyn.downCap=3
dyn.emo=1.5
dyn.per=0.25
dyn.emoCap=3
dyn.good=Preoccupied,Curious,Convinced,Excited,Enchanting,Funny,Calm,Touched
dyn.bad=Bored,Tired,Sad,Uncomfortable,Uneasy,Cringing,Irritated,Worried,Surprised

# ============================================================================
# NAME PATTERNS (families of actions)
# ============================================================================
# A pattern catches many actions by name so they do not have to be listed one by one. An exact bag.* row wins over a pattern.
# pattern.<cat>.match = Lua patterns separated by ' || '  (^ = start of the name, $ = end, %d = a digit, %a = a letter, . = any character).
# pattern.<cat>.skip = plain text parts that exclude an action.  pattern.<cat>.target=1 = only when the action has a target character (partner actions).

# -- tv
pattern.tv.match=^On_.*TV

# -- shower
pattern.shower.match=^Shower%d || ^Use_Bath

# -- kiss
pattern.kiss.match=Kiss || ^Co_Peck_ || ^Co_DeepHug_ || ^Co_Lover_Sit_Peck || ^Co_Spouse_Peck_ || ^Co_Spouse_DeepHug_ || ^Co_Spouse_Sit_Peck || ^Co_PicturePose_Couple_B$ || ^Co_Skill_Charisma_06$
pattern.kiss.skip=Fail || Feedback || FeedBack
pattern.kiss.target=1

# -- mourning
