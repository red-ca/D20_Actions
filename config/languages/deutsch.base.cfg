fitness.bonus=Es macht Klick. Die Gewichte fühlen sich leichter an und deine Haltung sieht verdächtig professionell aus. || Du kommst in den Flow und fühlst dich unaufhaltsam. Der Spiegel im Studio nickt anerkennend.
fitness.crit_success=Legendäre Wiederholung! Irgendwo weint ein Proteinshaker vor Stolz.
fitness.soft_fail=Zäher Satz, aber du quälst dich trotzdem durch. || Deine Haltung wackelt und dein Ego auch, aber die Wiederholung klappt.
fitness.crit_fail=Du gehst voll in den Lift und dein Körper reicht eine offizielle Beschwerde ein. Der Satz ist vorbei, bevor er anfängt. || Aus deinem Rücken kommt ein Geräusch, das kein menschlicher Rücken machen sollte. Wiederholung gestrichen. || Die Stange gewinnt. Sie gewinnt immer. Du schleichst davon, den Stolz in der Schlinge.
fitness.heat=Das Training wird zur Saunasitzung. Du fächelst dir Luft zu, der Schweiß läuft und der Raum fängt an sich zu drehen. || Du übertreibst es in der Hitze. Das Shirt ist durchnässt, der Kopf ist rot und dein Körper verlangt nach einem Ventilator, einem Ozean und einem Nickerchen. || Der Hitzschlag klopft höflich an und tritt dann die Tür ein. Du taumelst hinaus, triefend vor Schweiß.
fitness.exhausted=Bei der letzten Wiederholung geben deine Beine nach. Du sackst zusammen, starrst an die Decke und überdenkst deine Lebensentscheidungen. || Du gehst über dein Limit und das Limit schlägt zurück. Ab auf den Boden.
fitness.sore=Irgendwas in deinem Körper legt Beschwerde ein, die du zwei Tage spüren wirst. Morgen wird lustig. || Du hast es übertrieben. Deine Muskeln rufen den Streik aus, mit sofortiger Wirkung.
fitness.slip=Dein Fuß rutscht im schlimmsten Moment weg und die Schwerkraft gewinnt die Diskussion. || Du verlierst das Gleichgewicht und drehst dich wie ein schlecht geplanter Tanzschritt.
fitness.embarrassed=Das hat garantiert jemand gesehen. Du tust so, als gehöre es zur Übung. || Du vermasselst die Bewegung so sehr, dass sogar die Geräte wegschauen.
fitness.sweat_cold=Du verzichtest aufs Handtuch und der Ventilator im Studio erwischt dich genau richtig. Abends schniefst du. Erkältung verdient. || Schweiß, Klimaanlage und schlechtes Urteilsvermögen ergeben eine Erkältung. Du hast es kommen sehen. || Dein Körper findet das Training etwas zu viel und schickt dir eine Erkältung als Bewertung.
fitness.lift_drop=Du hebst {t} mit ganzer Liebe hoch und die Schwerkraft holt sich {t} zurück. Die Landung klappt auf beiden Füßen, meistens. || Der Hebeversuch schafft es halb nach oben, dann beschweren sich deine Arme. {t} plumpst lachend auf den Boden. || Du schwingst {t} in die Luft, verlierst den Griff und ihr landet beide als Haufen auf dem Boden.
fitness.back_strain=Du hebst {t} hoch und irgendwas in deinem Rücken sagt Nein. Du hältst die Pose eine Sekunde und bereust es. || Liebe ist stark, aber dein unterer Rücken sieht das anders. {t} setzt dich ab und zuckt mit dir zusammen. || Der große Hebeversuch endet mit einem lauten Knacken in der Wirbelsäule. {t} fragt, ob alles okay ist. Du sagst nein.
fitness.show_off_fail=Du willst stark wirken und hebst {t} wie ein Held hoch. Du siehst aus wie jemand, der Möbel schleppt. || Die große Geste landet irgendwo zwischen beeindruckend und urkomisch. {t} klatscht leise. || Du spannst vor dem Heben die Muskeln an. Es geht schief. {t} starrt erst auf deine Arme, dann auf dich.
fitness.mine_strain=Du schwingst die Spitzhacke mit viel zu viel Selbstvertrauen. Dein Rücken reicht eine offizielle Beschwerde ein. || Der Fels gewinnt. Du bekommst eine Blase und jede Menge Staub.
fitness.treadmill_stumble=Das Laufband läuft weiter. Du kurz nicht. || Ein kleines Wackeln wird zu einem sehr öffentlichen Stolperer.
fitness.fail=Deine Arme streiken auf halber Strecke. Du tust so, als wolltest du eine Pause machen. || Du beäugst die Gewichte und die Gewichte beäugen dich zurück. Heute nicht.
fitness.pass=Du drückst den Satz ohne Probleme durch. || Saubere Form, ruhige Atmung. Ein ganz normaler Tag im Büro.
kiss.bonus=Der war besonders. {t} wird sich noch eine Weile daran erinnern. || Funken! {t} strahlt und du auch.
kiss.crit_success=Ein Kuss für die Geschichtsbücher. {t} vergisst den eigenen Namen.
kiss.soft_fail=Der Kuss ist ein bisschen ungeschickt und ein bisschen peinlich, aber {t} lässt es durchgehen.
kiss.slap=Du beugst dich vor, um {t} zu küssen, aber {t} wird überrascht und holt zur Ohrfeige aus!
kiss.runaway=Du beugst dich zum Kuss vor und {t} rennt davon, als hättest du eine Steuererklärung angeboten. || {t} wirft einen Blick auf den heranrückenden Kuss und spurtet los. Mutige Strategie, {a}.
kiss.embarrassed=Du beugst dich zum Kuss vor. {t} wird knallrot, betrachtet die eigenen Schuhe und wünscht sich, der Boden würde sich auftun. || {t} erstarrt, wird rot bis an die Ohren und murmelt etwas über das Wetter.
kiss.angry={t} fand den Schmollmund gar nicht gut. Du bist wütend notiert, {a}. || Du gehst auf den Kuss los und {t} geht auf den wütenden Blick los. Fairer Tausch?
kiss.rejection={t} lehnt den Kuss höflich, aber bestimmt ab. Die Stille ist lauter als die Abfuhr. || {t} dreht den Kopf genau rechtzeitig weg. Smooth, {a}. Sehr smooth.
kiss.sad={t} wirft dir einen schmerzvollen Blick und einen langen Seufzer zu. So nicht. || Der Kuss geht daneben und die Stimmung auch. {t} schaut weg.
kiss.knockout={t} rastet aus und schlägt zu. Der Schlag sitzt und du gehst zu Boden wie ein Wäschesack. || Der Spruch war der Tropfen zu viel. {t} holt aus und der Raum kippt. Du kommst zu dir und starrst an die Decke. || {t} läuft knallrot an und trifft dich voll. Deine Würde verlässt das Gebäude, bevor du den Boden berührst.
kiss.fight={t} hat genug. Ein schneller Schubser, ein lautes Wort und plötzlich steckst du mitten in einer Schlägerei. || Das war einen Schritt zu weit. {t} geht in Stellung und kommt mit fliegenden Fäusten auf dich zu. || {t} nimmt es sehr persönlich und antwortet mit den Fäusten. Du hast es herausgefordert.
kiss.police={t} hat genug und wählt schon die Nummer. Eine Anzeige ist unterwegs zu dir. || {t} starrt dich kurz an und sagt: „Ich rufe die Polizei.“ Es klingt ziemlich ernst gemeint. || Das lief schlecht. {t} erstattet Anzeige gegen dich, noch bevor du dich fertig entschuldigt hast.
kiss.spark=Da war ein Funke, den ihr beide gespürt habt. Etwas Warmes bleibt zwischen dir und {t}. || Der Moment hinterlässt ein Leuchten. Du und {t} fühlt euch jetzt ein bisschen näher. || Ein winziges Flattern, ein stilles Lächeln. Die Luft zwischen dir und {t} bleibt warm.
kiss.knockout_death=Der Schlag von {t} sitzt, du fällst zu Boden... und wachst nicht mehr auf. Das Ende. || Ein Schlag von {t}. Du sackst um, der Raum wird still und du stehst nicht wieder auf. Abspann. || {t} schlägt ein einziges Mal zu. Es ist leider das Letzte, was du mitbekommst. Das Ende.
kiss.pass=Der Kuss landet sanft. {t} schmilzt ein bisschen dahin. || Ein zarter Moment. {t} lächelt dich danach an.
chat.bonus=Das Gespräch fließt einfach. Du und {t} vergesst die Zeit, und zwar auf die beste Art. || Ein lockeres Gespräch, ein echtes Lachen und das Gefühl, alles sagen zu können. Ein richtig gutes. || {t} öffnet sich ein bisschen und du auch. Es fühlt sich leicht an.
chat.crit_success=Du sagst genau das Richtige im genau richtigen Moment. {t} lächelt auf eine Art, die du nicht vergisst. || Ein perfektes Gespräch. Jeder Satz sitzt und jede Pause fühlt sich warm an. {t} will gar nicht aufhören. || Das Gespräch geht unbemerkt in die Tiefe. {t} sieht dich an, als hättest du gerade den Nagel auf den Kopf getroffen.
chat.soft_fail=Das Gespräch humpelt dahin und endet höflich. Niemand sagt, was eigentlich gesagt werden sollte. || Ein fades Gespräch, das nirgendwohin führt. Ihr geht beide ein bisschen leichter und ein bisschen gelangweilter weg. || Ist okay. Einfach nur okay. Ihr nickt beide und macht weiter.
chat.crit_fail=Jeder Satz kommt falsch an. Am Ende wäre {t} lieber überall sonst. || Du sagst etwas wirklich Unglückliches. Die Luft wird fest und {t} starrt die Wand an. || Ein Gesprächsdesaster. {t} braucht eine Minute und wahrscheinlich einen Snack.
chat.silence=Du öffnest den Mund und nichts passiert. {t} füllt die Stille, indem die Decke genau studiert wird. || Das Gespräch versiegt auf halbem Weg. Du und {t} nickt euch zu wie alte Möbelstücke. || Eine peinliche Lücke wächst zwischen euch. Ihr tut beide so, als wäre es angenehmes Schweigen.
chat.wrong_topic=Du erwischst genau das Thema, das {t} hasst. Das Lächeln von {t} gefriert zu etwas Höflich-Distanziertem. || Du schneidest das falsche Thema zur falschen Zeit an. {t} wechselt das Thema mit der Anmut eines Autounfalls. || Irgendwie trittst du auf einen wunden Punkt. {t} sagt „klar“ in einem Ton, der „nein“ heißt.
chat.overshare=Du erzählst viel zu viel, viel zu schnell. {t} guckt, als würde gerade ein sehr langes Kleingedrucktes gelesen. || Dein Smalltalk wird zur Beichte. {t} hört zu, nickt langsam und sucht nach dem Ausgang. || Du springst mit einem Atemzug von „Wie geht's“ zu deiner Lebensgeschichte. {t} braucht einen Moment.
chat.voice_cracks=Mitten in den großen Worten bricht dir die Stimme. {t} bleibt freundlich, aber der Moment ist jetzt zerbrechlich. || Das hast du geübt. Das Üben hat nichts gebracht. Deine Stimme wackelt und gibt auf. || Die Worte kommen kleiner raus, als sie sich in deinem Kopf anfühlten. {t} wartet höflich, dass du es noch mal versuchst.
chat.too_intense=Das war viel und viel zu schnell. {t} weicht einen halben Schritt zurück und lächelt sehr vorsichtig. || Du sagst es von ganzem Herzen. {t} hört es mit einem Hauch zu viel Panik. || Das Versprechen wiegt schwer. {t} lacht nervös und wechselt das Thema.
chat.advice_backfires=Du bittest um Rat und widersprichst jedem Wort davon. {t} gibt auf und nickt einfach mit. || Der Rat ist gut. Du ignorierst ihn laut und deutlich. {t} sieht aus, als hätte {t} diesen Film schon mal gesehen. || {t} gibt dir einen ehrlichen Rat. Du nimmst ihn schlecht auf und die Stimmung kühlt ab.
chat.awkward_hello=Du sagst Hallo und deine Stimme wählt eine zufällige Tonhöhe. {t} grüßt aus Gnade in derselben Tonhöhe zurück. || Die Begrüßung durchläuft drei Versionen, bevor sie sitzt. || „Hi. Hallo. Hey.“ Du hast alle drei gleichzeitig geschafft.
chat.makeup_fails=Du sagst, es tut dir leid. {t} hört „Tut mir leid, dass du das so siehst“. Das ist nicht dasselbe. || Die Entschuldigung dreht sich im Kreis. {t} ist immer noch verletzt und jetzt auch verwirrt. || Du willst dich versöhnen und fängst irgendwie einen zweiten Streit an.
chat.life_talk_drags=Das tiefe Gespräch wird tiefer und schwerer, bis keiner mehr weiß, wie die ursprüngliche Frage lautete. || Du philosophierst eine Weile. {t} gähnt diskret in den Ärmel. || „Was ist der Sinn von allem?“ ist ein schwerer Einstieg. Das Gespräch erholt sich nie wieder.
chat.gossip_leaks=Der Klatsch, den du teilst, ist ein bisschen zu saftig. {t} ist beleidigt, mit hineingezogen zu werden. || Flüstern ist weniger leise als gehofft. Jemand hat alles gehört. || Du verplapperst dich und ein Teil davon landet bei {t}.
chat.advice_ignored=Du gibst weisen Beziehungsrat. {t} hört nichts davon an und ist leicht genervt. || Dein Rat ist völlig in Ordnung und komplett unerwünscht. {t} seufzt. || Du sagst „Vertrau mir“. {t} tut es nicht.
chat.kindness_unnoticed=Du tust etwas Nettes und {t} merkt es nicht. Es zählt trotzdem, sagst du dir. || Eine kleine Geste der Freundlichkeit, höflich übersehen. Du kommst dir ein bisschen albern vor. || Es war eine süße Geste. Sie landete bei einem höflichen Achselzucken.
chat.flat_greeting=Dein Hallo klingt wie ein Tippfehler. {t} tut höflich so, als hätte {t} nichts gehört. || Die Begrüßung kommt steif und eine Sekunde zu spät. {t} winkt kurz und verlegen. || Du sagst die richtigen Worte mit der falschen Stimme.
chat.rumor_awkward=Das Gerücht wird schnell komisch. Niemand weiß, wohin als Nächstes geschaut werden soll. || Du hörst zu, nickst und sagst nichts, ziemlich laut. || Das Gespräch startet warm und wird langsam lauwarm.
chat.fire_silence=Ihr sitzt zusammen am Feuer und keinem fällt etwas ein. Das Knistern übernimmt das Reden. || Die Stille zieht sich. {t} starrt in die Flammen und du auch, ein bisschen zu lange. || Du wolltest einen ruhigen Moment teilen. Es wird einfach nur ein ruhiger Moment.
chat.lesson_flops=Du erklärst die Grundlagen dreimal. Die Lernenden nicken und verstehen nichts. || Dein Lehrtalent ist schwächer als dein Können. Ihr seid beide erschöpft. || Die Stunde läuft aus dem Ruder und endet mit einem verlegenen „Wir probieren es morgen noch mal“.
chat.knockout={t} rastet aus und schlägt zu. Der Schlag sitzt und du gehst zu Boden wie ein Wäschesack. || Der Spruch war der Tropfen zu viel. {t} holt aus und der Raum kippt. Du kommst zu dir und starrst an die Decke. || {t} läuft knallrot an und trifft dich voll. Deine Würde verlässt das Gebäude, bevor du den Boden berührst.
chat.fight={t} hat genug. Ein schneller Schubser, ein lautes Wort und plötzlich steckst du mitten in einer Schlägerei. || Das war einen Schritt zu weit. {t} geht in Stellung und kommt mit fliegenden Fäusten auf dich zu. || {t} nimmt es sehr persönlich und antwortet mit den Fäusten. Du hast es herausgefordert.
chat.police={t} hat genug und wählt schon die Nummer. Eine Anzeige ist unterwegs zu dir. || {t} starrt dich kurz an und sagt: „Ich rufe die Polizei.“ Es klingt ziemlich ernst gemeint. || Das lief schlecht. {t} erstattet Anzeige gegen dich, noch bevor du dich fertig entschuldigt hast.
chat.deep_bond=Für einen Moment seid du und {t} voll auf einer Wellenlänge. Es fühlt sich an wie eine Freundschaft, die es schon seit Jahren gibt. || Die Worte fließen und nichts wird zurückgehalten. {t} sieht dich an, als gehörtest du zur Familie. || Ein echtes, tiefes Gespräch. Du gehst mit einer stärkeren Bindung und einem warmen Gefühl, das bleibt.
chat.closer=Dieses Gespräch hat euch näher zusammengebracht. Du spürst es, noch bevor {t} etwas sagt. || Etwas verschiebt sich zum Guten. Du und {t} fühlt euch jetzt ein bisschen wohler miteinander. || Das Gespräch wird zu einem echten Moment. Du und {t} geht mit dem Gefühl von mehr Nähe auseinander.
chat.knockout_death=Der Schlag von {t} sitzt, du fällst zu Boden... und wachst nicht mehr auf. Das Ende. || Ein Schlag von {t}. Du sackst um, der Raum wird still und du stehst nicht wieder auf. Abspann. || {t} schlägt ein einziges Mal zu. Es ist leider das Letzte, was du mitbekommst. Das Ende.
etiquette.bonus=Ein fester, freundlicher Austausch. {t} sieht dich mit einem Funken Respekt an. || Perfekte Manieren und genau die richtige Portion Selbstvertrauen. Die Stimmung ist entspannt und warm. || Bei dir wirkt es mühelos. {t} entspannt sich und der ganze Raum entspannt mit.
etiquette.crit_success=Makellos. {t} lächelt, als hättest du gerade einen Deal abgeschlossen, und vielleicht hast du das auch. || Charme, Timing und ein perfekter Händedruck. {t} ist sichtlich beeindruckt und lässt es dich wissen. || Du bist ein Profi. Ein echter. {t} nimmt sich vor, dich überall herumzureichen.
etiquette.soft_fail=Es ist steif und ein bisschen seltsam, aber es findet technisch statt. || Ein gezwungenes Lächeln, ein kurzes Nicken und eine leicht komische Stille. Nicht deine Sternstunde. || Kein Desaster, kein Triumph. Du gehst schnell zum Nächsten über.
etiquette.crit_fail=Alles geht gleichzeitig schief. {t} tut höflich so, als wäre nichts davon passiert. || Du schaffst es, in einer einzigen Geste unhöflich, tollpatschig und laut zu sein. Eine seltene Leistung. || Der Moment fällt zusammen wie ein missratenes Soufflé. {t} wird in etwa drei Jahren davon erzählen.
etiquette.sweaty_palm=Deine Handfläche ist glitschig. {t} schüttelt sie und wischt sich dann leise die Hand an der Hose ab, als hätte es niemand gesehen. || Der Händedruck ist ein feuchtes, schlaffes Etwas. {t} lächelt höflich und zählt die Sekunden. || Du drückst zu fest, dann zu locker, dann schwitzt du überall. {t} wird sich an diesen Händedruck erinnern.
etiquette.card_drop=Du reichst deine Visitenkarte rüber und sie flattert ins Nichts. {t} hebt sie für dich auf, geknickt. || Die Karte rutscht dir aus den Fingern und landet mit der Vorderseite nach unten. {t} liest aus Freundlichkeit die Rückseite. || Du überreichst eine Karte mit einem Kaffeering drauf. {t} bedankt sich so, wie man sich beim Zahnarzt bedankt.
etiquette.toast_spill=Du hebst dein Glas ein bisschen zu begeistert. Der Drink landet auf {t}, das Anstoßen geht ins Leere. || Klirr. Platsch. {t} schaut aufs Shirt, dann auf dich, dann wieder aufs Shirt. || Der Toast ist perfekt, bis das Glas kippt. Die Hälfte des Drinks landet auf dem Tisch, die andere Hälfte auf der Würde.
etiquette.bribe_caught=Du schiebst den Umschlag rüber. {t} zählt die Scheine laut mit und der ganze Raum hört mit. ${m} sind weg und dein Ruf gleich mit. || Jemand sieht den Austausch. Das „Geschenk“ kostet dich ${m} und eine sehr lange Erklärung. || Die Bestechung sollte dezent sein. {t} verkündet den Betrag dem ganzen Raum und ${m} verschwinden von deinem Konto.
etiquette.errand_refused={t} schaut auf die Liste, schaut auf dich und sagt: „Ich bin kein Lieferdienst.“ || Du bittest um einen Botengang. {t} seufzt tief und schafft es irgendwie, gleichzeitig beleidigt und müde zu sein. || Die Bitte um den Botengang kommt schlecht an. {t} verschränkt die Arme. Der Botengang bleibt ungemacht.
etiquette.pitch_flop=Du fängst mit Business-Buzzwords an und endest mit nichts. {t} nickt so, wie man bei Spam nickt. || Der Pitch klingt in deinem Kopf clever. Laut ausgesprochen fragt {t}, ob bei dir alles okay ist. || Du sagst zweimal „Synergie“ und einmal „Hebel“. {t} schaut unauffällig aufs Handy.
etiquette.stiff=Du klingst wie ein Roboter, der ein Businesshandbuch vorliest. {t} starrt dich an und weiß nicht, ob gelacht werden darf. || Die Geste ist höflich und steif wie ein Brett. Der Moment geht vorbei, ohne dass jemand etwas fühlt. || Du willst professionell wirken und landest bei „peinliche Statue“. {t} versucht zu retten, was nicht zu retten ist.
etiquette.pitch_ignored=Du präsentierst deine Idee mit Energie. {t} nickt und schreibt nichts auf. || „Interessant“, sagt {t} in dem Ton, den man für „nein“ benutzt. || Du legst deine Ziele auf den Tisch und {t} gibt dir ein höfliches Lächeln zurück.
etiquette.info_leaked=Die Information, die du teilst, stellt sich als falsch heraus, und der Schaden bleibt an dir hängen. || Du verrätst einen Tipp, der eigentlich privat bleiben sollte. {t} ist sauer und es kostet dich. || Ein vertrauliches Detail rutscht raus. Teuer.
etiquette.forced_cheer=Du sagst, du freust dich über das Wachstum. Es klingt wie ein Geiselvideo. || Die Begeisterung ist so aufgesetzt, dass {t} fragt, ob alles in Ordnung ist. || Deine Begeisterung ist einstudiert und man merkt es.
etiquette.formal_flub=Du begrüßt {t} sehr förmlich und mit dem falschen Titel. || Zu förmlich, dann zu locker, dann beides gleichzeitig. {t} ist ratlos. || Die höfliche Begrüßung stolpert über die eigenen Manieren.
etiquette.nosy_question=Du stellst eine Frage, die ein bisschen zu neugierig ist. {t} antwortet knapp. || Die Frage hängt einen Moment zu lang in der Luft. {t} schaut weg. || Du wolltest Smalltalk. Du bekommst einen Blick.
etiquette.too_personal=Die Frage war einen Schritt zu weit. {t} ist davon gar nicht begeistert. || Du fragst etwas sehr Privates mit sehr öffentlicher Stimme. {t} versteift sich. || {t} antwortet in einem Ton, den du nicht vergisst. Alle anderen auch nicht.
etiquette.coin_refused=Du bittest um Münzen und bekommst ein höfliches Nein und einen sehr langen Blick. || Um Resort-Münzen zu betteln läuft nicht gut. Du gehst mit etwas weniger Ego davon. || Die Antwort ist ein sehr freundliches, sehr bestimmtes Nein.
etiquette.gift_flop=Du überreichst das Geschenk. {t} lächelt, und du merkst, dass es das falsche ist. || Das Geschenk ist ein bisschen... seltsam. {t} bedankt sich mit großer Mühe. || {t} öffnet das Geschenk und gibt sich alle Mühe, erfreut auszusehen.
etiquette.knockout={t} rastet aus und schlägt zu. Der Schlag sitzt und du gehst zu Boden wie ein Wäschesack. || Der Spruch war der Tropfen zu viel. {t} holt aus und der Raum kippt. Du kommst zu dir und starrst an die Decke. || {t} läuft knallrot an und trifft dich voll. Deine Würde verlässt das Gebäude, bevor du den Boden berührst.
etiquette.fight={t} hat genug. Ein schneller Schubser, ein lautes Wort und plötzlich steckst du mitten in einer Schlägerei. || Das war einen Schritt zu weit. {t} geht in Stellung und kommt mit fliegenden Fäusten auf dich zu. || {t} nimmt es sehr persönlich und antwortet mit den Fäusten. Du hast es herausgefordert.
etiquette.police={t} hat genug und wählt schon die Nummer. Eine Anzeige ist unterwegs zu dir. || {t} starrt dich kurz an und sagt: „Ich rufe die Polizei.“ Es klingt ziemlich ernst gemeint. || Das lief schlecht. {t} erstattet Anzeige gegen dich, noch bevor du dich fertig entschuldigt hast.
etiquette.deal={t} kennt jemanden, der jemanden kennt, und ein neuer Kontakt schickt ${m} für „einen kleinen Job“. Networking funktioniert. || Dein guter Eindruck wird zum Gefallen und der Gefallen zu ${m}. So entstehen Geschäfte. || {t} bürgt bei einem Kunden für dich. Etwas später landen ${m} auf deinem Konto.
etiquette.insider_tip=Die Information, die du geteilt hast, erweist sich als wertvoll. {t} steckt dir dafür ein Dankeschön zu. || Aus einem Tipp wird ein Deal. Du gehst mit etwas Extrageld davon.
etiquette.gift_hit={t} liebt das Geschenk. Es ist genau das, was gewünscht war, und das sieht man. || Das Geschenk trifft perfekt. {t} umarmt dich ein bisschen zu lange.
etiquette.knockout_death=Der Schlag von {t} sitzt, du fällst zu Boden... und wachst nicht mehr auf. Das Ende. || Ein Schlag von {t}. Du sackst um, der Raum wird still und du stehst nicht wieder auf. Abspann. || {t} schlägt ein einziges Mal zu. Es ist leider das Letzte, was du mitbekommst. Das Ende.
humor.bonus=Der Witz sitzt perfekt. {t} lacht so sehr, dass ein Stuhl nötig wird. || Dein Timing ist ausgezeichnet und das Lachen ist echt. Heute bist du lustig. || Ein befreites, leichtes Lachen. {t} wischt sich eine Träne weg und will noch einen.
humor.crit_success=Comedy-Genie. {t} weint vor Lachen und fleht dich an aufzuhören, will dann aber mehr. || Ein perfekter Witz im perfekten Moment. Der ganze Raum würde applaudieren, wenn er könnte. || Du bringst {t} so zum Lachen, dass das Atmen vergessen wird. Eine legendäre Nummer.
humor.soft_fail=Nicht dein bestes Material, aber {t} lächelt, um nett zu sein. || Ein schwaches Lachen und eine noch schwächere Pointe. Du gehst schnell weiter. || Ein kleines Schmunzeln, ein bisschen Mitleid. Der Witz ist schon vergessen.
humor.crit_fail=Der Witz stirbt laut. So still war {t} noch nie. || Ein Witz so schlecht, dass eine neue Art von Stille entsteht. {t} starrt in die Ferne. || Du fällst so durch, dass der Raum kalt wirkt. {t} braucht eine Minute.
humor.flop=Du bringst den Witz mit voller Überzeugung. {t} starrt blinzelnd zurück und wartet auf den Rest. || Die Pointe landet mit einem leisen Plumps. {t} lacht ungefähr eine halbe Sekunde zu spät. || Du lachst über deinen eigenen Witz. Allein. {t} gibt ein höfliches „Hehe“ dazu.
humor.unfunny=Der Witz ist so unlustig, dass er wieder verwirrend wird. {t} nickt langsam. || Du erzählst ihn mit perfektem Timing und der Witz ist trotzdem schlecht. {t} lächelt freundlich. || Ein Stöhnen, ein Seufzen und ein Augenrollen. {t} gewinnt den Preis für das höflichste Publikum.
humor.slapstick_hurt=Du ziehst den Sturz ein bisschen zu überzeugend durch. Der Boden gewinnt, wie immer. {t} hört auf zu lachen und fängt an, sich Sorgen zu machen. || Der Slapstick geht auf die schmerzhafteste Art schief. {t} zuckt zusammen, lacht, zuckt wieder zusammen. || Du stolperst über deine eigene Nummer. Es tut weh und das Publikum aus einer Person weiß nicht, ob geklatscht werden soll.
humor.money_gun=Du feuerst die Geldkanone ab und Scheine fliegen überall hin. Sie waren echt. ${m} sind weg und {t} lacht hemmungslos. || Die Kanone war mit echtem Bargeld geladen. ${m} flattern aus dem Fenster und {t} bekommt vor Lachen keine Luft. || Ups. Die Kanone war nicht für Spielgeld. Du versprühst ${m} in die Luft und {t} schwört, nichts gesehen zu haben.
humor.dirty_offended=Der schmutzige Witz kommt schlecht an. {t} schaut dich nur zutiefst enttäuscht an und sagt nichts. || Du erzählst einen Witz, der nicht für dieses Publikum ist. {t} lacht nicht. {t} starrt. || Der Witz geht unter wie ein Bleiballon. {t} ist nicht amüsiert, und du weißt es.
humor.compliment_creepy=Das Kompliment klingt gruselig und {t} macht einen kleinen Schritt zurück. Du hörst dich selbst es noch mal sagen. || Du sagst etwas Nettes und es klingt nach etwas anderem. {t} starrt auf den Boden. || Das Kompliment kommt komisch an. {t} bedankt sich mit der Stimme einer Geisel.
humor.memes_cringe=Du erklärst ein Meme, das vor drei Jahren gestorben ist. {t} nickt höflich und sagt nichts. || Das Meme braucht einen ganzen Vortrag, um Sinn zu ergeben, und tut es danach immer noch nicht. {t} sieht dich mit freundlichem Mitleid an. || Du zeigst {t} ein Trend-Meme. Es ist kein Trend. Es war nie einer.
humor.high_five_miss=Du holst zum High Five aus und klatschst ins Leere. {t} lässt dich mit einem sehr freundlichen Gesicht hängen. || Das High Five landet irgendwo zwischen Klatschen und Ohrfeige. {t} schüttelt die Hand aus und lächelt trotzdem. || Du verfehlst die Hand um einen Zentimeter und dein Arm schwingt weiter. {t} tut höflich so, als wäre es eine Dehnübung gewesen.
humor.powerup_fizzle=Du hältst die Faust für ein Power-up hin und nichts funkelt. {t} stößt trotzdem verlegen dagegen. || Das Freundschafts-Power-up verpufft mit einem kleinen Plopp. {t} klatscht einmal, aus Loyalität. || Du rufst das Power-up und die Energie geht ins Nichts. {t} zeigt aus Freundlichkeit den Daumen nach oben.
humor.flex_fail=Du spannst an und aus deiner Schulter kommt ein sehr unerwünschtes Geräusch. {t} zuckt zusammen. || Die Pose war wild. Die Pose dauerte auch eine Sekunde zu lang und etwas hat sich verkrampft. || Du zeigst die Muckis. {t} ist unbeeindruckt und ein Muskel ist verletzt.
humor.knockout={t} rastet aus und schlägt zu. Der Schlag sitzt und du gehst zu Boden wie ein Wäschesack. || Der Spruch war der Tropfen zu viel. {t} holt aus und der Raum kippt. Du kommst zu dir und starrst an die Decke. || {t} läuft knallrot an und trifft dich voll. Deine Würde verlässt das Gebäude, bevor du den Boden berührst.
humor.fight={t} hat genug. Ein schneller Schubser, ein lautes Wort und plötzlich steckst du mitten in einer Schlägerei. || Das war einen Schritt zu weit. {t} geht in Stellung und kommt mit fliegenden Fäusten auf dich zu. || {t} nimmt es sehr persönlich und antwortet mit den Fäusten. Du hast es herausgefordert.
humor.police={t} hat genug und wählt schon die Nummer. Eine Anzeige ist unterwegs zu dir. || {t} starrt dich kurz an und sagt: „Ich rufe die Polizei.“ Es klingt ziemlich ernst gemeint. || Das lief schlecht. {t} erstattet Anzeige gegen dich, noch bevor du dich fertig entschuldigt hast.
humor.money_rain=Die Geldkanone überschüttet euch beide mit Scheinen und du erwischst ${m}, bevor der Wind den Rest holt. {t} jubelt. || Bargeld regnet in einem perfekten Bogen herab. {t} lacht, während du ${m} in die Tasche stopfst. || Die Kanone feuert eine legendäre Salve. Du gehst um ${m} reicher davon und {t} lacht immer noch.
humor.inside_joke=Der Witz wird zum Insider zwischen dir und {t}. Er kommt wochenlang wieder. || Du und {t} lacht im selben Moment und es fühlt sich großartig an. Jetzt ein bisschen näher. || Ein alberner Moment wird zu einer kleinen Verbindung. Du und {t} werdet ihn für immer zitieren.
humor.knockout_death=Der Schlag von {t} sitzt, du fällst zu Boden... und wachst nicht mehr auf. Das Ende. || Ein Schlag von {t}. Du sackst um, der Raum wird still und du stehst nicht wieder auf. Abspann. || {t} schlägt ein einziges Mal zu. Es ist leider das Letzte, was du mitbekommst. Das Ende.
family.bonus=Ein warmer kleiner Moment mit deinem {k}. Ihr geht beide ein bisschen leichter davon. || {t} lächelt so, wie nur Familie lächelt. Das braucht keine Erklärung. || Leicht, lieb und ein bisschen lustig. Genau so, wie es sein soll.
family.crit_success=Alles sitzt. Du und {t} lacht am Ende wie früher als Kinder und es fühlt sich nach Zuhause an. || Ein seltener perfekter Moment zwischen dir und deinem {k}. Keiner sagt es, alle fühlen es. || Die Art Familiengespräch, an die man sich jahrelang erinnert. {t} hält ein bisschen länger fest als sonst.
family.soft_fail=Es ist ganz nett. Familiendinge sind eben so. || Du redest, {t} nickt und der Tag geht weiter. || Nichts Besonderes. Aber auch nichts Schlimmes.
family.crit_fail=Du sagst genau das Falsche zu genau dem falschen {k} und der ganze Raum hört es. || Es wird eine dieser Familienszenen, die noch jahrelang beim Abendessen aufgewärmt wird. || Ein kleiner Kommentar wird zu einem großen. {t} geht mit einem Blick, den du nicht vergisst.
family.awkward_pause=Es legt sich eine Stille über euch, die nur dein {k} so laut hinbekommt. || Ihr greift beide gleichzeitig nach einem Thema und keiner spricht es aus. || Das Gespräch stockt und die Uhr wird plötzlich sehr interessant.
family.old_argument=Irgendwie steckst du wieder im selben Streit wie vor Jahren. Gleiche Sprüche, gleiche Abgänge. || {t} kommt auf die Sache von damals zu sprechen. Du wünschst dir, das wäre nicht passiert. || Du trittst auf eine alte wunde Stelle und stellst fest, dass sie nie verheilt ist.
family.rusty_visit=Es ist eine Weile her und man merkt es. Ihr seid Familie, aber auch ein bisschen Fremde. || Ihr sagt beide die richtigen Worte in einer leicht falschen Reihenfolge. || Wer nicht zusammenwohnt, muss erst mal aufholen. Über das Aufholen kommt ihr nie hinaus.
family.house_rules=Zusammenwohnen heißt: Das Geschirr kommt immer zur Sprache. Jetzt gerade. || Jemand hat etwas auf dem Boden liegen lassen. Natürlich ist dein {k} schuld. || Dasselbe Haus, zwei sehr verschiedene Vorstellungen von ordentlich.
family.spouse_bickers=Ehe heißt, denselben kleinen Streit auf neue Art zu führen. Heute ist es eine neue Art. || {t} wirft dir den Blick zu, den nur Ehepartner draufhaben, und der bedeutet, dass du schon Ärger hast. || Eine kleine Meinungsverschiedenheit über nichts Bestimmtes. Die schlimmste Sorte.
family.plan_clash=Ihr plant die Zukunft zusammen und für einen Moment sieht es nach zwei verschiedenen Zukünften aus. || {t} will das eine, du das andere. Der Kompromiss heißt Schweigen. || Die großen Pläne treffen auf kleine Realitäten. Diesmal gibt keiner nach.
family.lecture_flops=Deine Standpauke landet etwa so sanft wie ein Ziegelstein. {t} nickt so, wie Kinder nicken, wenn sie nicht mehr zuhören. || Du erklärst etwas Wichtiges. {t} hört „bla bla“ und ein bisschen Stolz. || In deinem Kopf klang es weiser.
family.chide_backfires=Du schimpfst und es geht nach hinten los. {t} starrt mit einem Blick zurück, der sagt: „Du hast dasselbe getan.“ || Die Standpauke wird zu einem tränenreichen „Du hörst mir nie zu“. Keiner gewinnt. || Du erhebst die Stimme und wünschst dir, du hättest es gelassen.
family.eye_roll=Dein Elternteil fängt einen Satz an und du weißt schon, wie er endet. Das Augenrollen wird bemerkt. || Der Rat ist gut. Ihn anzunehmen ist das Problem. || Du hörst mit großer Mühe zu. Man merkt es dir an.
family.generation_gap=Die Generationenlücke tut sich genau zwischen euch auf. Du winkst darüber hinweg. || Manche Dinge kann man einem Großelternteil nicht erklären. Das hier ist eins davon. || Du und {t} sprecht dieselbe Sprache, nur nicht im selben Jahrzehnt.
family.grandchild_bored=Die Geschichte von früher war ausgezeichnet. Das Enkelkind hat es nicht so weit geschafft. || Dein Enkelkind schaut schon auf einen Bildschirm. Früher muss warten. || Du bietest Weisheit an. Du bekommst ein höfliches „Mhm“.
family.sibling_spat=Geschwisterlogik: Du hast angefangen, {t} hat aufgehört, und ihr beansprucht beide den Sieg. || Ein Kommentar zu viel und du bist wieder zehn und streitest um ein Sofa. || Der Klassiker. Ein neckender Witz geht einen Schritt zu weit.
family.wrong_mood=Du sprichst das falsche Gefühl zur falschen Zeit an. {t} macht einen Schritt zurück. || Das Gefühl war echt. Das Timing nicht. || Nicht jedes Gefühl muss sofort geteilt werden. Dieses hier gehörte dazu.
family.allowance_gone=Du überreichst das Taschengeld und bekommst ein sehr kurzes Danke und kein Wechselgeld. || Das Taschengeld verschwindet schneller als der Kassenbon. Du wirst nie erfahren, wohin. || Geld wechselt den Besitzer und danach kommt ein Vortrag. Du hast beides bezahlt.
family.apology_stumbles=Die Entschuldigung kommt in der falschen Reihenfolge raus. Das „Tut mir leid“ kommt zuletzt. || Du versuchst, es wiedergutzumachen, und die Worte stolpern übereinander. || Die Entschuldigung ist ehrlich. Der Vortrag ist eine Katastrophe.
family.hug_too_tight=Die Umarmung dauert ein bisschen zu lang und der Druck ist ein bisschen zu fest. {t} klopft ab. || Du umarmst dein {k} und irgendwas knackt. Vielleicht der Rücken. || Eine begeisterte Umarmung, ein winziges Knirschen und ein verlegenes Lachen.
family.kid_not_listening=Die Kleinen hören auf alles, nur nicht auf dich. || Du sagst es dreimal. Beim vierten Mal kommt es endlich an, oder das Kind ist weg. || Du bist sehr gut in dem, was du tust. Das Kind ist sehr gut darin, es zu überhören.
family.family_warmth=Familiennähe ist leise. Das hier ist so ein Moment und du spürst es. || Etwas Kleines wird mit {t} zu etwas Warmem.
family.family_bond=Es macht Klick. Du und {t} fühlt euch wie eine echte Familie, nicht nur wie Verwandte. || Ein Moment, an den ihr beide euch erinnern werdet. Die Bindung wächst und die Wärme auch.
family.fail=Es beginnt gut und driftet irgendwohin, was keiner von euch geplant hat.
art.bonus=Das Gemälde nimmt schön Gestalt an. Ein paar kühne Striche haben die ganze Arbeit gemacht. || Gute Farben, gute Komposition. Das würde jemand aufhängen. || Du bist am Ende mit Farbe an den Händen und einem stillen kleinen Grinsen fertig.
art.crit_success=Der Pinsel bewegt sich von allein. Wenn du zurücktrittst, ist es das Beste, was du je gemacht hast. || Farben, Licht, ein bisschen Magie. Du signierst es mit ruhiger Hand. || Es hört auf, ein Bild zu sein, und wird zu einem Gefühl. Du könntest den ganzen Tag hinschauen.
art.soft_fail=Nicht dein bestes Werk, aber es ist deins. || Die Farben sind leicht daneben und die Komposition ist leicht schüchtern. || Okay, so wie ein erster Entwurf okay ist.
art.crit_fail=Das Gemälde wird zu einer sehr großen, sehr braunen Pfütze des Bedauerns. || Alles, was du versuchst, macht es schlimmer. Irgendwann hörst du einfach auf. || Das Ergebnis sieht aus wie ein Fehler mit eigener Meinung.
art.uninspired=Du starrst die Leinwand an. Die Leinwand gewinnt das Anstarr-Duell. || Die Muse macht Pause und hat keine Nachsendeadresse hinterlassen. || Nichts kommt. Keine Idee, keine Linie, keine Farbe.
art.muddy_colors=Alle Farben verlaufen zum selben Braunton. Es ist ein sehr konsequentes Braun. || Jede Mischung wird matschig. Du wolltest Sonnenuntergang und bist bei Sumpf gelandet. || Du hast noch eine Farbe dazugegeben und alles wurde grau.
art.paint_spill=Die Farbpalette kippt und ein Spritzer landet genau da, wo du ihn nicht haben willst. Farbe auf Kleidung, Farbe auf Schuhen, Farbe auf dir. || Du trittst zurück, um dein Werk zu bewundern, und trittst stattdessen in die Farbe. || Eine große Farbwelle erreicht zuerst dein Shirt. Dem Bild geht es gut. Dir nicht.
art.ruined_canvas=Ein Pinselstrich zu viel und die ganze Leinwand ist ruiniert. Du sagst ein Wort, das in keinem Kunstbuch steht. || Die Leinwand reißt, die Farbe läuft und die Arbeit einer Stunde ist weg. || Du versuchst, eine Ecke zu retten, und machst die anderen drei kaputt.
art.mural_drips=Die Farbe an der Wand tropft in langen, traurigen Linien herunter, ein bisschen auch auf dich. || Du zielst auf die Wand und die Wand teilt mit dir. || Das Wandbild wird ein bisschen zerlaufen und du wirst ein bisschen bemalt.
art.caught_tagging=Jemand aus der Nachbarschaft sieht dein Kunstwerk. Eine Strafe für illegales Graffiti folgt. Kunst hat ihren Preis. || Ein Passant nennt es Vandalismus. Der Strafzettel nennt es ${m}. || Die Wand gehörte nicht dir. Die Stadt schickt die Rechnung: ${m}.
art.art_confusing=Du schaust lange hin. Es schaut zurück und sagt nichts Nützliches. || Alle sagen, es sei tiefgründig. Du siehst eine Banane und langes Schweigen. || Du nickst nachdenklich, wie man es in Galerien tut, und verstehst gar nichts.
art.painting_sale=Ein Passant verliebt sich in dein Gemälde und zahlt auf der Stelle ${m} dafür. || Jemand mit Sammlerblick hört von deiner Arbeit und schickt ${m} und eine sehr begeisterte Nachricht. || Dein Werk verkauft sich für ${m}. Dein erster echter Fan ist ein Fremder.
art.art_praise=Eine befreundete Person sieht das Gemälde und steckt dir ${m} „für das nächste“ zu. || Jemand kauft einen kleinen Druck davon für ${m}. Du bist offiziell ein Profi.
art.fail=Es ist nicht so geworden, wie du es dir vorgestellt hast.
art.pass=Eine solide Arbeit.
spa.bonus=Warm, ruhig und genau das, was du gebraucht hast. Du gehst raus und fühlst dich wie neu. || Eine großartige Sitzung. Muskeln, von denen du vergessen hattest, dass du sie hast, sagen danke. || Dein ganzer Körper seufzt, und du auch.
spa.crit_success=Jeder Knoten löst sich auf einmal. Du schwebst hinaus, knochenlos, ruhig und etwa drei Zentimeter größer. || Pures Glück. Die Welt wird langsamer, deine Schultern sinken und du vergisst, wie sich Stress anfühlt. || Eine perfekte Behandlung. In genau diesem Zustand könntest du eine Woche bleiben.
spa.soft_fail=Ist okay. Entspannend genug, wenn auch nicht magisch. || Angenehm, aber dein Kopf ist woanders. || Eine ordentliche Behandlung. Du hattest schon bessere.
spa.crit_fail=Alles geht schief, und zwar so, wie es nur an einem Spatag schiefgehen kann. Du gehst verspannter, als du gekommen bist. || Was entspannend sein sollte, wird zur kleinen Tortur. Dein armer Körper weiß gar nicht, was ihn getroffen hat. || Du bezahlst für Entspannung und bekommst eine Geschichte, die du jahrelang erzählen wirst.
spa.restless=Du liegst da, aber dein Kopf will einfach nicht abschalten. Jeder Gedanke ist eine To-do-Liste. || Entspannen ist harte Arbeit. Du bist heute sehr schlecht darin. || Die Behandlung ist in Ordnung. Das Problem bist du.
spa.tense_knot=Da wird ein Knoten getroffen, von dem du nichts wusstest. Du siehst Sterne und die Sterne sagen aua. || Die Verspannung hat sich in deinen Schultern versteckt und wehrt sich. Du gehst wund statt entspannt. || Ein sehr fester Daumen findet genau die falsche Stelle und bleibt dort.
spa.too_hard=Der Druck ist viel zu stark. Du lächelst höflich und denkst leise über ein neues Leben nach. || Es hieß Tiefenmassage. Dass es bis auf die Knochen geht, hat keiner gesagt. Du bist stundenlang wund. || Es tut weh, auf eine Art, die angeblich gut für dich ist, und du bist nicht überzeugt.
spa.ticklish=Deine Füße sind viel kitzliger, als du dachtest. Du lachst, windest dich und trittst fast die Fische aus dem Wasser. || Das Kitzeln ist zu viel. Du kicherst, bis es überhaupt nicht mehr entspannend ist. || Die Doktorfische sind sehr begeistert von deinen Zehen. Den Zehen hat das keiner gesagt.
spa.fell_asleep=Du schläfst mitten in der Massage ein und wachst mit einer Sabberpfütze und null Würde auf. || Ein lautes Schnarchen weckt dich auf. Der Raum ist sehr still. Alle haben es gehört. || Du nickst ein, schreckst hoch und tust so, als hättest du nur kurz die Augen ausgeruht.
spa.salt_sting=Das Salz findet einen winzigen Kratzer, von dem du nichts wusstest. Du behältst ein ruhiges Gesicht. Knapp. || Eine sehr salzige Überraschung. Du sagst „mmm“ und meinst „aua“. || Das Salzbad brennt mehr, als es beruhigt.
spa.aroma_allergy=Die Öle sind herrlich, aber deine Nase hat eine andere Meinung. Das Niesen beginnt und hört nicht mehr auf. || Rosen, Kräuter und eine sehr plötzliche Allergie. Du gehst mit roter Nase und einem Taschentuch. || Eine Duftwolke und ein noch größeres Niesen. Hatschi.
spa.sauna_dizzy=Die Hitze setzt dir zu. Der Raum dreht sich, die Bänke wackeln und du trittst leicht krebsrot heraus. || Zu heiß, zu lang. Du gehst auf Beinen aus Wackelpudding. || Du sagst dir, dass es dir gut geht. Die Sauna sieht das anders.
spa.sauna_overheat=Du überreizt es in der Sauna und die Sauna gewinnt. Die Welt wird weiß und wackelig und du kriechst tropfend hinaus. || Schweiß, Pünktchen vor den Augen und das sehr ernste Gefühl, dass das ein Fehler war. Der Hitzschlag klopft höflich an und tritt dann die Tür ein. || Die Hitze ist nicht mehr entspannend, sondern bedrohlich. Du schaffst es gerade so bis zur Tür.
spa.pushy_staff=Das Personal wird genau im falschen Moment gesprächig. Du lächelst und entspannst dich nicht. || Ein sehr begeisterter Profi redet durch die gesamte Behandlung. Entspannung ist schwer zu finden. || Die Massage ist in Ordnung. Der Kommentar ist das Problem.
spa.fail=Entspannen klappt nicht so ganz.
spa.pass=Ordentlich Entspannung.
mood_spouse.bonus=Ein Blick, ein Lächeln, ein ganz leises „Komm her“. Die Stimmung erledigt den Rest. || {t} lacht leise und zieht dich näher. Perfekt. || Was vor einer Minute noch schwer wog, ist weg. Etwas Warmes ist an seine Stelle getreten.
mood_spouse.crit_success=Die Stimmung ist perfekt, bevor jemand ein Wort sagt. Du und {t} verschmelzt miteinander und die ganze Welt wird leiser, weicher, wärmer. || Alles stimmt: das Licht, das Timing, der Mensch. Ihr seid beide wieder bis über beide Ohren verliebt. || Es fühlt sich an wie das erste Mal und das hundertste zugleich. Nichts tut weh, nichts sorgt, nichts zählt außer {t}.
mood_spouse.soft_fail=Der Moment ist schön, wenn auch ein bisschen schüchtern. Am Ende kommt ihr beide an. || Leicht peinlich, meistens süß. Du lässt es durchgehen. || Es ist nicht ganz die Filmszene, aber es funktioniert.
mood_spouse.crit_fail=Du willst zärtlich werden, aber deine kalten Füße ruinieren die Stimmung. || Du beugst dich vor, stolperst über ein Kissen und der ganze Abend kippt. {t} lacht und seufzt gleichzeitig. || Der große romantische Moment wird von einem sehr lauten Magen unterbrochen, danach herrscht traurige kleine Stille.
mood_spouse.cold_feet=Du wolltest zärtlich werden, aber deine kalten Füße ruinierten die Stimmung. || Deine eiskalten Füße berühren {t} am Bein. Ein Quieken, ein Satz und die Stimmung ist weg. || Romantik endet in dem Moment, in dem kalte Zehen auf eine warme Wade treffen.
mood_spouse.cold_hands=Deine Hände sind eiskalt und {t} teilt dir das mit sehr hoher Stimme mit. || Eine kalte Hand an der falschen Stelle zur falschen Zeit. Die Stimmung verlässt den Raum. || Du meinst es lieb. Deine Finger meinen es eisig.
mood_spouse.phone_buzzes=Ein Handy brummt im denkbar schlechtesten Moment. Keiner von euch kann es überhören. || Eine Benachrichtigung. Dann noch eine. Die Stimmung hat den Chat verlassen. || Jemand hat vergessen, ein Handy stumm zu schalten. Ihr beide.
mood_spouse.pet_interrupts=Eine Pfote, ein Miau und ein lauter Plumps. Das Haustier ist zum Abend dazugestoßen. || Die Katze springt genau im falschen Moment aufs Bett. Die Stimmung überlebt das nicht. || Ein sehr großes, flauschiges Publikum schaut zu. Keiner kann sich konzentrieren.
mood_spouse.giggle_fit=Du versuchst, ernst zu bleiben, {t} fängt an zu kichern und jetzt kann keiner mehr aufhören. Süß, aber nicht gerade heiß. || Das erste Lachen war ein Prusten. Das zweite hat die Stimmung beendet. Ihr weint beide vor Lachen. || Es fing romantisch an und endete im Lachanfall. Trotzdem eine gute Zeit, nur eine andere.
mood_spouse.fail=Du versuchst, Stimmung zu machen. Die Stimmung hat andere Pläne.
mood_spouse.pass=Die Stimmung sitzt. Keiner muss etwas sagen.
mood_lover.bonus=Liebe ist ein Abenteuer, und du genießt es in vollen Zügen! || Ein aufregender kleiner Funke zwischen dir und {t}. Ihr fühlt euch beide leichter. || Der Moment ist süß, ein bisschen gewagt und richtig lustig.
mood_lover.crit_success=Liebe ist ein Abenteuer, und du genießt jede Minute davon. {t} spürt es auch. || Alles passt. Ein Blick, eine Berührung, ein Lächeln, das alles sagt. || Du planst es nicht, es passiert einfach. Und es ist wunderbar.
mood_lover.soft_fail=Es ist ein bisschen steif, aber {t} lässt es durchgehen. || Nicht gerade geschmeidig, aber süß genug. || Ein bisschen ungeschickt. {t} lächelt trotzdem.
mood_lover.crit_fail=Du liest den Moment komplett falsch. {t} sieht dich an, als wäre dir ein zweiter Kopf gewachsen. || Die Stimmung geht von null auf Katastrophe. {t} muss kurz den Raum verlassen. || Der große Move geht auf die peinlichste Art daneben.
mood_lover.slap=Du beugst dich vor, um Stimmung zu machen, aber {t} versteht es als Angriff und gibt dir eine Ohrfeige! || Das war ein bisschen zu forsch. {t} ohrfeigt dich und der Knall hallt nach.
mood_lover.runaway={t} sieht, was kommt, gerät in Panik und rennt aus dem Raum. || Du machst deinen Zug. {t} macht auch einen, Richtung Tür.
mood_lover.embarrassed={t} läuft knallrot an und kann dich nicht ansehen. Du auch nicht. || Der Moment wird zu viel. {t} versteckt sich hinter beiden Händen.
mood_lover.angry={t} ist gar nicht begeistert von dem, was du versucht hast. Der Blick sagt alles. || Du hast es falsch eingeschätzt und {t} sorgt dafür, dass du es weißt.
mood_lover.rejection={t} zieht sich zurück. Ein höfliches, bestimmtes „Nein“ hängt in der Luft. || Nicht heute Abend. Nicht so. {t} tritt zurück.
mood_lover.sad={t} wirkt verletzt und du spürst es auch. Die Stille wiegt schwer. || Die Stimmung stirbt auf sehr traurige Weise. {t} seufzt und schaut weg.
mood_lover.fight={t} ist wütend und der Streit wird zu einer echten Schlägerei. || Was als Stimmung begann, wurde zu einem Schreiduell und einem Schubser.
mood_lover.fail=Du versuchst, Stimmung zu machen, und {t} ist noch nicht ganz so weit.
mood_lover.pass=Gute Chemie.
romance.bonus={t} lacht im richtigen Moment und bleibt näher als vorher. Da beginnt etwas. || Ein guter Moment. Du und {t} haltet den Blickkontakt einen Takt zu lang, und keinen stört es. || Schmetterlinge im Bauch, und zwar auf beiden Seiten. Du gehst mit einem warmen, flatternden Gefühl davon.
romance.crit_success=Die Worte kommen genau richtig. {t} sieht dich an, als hättest du den Mond vom Himmel geholt, und fragt dann leise, ob du morgen auch Zeit hast. || Alles passt zusammen: das Timing, das Lächeln, die Stille an der richtigen Stelle. {t} ist ein bisschen außer Atem und du auch. || So geschmeidig warst du noch nie. {t} wird rot und der Raum fühlt sich etwa zehn Grad wärmer an.
romance.soft_fail=Es ist ganz nett, aber es funkt nie so richtig. Ihr tut beide so, als hätte es gefunkt. || {t} lächelt höflich. Es ist die Art Lächeln, die man dem Kellner schenkt. || Kein Desaster, aber auch kein Moment. Die Luft bleibt genau gleich warm.
romance.crit_fail=Du sagst etwas so Falsches, dass {t} prüft, ob es dir gut geht. Tut es nicht. || Der Moment bricht in Zeitlupe zusammen. {t} starrt dich an, du starrst auf den Boden, und der Boden hilft nicht. || Du öffnest den Mund, ein Satz fällt heraus, und es ist der schlimmste verfügbare. {t} wird sich jahrelang daran erinnern.
romance.tongue_tied=Du hast das unter der Dusche geübt. Laut ausgesprochen sind es nur Laute. || Dein Gehirn verlässt den Chat. Alles, was du hinbekommst, ist „Also... ja.“ || {t} wartet. Du wartest. Keiner sagt etwas Romantisches.
romance.turned_down={t} sagt „Ich glaube, als Freunde passen wir besser“ in sehr freundlichem Ton. Es tut trotzdem weh. || Ein höfliches „Nein, danke“. Die Höflichkeit ist das Schlimmste daran. || {t} wirkt aufrichtig bedauernd, was es irgendwie schlimmer macht. Du gehst mit schwerem Herzen heim.
romance.too_forward=Du gehst in einem Satz von null auf „Also, Kinder?“. {t} macht einen Schritt zurück. || Das war viel, und zwar schnell. {t} braucht eine Minute und ein Glas Wasser. || Du hast etwa neun Schritte übersprungen. {t} hat jeden einzelnen bemerkt.
romance.cold_feet=Du sprichst die Heirat an und {t} findet plötzlich die Decke sehr interessant. || „Und, wo siehst du das hier hinführen?“ landet wie ein Backstein. Die Stimmung verlässt leise den Raum. || {t} wechselt das Thema so schnell, dass Bremsspuren bleiben.
romance.sweaty_hands=Deine Handfläche ist ein Sumpf. {t} hält tapfer fest und wischt sich danach die Hand an der Hose ab. || Du greifst nach der Hand von {t}. Sie ist feucht, zittrig und entschuldigend. || Das Händchenhalten dauert genau so lange, bis ihr beide merkt, wie klamm ihr seid.
romance.hand_yanked={t} zieht die Hand weg, als wäre sie eine heiße Pfanne. Nicht gerade dezent. || Du greifst zu und {t} steckt die Hand in die Tasche. Die Botschaft ist klar. || Die Hand wird sehr höflich und sehr schnell zurückgezogen. Autsch.
romance.slap=Du greifst nach der Hand von {t}, aber {t} versteht es falsch und gibt dir stattdessen eine Ohrfeige! || Das war viel zu forsch. {t} reagiert mit einer Ohrfeige und der Knall hallt weit.
romance.cold_greeting=Dein süßes Hallo landet wie eine nasse Socke. {t} nickt und geht weiter. || Du begrüßt {t} mit deinem ganzen Charme. {t} antwortet mit einem höflichen „Hm“. || Die Begrüßung war ein hoffnungsvolles Flattern. Sie ist flach auf den Boden gefallen.
romance.confession_declined=Du fragst mit pochendem Herzen. {t} sagt sanft nein und dein pochendes Herz sackt ab. || {t} lässt dich sanft abblitzen, und „sanft“ fühlt sich ganz anders an. || Deine große Frage bekommt ein kleines, freundliches, vernichtendes „So nicht“.
romance.knockout={t} rastet aus und schlägt zu. Der Schlag sitzt und du gehst zu Boden wie ein Wäschesack. || Dieser Move war der Tropfen zu viel. {t} holt aus und der Raum kippt. Du kommst zu dir und starrst an die Decke.
romance.fight={t} hat genug. Ein schneller Schubser, ein lautes Wort und plötzlich steckst du mitten in einer Schlägerei. || Das war einen Schritt zu weit. {t} geht in Stellung und kommt mit fliegenden Fäusten auf dich zu.
romance.police={t} hat genug und wählt schon die Nummer. Eine Anzeige ist unterwegs zu dir. || „Ich rufe die Polizei.“ {t} klingt, als wäre es ernst gemeint.
romance.butterflies=Das Flattern ist gegenseitig. Zwischen dir und {t} wächst leise etwas. || Du und {t} trennt euch mit einem Lächeln, das sich nicht ganz verstecken lässt.
romance.swept_off_feet=Das ist einer dieser Momente, an die ihr euch beide erinnern werdet. {t} ist hin und weg, und du glühst. || {t} ist dem Ganzen völlig erlegen. Du spürst eine Welle von Wärme, die stundenlang anhält.
romance.fail=Du versuchst es mit Charme und landest irgendwo bei „Bedienungsanleitung laut vorlesen“. || Der Plan war romantisch. Die Umsetzung war eine Geiselverhandlung.
romance.knockout_death=Der Schlag von {t} sitzt, du fällst zu Boden... und wachst nicht mehr auf. Das Ende. || Ein Schlag von {t}. Du sackst um, der Raum wird still und du stehst nicht wieder auf. Abspann.
conflict.bonus=Ein scharfer Spruch, gut gebracht. {t} schmunzelt widerwillig. || Du bleibst standhaft und es wirkt. {t} respektiert das ein bisschen.
conflict.crit_success=Du landest ihn perfekt. {t} hat keine Antwort und der ganze Raum weiß, dass du gewonnen hast. || Eine Meisterklasse. {t} öffnet den Mund, schließt ihn wieder und nickt respektvoll. || Dein Mut zahlt sich aus. {t} gibt nach und du fühlst dich drei Meter groß.
conflict.soft_fail=Es kommt nur sanft an. {t} zuckt mit den Schultern und macht weiter. || Nicht dein schärfster Moment, aber es wird niemand verletzt. || {t} ist unbeeindruckt und die Sache bleibt ungeklärt.
conflict.crit_fail=Es läuft so schlecht, dass {t} gar nicht mehr antworten muss. Deine eigenen Worte haben das erledigt. || Dein großer Moment geht spektakulär nach hinten los. Die Stille danach ist ohrenbetäubend. || Du bist so standhaft geblieben, dass du gegen eine Wand gelaufen bist. {t} sieht mit großem Interesse zu.
conflict.stiff=Der Seitenhieb ist steif und einstudiert, und {t} durchschaut ihn. || Du versuchst, taff zu klingen. Du klingst wie eine Mailbox-Ansage.
conflict.tease_backfires=Die Neckerei zündet nicht und {t} schießt mit etwas zurück, das richtig wehtut. || Du stichelst gegen {t} und der Stich beißt dich selbst. || {t} ist nicht amüsiert. Du bist diejenige Person, die rot wird.
conflict.ridicule_backfires=Dein Spott wird so elegant umgedreht, dass du fast applaudieren möchtest. Fast. || Stattdessen lacht {t} über dich, laut, und jetzt wünschst du dir, du hättest gar nicht erst angefangen. || Du machst dich über {t} lustig und {t} hat den besseren Spruch parat. Autsch.
conflict.stubborn=Du gräbst dich ein, und {t} auch. Keiner gewinnt und die Stimmung ist hin. || Lauter darauf zu bestehen macht dich nicht richtiger. {t} hört auf zuzuhören.
conflict.line_crossed=Du ziehst die Grenze, und sie verläuft mitten durch die Gefühle von {t}. || Die Wahrheit war ein bisschen zu ehrlich. {t} verstummt und der Raum wird kälter. || Du hast es klar gesagt. {t} hat es klar gehört, und jetzt kann keiner dem anderen in die Augen sehen.
conflict.power_play_flops=Dein Machtspiel geht komplett daneben. {t} stellt dich vor allen bloß und es kostet dich. || Es zeigt sich, dass {t} gar nicht eingeschüchtert war. Das sticht, und zwar in mehr als einer Hinsicht. || Du drückst auf Einfluss und zahlst am Ende für das Privileg.
conflict.shown_the_door={t} zeigt zur Tür. Du verstehst den Wink und nimmst ein bisschen angeknackstenen Stolz mit. || Du bittest {t} zu gehen, und {t} antwortet mit einem Blick, der Stahl schmelzen könnte. || Das „Bitte geh“ kommt falsch an und plötzlich bist du diejenige Person draußen.
conflict.greeting_backfires=Dein unfreundliches Hallo bekommt eine noch unfreundlichere Antwort. Du hast angefangen, also gehört es jetzt dir. || {t} nimmt die saure Begrüßung persönlich und zahlt sie mit Zinsen zurück. || Du begrüßt {t} wie ein Bösewicht. {t} antwortet rollengerecht.
conflict.belittle_backfires=Du machst {t} vor allen schlecht. Es stellt sich heraus, dass {t} Belege hat. || Die Schuld landet stattdessen bei dir, mit Anmerkungen. || {t} bleibt ruhig, und das ist schlimmer. Alle haben es gesehen.
conflict.pent_up=Die Worte sprudeln heißer heraus als geplant. {t} hätte nicht alles davon gebraucht. || Du lässt alles raus, und einiges davon war für jemand anderen gedacht. || Die Gefühle waren echt. Das Timing nicht.
conflict.extort_backfires=Deine Drohung fällt auf halber Strecke in sich zusammen. {t} bleibt ruhig und du bist diejenige Person, die schuldig aussieht. || Die Erpressung läuft so gut, wie Erpressung eben läuft. {t} ist wütend und du zahlst dafür. || {t} zuckt nicht mit der Wimper. Die Strafe schon.
conflict.caught_red_handed=Jemand hat dich gesehen. Alle haben dich gesehen. Du tust so, als wärst du nie da gewesen. || Dein hinterhältiger Plan hat einen Zeugen. Du bist knallrot im Gesicht. || Das Geheimnis war weniger geheim, als du gehofft hattest.
conflict.rumor_backfires=Die Nachricht geht an die falsche Person. Du verbringst den Abend damit, Dinge zu löschen. || Das Gerücht verbreitet sich und kehrt dann mit ein paar zusätzlichen Details zu dir zurück. || Es stellt sich heraus, dass der Klatsch jemandes Freundschaft betraf. Ups.
conflict.prank_backfires=Der Streich trifft stattdessen dich. Alle lachen, aber nicht mit dir. || Dem Witz fehlte ein Schritt. Du hast ihn übersprungen und zahlst dafür.
conflict.knockout={t} rastet aus und schlägt zu. Der Schlag sitzt und du gehst zu Boden wie ein Wäschesack. || Das war der Tropfen zu viel. {t} holt aus und der Raum kippt. Du kommst zu dir und starrst an die Decke.
conflict.fight={t} hat genug. Ein schneller Schubser, ein lautes Wort und plötzlich steckst du mitten in einer Schlägerei. || Du bist zu weit gegangen. {t} geht in Stellung und kommt mit fliegenden Fäusten auf dich zu.
conflict.police={t} hat genug und wählt schon die Nummer. Eine Anzeige ist unterwegs zu dir. || „Das ist Belästigung, und ich rufe die Polizei.“ {t} klingt ernst.
conflict.witty=Der Spruch ist gut und {t} weiß es. Ein widerwilliges Lächeln und ein bisschen mehr Respekt. || Du gewinnst den Schlagabtausch ohne einen Kratzer. {t} taut ein wenig auf.
conflict.respect=Du gewinnst die Diskussion so sauber, dass {t} es tatsächlich bewundert. Dein Selbstvertrauen glüht eine Weile nach. || {t} tritt mit einem Nicken ab. Du hast dir heute echten Respekt verdient.
conflict.fail=Du wolltest mutig sein und bist bei peinlich angekommen. || Der Spruch war gut. Die Ausführung war ein Niesen.
conflict.knockout_death=Der Schlag von {t} sitzt, du fällst zu Boden... und wachst nicht mehr auf. Das Ende. || Ein Schlag von {t}. Du sackst um, der Raum wird still und du stehst nicht wieder auf. Abspann.
passion.bonus=Euer gemeinsames Interesse löst ein gutes Gespräch aus. {t} nickt mit und ihr geht beide voller Energie davon. || Ein tolles kleines Gespräch über etwas, das ihr beide liebt. {t} will mehr.
passion.crit_success=Ihr liebt beide haargenau dasselbe. Du und {t} redet stundenlang, ohne es zu merken. || Zwei verwandte Seelen finden einander. {t} leuchtet auf wie eine Lampe, und du auch. || Das Thema passt perfekt. {t} will alles wissen, und du erzählst es gern.
passion.soft_fail=Dir fallen ein paar Dinge ein, und {t} auch. Ist in Ordnung. || Gemeinsamkeiten, aber nicht viel Funke. || Das Thema verläuft sich höflich im Sand.
passion.crit_fail=Du sagst selbstbewusst das Falsche über genau das Thema, das {t} am wichtigsten ist. Stille. || Deine Leidenschaft ist offenbar eine ganz andere als die von {t}. Das Gespräch erholt sich nie. || Du gehst voll in ein Thema und {t} zuckt zusammen. Du bist nicht sicher, wem von euch beiden es peinlicher ist.
passion.dull_topic=Du redest zehn Minuten über das Thema. Bei {t} werden die Augen etwa ab Minute drei glasig. || Du bist fasziniert. {t} schaut auf die Uhr. || Das Thema ist für dich spannend und für sonst niemanden im Raum.
passion.hot_take=Du haust eine sehr gewagte Meinung raus und {t} nimmt es nicht freundlich auf. || Dein Hot Take kühlt den Raum schnell ab. {t} widerspricht, laut. || {t} nimmt das Thema persönlich und jetzt ist es eine Debatte.
passion.dance_stumble=Du willst einen Move zeigen, stolperst über deine eigenen Füße und drehst dich zu einem Haufen. {t} zuckt mitfühlend zusammen. || Der Tanzschritt braucht mehr Platz, als du hast. Der Boden gewinnt. || Ein Schritt zu ehrgeizig, und die Schwerkraft holt sich ihren Tribut.
passion.muscle_strain=Du zeigst eine Trainingsübung und etwas zerrt. {t} bietet ein Kissen und viel Mitgefühl an. || Die Begeisterung wiegt schwerer als dein Aufwärmen. Dein Rücken legt Beschwerde ein. || Du spannst zu stark an und zerrst dir etwas, das du noch gebraucht hast.
passion.voice_cracks_song=Du triffst den hohen Ton mit Selbstvertrauen. Der Ton trifft nicht zurück. || Deine Stimme kippt so laut, dass {t} sich nach dem nächsten Fenster umsieht. || Gemeinsam singen ist toll, bis du die Führung übernimmst.
passion.off_key=Der Akkord, den du spielst, stand nie im Lied. {t} tut höflich so, als wäre es eine kreative Entscheidung. || Deine Gitarre ist verstimmt und die ganze Stimmung auch. || Du schrammelst mit Leidenschaft und mit den falschen Tönen.
passion.meat_debate=Du fängst an, über Fleisch zu reden, und {t} hat starke Meinungen zu Zuschnitten. Es wird zur Debatte. || Der Steak-Streit wird hitzig. Blutig und durchgebraten passen nicht zusammen. || Du sagst „durchgebraten“ und {t} sieht dich an, als hättest du die eigene Familie beleidigt.
passion.recipe_war=Dein Rezept gegen das Rezept von {t}. Keiner gewinnt, alle haben Hunger und sind leicht beleidigt. || Du sagst, die Geheimzutat ist Butter. {t} sagt, es ist Geduld. Die Spannung steigt. || Du kritisierst die Technik von {t}. Fehler.
passion.no_common_ground=Du erzählst von deinen Lieblingsdingen. {t} erzählt von den eigenen. Sie haben nichts miteinander gemeinsam. || Eure Geschmäcker könnten nicht weiter auseinanderliegen. Das Gespräch verstummt. || {t} fragt „Moment, das magst du?“ in einem Ton, den du nicht vergisst.
passion.shared_joy=Über das zu reden, was ihr beide liebt, schenkt dir ein warmes Gefühl und eine stärkere Bindung. || {t} lacht und erzählt eine eigene Geschichte. Ihr seid euch jetzt näher.
passion.kindred_spirits=Du und {t} stellt fest, dass ihr aus demselben Holz geschnitzt seid. Heute beginnt eine starke Freundschaft. || {t} grinst und sagt: „Wo warst du mein ganzes Leben lang?“ Du fühlst es auch.
passion.fail=Du warst sicher, etwas gemeinsam zu haben. Es war weniger, als du dachtest. || Die Begeisterung war echt. Das Wissen nicht.
selfcare.bonus=Ein guter Moment mit dir selbst. Du fühlst dich erfrischt und still zufrieden. || Das hat dir gutgetan. Du gehst leichter weg, als du gekommen bist.
selfcare.crit_success=Du fühlst dich am Ende wie neugeboren. Alles ist ein bisschen heller und viel ruhiger. || Gut investierte Zeit in dich selbst. Du strahlst und der ganze Tag fühlt sich leichter an. || Einer dieser seltenen Momente, in denen du dich völlig im Reinen fühlst.
selfcare.soft_fail=Ist okay. Nicht magisch, aber okay. || Nichts Besonderes, nichts Schlimmes. Du machst weiter. || Der Moment vergeht, ohne dass viel dazu zu sagen wäre.
selfcare.crit_fail=Alles geht schief und am Ende fühlst du dich schlechter als vorher. || Was ein ruhiger Moment sein sollte, wird zu einer kleinen Katastrophe.
selfcare.off_day=Du versuchst es, aber heute ist dein Herz nicht dabei. Ein tiefer Seufzer folgt. || An manchen Tagen ist sogar Entspannen harte Arbeit.
selfcare.self_doubt=Du und der Spiegel starrt euch an. Du blinzelst zuerst, und nicht gerade selbstbewusst. || Du übst den Satz sechsmal. Jedes Mal wird er irgendwie schlechter. || Du siehst dich an und findest nur Dinge, die verbessert werden müssen. Die Motivationsrede hilft nicht.
selfcare.mind_wanders=Dein Kopf weigert sich, runterzufahren. Jeder Gedanke ist ein anderer Gedanke. || Du sitzt, du atmest und erinnerst dich an eine E-Mail, die du vergessen hast zu schicken. Frieden abgesagt. || Die Ruhe kommt nie ganz an. Du gehst unruhiger, als du angefangen hast.
selfcare.bad_omen=Die Deutung ist vage, düster und leicht unverschämt. Du gehst beunruhigt. || Die Zukunft sieht wolkig aus. Du wünschst, du hättest nicht gefragt. || Die Karten oder die Kugel haben schlechte Nachrichten in fröhlichem Ton. Irgendwie ist das schlimmer.
selfcare.bad_sleep=Du wälzt dich, drehst dich und kämpfst mit dem Kissen. Der Morgen kommt zu früh. || Du schläfst, technisch gesehen. Es fühlt sich nicht so an. || Jedes Mal, wenn du wegdämmerst, klappert etwas. Müde ist der neue Normalzustand.
selfcare.nightmare=Ein sehr seltsamer Traum, mit Zähnen und einem sprechenden Sandwich. Du wachst erschüttert und erschöpft auf. || Der Albtraum fühlt sich völlig echt an. Du setzt dich im Dunkeln auf und brauchst eine Minute. || Du träumst, du kommst zu spät zu etwas. Du wachst verspätet, müde und ohne zu wissen, wozu auf.
selfcare.firewood_boom=Du wirfst das Holzscheit rein und das Feuer antwortet mit einem KNALL. Ein Feuerball, eine Rußwolke und du bist plötzlich der dreckigste Mensch im Park. || Das Brennholz war feucht, das Feuer wütend. Bumm! Du bist von Kopf bis Fuß mit Asche bedeckt. || Ein Scheit zu viel. Das Lagerfeuer explodiert in einer Wolke aus Rauch und Funken und du siehst aus wie ein Schornsteinfeger.
selfcare.dust_fizzles=Du streust den Zauberstaub und das Feuer niest nur. Nichts passiert, außer ein bisschen Glitzer auf deinen Schuhen. || Der Staub funkelt eine Sekunde und erlischt dann mit einem traurigen kleinen Plopp. || Vielleicht ist das Feuer heute nicht in Stimmung für Magie.
selfcare.otherworldly_visitor=Die Flammen flackern, biegen sich und etwas mit viel zu vielen Augen beginnt aus dem Feuer zu kriechen. Du lachst. Du kannst nicht aufhören zu lachen. Es ist ein sehr nervöses Lachen. || Eine Gestalt steigt im Rauch auf, sieht dich direkt an und sagt nichts. Dir geht es gut. Dir geht es absolut gut. Ha. Ha ha ha. || Das Feuer flüstert deinen Namen mit einer Stimme aus dem Nichts. Du antwortest mit einem Kichern, das du nicht als dein eigenes erkennst.
selfcare.sparkler_burn=Die Wunderkerze spuckt überall Funken. Einer landet auf deinem Ärmel und deiner Würde. || Du schwenkst sie ein bisschen zu begeistert. Die Funken schwenken zurück. || Sie verglüht in deiner Hand, mit einem sehr kleinen, sehr unverschämten Zischen.
selfcare.smoke_in_eyes=Der Wind dreht und der Rauch folgt dir, wohin du dich auch setzt. Deine Augen werden dem Feuer nie verzeihen. || Du machst es dir gemütlich und der Rauch macht es sich mit dir gemütlich. Das Husten beginnt. || Das Feuer ist warm, der Rauch nicht. Du wechselst dreimal die Seite und er folgt dir.
selfcare.stubbed_toe=Du trittst fest zu. Dem Ding ist es egal, deinem Zeh nicht. || Wut an einem Gegenstand auszulassen fühlt sich eine Sekunde lang großartig an. Dann beginnt der Zeh zu pochen. || Das Ding gewinnt. Du hüpfst herum und hältst deinen Fuß und deinen Stolz fest.
selfcare.sunburn=Du dösest in der Sonne ein. Am Abend glühst du auf eine Art, um die keiner gebeten hat. || Das Öl hat eine Stelle verpasst. Die Stelle ist jetzt sehr, sehr rot. || Zu viel Sonne, zu wenig Verstand. Deine Haut legt Beschwerde ein.
selfcare.hammock_flip=Die Hängematte kippt und du auch, direkt in den Sand. || Du legst dich sehr elegant hin und stehst weniger elegant wieder auf. || Die Liege hat Meinungen dazu, wie du sitzt. Sie setzt sich durch.
selfcare.smoky_flue=Die Klappe war zu und das Wohnzimmer bekommt eine ordentliche Räucherung. Du hustest dich zum nächsten Fenster. || Das Feuer stottert, der Rauch geht überallhin, nur nicht den Kamin hoch. Deine Augen brennen. || Du zündest an, es qualmt. Du fächelst, es qualmt stärker.
selfcare.backfire_soot=Der Kamin hustet einen Rußfeuerball direkt auf dich. Du bist jetzt in einem sehr festlichen Schwarz. || WUMM! Ein Schwall Funken und Asche, und der Kaminvorleger ist nicht das Einzige, das verkohlt aussieht. || Das Feuer zündet mit einem Knall und du siehst aus, als wärst du gerade aus dem Schornstein gekrochen.
selfcare.ash_cloud=Du löschst das Feuer und die Asche steigt in einer großen grauen Wolke auf. Du wedelst sie mit Würde weg. || Die letzte Glut schmollt und schickt dir eine Aschewolke mitten ins Gesicht. || Das Feuer ist aus. Deine Frisur auch.
selfcare.burnt_fingers=Du hältst die Hände ein bisschen zu nah hin. Das Feuer verbrennt höflich eine Fingerspitze. || Warme Hände, dann heiße Hände, dann sehr schnelle Hände. || Aus einem Meter Abstand war das Feuer freundlicher.
selfcare.blessing=Der Zauberstaub erblüht zu einem warmen goldenen Schein. Für einen Moment fühlst du alles auf einmal: ausgeruht, satt, sauber und leicht. Das Feuer lächelt. Wahrscheinlich. || Die Flammen nehmen die Farbe eines Sonnenaufgangs an und umhüllen dich. Als sie verblassen, sind alle Wehwehchen, Sorgen und Krankheiten weg. || Ein sanfter Regen goldener Funken und die Welt ergibt wieder Sinn. Du bist geheilt, erfrischt und still begeistert.
selfcare.fail=Das war nicht deine beste Zeit mit dir selbst.
games.bonus=Ein solider Sieg. Du bist bestens gelaunt und fühlst dich geistesgegenwärtig. || Gut gespielt. Ein kleiner Siegestanz ist angebracht.
games.crit_success=Perfekter Lauf. Ein Publikum aus niemandem jubelt und du fühlst dich trotzdem wie ein Champion. || Absolute Präzision. Sogar der Automat sieht beeindruckt aus. || Das Spiel beugt sich heute deinem Willen. Was für ein Rausch.
games.soft_fail=Du verlierst, aber es war knapp genug, um unterhaltsam zu sein. || Nicht heute. Mehr Glück in der nächsten Runde. || Knapp daneben. Keiner hat es gesehen, also zählt es nicht.
games.crit_fail=Eine spektakuläre Niederlage. Du überlegst, in eine andere Stadt zu ziehen. || Alles, was schiefgehen kann, geht schief, in der peinlichstmöglichen Reihenfolge.
games.so_close=So nah dran. Nur ein kleines bisschen mehr und es wäre deins gewesen. || Du verfehlst es um Haaresbreite. Das Haar ist nicht beeindruckt.
games.sore_loser=Du verlierst und bist dabei nicht besonders souverän. Es fallen mehrere Worte. || Du gibst dem Automaten, dem Lag und einem kleinen Windstoß die Schuld.
games.claw_empty=Der Greifer schließt sich um nichts und das Plüschtier grinst dich an. Ein paar Münzen verschwinden. || Du richtest ihn perfekt aus. Der Greifer lässt los. Natürlich tut er das.
games.dart_stray=Der Dart segelt am Brett vorbei und findet stattdessen eine Wand. Keiner hat was gesehen. || Du zielst aufs Bullseye. Der Dart zielt auf den Boden.
games.gutter_ball=Die Kugel rollt langsam in die Rinne. Du schaust ihr den ganzen Weg nach. || Ein perfekter Wurf, wenn die Bahn einen Meter weiter links wäre.
games.air_ball=Der Ball verfehlt alles, auch den Korb, das Brett und deine Würde. || Du wirfst, du triffst nicht und der Ball springt irgendwohin, wo du nicht nach ihm suchen wirst.
games.button_mash=Du hämmerst auf alle Tasten gleichzeitig. Die Figur macht etwas Seltsames und verliert sofort. || Der Controller wehrt sich. Die Niederlage auch.
games.eats_coins=Der Automat nimmt deine Münzen und behält sie. Es tut ihm nicht leid. || Das Gerät frisst die Münzen ohne ein Danke. Der Bildschirm zeigt „Game Over“, bevor du anfängst.
games.wild_throw=Der Ball fliegt an den Dosen vorbei, an der Bude vorbei und fast ins Meer. || Du wirfst mit Selbstvertrauen. Die Dosen bleiben völlig unbewegt. || Ein toller Wurf, nur ganz woanders.
games.seesaw_bonk=Die Wippe schnellt hoch und haut dir direkt ans Kinn. || Du reitest das kleine Pferd ein bisschen zu wild und es wehrt sich.
games.arcade_win=Der Automat zahlt aus und ein paar Münzen landen in deiner Hand. || Ein kleiner Preis, ein breites Grinsen.
games.jackpot=Lichter blinken, Glocken läuten und Münzen sprudeln heraus. So viel Glück hattest du noch nie. || Jackpot! Die ganze Spielhalle dreht sich um.
games.fail=Das Spiel gewinnt diese Runde.
photo.bonus=Das Foto ist scharf, das Licht ist toll und {t} sieht perfekt aus. Ein Foto zum Behalten. || Ein klares, warmes Foto mit einem tollen Lächeln. Das willst du ausdrucken. || Perfekter Ausschnitt, perfektes Timing. Das Foto fängt die Stimmung genau ein.
photo.crit_success=Ein Foto so gut, dass man es einrahmen könnte. {t} will eine Kopie und noch eine zur Sicherheit. || Das Foto hat Magazinqualität. Du und {t} starrt beide auf den Bildschirm. || Du fängst einen Moment ein, der so perfekt ist, dass er gestellt aussieht. Die Fotogötter sind zufrieden.
photo.soft_fail=Das Foto ist nicht toll, aber es existiert. Du sagst, du machst später noch eins. || Ein mittelmäßiges Bild. {t} sagt, es sei okay, und meint es nur halb. || Es ist ein Foto. Man erkennt, was es sein soll. Mehr nicht.
photo.crit_fail=Das Foto ist in jeder erdenklichen Hinsicht eine Katastrophe. {t} besteht darauf, dass es nie gezeigt wird. || Du schaffst es, Foto, Licht und Stimmung gleichzeitig zu ruinieren. Ein Meisterwerk des Scheiterns. || Die Kamera spinnt, der Blitz geht falsch los und das Bild wird verflucht. {t} bittet darum, es zu löschen.
photo.blurry=Du drückst auf den Auslöser und das ganze Foto wird ein Schmierfleck. {t} sagt „künstlerisch“ mit ernster Miene. || Das Bild ist verwackelt wie eine Geistersichtung. {t} schlägt vor, es noch mal zu versuchen, vielleicht mit ruhigerer Hand. || Du bekommst ein perfektes Foto von einem sehr verschwommenen Nichts. {t} sagt höflich, es habe Charakter.
photo.blink=Du erwischst {t} mitten im Blinzeln. Auf dem Foto sieht es aus wie ein Traum. || Der Blitz geht los und {t} blinzelt genau im falschen Moment. Ein schönes Porträt geschlossener Augen. || Klick. {t} sieht auf dem Bild halb eingeschlafen aus. Löschen wird verlangt, und zwar bestimmt.
photo.finger=Dein Finger verdeckt die halbe Linse und dein Finger ist der Star des Fotos. || Du rahmst das Bild perfekt ein und erwischst hauptsächlich deinen Daumen. Ein Daumen mit toller Beleuchtung. || Auf dem Foto sind {t}, ein schöner Hintergrund und ein rosa Fleck in der Ecke: du.
photo.phone_drop=Das Selfie läuft gut, bis dir das Handy aus der Hand rutscht. {t} zuckt beim Klappern zusammen. || Du streckst dich für den perfekten Winkel und das Handy springt dir aus der Hand. Das Selfie ist der Boden. || Mitten im Selfie macht das Handy einen kleinen Sturzflug. {t} sieht es an, dann dich, und sagt nichts.
photo.camera_shy={t} versteckt das Gesicht, sobald die Kamera rauskommt. Auf dem Foto sind eine Hand und ein Lächeln, das nicht da ist. || Du hebst die Kamera und {t} wird schüchtern. Das Bild ist ein halbes Gesicht und viel Bedauern. || {t} taucht in letzter Sekunde aus dem Bild. Dein Foto ist ein perfektes Bild der Wand.
photo.viral_pic=Das Foto, das du gemacht hast, geht viral. Eine Seite kauft die Rechte für ${m}. {t} verlangt eine Nennung. || Jemand im Netz liebt dein Bild und schickt ${m} fürs Verwenden. Deine Handykamera hat gerade das Mittagessen bezahlt. || Du postest das Foto und es explodiert. Eine Marke zahlt ${m} dafür und {t} will etwas abhaben.
tv.bonus=Du landest bei der perfekten Sendung. Heute ist ein guter Tag. || Der Sender trifft genau deinen Geschmack. Pure Fernsehmagie.
tv.crit_success=Der Fernseher stellt sich kristallklar ein. Sogar die Zimmerantenne applaudiert.
tv.soft_fail=Das Bild ist verrauscht, aber mit einem Klaps auf die Seite kriegst du es hin.
tv.fire=Der Fernseher zischt, knallt und setzt sich selbst in Brand. Streaming war noch nie so heiß. || Rauch kringelt sich hinten aus dem Fernseher und dann steht das ganze Ding in Flammen. Das war viel für eine Fernbedienung. || Du drückst einen Knopf und der Fernseher antwortet mit Flammen. Die Bewertungen sind gemischt.
tv.shock_break=Du drückst den Einschaltknopf. Der Fernseher knallt, zischt und stirbt mit einer Rauchwolke, und der Reststrom erwischt dich trotzdem. || Ein Knall, ein Blitz und der Fernseher bleibt für immer dunkel. Der Schlag ist nur die letzte Beleidigung. || Du drückst die Fernbedienung und das ganze Gerät gibt das Leben auf, und die gute Laune deiner Haare nimmt es mit.
tv.shock=Du greifst zur Fernbedienung und hast ein herausragendes Kabel nicht bemerkt. Du bekommst einen schönen heißen Schlag. Wer hätte gedacht, dass Batterien so stark sind?! || Du schaltest den Fernseher an und das alte Gerät beißt zurück. Dir stehen die Haare zu Berge und deine Seele verlässt kurz den Körper. || Der Fernseher knistert, funkt und beschließt, dass du die neue Antenne bist. Zzzzzack! || Du drückst den Einschaltknopf. Der Fernseher drückt zurück. Fest.
tv.fire_safe=Der Fernseher gibt einen winzigen Knall von sich und wird still. Gut, dass es nur ein kleiner Funke war... || Hinter dem Bildschirm macht es Peng. Sehr klein, sehr dramatisch. Dem Fernseher ist es sichtlich peinlich. || Ein kurzer kleiner Knall, dann Stille. Gut, dass nichts Schlimmeres passiert ist.
tv.pass=Der Fernseher flackert an. Die Primetime wartet.
shower.bonus=Das Wasser trifft genau richtig. Du könntest hier bleiben, bis der Boiler aufgibt. || Eine herrliche Dusche. Du kommst raus und fühlst dich wie eine ganz neue Zoi.
shower.crit_success=Die beste Dusche deines Lebens. Dampf, perfekter Druck und ein Lied, das du fast aufnehmen möchtest.
shower.soft_fail=Das Wasser ist ein bisschen lauwarm, aber du ziehst es durch.
shower.crit_fail=Du steigst rein und die Mischbatterie verrät dich. Es ist nicht kalt, es ist ein Gletscher. Deine Seele verlässt dich durch den Abfluss. || Die Rohre stöhnen, das Wasser wird arktisch und du schreist einen Ton, von dem du nicht wusstest, dass du ihn hast.
shower.fail=Du duschst, aber die Mischbatterie hat versagt und es ist eiskalt! Das wirst du morgen bereuen. || Das Wasser startet warm und wird dann aus Trotz zu Eis. Du springst zitternd heraus.
shower.pass=Eine völlig gewöhnliche Dusche. Nichts ist explodiert, nichts eingefroren.
housework.bonus=Blitzblank! Die Bude glänzt und deine Laune auch. || Putzen fühlt sich heute seltsam befriedigend an. Du könntest die ganze Wohnung machen.
housework.crit_success=Der Raum funkelt wie ein Ausstellungsraum. Sogar die Wollmäuse applaudieren.
housework.soft_fail=Ein paar Schlieren und viel Gemecker, aber die Arbeit wird erledigt.
housework.crit_fail=Eine Überschwemmung, ein Ausrutscher und ein kaputtes Gerät in einem Rutsch. Es braucht Talent, so gründlich zu scheitern.
housework.slip=Du trittst in die nasse Stelle, die du gerade gewischt hast. Der Boden gewinnt und du drehst eine Pirouette wie auf dem Eis. || Das Putzen läuft prima, bis dein Fuß auf eine Seifenpfütze trifft. Wiiiie... bums.
housework.frustrated=Du schrubbst, du fegst, du seufzt. Die Unordnung wächst aus Trotz nach. || Jedes Mal, wenn du eine Stelle putzt, tauchen zwei neue auf. Du hast keine Lust mehr, ruhig zu bleiben.
housework.water_break=Du drehst den Hahn einmal zu oft auf und das Rohr gibt auf. Überall Wasser, und das Waschbecken ist hinüber. || Ein verdächtiges Zischen, ein Knall und eine Fontäne. Die Rohrleitung hat gekündigt und der Boden ist jetzt ein See.
housework.break=Du machst an dem Gerät herum und irgendwas darin macht klonk. Dann Stille. Super. || Du drückst das Falsche und das Gerät stirbt mit einem traurigen kleinen Surren.
housework.messy=Irgendwie war dein Mopp dreckiger als der Boden und hat alles noch schmutziger gemacht. Dreck, überall Dreck! || Der Schwamm, den du genommen hast, war offenbar eine Staubfarm. Jetzt sieht alles aus, als wäre seit 1987 keiner mehr hier gewesen. || Du schüttelst den Staubwedel aus und es wird staubiger. Die Physik hat Fragen. Du auch. || Der Staubsauger rülpst alles aus, was er je geschluckt hat. Glückwunsch, du hast rückwärts Putzen erfunden. || Du wringst den Lappen aus und es regnet irgendwie Staub. Jedes Regal, jeder Boden, jede Fläche. Sogar die Spinnweben legen Beschwerde ein. || Dein Besen hat geniest. Jetzt ist alles ein Staubsturm. Putzen war ein Fehler.
housework.sigh=Du seufzt beim Anblick des Aufgabenbergs. Der Aufgabenberg interessiert das nicht. || Es gibt immer etwas Dreckigeres. Du nimmst dir einen Moment, um deiner Freizeit nachzutrauern.
housework.dust_allergy=Du wirbelst eine Staubwolke auf, die seit Jahren darauf gewartet hat. Hatschi. Deine Nase legt Beschwerde ein. || Der Besen weckt jede Wollmaus im Haus. Du niest, bis deine Ohren knacken. || Eine Wolke alten Staubs erwischt dich genau in der Nase. Du bist jetzt offiziell allergisch gegen dein eigenes Putzen.
housework.clean_house=Ein Schub Putzenergie und die ganze Bude glänzt in einem Rutsch. Kein Staubkorn hat überlebt. || Du findest den perfekten Putzrhythmus. Jede Fläche und jeder Boden ist makellos. Wer ist diese Person? || Es macht Klick. Du räumst die ganze Wohnung in einem glorreichen Schwung auf, Wollmäuse inklusive.
repair.crit_success=Es macht Klick. Alles Kaputte hier summt auf einmal wieder, und du gehst davon wie eine Reparaturlegende. || Deine Hände bewegen sich von selbst. Als du das Werkzeug weglegst, ist hier nichts mehr kaputt. Heldenzeug. || Eine perfekte Reparatur, dann noch eine, dann alle. Alles Kaputte ringsum kommt zurück und der Werkzeugkasten applaudiert.
repair.soft_fail=Die Reparatur klappt fast. Fast. Du trittst zurück und das Ding zuckt mit den Schultern. || Du ziehst an, drehst und testest. Es funktioniert immer noch nicht. Es sieht allerdings ein bisschen beleidigt aus. || Nah dran, aber nein. Das Objekt hat beschlossen, noch etwas länger kaputt zu bleiben.
repair.shock=Du berührst das falsche Kabel und das Gerät gibt dir dazu eine sehr deutliche Meinung. Deine Haare stehen applaudierend ab. || ZACK! Die Reparatur endet mit einem Funken, einem Aufschrei und dem Geruch verbrannter Haare. || In der Anleitung stand „zuerst den Stecker ziehen“. Du hast diese Zeile direkt nach dem Funken gelesen.
repair.sparks=Im Inneren knallt, zischt und qualmt es. Du trittst mit sehr vorsichtigem Gesicht zurück. || Ein Funkenregen, ein Brandgeruch und langes Schweigen. Du beschließt, nichts gesehen zu haben. || Das Gerät summt, funkt einmal und gibt auf. Du bist nicht sicher, wer diese Runde verloren hat.
repair.flood=Du lockerst ein Rohr zu viel und das Wasser stößt zur Party. Der Boden ist jetzt ein Teich. || Der Schraubenschlüssel rutscht ab, das Rohr gibt nach und eine Fontäne ist geboren. Platsch. || Ein winziges Leck wird zu einem nicht ganz so winzigen Problem. Der Boden ist nass, und du auch.
repair.soaked=Ein Schwall Wasser trifft dich mitten ins Gesicht. Du bist jetzt offiziell Teil der Rohrleitung. || Das Rohr spritzt zur Seite und du kriegst alles ab. Glückwunsch, du bist sehr sauber und sehr kalt. || Du drehst am falschen Ventil und bekommst eine Gratisdusche. Natürlich vollständig bekleidet.
repair.fumble=Der Schraubenzieher gewinnt diese Runde. Du lässt alles fallen und sagst ein paar Worte. || Du legst das Werkzeug für eine Sekunde ab und es verschwindet. Das Ding ist immer noch kaputt und deine Geduld auch. || Jede Schraube, die du anfasst, rollt davon. Das Ding bleibt kaputt und du bleibst genervt.
repair.wrong_part=Du reparierst das falsche Teil, sehr selbstsicher. Das richtige Teil ist immer noch kaputt und jetzt bist du müde. || Du tauschst ein Teil aus, das gar nicht getauscht werden musste. Das eigentliche Problem winkt dir aus der Ecke zu. || Repariert! Naja, irgendwas. Nicht das, was kaputt war.
repair.thumb=Der Hammer trifft deinen Daumen. Dein Daumen reicht eine offizielle Beschwerde ein. || Ein kleiner Ausrutscher, ein großes Aua. Du hältst dir die Hand und tust so, als wäre nichts gewesen. || Du triffst genau das, worauf du gezielt hast, nur dass es dein Finger war.
repair.flood_safe=Das Rohr spuckt eine kleine Pfütze aus und überlegt es sich dann anders. Nasser Boden, nasse Schuhe, trockenes Ego. || Ein bisschen Wasser schleicht heraus und bildet eine Pfütze. Nichts, was ein Wischmopp nicht lösen könnte, aber du starrst sie trotzdem an. || Das Rohr rülpst etwas Wasser auf den Boden. Es ist nur eine Pfütze, aber es ist DEINE Pfütze.
repair.repair_all=Es macht Klick. Alles Kaputte hier summt auf einmal wieder, und du gehst davon wie eine Reparaturlegende. || Deine Hände bewegen sich von selbst. Als du das Werkzeug weglegst, ist hier nichts mehr kaputt. Heldenzeug. || Eine perfekte Reparatur, dann noch eine, dann alle. Alles Kaputte ringsum kommt zurück und der Werkzeugkasten applaudiert.
repair.shock_death=Du greifst ins Gerät... ein heller Blitz ist das Letzte, was du siehst. Das Ende. || ZACK. Das Licht flackert, du sackst um und die Reparaturanleitung klappt leise von selbst zu. Abspann. || Das falsche Kabel im falschen Moment. Du warst eine großartige Reparaturkraft... eine Weile lang. Das Ende.
laundry.bonus=Die Wäsche kommt weich, warm und mit Frühlingswiesenduft heraus. Zusammenlegen macht fast Spaß. || Ein makelloser Waschgang. Jede Socke hat ihr Pendant und keine ist rosa. || Die Ladung ist fleckenlos und perfekt trocken. Du fühlst dich wie ein Wäsche-Profi.
laundry.crit_success=Wäsche-Perfektion. Das Weiß ist weißer, die Farben leuchten und du faltest wie im Hotel. || Das Programm endet und deine Kleidung sieht aus wie neu. Irgendwo in der Nähe summt ein Chor. || Jeder Fleck weg, jede Socke gepaart, jedes Hemd knackig. Die Wäschegötter sind zufrieden.
laundry.soft_fail=Die Ladung kommt ein bisschen zerknittert und ein bisschen feucht heraus, aber tragbar. || Ein paar Flecken überleben den Waschgang. Du beschließt, das ist Charakter. || Du drückst Start, hoffst aufs Beste und die Kleidung kommt größtenteils okay heraus.
laundry.crit_fail=Eingelaufen, rosa, überschwemmt und eine Socke weniger. Ein Meisterwerk der Wäschekatastrophen. || Die Maschine läuft über, dein Hemd schrumpft und die rote Socke schlägt wieder zu. Du verdienst eine Medaille im Chaos. || Eine Schaumflut, eine ruinierte Garderobe und eine fehlende Socke in einem Waschgang. Auf seine Art beeindruckend.
laundry.shrunk=Du wäschst deinen Lieblingspulli heiß. Er passt jetzt einem sehr kleinen Bären. || Auf dem Etikett stand Kaltwäsche. Du hast es nach dem Waschgang gelesen. Das Hemd ist jetzt ein bauchfreies Top. || Du öffnest die Maschine und ziehst deine Jeans heraus. Sie hat jetzt Puppengröße. Die Waschmaschine ist selbstzufrieden.
laundry.pink=Eine einzelne rote Socke schleicht sich in die Weißwäsche. Alles, was du besitzt, ist jetzt rosa. || Du wolltest frische weiße Hemden. Du hast einen rosigen Sonnenuntergang und eine Lektion über Sortieren bekommen. || Die Ladung kommt in einer Farbe heraus: Lachs. Deine Garderobe startet in eine mutige neue Ära.
laundry.lost_sock=Du zählst die Socken zweimal. Eine ist wieder in die versteckte Dimension der Maschine verschwunden. || Sieben Socken gehen rein, sechs kommen raus. Die Waschmaschine legt eine Sammlung an. || Eine einsame Socke starrt dich aus der Trommel an. Ihr Gegenstück ist für immer weg.
laundry.slip=Du trittst auf eine Schaumspur der Maschine. Der Boden gewinnt und du drehst eine Pirouette wie auf dem Eis. || Eine Seifenpfütze überfällt deine Socken. Wiiiie... bums. || Du trägst den Korb direkt in eine nasse Stelle. Die Wäsche fliegt und du auch.
laundry.flood=Der Schlauch springt ab und die Maschine überschwemmt den Boden. Du stehst in einem sehr sauberen See. || Zu viel Waschmittel, zu wenig Verstand. Eine Schaumwelle übernimmt den Raum und die Maschine gibt auf. || Ein lautes Gluckern, ein Knall und eine Fontäne aus Seifenwasser. Der Waschkeller ist jetzt ein Pool.
laundry.break=Du drückst einen Knopf, der nicht gedrückt werden sollte. Die Maschine stöhnt und geht aus. || Im Inneren klonkt, rattert und stoppt es. Die Trommel steckt mitten im Programm fest und deine Laune auch. || Die Maschine bebt, qualmt ein wenig und stirbt. Es war schön, sie gekannt zu haben.
laundry.burnout=Die Maschine schreit, funkt und gibt eine kleine rauchige Flamme von sich, bevor sie stirbt. Waschtag abgesagt. || Rauch, Funken und eine kurze Flamme hinten an der Maschine. Es war eine gute Waschmaschine. Es war eine alte Waschmaschine. || Etwas im Inneren überhitzt und die Maschine verabschiedet sich in einer Rauchwolke. Deine Kleidung muss warten.
laundry.laundry_cash=Du prüfst die Wäsche und findest ${m} gefaltet in der Tasche deiner alten Hose, eine Sekunde bevor die Maschine sie zu Konfetti macht. || Ein zerknülltes Bündel mit ${m} in der Jeans, von der du geschworen hast, sie sei leer. Die Waschmaschine kriegt die Jeans, du das Geld. || Du tastest vor dem Waschgang jede Tasche ab und landest einen Volltreffer: ${m}. Das frühere Ich war ein Genie. Das heutige Ich ist reich. || Rätsel gelöst: Dort sind die ${m} geblieben. Sie haben sich die ganze Zeit in deiner Hose versteckt. || Du findest ${m} in einer Tasche, kurz bevor der Schleudergang startet. Die Maschine wirkt enttäuscht, dass sie sie verpasst hat.
laundry.flood_safe=Die Maschine rattert, hustet eine Flusenwolke und gibt auf. Eine einzelne Wollmaus rollt vor deinen Füßen aus. || Ein lautes Klonk, ein trauriges Stottern und die Trommel wird still. Ein kleines Staubwölkchen setzt sich neben deinen Schuhen ab. || Das Programm klemmt und die Maschine rülpst ein graues Flusenwölkchen aus. Der Boden bekommt eine winzige Wollmaus und du die Schuld.
cooking.bonus=Der Duft ist fantastisch. Du probierst und nickst wie ein Fernsehkoch. || Eine kleine Prise Glück und das Gericht wird perfekt.
cooking.crit_success=Ein Meisterwerk. Restaurants würden um dieses Rezept betteln.
cooking.soft_fail=Es sieht kein bisschen wie auf dem Bild aus, aber es ist essbar. Wahrscheinlich.
cooking.crit_fail=Rauch, Funken und eine sehr verwirrte Küchenkraft. Heute hast du eine neue Stufe des Küchendesasters erfunden.
cooking.burn=Du packst die heiße Pfanne mit nacktem Selbstvertrauen. Sie ist anderer Meinung. Du hüpfst herum und fächelst deine Hand. || Der Dampf erwischt dich und die Pfanne erwischt dich. Kochen ist offenbar gefährlich.
cooking.food_poison=Das Gericht riecht verdächtig, schmeckt verdächtig und dein Magen plant schon eine Rachetour. || Du kochst mit großem Selbstvertrauen und null Hygiene. Dein Magen schickt später eine Bewertung.
cooking.mess=Mehl an der Decke, Soße an der Wand und eine qualmende Pfanne. Wo ging das Rezept schief? || Die Küche sieht aus wie ein Schlachtfeld. Du bist das einzige Opfer.
cooking.fire=Du schaust eine Sekunde weg und die Pfanne fängt Feuer. Die Küche hat Meinungen zu deinem Kochen. || Flammen! Der Herd wurde kreativ und du bist darauf überhaupt nicht vorbereitet. || Das Öl wird ehrgeizig, die Flamme wird höher und dein Abendessen ist offiziell ein Brandrisiko. Lauf!
cooking.explosion=Der Ofen macht ein Geräusch, das kein Ofen machen sollte. Dann ein größeres. Das Abendessen ist jetzt ein Tatort. || Irgendetwas da drin sollte NICHT erhitzt werden. Die Küche antwortet mit einem lauten Knall. || Du drückst Start, der Ofen denkt kurz nach und geht dann los wie ein Feuerwerk.
cooking.appliance_break=Du drückst den Knopf und das Gerät macht Knall und dann nichts mehr. Abendessen ist jetzt Lieferdienst. || Im Ofen funkt etwas. Du drehst dich um, um dich zu entschuldigen, aber er ist schon hinüber.
cooking.takeout=Das Abendessen ist ein hoffnungsloser Fall, also bestellst du Essen. Es kommt schnell und kostet ${m}. Kochen ist eine Reise. || Du gibst dich geschlagen und rufst beim Pizzaladen an. ${m} später sind alle glücklich. || Der Rauchmelder überlegt noch, also gibt es Lieferdienst. Summe: ${m}.
cooking.explosion_safe=Der Ofen macht einen kleinen Knall und wird dann still. Du entscheidest dich, es Würze zu nennen. || Ein kleiner Knall und ein sehr dramatischer Ofen. Niemand ist verletzt, nur beleidigt. || Der Ofen knallt einmal laut. Gut, dass es nur ein kleiner Bums war.
cooking.fire_safe=Die Pfanne knallt wie ein Böller, du quiekst und dann wird alles still. Gut, dass es nur ein kleiner Knall war... || Der Herd hustet einen winzigen Knall aus und überlegt es sich dann anders. Gut, dass es nur ein kleiner Knall war... || Ein kleiner Knall, ein Hauch von nichts und eine Küche, die nach einem Grillfest riecht, das nie stattgefunden hat.
dining.bonus=Der Kühlschrank hat genau das, was du wolltest, und es schmeckt noch besser, als es aussieht. Ein kleiner Sieg. || Perfekte Temperatur, perfekte Portion. Du isst, als müsstest du noch irgendwohin Wichtiges. || Jeder Bissen sitzt. Du isst sogar den Teller ohne einen Krümel leer.
dining.crit_success=Ein Essen, das Applaus verdient. Du leckst den Teller ab und niemand kann dich aufhalten. || Ein Sternekoch würde weinen. Du isst es einfach. Pure Freude. || Der beste Bissen deiner Woche. Du schließt die Augen und bleibst einen Moment dort.
dining.soft_fail=Ein bisschen Gekleckere, ein kleines Ups. Du wischst den Tisch ab und tust so, als wäre nichts gewesen. || Das Essen ist ein bisschen komisch, aber du isst es trotzdem auf. Stolz ist eine Soße. || Du lässt es fast fallen, fängst es auf und nickst, als wäre das der Plan gewesen.
dining.crit_fail=Du trägst den Teller mit Selbstvertrauen, dann mit Panik, dann gar nicht mehr. Der Boden bekommt das Essen und du den Boden. || Die Schüssel hebt ab und die Suppe nimmt den Boden. Du nimmst den Boden auch. Das Mittagessen ist jetzt eine Geschichte. || Ein Niesen, ein Malheur und die schlimmstmögliche Landung. Das Essen und dein Stolz sind überall.
dining.spill=Die Schüssel kippt und das Abendessen landet auf dem Boden. Der Boden war irgendwie schon staubig und jetzt ist es ein Schauplatz. || Du lässt die Hälfte des Essens fallen und eine Wolke aus Krümeln und Staub steigt auf. Die Küche ist nicht begeistert. || Ein ungeschicktes Kippen, ein Scheppern und eine Sauerei breitet sich auf dem Boden aus. Das Aufräumen kann warten.
dining.burnt_tongue=Du beißt rein, bevor es abgekühlt ist. Deine Zunge legt Beschwerde ein und deine Augen auch. || Zu heiß, zu schnell. Du fächelst dir den Mund wie ein sehr kleiner Drache. || Der erste Bissen ist Lava. Der zweite Bissen ist eine schlechte Idee. Du nimmst ihn trotzdem.
dining.choke=Ein Bissen geht in die falsche Kehle. Du hustest, du keuchst, du erholst dich mit einem sehr würdevollen Nicken. || Du inhalierst das halbe Essen und ein Teil davon will wieder raus. Wasser, sofort. || Ein wilder Hustenanfall, ein paar Tränen und ein Daumen nach oben. Dir geht's gut. Der Teller verurteilt dich.
dining.food_coma=Mitten auf dem Teller bist du für heute schon fertig. Deine Augenlider geben als Erstes auf. || Ein schweres Essen, ein schwerer Seufzer und ein langer Blick ins Nichts. Das Nickerchen ruft. || Das Essen war toll. Der Körper ist jetzt zur Wartung offline.
dining.bad_leftovers=Der Rest roch in Ordnung, was eine Lüge ist, die Reste erzählen. Dein Magen fängt an zu widersprechen. || Du isst das Ding ganz hinten im Kühlschrank. Der Kühlschrank wollte dich warnen. || Es sah okay aus und schmeckte okay. Dein Magen hat andere Meinungen.
dining.machine_eats_coin=Der Automat nimmt deine Münze und gibt dir mit Selbstvertrauen nichts. || Du drückst den Knopf. Der Automat brummt, denkt nach und behält dein Geld.
dining.fountain_splash=Das Wasser springt höher als erwartet. Dein Shirt ist jetzt Teil des Brunnens. || Du beugst dich für einen Schluck vor und bekommst eine Ladung kaltes Wasser ins Gesicht.
programming.bonus=Der Code kompiliert beim ersten Versuch. Verdächtig, aber willkommen. || Du findest die elegante Lösung und fühlst dich wie ein Zauberer.
programming.crit_success=Makelloser Code, null Bugs und Standing Ovations von einem leeren Raum.
programming.soft_fail=Es läuft, größtenteils. Die Warnungen sind das Problem deines zukünftigen Ichs.
programming.crit_fail=Du löschst mit rm -rf etwas, was du nicht hättest löschen sollen, und die Hardware schließt sich der Party an. Totale Systemkernschmelze.
programming.stress=Dein Code kompiliert beim fünften Versuch und bricht beim sechsten. Dein Auge zuckt im Takt. || Ein fehlendes Semikolon kostet dich eine Stunde Lebenszeit. Jemand Kaffee?
programming.frustrated=Vor einer Minute hat noch alles funktioniert. Du hast nichts angefasst. Da bist du dir sehr sicher. || Der Bug ist weg, dann ist er wieder da, dann ist er woanders. Du haust auf den Tisch.
programming.shock_break=Ein Knall, ein Blitz und dein Computer geht mit einer Rauchwolke aus. Der Schlag ist nur die letzte Beleidigung. || Du drückst Enter und die Maschine schlägt zurück. Die Funken fliegen, buchstäblich.
programming.crash=Der Bildschirm wird blau, dann schwarz, dann tot. Die ganze ungespeicherte Arbeit geht mit. || Dein Computer seufzt leise und streikt. Er hatte genug.
programming.hack=Du hast geschworen, deine Software sei unhackbar. Jemand hat dich gerade widerlegt und ${m} von deinem Bankkonto abgehoben. Auf dem Zettel steht „Danke für den Tipp“. || Dein supersicheres Passwort war „passwort1“. Jemand hat ${m} von deinem Konto abgezogen, bevor du deinen Kaffee ausgetrunken hattest. || Ein Unbekannter fand die Hintertür, die du vergessen hast zu schließen, und bediente sich mit ${m}. Beeindruckende Teamarbeit mit deinem früheren Ich.
programming.bounty=Du findest einen kritischen Bug in einer bekannten App und meldest ihn höflich. Sie zahlen ${m} Kopfgeld. Du tust so, als wäre das immer der Plan gewesen. || Dein Pull Request behebt etwas, das jahrelang niemand beheben konnte. Die Maintainer schicken ${m} und ein sehr langes Dankeschön. || Eine Firma liest deinen sauberen kleinen Exploit-Bericht und überweist dir ${m}. Der Hoodie war eine gute Investition.
programming.freelance=Ein Kunde zahlt ${m} für einen kurzen Gefallen. Es hat zehn Minuten und drei Jahre Erfahrung gekostet. || Du reparierst die Website von jemand Fremdem per Chat und es wird darauf bestanden, ${m} zu schicken. Wer bist du, abzulehnen? || Ein winziger Nebenjob landet in deinem Postfach und gleich dahinter ${m} auf deinem Konto.
logic.bonus=Die Teile rasten ein. Du fühlst dich richtig klug. || Du entdeckst den Fehler im Argument vor allen anderen. Stille, selbstzufriedene Freude. || Fakten, dann Logik, dann eine Schlussfolgerung, die tatsächlich folgt. Herrlich.
logic.crit_success=Jede Frage beantwortet, jeder Trick durchschaut. Du könntest einen Kurs geben. || Das Rätsel faltet sich wie Papier. Du lehnst dich zurück und der Stuhl knarrt respektvoll. || Eine perfekte Argumentationskette von Anfang bis Ende. Wirklich brillant.
logic.soft_fail=Nah dran, aber die Logik hat ein Loch, durch das ein Lkw passt. || Du hast es fast. „Fast“ leistet hier ganz schön viel. || Die Antwort ist in der Nähe. Du bist nur nicht sicher, wo.
logic.crit_fail=Du folgst einem sehr überzeugenden Argument bis an einen sehr falschen Ort. Totaler Zusammenbruch. || Alles, was du vor drei Minuten geglaubt hast, war falsch. Und das, was du jetzt glaubst, auch. || Selbstvertrauen, ein Schnitzer und ein kompletter mentaler Neustart. Du fängst bei null an.
logic.headache=Zu viele Tabs, zu viele Fakten. Dein Kopf beginnt zu pochen. || Du liest denselben Absatz sechsmal und es wird nie leichter. || Ein dumpfer Schmerz hinter den Augen sagt, dass es für heute genug Denken war.
logic.rabbit_hole=Ein Link führte zum nächsten und in deinem Kopf ist es jetzt drei Uhr morgens. || Du hast mit einer einfachen Frage angefangen und liest jetzt über mittelalterlichen Käse. || Die Recherche wurde interessant. Die Recherche wurde sehr lang.
logic.wrong_answer=Du warst dir so sicher. Die Lösung war gnädiger, als sie hätte sein müssen. || Du antwortest mit Selbstvertrauen. Die Antwort ist mit demselben Selbstvertrauen falsch. || Ein kühner Tipp, der kühner war, als er richtig war.
logic.overthinking=Du denkst so angestrengt über die Frage nach, dass du vergisst, wie sie lautete. || Je mehr du analysierst, desto weniger ergibt es Sinn. Denken tut ironischerweise weh. || Du baust eine perfekte Theorie auf und merkst dann, dass du von der falschen Tatsache ausgegangen bist.
logic.argument=Du erklärst die Logik. {t} erklärt, warum sie falsch ist. Jetzt erklärt ihr beide. || Dein perfektes Argument hat ein Loch, das du nicht gesehen hast. {t} sieht es und sagt nichts, laut. || Du gewinnst die Diskussion in deinem Kopf. Laut gewinnt {t} sie mit einem Satz.
logic.lost_thread=Du startest mit einem klaren Punkt und verlierst ihn mitten im Satz. {t} wartet freundlich, bis er zurückkommt. || Die Logik bricht auf halber Strecke zusammen. Du blinzelst {t} an und sagst „Was wollte ich sagen?“ || Ein makelloses Argument, das makellos in der Mitte aufhört. {t} nickt, als hätte es Sinn ergeben.
logic.pedantic=Du korrigierst {t} bei einem winzigen Detail. {t} sieht dich an, als hättest du den letzten Keks gegessen. || Technisch hast du recht. {t} starrt dich mit der Energie einer geschlossenen Tür an. || Du gewinnst einen Punkt, der keinen interessiert hat. {t} holt tief Luft.
logic.falls_asleep_reading=Das Buch ist so still. Du blinzelst einmal und wachst auf Seite 40 mit einem Abdruck auf der Wange auf. || Du liest drei Zeilen, dann fangen die Wörter an, sich zu bewegen. Ein Nickerchen wurde gemacht.
logic.quiz_prize=Du beantwortest die letzte Frage, bevor die Moderation sie zu Ende gestellt hat. Der Preis sind ${m} und ein seltenes Gefühl der Überlegenheit. || Dein Quizwissen zahlt sich endlich aus: ${m}. All die skurrilen Fakten waren eine Investition. || Du knackst das Rätsel in Rekordzeit und ein Pop-up zahlt dir ${m}. Mensa war für eine Stellungnahme nicht zu erreichen.
finance.bonus=Die Zahlen passen und dein Bauchgefühl liegt zur Abwechslung richtig. Ein stiller kleiner Sieg. || Du liest den Chart wie ein Buch und der Chart benimmt sich. Sehr geschmeidig. || Ein kluger Zug, eine ruhige Hand und ein grüner Bildschirm. Du nickst dir selbst zu.
finance.crit_success=Jeder Zug sitzt. Der Markt liebt dich und du tust bescheiden. || Du kaufst günstig, verkaufst teuer und irgendwie war alles Absicht. Legendär. || Der Chart geht zu deinen Gunsten senkrecht nach oben. Du klappst den Laptop zu wie ein Filmschurke.
finance.soft_fail=Nichts Weltbewegendes, nur ein winziger Rückgang und viel Zusammenkneifen der Augen. || Du bist bei plus minus null und nennst es eine Lektion. Eine sehr langweilige Lektion. || Der Markt zuckt mit den Schultern und du auch.
finance.crit_fail=Du verkaufst am Tiefpunkt und kaufst am Höhepunkt, ein seltenes Doppel. Der Markt bemerkt es. || Ein falscher Klick und der ganze Plan geht in Rot unter. Dein Magen sackt mit dem Chart ab. || Der Chart geht senkrecht, in die falsche Richtung. Du starrst ihn an, als würde er dir eine Entschuldigung schulden.
finance.bad_trade=Bei dieser Sache warst du dir sicher. Der Chart widerspricht, laut. || Der Tipp kam von jemand sehr Selbstsicherem, den du nicht kanntest. Das war der erste Fehler. || Du hältst ein bisschen zu lange fest und verkaufst ein bisschen zu spät. Ein Klassiker.
finance.panic=Die Linie fällt und dein Herz fällt mit. Du lädst die Seite neun Mal neu. || Überall rote Zahlen. Du atmest in eine Papiertüte, sinnbildlich. || Deine Hand schwebt zitternd über dem Verkaufsknopf. Der Markt wartet nicht.
finance.rage=Du beschimpfst den Markt mit Wörtern, die ein höflicher Computer nicht hören sollte. || Du haust auf den Tisch und der Aktienchart fällt weiter. Unverschämt. || Deine Faust und der Tisch haben ein kurzes Meeting. Der Tisch gewinnt.
finance.glitch=Die Handelsseite stürzt im schlimmsten Moment ab. Dein Computer auch. || Ein Pop-up, ein Ladekreis und ein eingefrorener Bildschirm. Der Markt hat deine Sitzung als Geisel genommen. || Die Maschine bricht unter dem Gewicht deiner schlechten Entscheidungen zusammen.
finance.scam=Eine Nachricht sagt, du hättest etwas gewonnen. Du klickst darauf. ${m} verlassen in Eile dein Konto. || Ein sehr netter Prinz brauchte einen kleinen Gefallen. Der Gefallen kostete ${m}. || Die Geldanlage sah seriös aus, mit Logo und allem. Es war nur ein Logo. ${m} sind weg.
finance.lottery_counterfeit=Der Schein ist eine Fälschung. Die Verkaufskraft entschuldigt sich sehr und du bist ${m} los. || Ein gefälschtes Los, ein fröhliches Lächeln und ${m} weg. Du hörst fast den Drucker lachen. || Die Zahlen sehen richtig aus und das Papier sieht falsch aus. Eine sehr überzeugende Fälschung kostet dich ${m}.
finance.lottery_washed=Das Los geht mit deiner Jeans durch die Wäsche. Übrig sind graues Konfetti und verlorene ${m}. || Du findest das Los im Trockner, jetzt ein kleines Papierknäuel. Der Gewinn bleibt unabgeholt und das Los hat ${m} gekostet. || Eine Tasche, eine Waschmaschine und ein durchweichtes Los. Ein verregneter Tag, ${m} verloren.
finance.lottery_old_draw=Du feierst eine volle Minute, bevor du merkst, dass es die Ziehung von letzter Woche war. Das Los kostete ${m} und dein Stolz auch. || Die Zahlen sind perfekt. Das Datum leider nicht. ${m} für eine sehr teure Lektion. || Ein großer Gewinn, etwas Kleingedrucktes und ${m} aus deiner Tasche. Die Ziehung war letzte Woche.
finance.lottery_text_scam=Eine SMS sagt, du hättest einen Preis gewonnen und müsstest nur eine kleine Gebühr zahlen. Die Gebühr beträgt ${m}. Der Preis kommt nie an. || Eine sehr freundliche Nachricht, ein Link, den du nicht hättest anklicken sollen, und ${m} weg. || „Jetzt Preis abholen!“ Hast du. Es hat ${m} gekostet.
finance.card_swallowed=Der Automat schluckt deine Karte und druckt einen Beleg mit der Aufschrift „Viel Glück“. || Eine versteckte Gebühr taucht auf. Du starrst sie an, als könnte sie sich ändern.
finance.hidden_fee=Eine kleine Gebühr, die du nicht kommen sahst, beißt ein kleines Stück aus deinem Geld. || Ah, die „Servicepauschale“. Praktisch, für jemanden.
finance.lottery_dud=Du rubbelst, du hoffst, du verlierst. Das Los ist ein sehr teures Lesezeichen. || Drei Zahlen stimmen überein. Von sechs. Nicht diese drei.
finance.lottery_jackpot=Sechs Zahlen, alle deine. Du liest das Los dreimal, dann noch einmal laut. Der Gewinn sind ${m}. || Die Zahlen reihen sich eine nach der anderen auf und das Los fühlt sich plötzlich sehr schwer an. ${m} landen auf deinem Konto. || Du gewinnst ${m}. Du suchst nach einem Haken, findest keinen und beginnst, eine sehr verantwortungsvolle Party zu planen.
finance.lottery_lucky=Ein kleiner Gewinn: ${m}. Nicht lebensverändernd, aber genug für ein weiteres Los. || Das Los zahlt ${m}. Du nennst es ein Zeichen und ignorierst höflich die Wahrscheinlichkeit. || Zwei passende Zahlen und ${m} für die Mühe. Das Universum zwinkert.
finance.dividends=Eine Aktie, die du vergessen hattest, zahlt ${m}. Das frühere Ich lässt grüßen. || Eine winzige Dividende trudelt ein: ${m}. Es ist nicht viel, aber es gehört dir. || Dein Depot hustet ${m} aus wie eine höfliche Katze. Du nimmst das Geschenk an.
finance.lottery_soft=Zwei Zahlen stimmen, eine liegt um eine Ziffer daneben und der Rest ist nicht mal in der Nähe. Das Los wandert in die Schublade der Hoffnung. || Du rubbelst es mit großer Zeremonie. Nichts. Du rubbelst noch mal, sicherheitshalber. || Kein Gewinn. Das Los gibt ein sehr leises, sehr höfliches „Vielleicht beim nächsten Mal“ von sich.
gaming.bonus=Deine Reflexe sind scharf, das Team ist gesprächig und die Beute großzügig. Ein guter Abend. || Du gibst das Spiel vor, das Team folgt, und der Bildschirm zeigt SIEG. Dein Stuhl dreht sich ein bisschen. || Alles passt. Das Zielen, das Timing, der Snack. Du bist die Hauptfigur.
gaming.crit_success=Ein makelloser Durchlauf. Der Chat steht auf den Füßen und du auch, gerade so. || Du gewinnst ein Match, das keiner für gewinnbar hielt. Du stehst auf und drehst eine kleine Ehrenrunde. || Platz eins, keine Tode und ein Clip, den man an alle schicken muss.
gaming.soft_fail=Du verlierst die Runde, behältst aber die Ruhe. Größtenteils. || Eine knappe Niederlage. Du gibst dem Lag die Schuld und startest eine neue Runde. || Nicht dein bestes Match, nicht dein schlechtestes. Der Controller überlebt.
gaming.crit_fail=Dein Teammitglied geht, dein Internet geht, dann geht der Strom. Der Bildschirm wird schwarz mitten im perfekten Lauf. || Du rastest so aus, dass die Tastatur ein Kontaktverbot beantragt. Match verloren, und mehr. || Beenden, Rematch, verlieren, beenden. Irgendwo fliegt ein Controller. Keiner ist stolz.
gaming.rage_quit=Du verlierst gegen einen Bug, der eindeutig am Spiel lag. Du bist da sehr gelassen. Du bist da gar nicht gelassen. || Fünf Minuten vor dem Sieg erscheint ein Pop-up und beendet das Match. Du sagst Wörter. || Der Endboss erledigt dich zum neunten Mal mit einem Schlag. Der Stuhl nimmt deinen Frust auf.
gaming.burnout=Drei Stunden drin, deine Augen sind trocken und die Daumen tun weh. Vielleicht wäre eine Pause gut. || Du hast ein Match mehr versprochen. Das war sechs Matches her. Dein Rücken legt Beschwerde ein. || Das Spiel läuft weiter. Du nicht. Ein langer Seufzer und ein langes Strecken.
gaming.crash=Das Spiel friert ein, der Lüfter schreit und der Bildschirm wird dunkel. Der Computer hat genug von deinem Zocken. || Zu viele Tabs, zu viele Mods und ein Bosskampf zu viel. Die Maschine gibt auf. || Ein lauter Knall aus dem Gehäuse, dann Stille. Der Spielstand ist irgendwo im Jenseits.
gaming.pc_fire=Die PC-Lüfter schreien, eine Flamme schießt aus dem Gehäuse und alles wird dunkel. Dein Spielstand hatte ein gutes Leben. || Rauch, eine kleine Flamme und ein toter Computer. Vielleicht war ein Upgrade sowieso fällig. || Die Grafikkarte hat sich für Gewalt entschieden: eine Flamme, dann ein schwarzer Bildschirm. Keiner gibt dir die Schuld. Alle geben dir die Schuld.
gaming.microtransaction=Du tippst auf einen glänzenden Knopf, um zu sehen, was er macht. Er löst einen Kauf über ${m} aus. Das Schwert ist ein Hut. || Eine Lootbox öffnet sich mit Feuerwerk und einer Abbuchung von ${m}. Drin: ein sehr kleiner Pokal. || Das Spiel bietet ein Starterpaket für begrenzte Zeit an. Die Zeit war jetzt, der Preis war ${m}.
gaming.tournament=Du rettest die letzte Runde mit einem Lebenspunkt. Das Preisgeld beträgt ${m}. Du schreist in einem sehr stillen Raum. || Ein winziges Online-Turnier, ein winziger Preis und ein großer Ego-Schub: ${m} gehören dir. || Dein Team gewinnt und alle brüllen im Voicechat. Das Preisgeld beträgt ${m} und vom Match weißt du nichts mehr.
gaming.stream_tips=Jemand, der deinen Stream schaut, schickt ${m} und die Nachricht „Nice Moves“. Beides fühlt sich gut an. || Ein Zuschauer wirft ${m} für die Stimmung rein. Du bedankst dich live, zweimal. || Ein winziges Publikum, ein Trinkgeld von ${m} und genug Selbstvertrauen, morgen auch zu streamen.
media.bonus=Der Schnitt fließt, die Farben knallen und die Datei wird ohne einen einzigen Fehler exportiert. Magie. || Dein Schnitt hat Rhythmus. Sogar das B-Roll wirkt gewollt. || Ein sauberes Rendering, eine saubere Timeline und ein sehr selbstzufriedenes Nicken.
media.crit_success=Ein Meisterwerk entsteht. Du drückst mit stiller Ehrfurcht auf Speichern. || Das Video sieht aus wie ein echter Film. Du schaust es dir dreimal an, um sicherzugehen. || Jedes Bild stimmt, jeder Schnitt sitzt. Du bist jetzt ein Autorenfilmer.
media.soft_fail=Es wird exportiert, aber der Ton ist leicht asynchron. Keiner wird es merken. Wahrscheinlich. || Die Farbe ist ein bisschen daneben, der Schnitt ein bisschen grob. Gut genug, fast. || Ein ordentlicher Versuch. Das Endergebnis sagt: „Braucht Arbeit.“
media.crit_fail=Die Software frisst drei Stunden Arbeit und dann das ganze Projekt. Nicht mal ein Backup. || Du startest das Rendern und der Computer schlägt zurück. Funken, Rauch und ein sehr stiller Raum. || Der Export stürzt ab, die Datei wird beschädigt und die Timeline ist eine Landkarte des Bedauerns.
media.render_crash=Der Rendering-Balken erreicht 99 Prozent und die Maschine schläft für immer ein. || Der Computer wird laut, heiß und dann sehr, sehr leise. || Der Lüfter schreit, der Bildschirm flackert und das Projekt stirbt einen feurigen Tod.
media.corrupted=Die Datei weigert sich, sich zu öffnen. Du versuchst es neunmal. Sie weigert sich neunmal. || Ein einziger falscher Klick und der Clip wird zu grünem Rauschen. || Das Projekt hat sich als sehr kleine, sehr kaputte Datei gespeichert.
media.burnout=Acht Stunden Schnitt und die Timeline sieht immer noch gleich aus. Deine Augen widersprechen der Uhr. || Du starrst eine Stunde lang auf dieselben zwei Sekunden Material. Sie starren zurück. || Dein Rücken sagt nein, deine Augen sagen nein und deine Timeline sagt: vielleicht morgen.
media.bad_take=Du siehst dir den finalen Schnitt an und zuckst zusammen. Von allem ist ein bisschen was schiefgegangen. || Der Ton ist leise, das Bild ist dunkel und der Witz zündet nicht. || Irgendwo zwischen Idee und Video ist die Idee verloren gegangen.
media.copyright=Auf deinem Video taucht ein Urheberrechtsanspruch auf. Der Song waren „nur fünf Sekunden“. Die Strafe beträgt ${m}. || Ein Studio findet den Clip, den du „total genug bearbeitet“ hattest. Deren Anwälte stellen dir ${m} in Rechnung. || Dein Meisterwerk nutzt einen sehr berühmten Soundtrack ohne Erlaubnis. ${m} gehen als Schadenersatz raus.
media.viral=Dein Video explodiert über Nacht und die Werbeeinnahmen treffen ein: ${m}. Die Kommentare sagen „Erster“. Immer. || Ein Clip, den du fast gelöscht hättest, geht viral. Die Plattform schickt ${m} und dein Handy hört nicht auf zu brummen. || Alle teilen deinen Schnitt. Eine Marke meldet sich mit ${m} und einer verdächtig herzlichen Mail.
media.sponsor=Eine kleine Marke liebt deinen Kanal und schickt ${m}, weil dein Logo in der Ecke gut aussieht. || Ein Sponsor zahlt ${m}, um acht Sekunden lang erwähnt zu werden. Du erwähnst ihn neun. || Ein Rabattcode und ${m} für die Mühe. Werbung wirkt bei dir wirklich.
music.bonus=Eine Melodie kommt aus dem Nichts und setzt sich, als wohnte sie hier. Schön. || Die Akkorde passen, als hätten sie auf dich gewartet. Der Beat ist entspannt und sicher. || Du summst den Hook und es funktioniert einfach. Eine Melodie, die man behalten sollte.
music.crit_success=Ein Hit. Du hörst das Publikum mitsingen, und das Publikum bist nur du. || Der Song schreibt sich selbst, spielt sich selbst und bringt dich ein bisschen zum Weinen. Wunderschön. || Der perfekte Hook, der perfekte Beat, das perfekte Finale. Ein echter Banger.
music.soft_fail=Die Melodie ist schön, der Rest nicht. Du speicherst es als „Entwurf 14“. || Ein ordentlicher Anfang mit einer sehr unfertigen Mitte. || Der Song geht irgendwohin, nur nicht irgendwohin Gutes.
music.crit_fail=Der Track klingt wie eine Katze, die in einem Tunnel über ein Klavier läuft. Alle halten sich die Ohren zu. || Du löschst aus Versehen die ganze Session. Die Stille ist sehr lehrreich. || Der Song ist schrecklich und wird dann irgendwie noch schlimmer. Ein neuer Rekord.
music.off_key=Du triffst einen Ton, dem der Rest des Songs laut widerspricht. || Irgendwo zwischen Strophe und Refrain hat die Tonart gewechselt, ohne es dir zu sagen. || Ein falscher Ton, eine lange Pause und ein sehr ehrliches Zusammenzucken.
music.block=Du starrst eine Stunde lang auf eine leere Spur. Die leere Spur gewinnt. || Jede Idee klingt nach etwas, das du schon gehört hast. Weil du es hast. || Die Inspiration hat den Tag freigenommen und keine Nachricht hinterlassen.
music.lost_file=Das Projekt schließt, ohne zu speichern. Dein Song schwebt davon wie ein Luftballon. || Ein falscher Klick löscht den besten Teil des Tracks. Es war der gute Teil. || Die Speicherdatei stellt sich als leere heraus. Dein Genie ist weg, auf sehr leise Art.
music.studio_bill=Das Studio bucht dich für eine kurze Session. Die Rechnung beträgt ${m}, inklusive Gebühr für einen Stuhl, auf dem du nie gesessen hast. || Du mietest ein schöneres Mikrofon für die Stimmung. Die Stimmung kostet ${m}. || Eine Begleitmusik-Person sagt in letzter Minute ab und behält die Anzahlung: ${m}. Das Gitarrensolo war sowieso erfunden.
music.string_snaps=Eine Gitarrensaite reißt mit einem Knall und schnalzt dir ins Gesicht. Es brennt, und dein Stolz auch. || Die Saite macht „twäng“ auf eine Art, wie sie es nicht sollte.
music.dropped_stick=Ein Drumstick fliegt dir aus der Hand und landet an einer ungünstigen Stelle. || Du triffst den Beat. Der Stick trifft den Boden. Der Beat ist weg.
music.sticky_keys=Die Tasten kämpfen gegen dich. Jeder Akkord kommt leicht falsch heraus, und so selbstsicher. || Deine Finger verheddern sich und das Ergebnis klingt wie eine Katze auf einer Tastatur.
music.dj_scratch=Der Scratch ist laut, falsch und sehr stolz auf sich. || Du drückst den falschen Knopf und der Track bleibt abrupt stehen. Die Stille ist brutal.
music.royalties=Dein Track läuft irgendwo in einem Café und die Tantiemen kommen an: ${m}. Dein innerer Rockstar richtet sich auf. || Eine Serie lizenziert deine Melodie und schickt ${m}. Du summst sie den Rest des Tages vor dich hin. || Eine Streaming-Abrechnung trudelt ein, mit ${m} darin. Dutzende Hörende. Vielleicht Hunderte. Okay, vielleicht deine Cousine.
music.tips=Jemand aus dem Freundeskreis mag dein Demo so sehr, dass dir ${m} geschickt werden. Kunst fördern. || Jemand aus dem Publikum schickt ${m} mit der Nachricht „Mehr bitte“. Du kommst sofort nach. || Jemand wirft ${m} in deinen virtuellen Hut. Es ist, technisch gesehen, ein Hut.
performance.bonus=Der Rhythmus übernimmt und du triffst jeden Beat. Der Raum gehört dir. || Du gleitest durch die Choreo, als wärst du dafür geboren.
performance.crit_success=Standing Ovations, in einem Raum aus einer Person. Du strahlst trotzdem.
performance.soft_fail=Du verpasst einen Schritt oder zwei, behältst aber den Groove. Keiner hat es gemerkt. Wahrscheinlich.
performance.crit_fail=Du rutschst, drehst dich und landest in einem Platscher aus Scham. Sogar der Beat legt eine Schweigeminute ein.
performance.embarrassed=Deine Moves sind mutig, dein Timing nicht. Du erstarrst mitten im Schritt und tust so, als wäre die Musik stehen geblieben. || Alle schauen zu, und nicht auf die gute Art. Du winkst verlegen und verlässt die Bühne.
performance.stage_fright=Das Scheinwerferlicht trifft dich und deine Beine vergessen alles. Du hörst nur deinen eigenen Herzschlag. || Du trittst vor und der Rhythmus tritt weg. Irgendwo urteilt ein Publikum aus null Leuten über dich.
performance.sad=Du tanzt, als würde dir keiner zusehen, und merkst dann, dass wirklich keiner zugesehen hat. Ein leiser Seufzer folgt. || Die Musik endet und dein Selbstvertrauen auch. Vielleicht ein andermal.
performance.fined=Jemand aus der Nachbarschaft beschwert sich über den Lärm und die Stadt verhängt ${m} Strafe. Kunst hat, wie immer, ihren Preis. || Eine Kontrollperson sagt, dein Auftritt brauche eine Genehmigung. Stimmt. Die Strafe beträgt ${m}. || Jemand ruft wegen deines Auftritts die Behörden. Der Strafzettel kostet ${m} und die Show geht im Geiste weiter.
performance.flat_note=Der erste Ton ist wunderschön. Der zweite ist woanders. {t} lächelt und hält durch. || Du zielst aufs Herz und triffst eine andere Tonart. {t} applaudiert höflich für die Mühe. || Das Ständchen trifft einen Ton, bei dem der Hund bellen würde, wenn es einen Hund gäbe. {t} nickt tapfer.
performance.forgot_lyrics=Du vergisst mitten im Lied den Text. {t} wartet mit gefalteten Händen und sanftem Blick. || Der Text verschwindet aus deinem Kopf. Du summst ein bisschen und tust so, als wäre es Absicht. || Du bleibst im Refrain hängen. {t} lächelt und formt die nächste Zeile für dich mit den Lippen.
performance.too_loud=Du singst so laut, dass {t} zusammenzuckt. Die Nachbarschaft hat es vielleicht auch gehört. || Das Ständchen ist leidenschaftlich und absolut ohrenbetäubend. {t} hält sich höflich ein Ohr zu. || Zu viel Lautstärke, zu wenig Kontrolle. {t} würde sich wünschen, dass das Lied endet, aber sanft.
performance.mic_feedback=Das Mikro kreischt in einer Rückkopplung. Alle halten sich die Ohren zu. || Ein schriller Pfiff, eine fassungslose Stille und ein entschuldigendes Winken.
performance.joke_dies=Die Pointe kommt. Keiner lacht. Eine Grille schon. || Du bringst den Witz perfekt. Das Publikum liefert Stille.
performance.cracked_voice=Deine Stimme kippt beim großen Ton und geht noch ein Stück weiter, als sie sollte. || Der hohe Ton war eine mutige Idee. Er endete in einem Röcheln.
performance.knockout={t} rastet aus und schlägt zu. Der Schlag sitzt und du gehst zu Boden wie ein Wäschesack. || Der Spruch war der Tropfen zu viel. {t} holt aus und der Raum kippt. Du kommst zu dir und starrst an die Decke. || {t} läuft knallrot an und trifft dich voll. Deine Würde verlässt das Gebäude, bevor du den Boden berührst.
performance.fight={t} hat genug. Ein schneller Schubser, ein lautes Wort und plötzlich steckst du mitten in einer Schlägerei. || Das war einen Schritt zu weit. {t} geht in Stellung und kommt mit fliegenden Fäusten auf dich zu. || {t} nimmt es sehr persönlich und antwortet mit den Fäusten. Du hast es herausgefordert.
performance.police={t} hat genug und wählt schon die Nummer. Eine Anzeige ist unterwegs zu dir. || {t} starrt dich kurz an und sagt: „Ich rufe die Polizei.“ Es klingt ziemlich ernst gemeint. || Das lief schlecht. {t} erstattet Anzeige gegen dich, noch bevor du dich fertig entschuldigt hast.
performance.big_tip=Jemand im Vorbeigehen wirft ${m} in deinen Hut und sagt nichts. Das Schweigen ist das Kompliment. || Die Menge dreht durch und jemand Fremdes gibt ${m} Trinkgeld. Du verbeugst dich und zählst es zweimal. || Kein Talentscout taucht auf, aber ${m}. Das nimmst du.
performance.busking_tips=Ein paar Münzen werden bis zum Ende des Songs zu ${m}. Jemand hat sogar geklatscht. || Ein Kind wirft ${m} in deinen Hut und rennt weg. Ein winziger Kunstförderer. || Dein Hut ist schwerer als heute Morgen: ${m}. Die Tauben applaudieren.
performance.knockout_death=Der Schlag von {t} sitzt, du fällst zu Boden... und wachst nicht mehr auf. Das Ende. || Ein Schlag von {t}. Du sackst um, der Raum wird still und du stehst nicht wieder auf. Abspann. || {t} schlägt ein einziges Mal zu. Es ist leider das Letzte, was du mitbekommst. Das Ende.
dance.bonus=Der Beat setzt ein und dein Körper weiß schon, wohin. Geschmeidig, mühelos, ein bisschen selbstzufrieden. || Du triffst jeden Move, als hätte die Choreografie nur für dich existiert. || Jemand in der Nähe fängt an mitzuklatschen. Du tust so, als würdest du es nicht merken, und baust eine Drehung ein.
dance.crit_success=Pures Rhythmusgefühl. Sogar die Möbel scheinen mitzuwippen. || Du triffst einen Move so sauber, dass du dir fast selbst applaudierst. || Der Raum wird für eine Sekunde still, dann legst du das Finale hin. Legendenstatus.
dance.soft_fail=Du verpasst einen Schritt oder zwei, behältst aber den Groove. Keiner hat es gemerkt. Wahrscheinlich. || Ein kleines Stolpern, ein schneller Shuffle und du machst weiter, als wäre es choreografiert. || Dein Timing driftet ein paar Takte lang und findet dann zurück.
dance.crit_fail=Du setzt zur Drehung an und der Boden setzt zum Sieg an. Schwerkraft: 1, du: 0. || Dein Fuß geht in die eine Richtung, der Rest von dir ist anderer Meinung. Die Landung ist nicht anmutig. || Der Move sah in deinem Kopf großartig aus. Der Raum hat ihn jetzt gesehen und kann es nicht rückgängig machen.
dance.puddle_slip=Eine verdächtige Pfütze wartet auf der Tanzfläche. Du findest sie mit einer Drehung. || Du startest den großen Move, dein Fuß findet eine Pfütze und der Rest ist ein Tanz ganz anderer Art. || Keiner hat diese Pfütze gesehen. Gleich sehen alle dich darin.
dance.embarrassed=Deine Moves sind mutig, dein Timing nicht. Du erstarrst mitten im Schritt und tust so, als hätte sich die Musik geändert. || Du wirfst dich für das große Finale in Pose und das Lied läuft ohne dich weiter. || Jemand schaut zu, und nicht auf die gute Art. Du winkst verlegen und nennst es Kunst.
dance.exhausted=Nach drei Songs legen deine Beine Beschwerde ein. Du bist fertig, und dein Akku auch. || Die Begeisterung war da. Die Ausdauer hat den Abend freigenommen. || Du tanzt, bis die Knie sich melden, setzt dich dann hin und denkst über deine Entscheidungen nach.
dance.sad=Du tanzt, als würde dir keiner zusehen, und merkst dann, dass wirklich keiner zugesehen hat. Ein leiser Seufzer folgt. || Die Musik endet und dein Selbstvertrauen auch. Vielleicht ein andermal. || Die Tanzfläche ist leer. Für einen Moment du auch.
dance.stepped_on=Du trittst {t} mit der Anmut eines fallenden Klaviers auf den Fuß. So zu tun, als hätte es nicht wehgetan, kostet Mühe. || Der Tanz läuft gut bis zum dritten Schritt. {t} hüpft auf einem Bein und lacht es weg, größtenteils. || Zwei linke Füße, deine und die von {t}. {t} sagt „Mein Fehler“ und ihr beide wisst, dass es das nicht ist.
dance.dizzy=Die Drehung ist zu schnell und der Raum kippt. Du und {t} fallt einander in die Arme, schwindelig und lachend. || Du drehst dich, die Welt dreht sich weiter und du verlierst das Gleichgewicht. {t} fängt dich auf, oder versucht es. || Rund und rund, bis der Boden verschwindet. {t} stöhnt und hält trotzdem fest.
dance.dip_dropped=Der Dip geht schief und {t} rutscht dir aus den Armen. Ein anmutiger Sturz, technisch gesehen. || Du lehnst dich in den Dip, {t} lehnt sich raus und der Boden nimmt euch beide. Tanzen mit der Schwerkraft. || Auf halbem Weg nach unten gibt dein Griff auf. {t} landet auf dem Boden und sagt „Aua“ in zwei Silben.
dance.in_sync=Du und {t} bewegt euch als eins. Der Rhythmus rastet ein und zwischen euch wächst etwas Wärme. || Jeder Schritt passt. {t} lächelt auf eine Art, die sagt: Das war es wert. || Eine perfekt getimte Drehung, ein gemeinsames Lachen. Du und {t} beendet den Tanz näher, als ihr angefangen habt.
dating.bonus=Dein Profil bekommt eine gute Reaktion und eine lustige Antwort. Gar nicht schlecht. || Der Chat fließt, die Witze zünden und jemand sagt, dass dein Humor gefällt. || Ein Match, ein Lachen und ein vielversprechender Plan. Du wirst vor dem Bildschirm rot.
dating.crit_success=Ein perfektes Match, ein tolles Gespräch und ein Date, das nach Film klingt. Du strahlst. || Drei Leute antworten gleichzeitig und alle sind nett. Was für ein Luxusproblem. || Dein Foto, deine Bio und dein Timing sind alle perfekt. Das Internet liebt dich.
dating.soft_fail=Ein paar höfliche Antworten und keine Funken. Das Profil braucht noch einen Blick. || Du matchst mit jemandem und der Chat stirbt nach „Hi“. || Die App zeigt dir ein paar Gesichter. Keins winkt zurück.
dating.crit_fail=Du schickst eine Nachricht an die falsche Person, die falsche Nachricht und das falsche Foto. Alles auf einmal. || Dein Profil wird von jemandem gemeldet, mit dem du gematcht hast. Irgendwie ist es deine Schuld. || Totales Desaster: ein Tippfehler im Namen, ein verwackeltes Foto und eine Antwort, die lautet: „Wer?“
dating.ghosted=Der Chat lief so gut, und dann war die andere Person verschwunden. Nicht mal ein Tschüss. || Drei Punkte erscheinen, verschwinden und kommen nie wieder. Du starrst sie trotzdem an. || Die Nachricht wurde gelesen und dabei belassen. Die Stille ist ohrenbetäubend.
dating.catfish=Die Fotos waren ganz anders als der Mensch. Ganz anders. Sogar eine andere Spezies. || Das charmante Match stellt sich als Bot mit einem sehr guten Skript heraus. || Im Profil stand „groß, lustig, ehrlich“. Im Chat stand „schick mir eine Geschenkkarte“.
dating.awkward=Deine erste Nachricht war ein sehr langer Witz, der viel Erklärung brauchte. || Du antwortest „haha“ auf eine Art, die sehr traurig rüberkommt. || Ein Anmachspruch zum Fremdschämen, gesendet mit einem Selbstvertrauen, das sich nicht verteidigen lässt.
dating.typo=Die Autokorrektur macht aus einer süßen Nachricht etwas zutiefst Unglückliches. || Du drückst auf Senden und siehst dann den Tippfehler. Der Tippfehler steckt im ersten Wort. || Ein winziger Fehler, ein riesiger Bedeutungsunterschied. An den hier wirst du dich erinnern.
medicine.bonus=Die Medizin wirkt schnell und dein verstopfter Kopf wird frei. Du fühlst dich fast wie neu. || Richtige Dosis, richtiger Zeitpunkt. Deine Nase wird frei und deine Laune auch. || Die Tablette macht still ihren Job. Du beschließt, Tabletten mehr zu vertrauen.
medicine.crit_success=Perfekte Dosis, perfektes Timing. Du fühlst dich besser als vor der Krankheit. || Die Medizin wirkt wie eine Filmmontage. Taschentücher fliegen, Musik spielt, du bist geheilt. || Lehrbuchbehandlung. Irgendwo empfindet eine Ärztin oder ein Arzt einen seltsamen Stolz.
medicine.soft_fail=Du schüttelst die Flasche, seufzt und tust so, als wärst du produktiv. || Du beschließt, dass die Erkältung nicht so schlimm ist. Die Erkältung widerspricht. || Du legst die Medizin für später weg. Später ist noch weit weg.
medicine.crit_fail=Du greifst die falsche Flasche. Auf dem Etikett stand „für Pflanzen“. Du fühlst dich sehr blättrig. || Die Tablette rollt unters Sofa und du nimmst die daneben. Mutig. Nicht klug. || Du nimmst Medizin, die für etwas völlig anderes gedacht ist. Dein Körper reicht eine offizielle Beschwerde ein.
medicine.wrong_dose=Du kneifst die Augen zusammen, rätst beim Etikett und liegst falsch. Medizin ist nicht so ein Spiel. || Du nimmst ein bisschen zu wenig, dann ein bisschen zu viel. Die Erkältung bleibt und du fühlst dich komisch. || Die Anleitung war klar und du hast nichts davon gelesen. Die Erkältung ist immer noch da.
medicine.side_effects=Die Medizin behebt nichts und macht dich schläfrig. Glückwunsch: eine Erkältung mit Kopfschmerzen. || Dein Magen mag die Tablette nicht. Deiner Erkältung ist das egal. || Du liest die Nebenwirkungen nach der Einnahme. Es waren mehr, als du dachtest.
mourning.bonus=Eine lange, warme Umarmung. {t} atmet aus, als hätte der Atem den ganzen Tag gestockt. || Du sagst nicht viel und musst es auch nicht. {t} lehnt sich an und der Raum wird ein Stück ruhiger.
mourning.crit_success=Du hältst {t} fest und die Worte spielen keine Rolle mehr. Ihr weint beide, lacht ein bisschen und zum ersten Mal heute fühlt es sich überstehbar an. || {t} bricht in deinen Armen zusammen und du lässt es zu. Am Ende seid ihr beide leichter als am Anfang. || Manche Umarmungen sagen, was sonst nichts sagen kann. Diese hier sagt alles, und die Last auf euch beiden wird auf einmal leichter.
mourning.soft_fail=Die Umarmung ist steif und kurz. {t} nickt höflich und der Verlust wiegt ein Stück schwerer als zuvor. || Du klopfst {t} auf den Rücken wie jemand Fremdes an der Bushaltestelle. Ihr beide spürt, dass es danebenging. || Deine Arme sind da, aber die Worte nicht. Die Stille danach ist lang und traurig.
mourning.crit_fail=Du hältst einen Takt zu lange fest, sagst genau das Falsche und {t} weint noch heftiger. Du auch. || Die Umarmung wird zu einem Schluchzfest der falschen Art. Die Trauer ist jetzt schwerer und wird zu gleichen Teilen geteilt. || Du meinst es gut, wirklich. Es kommt als das Schlimmste heraus, was du hättest sagen können. {t} verstummt und du auch.
mourning.fail=Du sagst „Mein Beileid“, als würdest du es von einer Karte ablesen. {t} bedankt sich und keinem von euch geht es besser. || Die Umarmung kommt im falschen Moment und die Trauer wird nur lauter. Keiner weiß, wohin mit den Händen. || Du versuchst, {t} zu trösten, und erinnerst euch beide an alles, was fehlt.
mourning.pass=Eine gute Umarmung. Sie löst nichts, aber sie hilft. || Du hältst {t} eine Weile fest. Manches ist leichter, wenn jemand einen Teil davon mitträgt.
sink.bonus=Das Wasser läuft gleich beim ersten Mal warm. Irgendwer da oben mag dich. || Deine Hände werden so sauber, dass sie quietschen. Chirurginnen und Chirurgen wären neidisch. || Perfekter Druck, perfekte Temperatur. Ein kleines Wunder im Badezimmer.
sink.crit_success=Hände, Gesicht, Zähne, alles makellos. Der Spiegel applaudiert. || Das Waschbecken benimmt sich so gut, dass es eine Medaille verdient.
sink.soft_fail=Das Wasser ist lauwarm und die Seife fast leer, aber du kriegst es hin. || Ein bisschen Gespritze, viel Gemecker und du bist sauber genug.
sink.crit_fail=Na toll, was für eine Sauerei. Pass auf, wo du hintrittst, nicht ausrutschen! || Du drehst am Hahn und das ganze Waschbecken gibt auf. Überall Wasser, nirgends Würde. || Das Rohr stöhnt, knallt und spuckt einen Geysir aus. Das Bad ist jetzt ein Schwimmbad.
sink.flood=Na toll, was für eine Sauerei. Pass auf, wo du hintrittst, nicht ausrutschen! || Der Wasserhahn bricht ab und das Wasser spritzt überallhin. Achtung, Pfütze, Genie. || Ein Knacken, ein Zischen, eine Fontäne. Das Waschbecken ist kaputt und direkt unter deinen Füßen steht eine Pfütze.
sink.frustrated=Du ringst mit dem Hahn, bis er aufgibt. Du bist dabei nicht ruhig. || Jedes Mal, wenn du den Griff drehst, wird es schlimmer. Du funkelst die Rohre an, als würden sie dir Geld schulden.
sink.splash=Du spritzt dir direkt ins Gesicht und wünschst dir, du könntest eine Minute zurückspulen. || Der Hahn spritzt zur Seite und durchnässt dein Shirt. Sehr elegant.
sink.slip=Du trittst auf die nasse Stelle, die du gerade gemacht hast. Die Schwerkraft legt Beschwerde ein. || Der Boden ist rutschig, deine Socken sind rutschig und dein Glück auch.
sink.fail=Der Hahn stottert, hustet und spritzt dir ins Gesicht. Unverschämt. || Das Wasser wird kalt, dann heiß, dann wieder kalt. Das Waschbecken hat eine Persönlichkeit. || Du kämpfst gegen den Wasserhahn und der Wasserhahn gewinnt.
sink.pass=Eine normale, langweilige, völlig funktionierende Wäsche.
toilet.bonus=Alles funktioniert. Es sind die kleinen Siege, die zählen. || Ein makelloser Besuch. Der Porzellanthron ist zufrieden.
toilet.crit_success=Eine Spülung so geschmeidig, dass sie in einen Katalog gehört. || Ein perfekter Besuch. Das Bad duftet wie ein Spa.
toilet.soft_fail=Es braucht zwei Spülungen, aber es klappt. Keiner hat etwas gesehen. || Ein bisschen laut, ein bisschen langsam, und du bist fertig.
toilet.crit_fail=Die Toilette gluckert auf eine Art, die teuer klingt. Pass auf, wo du hintrittst! || Bei den Rohren ist etwas schiefgegangen, während du beschäftigt warst. Ruhe bewahren und nicht ausrutschen. || Ein furchtbares Gluckern und eine verdächtige Pfütze, die sich zu deinen Füßen ausbreitet. Du gehst mit großer Würde davon.
toilet.overflow=Die Toilette hat bedrohlich gegluckert und jetzt breitet sich das Wasser aus. Pass auf, wo du hintrittst, nicht ausrutschen! || Zu deinen Füßen ist eine Pfütze. Du tust so, als würde nichts passieren. || Die Schüssel hat eine Überraschungswelle ausgehustet. Jetzt stehst du in einer Pfütze und versuchst, würdevoll auszusehen.
toilet.clog=Du drückst auf den Spülknopf und die Spülung gluckert, überlegt kurz und gibt auf. Du starrst schweigend in die Schüssel. || Die Spülung macht nichts. Du versuchst es noch mal und noch mal. Die Toilette hat sich für Gewalt entschieden.
toilet.gross=Wer vor dir hier war, hat eine Überraschung hinterlassen. Dein Magen ist nicht amüsiert. || Du schaust in die Schüssel, bereust es und schaust sehr schnell weg.
toilet.embarrassed=Du bist ziemlich sicher, dass das jemand gehört hat. Du tust so, als wären es die Rohre gewesen. || Die Tür war nicht abgeschlossen. Darüber muss niemand reden.
toilet.fail=Die Spülung ist schwach und die Toilette macht ein unanständiges Geräusch. Du tust so, als wäre nichts gewesen. || Der Sitz ist kalt, das Papier ist alle und der Tag fängt schlecht an.
toilet.pass=Mission erfüllt. Nichts ist explodiert.
