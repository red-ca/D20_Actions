fitness.bonus=何かがハマりました。ウェイトが軽く感じて、フォームがやけにプロっぽいです。 || いい流れに乗って、無敵の気分です。ジムの鏡もうなずいています。
fitness.crit_success=伝説の1回です! どこかでプロテインシェイカーが誇らしさに涙しています。
fitness.soft_fail=きついセットでしたが、なんとかやり切りました。 || フォームもプライドもぐらつきましたが、1回はこなしました。
fitness.crit_fail=全力で持ち上げたら、体から正式な苦情が届きました。セットは始まる前に終了です。 || 人の背中が出してはいけない音が鳴りました。この1回はなしです。 || バーの勝ちです。いつだって勝ちます。プライドを三角巾で吊ってそっと退散しました。
fitness.heat=トレーニングがサウナに変わりました。あおいでも汗はダラダラで、部屋が回り始めます。 || 暑い中でやりすぎました。シャツはびしょ濡れ、顔は真っ赤で、体は扇風機と海と昼寝を要求しています。 || 熱中症が礼儀正しくノックして、そのままドアを蹴破ってきました。汗だくでふらふら退場です。
fitness.exhausted=ラスト1回で足が崩れました。倒れ込んで天井を見つめ、人生の選択を振り返ります。 || 限界を超えたら、限界に押し返されました。ダウンです。
fitness.sore=体のどこかから、2日は響く苦情が届きました。明日が楽しみです。 || 追い込みすぎました。筋肉がストライキを宣言、即日発効です。
fitness.slip=最悪のタイミングで足が滑って、重力が議論に勝ちました。 || バランスを崩して、段取りの悪いダンスみたいにくるりと回りました。
fitness.embarrassed=絶対に誰かに見られました。ルーティンの一部だったことにします。 || 派手にミスしたので、器具まで目をそらしています。
fitness.sweat_cold=タオルを使わなかったら、ジムの扇風機が絶妙に直撃しました。夜には鼻水が出ます。自業自得の風邪です。 || 汗とエアコンと判断ミスで風邪をひきました。言わんこっちゃないです。 || 今日の運動はやりすぎだったと、体が風邪というレビューを送ってきました。
fitness.lift_drop=愛を込めて{t}を持ち上げたものの、重力が{t}を取り返しました。着地は両足で、だいたい。 || 持ち上げが半分まで来たところで、腕が苦情を出しました。{t}は笑いながら床に落ちます。 || {t}を宙に振り上げて手が滑り、二人そろって床に山積みです。
fitness.back_strain={t}を持ち上げたら、腰が「無理」と言いました。1秒ポーズを保って後悔します。 || 愛は強いですが、腰は同意しません。{t}はあなたを降ろし、一緒に顔をしかめます。 || 大きなリフトは背骨のバキッという音で終わりました。{t}が大丈夫かと聞き、大丈夫ではないと答えます。
fitness.show_off_fail=強そうに見せたくて、{t}をヒーローのように持ち上げます。見た目は家具を運ぶ人です。 || 大技は、すごいとおかしいの中間に着地しました。{t}は小さく拍手します。 || 持ち上げる前に力こぶを見せつけましたが、うまくいきません。{t}は腕を見て、それからあなたを見ます。
fitness.mine_strain=自信満々につるはしを振ったら、腰から正式な苦情が届きました。 || 岩の勝ちです。マメと大量のほこりが手に入りました。
fitness.treadmill_stumble=ランニングマシンは動き続けます。あなたは、ちょっとだけ止まりました。 || ちょっとしたぐらつきが、みんなに見られるつまずきになりました。
fitness.fail=腕が途中で言うことを聞かなくなりました。わざと休憩したことにします。 || ウェイトを見つめると、ウェイトも見つめ返してきます。今日はやめておきます。
fitness.pass=セットを問題なくやり切りました。 || しっかりしたフォームに安定した呼吸。いつもの仕事の一日です。
kiss.bonus=特別なキスでした。{t}はしばらく忘れないでしょう。 || ビビッときました! {t}も輝いていて、あなたも輝いています。
kiss.crit_success=歴史に残るキスです。{t}は自分の名前も忘れました。
kiss.soft_fail=ちょっとぎこちなくて気まずいキスでしたが、{t}は見逃してくれました。
kiss.slap={t}にキスしようと顔を寄せたら、{t}は驚いてビンタを繰り出しました!
kiss.runaway=キスしようと顔を寄せたら、{t}は税金の書類でも差し出されたかのように逃げ出しました。 || {t}は迫るキスを一目見て、全力で走り去りました。大胆な作戦ですね、{a}。
kiss.embarrassed=キスしようと顔を寄せます。{t}は真っ赤になって、足元を見つめ、床に飲み込まれたいと願っています。 || {t}は固まり、耳まで赤くして、天気の話をもごもご言い始めました。
kiss.angry={t}はキスをお気に召さなかったようです。怒りとともに記憶されました、{a}。 || キスを狙ったら、{t}は怒り顔を狙ってきました。おあいこでしょうか?
kiss.rejection={t}は丁寧に、でもきっぱりとキスを断りました。拒絶より沈黙のほうがこたえます。 || {t}はギリギリで顔をそらしました。お見事です、{a}。実にお見事。
kiss.sad={t}は痛そうな目で見つめ、長いため息をつきました。こういうのじゃないんです。 || キスは外れ、ムードも外れました。{t}は目をそらします。
kiss.knockout={t}がキレてパンチを繰り出しました。命中し、洗濯物の袋みたいに床に倒れます。 || 今のジョークが決定打でした。{t}が殴り、部屋が傾きます。気づくと天井を見ています。 || {t}は真っ赤になって、顔面にパンチを入れます。床に着く前に、あなたの尊厳は建物から出ていきました。
kiss.fight={t}はもう限界です。ひと突き、大声ひとつ、気づけばケンカの真っ最中です。 || 今のは一線を越えました。{t}は身構えて、殴りかかってきます。 || {t}はとても根に持って、拳で答えることにしました。自業自得です。
kiss.police={t}は堪忍袋の緒が切れて、もう電話をかけています。警察への届け出が届きそうです。 || {t}は一瞬あなたを見つめて「警察を呼びます」と言いました。かなり本気に聞こえます。 || 最悪の展開です。謝り終わる前に、{t}はあなたを通報しました。
kiss.spark=二人とも感じた火花がありました。{t}とあなたの間に、温かい余韻が残ります。 || その瞬間は輝きを残しました。{t}とあなたは、少し近づいた気がします。 || ほんのときめきと、静かな笑顔。{t}とあなたの間の空気は温かいままです。
kiss.knockout_death={t}のパンチが決まり、床に倒れて、そのまま目を覚ましません。おしまい。 || {t}の一撃。倒れ、部屋が静まり、もう立ち上がれません。エンドロール。 || {t}の一発のパンチ。それが、残念ながら人生で最後に気づいたものでした。おしまい。
kiss.pass=キスはそっと決まりました。{t}は少しとろけています。 || やさしい時間です。そのあと、{t}が微笑みかけてくれます。
chat.bonus=会話が自然に流れます。{t}と時間を忘れる、最高の形です。 || 気楽な会話、本物の笑い、何でも話せそうな気持ち。いい時間です。 || {t}が少し心を開き、あなたも開きます。気楽な空気です。
chat.crit_success=ぴったりの言葉を、ぴったりのタイミングで言えました。{t}は忘れられない笑顔を見せます。 || 完璧な会話です。どの言葉も響いて、どの間も温かい。{t}はやめたくなさそうです。 || 誰にも気づかれないまま、会話は深いところへ。{t}は、わかってもらえたという目で見つめてきます。
chat.soft_fail=会話はよろよろ進み、丁寧に終わります。どちらも言いたかったことは言えません。 || どこにも行かない退屈な会話です。二人とも少し気が抜けて、少し退屈して帰ります。 || まあ、悪くはないです。ただ、悪くないだけ。お互いうなずいて、次に進みます。
chat.crit_fail=言葉がことごとく裏目に出ます。終わるころ、{t}はどこか別の場所にいたそうです。 || 本当に残念なことを言ってしまいました。空気が固まり、{t}は壁を見つめます。 || 会話の大惨事です。{t}には少し時間と、たぶんおやつが必要です。
chat.silence=口を開いたものの、何も出てきません。{t}は天井を観察して沈黙を埋めます。 || 会話が途中で干上がりました。{t}と古い家具のようにうなずき合います。 || 気まずい隙間が広がります。二人とも、心地よい沈黙のふりをします。
chat.wrong_topic={t}が一番嫌いな話題を選んでしまいました。{t}の笑顔は、丁寧で遠いものに固まります。 || 間違った話題を、間違ったタイミングで出しました。{t}は、衝突事故のような鮮やかさで話題を変えます。 || なぜか地雷を踏みました。{t}は「そうですね」と、「いいえ」の意味の口調で言います。
chat.overshare=話しすぎました。しかも早すぎです。{t}は、長い利用規約を読んでいるような顔になります。 || 世間話が告白に変わりました。{t}はゆっくりうなずきながら、出口を探し始めます。 || 「元気?」から人生の全てへ、ひと息で到達しました。{t}には少し時間が必要です。
chat.voice_cracks=大事な言葉の途中で声が裏返ります。{t}はやさしいままですが、その場の空気はもろくなりました。 || 練習してきたのに、役に立ちませんでした。声が震えて、あきらめます。 || 言葉は、頭の中で感じたより小さく出てきました。{t}は、もう一度言うのを静かに待っています。
chat.too_intense=重すぎて、しかも早すぎました。{t}は半歩下がり、慎重に微笑みます。 || 心の底から伝えました。{t}には、ちょっとパニック気味に届いたようです。 || 約束が重くのしかかります。{t}はぎこちなく笑って、話題を変えます。
chat.advice_backfires=アドバイスを求めたのに、一言ごとに反論します。{t}はあきらめて、うなずくだけになります。 || アドバイスは的確ですが、口に出して無視しました。{t}は、この映画を前にも見た人の顔です。 || {t}は正直なアドバイスをくれました。悪く受け取って、空気が冷えます。
chat.awkward_hello=挨拶したら、声がランダムな高さになりました。{t}は情けで同じ高さで返してくれます。 || 挨拶は3回やり直してから、ようやく着地しました。 || 「どうも。こんにちは。やあ。」3つ同時に言えました。
chat.makeup_fails=ごめんなさいと言います。{t}には「そう感じたならごめんね」と聞こえました。同じではありません。 || 謝罪は堂々巡りです。{t}は傷ついたままで、さらに混乱もしています。 || 仲直りしようとして、なぜか2つ目のケンカを足しました。
chat.life_talk_drags=深い話はどんどん深く重くなり、最初の質問が何だったか誰もわからなくなります。 || しばらく哲学します。{t}は袖の中でこっそりあくびします。 || 「結局、何のために生きてるんだろう?」は重い入りです。会話は二度と立ち直りません。
chat.gossip_leaks=話した噂話が、ちょっと濃すぎました。{t}は巻き込まれたことに気分を害します。 || ひそひそ話は、思ったより静かではありませんでした。誰かが全部聞いていました。 || うっかり暴露したら、一部が{t}に飛び火しました。
chat.advice_ignored=恋愛について賢いアドバイスをします。{t}は全然聞かず、ちょっとムッとします。 || アドバイスは完璧に正しく、完全にお呼びでありません。{t}はため息をつきます。 || 「任せて」と言いますが、{t}は任せません。
chat.kindness_unnoticed=いいことをしましたが、{t}は気づきません。それでも、数には入る、と自分に言い聞かせます。 || ささやかな親切は、礼儀正しくスルーされました。ちょっと恥ずかしくなります。 || すてきな行いでしたが、軽い肩すくめで返されました。
chat.flat_greeting=挨拶が誤字みたいに響きました。{t}は聞こえなかったふりをしてくれます。 || 挨拶はぎこちなく、1秒遅れて出ました。{t}は小さく気まずい手を振ります。 || 正しい言葉を、間違った声で言いました。
chat.rumor_awkward=噂話はすぐに変な方向へ。誰もどこを見ていいかわかりません。 || 聞いて、うなずいて、何も言わないことを大声で主張します。 || 会話は温かく始まり、じわじわとぬるくなります。
chat.fire_silence=二人で火のそばに座りますが、何も言うことが見つかりません。パチパチという音がすべてを語ります。 || 沈黙が伸びます。{t}は炎を見つめ、あなたもちょっと長すぎるくらい見つめます。 || 静かな時間を分かち合うつもりでした。結果、静かな時間になりました。
chat.lesson_flops=基本を3回説明しました。生徒はうなずきますが、何一つ理解していません。 || 教える腕は、自分の腕前より弱いようです。二人ともぐったりです。 || レッスンは脱線して、気まずい「また明日やりましょう」で終わります。
chat.knockout={t}がキレてパンチを繰り出しました。命中し、洗濯物の袋みたいに床に倒れます。 || 今のジョークが決定打でした。{t}が殴り、部屋が傾きます。気づくと天井を見ています。 || {t}は真っ赤になって、顔面にパンチを入れます。床に着く前に、あなたの尊厳は建物から出ていきました。
chat.fight={t}はもう限界です。ひと突き、大声ひとつ、気づけばケンカの真っ最中です。 || 今のは一線を越えました。{t}は身構えて、殴りかかってきます。 || {t}はとても根に持って、拳で答えることにしました。自業自得です。
chat.police={t}は堪忍袋の緒が切れて、もう電話をかけています。警察への届け出が届きそうです。 || {t}は一瞬あなたを見つめて「警察を呼びます」と言いました。かなり本気に聞こえます。 || 最悪の展開です。謝り終わる前に、{t}はあなたを通報しました。
chat.deep_bond=一瞬、あなたと{t}は完全に同じ気持ちになりました。何年も続いた友情のようです。 || 言葉は自然に出てきて、何も隠しません。{t}は家族を見るような目であなたを見ます。 || 本物の深い会話です。絆が強くなり、温かい気持ちが長く続きます。
chat.closer=その会話で距離が縮まりました。{t}が何か言う前から、それを感じます。 || いい方向に何かが変わります。あなたと{t}は、前より少し居心地がよくなりました。 || 会話は本物のひとときになりました。あなたと{t}は、近づいた気持ちで終えます。
chat.knockout_death={t}のパンチが決まり、床に倒れて、そのまま目を覚ましません。おしまい。 || {t}の一撃。倒れ、部屋が静まり、もう立ち上がれません。エンドロール。 || {t}の一発のパンチ。それが、残念ながら人生で最後に気づいたものでした。おしまい。
etiquette.bonus=しっかりして、感じのいいやり取りです。{t}は、ほんのり敬意のこもった目で見つめます。 || 完璧なマナーと、ちょうどいい自信。場は穏やかで温かいです。 || 楽々とこなしました。{t}はリラックスし、部屋中も{t}と一緒にリラックスします。
etiquette.crit_success=完璧です。{t}は契約をまとめたかのように微笑みます。実際、まとまったのかもしれません。 || 魅力、タイミング、完璧な握手。{t}は明らかに感心していて、それを隠しません。 || プロです。本物のプロです。{t}は、あなたをみんなに紹介しようと心に決めました。
etiquette.soft_fail=ぎこちなくて少し変ですが、一応ちゃんと成立しました。 || 作り笑い、軽いうなずき、ちょっと変な沈黙。ベストとは言えません。 || 大失敗でも大成功でもありません。さっさと次に進みます。
etiquette.crit_fail=すべてが同時にうまくいかなくなりました。{t}は、何もなかったことにしてくれます。 || 失礼で、不器用で、うるさい。その全部をひとつの動作でやってのけました。めったにない快挙です。 || 場の空気が失敗したスフレのようにしぼみました。{t}は、3年後くらいにこの話をするでしょう。
etiquette.sweaty_palm=手のひらがぬるぬるです。{t}は握手したあと、誰にも見られていないふりでそっとズボンで手を拭きます。 || 握手はじっとりした力のないものでした。{t}は丁寧に微笑んで、秒数を数えています。 || 強く握りすぎて、次は弱すぎて、最後は汗だらけ。{t}はこの握手を忘れないでしょう。
etiquette.card_drop=名刺を差し出したら、何もない水たまりにひらりと落ちました。{t}が拾ってくれましたが、折れています。 || 名刺が指から滑り、裏向きに落ちました。{t}は気づかいで裏面を読み上げます。 || コーヒーの輪染みがついた名刺を渡しました。{t}は、歯医者で言うような「ありがとう」を返します。
etiquette.toast_spill=グラスを少し勢いよく掲げすぎました。飲み物は{t}にかかり、乾杯はどこにも届きません。 || カチン。バシャッ。{t}はシャツを見て、あなたを見て、またシャツを見ます。 || 乾杯は完璧でした、グラスが傾くまでは。半分はテーブルに、もう半分は尊厳にかかりました。
etiquette.bribe_caught=封筒を滑らせます。{t}はお札を声に出して数え、部屋中に聞こえます。${m}と評判が消えました。 || 誰かにやり取りを見られました。その「贈り物」は${m}と、長い言い訳代がかかりました。 || 賄賂はこっそりのはずでした。{t}は金額を部屋中に発表し、${m}が口座から消えます。
etiquette.errand_refused={t}はリストを見て、あなたを見て、「私は宅配サービスじゃありません」と言いました。 || お使いを頼みます。{t}は深くため息をつき、なぜか怒りと疲れを同時に表現します。 || お使いのお願いは不発でした。{t}は腕を組みます。お使いは未完のままです。
etiquette.pitch_flop=ビジネス用語で始めて、何も残らずに終わります。{t}は、迷惑メールにうなずくようにうなずきます。 || プレゼンは頭の中では賢く聞こえました。声に出すと、{t}は大丈夫かと聞いてきます。 || 「シナジー」を2回、「レバレッジ」を1回言いました。{t}はこっそりスマホを確認します。
etiquette.stiff=ビジネスマニュアルを読むロボットのようです。{t}は、笑っていいのか迷って見つめます。 || 丁寧ですが、板のようにカチコチです。誰も何も感じないまま、その場は過ぎます。 || プロらしくしようとして、「ぎこちない彫像」に着地しました。{t}はフォローしようとして失敗します。
etiquette.pitch_ignored=アイデアを熱く発表します。{t}はうなずきますが、何もメモしません。 || 「面白いですね」と{t}は言います。「ノー」を意味するときの口調です。 || 目標を差し出すと、{t}は丁寧な微笑みを返してきました。
etiquette.info_leaked=共有した情報は間違いで、その被害は自分に返ってきます。 || 内緒のはずのヒントを話してしまいました。{t}は激怒し、お金もかかります。 || 機密の情報がうっかり漏れました。高くつきます。
etiquette.forced_cheer=成長がうれしいと言います。人質ビデオのように聞こえます。 || あまりに無理やりな喜びようで、{t}は大丈夫かと聞いてきます。 || 熱意はリハーサル済みで、それがバレバレです。
etiquette.formal_flub=とても丁寧に{t}へ挨拶しましたが、肩書きを間違えました。 || かたすぎて、くだけすぎて、両方が同時に出ました。{t}は迷子です。 || 丁寧な挨拶が、自分のマナーにつまずきました。
etiquette.nosy_question=ちょっと詮索しすぎな質問をしました。{t}は短く答えます。 || 質問が少し長すぎるくらい宙に浮きます。{t}は目をそらします。 || 世間話のつもりが、じっと見つめられました。
etiquette.too_personal=その質問は一歩踏み込みすぎでした。{t}は不機嫌です。 || とてもプライベートなことを、とても公な声で聞きました。{t}は固まります。 || {t}は忘れられない口調で答えます。周りのみんなも忘れません。
etiquette.coin_refused=コインを頼んだら、丁寧な断りと長い視線が返ってきました。 || リゾートコインの物乞いはうまくいきません。ちょっと軽くなったプライドで立ち去ります。 || 返事は、とても優しくて、とてもきっぱりした「ノー」です。
etiquette.gift_flop=プレゼントを渡します。{t}は微笑みますが、選択を間違えたのがわかります。 || プレゼントがちょっと…個性的でした。{t}は精一杯の努力でお礼を言います。 || {t}は包みを開けて、うれしそうな顔を全力で作ります。
etiquette.knockout={t}がキレてパンチを繰り出しました。命中し、洗濯物の袋みたいに床に倒れます。 || 今のジョークが決定打でした。{t}が殴り、部屋が傾きます。気づくと天井を見ています。 || {t}は真っ赤になって、顔面にパンチを入れます。床に着く前に、あなたの尊厳は建物から出ていきました。
etiquette.fight={t}はもう限界です。ひと突き、大声ひとつ、気づけばケンカの真っ最中です。 || 今のは一線を越えました。{t}は身構えて、殴りかかってきます。 || {t}はとても根に持って、拳で答えることにしました。自業自得です。
etiquette.police={t}は堪忍袋の緒が切れて、もう電話をかけています。警察への届け出が届きそうです。 || {t}は一瞬あなたを見つめて「警察を呼びます」と言いました。かなり本気に聞こえます。 || 最悪の展開です。謝り終わる前に、{t}はあなたを通報しました。
etiquette.deal={t}の知り合いの知り合いから、「ちょっとした仕事」の報酬として${m}が届きました。人脈は強いです。 || いい印象が頼まれごとになり、頼まれごとが${m}になりました。これがビジネスです。 || {t}がクライアントにあなたを推薦してくれました。しばらくして、${m}が口座に入ります。
etiquette.insider_tip=共有した情報は貴重でした。{t}がお礼をこっそり渡してくれます。 || ヒントが取引に変わりました。少しのお小遣いを手に帰ります。
etiquette.gift_hit={t}はプレゼントが大好きです。まさに欲しかったもので、顔に出ています。 || プレゼントは完璧に決まりました。{t}は、ちょっと長すぎるハグをくれます。
etiquette.knockout_death={t}のパンチが決まり、床に倒れて、そのまま目を覚ましません。おしまい。 || {t}の一撃。倒れ、部屋が静まり、もう立ち上がれません。エンドロール。 || {t}の一発のパンチ。それが、残念ながら人生で最後に気づいたものでした。おしまい。
humor.bonus=ジョークが完璧に決まりました。{t}は笑いすぎて座りたくなるほどです。 || タイミングは抜群で、笑いは本物です。今日のあなたは面白いです。 || さわやかで気楽な笑いです。{t}は涙をぬぐって、もう一回とせがみます。
humor.crit_success=お笑いの天才です。{t}は笑い泣きして、やめてと頼み、そのあともっとと頼みます。 || 完璧なジョークが完璧な瞬間に。できるなら、部屋中が拍手しています。 || {t}は息をするのも忘れるほど笑います。伝説のネタです。
humor.soft_fail=とっておきのネタではありませんが、{t}は気をつかって微笑みます。 || 弱い笑いに、さらに弱いオチ。さっさと次に進みます。 || くすっと小さな笑いと、ほんの少しの同情。ジョークはもう忘れられました。
humor.crit_fail=ジョークが大きな音を立てて死にました。{t}は、こんなに静かになったことはありません。 || ひどすぎて、新しい種類の沈黙が生まれたジョークです。{t}は遠くを見つめます。 || 大スベリで、部屋が寒くなりました。{t}には少し時間が必要です。
humor.flop=自信満々でジョークを言いました。{t}はまばたきしながら、続きを待っています。 || オチはぽとりと落ちました。{t}は、0.5秒ほど遅れて笑います。 || 自分のジョークで自分だけ笑います。{t}は「ははっ」と礼儀正しく返してくれます。
humor.unfunny=おもしろくなさが一周して、わけがわからなくなりました。{t}はゆっくりうなずきます。 || 完璧なタイミングで言ったのに、ジョークはやっぱりつまらないです。{t}はやさしく微笑みます。 || うめき声、ため息、白目。{t}は「最も礼儀正しい観客賞」を受賞しました。
humor.slapstick_hurt=ずっこけ芸にちょっと本気を出しすぎました。床はいつも通り勝ちます。{t}は笑うのをやめて心配し始めます。 || どたばた芸が一番痛い形で失敗しました。{t}は顔をしかめ、笑い、また顔をしかめます。 || 自分のネタにつまずきました。痛いですし、観客1人は拍手していいのか迷っています。
humor.money_gun=マネーガンを撃つと、お札があちこちに飛びます。本物でした。${m}が消え、{t}は笑いが止まりません。 || 銃には本物の現金が入っていました。${m}が窓の外へ舞い、{t}は笑いすぎて息ができません。 || あ、おもちゃのお金じゃありませんでした。${m}を空中にばらまき、{t}は何も見ていないと誓います。
humor.dirty_offended=下ネタは大スベリです。{t}はただ、深く失望した目で見つめて、何も言いません。 || この場には合わないジョークを言いました。{t}は笑いません。ただ見つめます。 || ジョークは鉛の風船のように沈みました。{t}はおもしろくなく、それはあなたもわかっています。
humor.compliment_creepy=褒め言葉が不気味に響いて、{t}は小さく一歩下がります。自分でももう一度聞こえてしまいます。 || いいことを言ったのに、別の何かに聞こえます。{t}は床を見つめます。 || 褒め言葉が変な着地をしました。{t}は人質のような声でお礼を言います。
humor.memes_cringe=3年前に死んだミームを解説します。{t}は礼儀正しくうなずき、何も言いません。 || そのミームは完全な講義が必要で、それでも伝わりません。{t}は優しい同情の目で見ます。 || {t}にトレンドのミームを見せます。トレンドではありません。一度もなったことがありません。
humor.high_five_miss=ハイタッチを振りかぶって、空気を叩きました。{t}はとても優しい顔で、あなたを宙ぶらりんにします。 || ハイタッチは拍手とビンタの中間に着地しました。{t}は手を振ってほぐし、それでも微笑みます。 || 手を1センチ外して、腕がそのまま進みます。{t}は、ストレッチだったことにしてくれます。
humor.powerup_fizzle=パワーアップのためにこぶしを出しますが、何も光りません。{t}は気まずくも一応こぶしを合わせます。 || 友情パワーアップは、ぷしゅっと小さく不発です。{t}は義理で1回拍手します。 || パワーアップの掛け声を叫びますが、エネルギーはどこにも行きません。{t}は気づかいでサムズアップします。
humor.flex_fail=力こぶを見せたら、肩から非常に歓迎できない音がしました。{t}は顔をしかめます。 || ポーズは激しかったです。ただ、1秒長すぎて、何かがつりました。 || 筋肉を披露します。{t}は感心せず、筋肉の1つが傷つきます。
humor.knockout={t}がキレてパンチを繰り出しました。命中し、洗濯物の袋みたいに床に倒れます。 || 今のジョークが決定打でした。{t}が殴り、部屋が傾きます。気づくと天井を見ています。 || {t}は真っ赤になって、顔面にパンチを入れます。床に着く前に、あなたの尊厳は建物から出ていきました。
humor.fight={t}はもう限界です。ひと突き、大声ひとつ、気づけばケンカの真っ最中です。 || 今のは一線を越えました。{t}は身構えて、殴りかかってきます。 || {t}はとても根に持って、拳で答えることにしました。自業自得です。
humor.police={t}は堪忍袋の緒が切れて、もう電話をかけています。警察への届け出が届きそうです。 || {t}は一瞬あなたを見つめて「警察を呼びます」と言いました。かなり本気に聞こえます。 || 最悪の展開です。謝り終わる前に、{t}はあなたを通報しました。
humor.money_rain=マネーガンがお札をシャワーのように降らせ、風にさらわれる前に${m}をキャッチします。{t}は歓声をあげます。 || 現金が完璧な弧を描いて降ってきます。{t}が笑う間に、${m}をポケットに押し込みます。 || 銃が伝説級の連射を放ちました。${m}リッチになって帰り、{t}はまだ笑っています。
humor.inside_joke=そのジョークは、{t}とあなたの二人だけのネタになりました。何週間も思い出して笑えます。 || {t}と同時に笑って、気持ちいいです。ちょっと距離が縮まりました。 || くだらない瞬間が小さな絆になりました。{t}と一生ネタにし続けるでしょう。
humor.knockout_death={t}のパンチが決まり、床に倒れて、そのまま目を覚ましません。おしまい。 || {t}の一撃。倒れ、部屋が静まり、もう立ち上がれません。エンドロール。 || {t}の一発のパンチ。それが、残念ながら人生で最後に気づいたものでした。おしまい。
family.bonus=あなたの{k}との、ほっこりした時間です。二人とも少し気が楽になりました。 || {t}は、家族にしかできない笑顔を見せます。説明はいりません。 || 気楽で、優しくて、ちょっと笑える。まさにこうあるべき時間です。
family.crit_success=すべてがうまくいきました。{t}と、小さいころのように笑い合って、家に帰ってきた気分です。 || {k}同士の、めったにない完璧な瞬間です。誰も口にしませんが、みんな感じています。 || 何年たっても覚えている、そんな家族の会話です。{t}はいつもより少し長く離れません。
family.soft_fail=まあまあ穏やかです。家族の会話はこんなものです。 || あなたが話し、{t}がうなずき、一日は続きます。 || 特別なことはありません。悪いこともありません。
family.crit_fail=言ってはいけない{k}に、言ってはいけないことを言って、部屋中に聞こえました。 || 家族みんなが何年も夕食で持ち出す、あの手の場面になりました。 || 小さな一言が大きな一言になりました。{t}は、忘れられない顔で去ります。
family.awkward_pause={k}にしか作れない、これほど大きな沈黙が広がります。 || 二人同時に話題を探しますが、どちらも口にしません。 || 会話が止まり、時計が急に面白くなります。
family.old_argument=なぜか何年も前と同じ口ゲンカに戻りました。同じセリフ、同じ逃げ道です。 || {t}はあの時のあの件を持ち出しました。持ち出さないでほしかったです。 || 古い傷を踏んでしまい、まったく治っていなかったとわかります。
family.rusty_visit=久しぶりで、それが出ています。家族なのに、ちょっと他人です。 || 二人とも正しい言葉を、ちょっとだけ違う順番で言います。 || 離れて暮らすと、まず近況報告からです。報告から先に進みません。
family.house_rules=一緒に住んでいれば、お皿の話は必ず出ます。今まさに出ました。 || 誰かが床に物を置きっぱなしです。もちろん、{k}のせいです。 || 同じ家なのに、片付いている状態の考え方が全然違います。
family.spouse_bickers=結婚とは、同じ小さなケンカを新しい形で続けること。今日は新しい形です。 || {t}は、配偶者にしかできない視線をくれます。つまり、もう怒られています。 || 特に何でもないことでの、ちょっとした言い合いです。これが一番たちが悪いです。
family.plan_clash=二人で未来を計画しますが、一瞬、別々の未来に見えます。 || {t}はひとつを望み、あなたは別のものを望みます。妥協は沈黙です。 || 大きな計画が小さな現実にぶつかります。今回はどちらも譲りません。
family.lecture_flops=お説教はレンガのような軽さで着地しました。{t}は、聞くのをやめた子どもみたいにうなずきます。 || 大事なことを説明します。{t}には「ぶつぶつ」と少しのプライドしか聞こえません。 || 頭の中ではもっと賢く聞こえました。
family.chide_backfires=叱ったら裏目に出ました。{t}は、「そっちだって同じことしたでしょ」と言いたげに見つめ返します。 || お説教が、涙ながらの「全然聞いてくれない」に変わりました。誰も得をしません。 || 声を荒げて、荒げなければよかったと思います。
family.eye_roll=親が話し始めたら、もう結末がわかります。白目をむいたのも見られました。 || アドバイスは正しいです。受け取るのが問題なんです。 || 一生懸命聞いています。相手にはバレています。
family.generation_gap=世代の溝が、ちょうど二人の間に開きます。溝の向こうに手を振ります。 || 祖父母には説明できないこともあります。これがその一つです。 || {t}とは同じ言葉を話しているのに、同じ年代ではありません。
family.grandchild_bored=昔話は最高でした。孫はそこまで聞いていませんでした。 || 孫はもう画面を見ています。昔話はお預けです。 || 知恵を授けますが、返ってくるのは礼儀正しい「ふーん」です。
family.sibling_spat=きょうだい理論です。始めたのはあなた、終わらせたのは{t}、二人とも勝ったと言い張ります。 || 一言多くて、ソファを取り合っていた10歳のころに逆戻りです。 || 王道です。からかいのジョークが一歩行きすぎました。
family.wrong_mood=間違った気持ちを、間違ったタイミングで出しました。{t}は一歩下がります。 || 気持ちは本物でした。タイミングは本物ではありませんでした。 || すべての気持ちを今すぐ共有する必要はありません。これがその一つでした。
family.allowance_gone=お小遣いを渡すと、ごく短い「ありがとう」が返り、お釣りはありません。 || お小遣いはレシートより早く消えます。どこへ行ったかは永遠にわかりません。 || お金が手渡され、そのあとお説教が続きます。両方の代金を払いました。
family.apology_stumbles=謝罪が順番を間違えて出てきます。「ごめん」は最後に来ます。 || 償おうとしますが、言葉同士がつまずきます。 || 謝罪は誠実です。伝え方は大惨事です。
family.hug_too_tight=ハグがちょっと長く、締めつけがちょっと強すぎました。{t}はタップします。 || {k}をハグしたら、何かがポキッといいました。たぶん背中です。 || 元気いっぱいのハグ、小さなバキッ、そして気まずい笑い。
family.kid_not_listening=小さな子は、あなた以外の全部を聞いています。 || 3回言いました。4回目にやっと届くか、子どもがいなくなります。 || あなたはその道のプロです。子どもは、無視のプロです。
family.family_warmth=家族の親しさは静かなものです。今がそのひとときで、それを感じます。 || ささいなことが、{t}との温かいひとときに変わります。
family.family_bond=すべてがカチッとはまります。{t}とは、ただの親戚ではなく本当の家族だと感じます。 || 二人とも忘れられない瞬間です。絆が育ち、温かさも増します。
family.fail=始まりはよかったのに、二人とも予定していなかった方向へ流れていきます。
art.bonus=絵がいい感じにまとまってきました。大胆な数筆がすべてをやってのけました。 || いい色、いい構図。誰かが飾りたくなる絵です。 || 手に絵の具をつけて、静かなにっこりで締めくくります。
art.crit_success=筆がひとりでに動きます。離れて見ると、今までで最高の作品です。 || 色、光、ほんの少しの魔法。とても落ち着いた手でサインします。 || 絵ではなく、感情になりました。一日中見つめていられます。
art.soft_fail=ベストではありませんが、自分の作品です。 || 色は少しズレていて、構図は少し控えめです。 || まあまあです。初稿がまあまあであるのと同じ意味で。
art.crit_fail=絵は、とても大きくてとても茶色い、後悔の水たまりになりました。 || 何をやっても悪化します。あるところで、やめます。 || 完成品は、意見を持った失敗作のようです。
art.uninspired=キャンバスを見つめます。にらめっこはキャンバスの勝ちです。 || ミューズは休憩中で、転送先も残していません。 || 何も出てきません。アイデアも、線も、色も。
art.muddy_colors=すべての色が同じ茶色に混ざります。とても安定した茶色です。 || 混ぜるたびに濁ります。夕焼けを狙って、沼にたどり着きました。 || もう1色足したら、全体が灰色になりました。
art.paint_spill=絵の具トレーがひっくり返り、一番避けたい場所に飛び散ります。服にも、靴にも、自分にも絵の具です。 || 作品を眺めようと下がったら、代わりに絵の具を踏みました。 || 絵の具の大波がまずシャツに届きます。絵は無事です。自分は無事ではありません。
art.ruined_canvas=あと一筆でキャンバス全体が台無しになりました。画集には載っていない言葉をつぶやきます。 || キャンバスが破れ、絵の具が流れて、1時間の作業が消えました。 || 一角を直そうとして、残りの三角を壊しました。
art.mural_drips=壁の絵の具が、長く悲しげな線になって垂れ、少し自分にもかかります。 || 壁を狙ったのに、壁は分けてくれました。 || 壁画は少し溶けた仕上がりで、自分は少し塗られた仕上がりです。
art.caught_tagging=近所の人に作品を見られ、違法な落書きの罰金が来ました。芸術には代償があります。 || 通りすがりの人は器物損壊と呼びます。罰金通知は${m}と呼びます。 || その壁は塗っていい壁ではありませんでした。市から請求書が届きます: ${m}。
art.art_confusing=長い間見つめます。向こうも見つめ返しますが、役に立つことは何も言いません。 || みんな深いと言います。バナナと長い沈黙しか見えません。 || ギャラリーの人のように、何もわからないまま、したり顔でうなずきます。
art.painting_sale=通りすがりの人があなたの絵に一目惚れし、その場で${m}を払いました。 || コレクターが作品の噂を聞き、${m}と熱烈なメッセージを送ってきました。 || 作品が${m}で売れました。最初の本当のファンは、見知らぬ人です。
art.art_praise=友人が絵を見て、「次の作品のために」と${m}をそっと渡してくれました。 || 誰かが小さなプリントを${m}で買いました。これで正式にプロです。
art.fail=思い描いた通りにはなりませんでした。
art.pass=しっかりした出来の作品です。
spa.bonus=温かくて静かで、まさに必要だったものです。生まれ変わった気分で出てきます。 || 最高のセッションです。忘れていた筋肉が「ありがとう」と言っています。 || 全身がため息をつき、あなたもため息をつきます。
spa.crit_success=すべてのコリが一度にほどけます。骨が抜けたようにふわふわと、穏やかに、3センチほど背が伸びた気分で出てきます。 || 至福です。世界がゆっくりになり、肩が落ち、ストレスの感覚を忘れました。 || 完璧な施術です。この状態のまま、1週間は過ごせそうです。
spa.soft_fail=まあまあです。魔法ではないけれど、そこそこリラックスできました。 || 気持ちいいけれど、心はどこか別の場所にあります。 || 悪くない施術です。もっといい経験もありました。
spa.crit_fail=スパの日ならではの形で、すべてがおかしくなります。来たときより緊張して帰ります。 || リラックスのはずが、ちょっとした試練になりました。体は何が起きたのかわかりません。 || リラックスにお金を払って、何年も語れるネタが手に入りました。
spa.restless=横になっても、頭のスイッチが切れません。どの考えもやることリストです。 || リラックスは重労働だとわかりました。今日はとても下手です。 || 施術は問題ありません。問題はあなたです。
spa.tense_knot=自分でも知らなかったコリにヒットしました。目の前に星が見えて、星も「痛い」と言っています。 || 緊張は肩に隠れていて、反撃してきます。癒やされるどころか、痛くなって帰ります。 || とても力強い親指が、一番ダメな場所を見つけて、そこにとどまります。
spa.too_hard=圧が強すぎます。丁寧に微笑みながら、静かに別の人生を考えます。 || 深部と言われましたが、「骨まで」とは言われませんでした。何時間も痛みます。 || 体にいいはずの痛みですが、納得できません。
spa.ticklish=足が思った以上にくすぐったがりでした。笑って、もだえて、魚を水から蹴り出しそうになります。 || くすぐったすぎて、リラックスどころではなくなるまで笑い続けます。 || ドクターフィッシュは、あなたのつま先にとても熱心です。つま先には誰も教えていません。
spa.fell_asleep=マッサージ中に眠ってしまい、よだれの水たまりと尊厳ゼロで目が覚めます。 || 大きないびきで目が覚めます。部屋はとても静かです。全員に聞かれました。 || うとうとして、ハッと目を覚まし、目を休めていただけのふりをします。
spa.salt_sting=塩が、気づかなかった小さな傷を見つけました。平静な顔を保ちます。かろうじて。 || とてもしょっぱいサプライズです。「うーん」と言いながら、心の中は「痛い」です。 || 塩の湯は、癒やしよりしみるほうが強いです。
spa.aroma_allergy=オイルはすてきですが、鼻は別の意見を持っています。くしゃみが始まり、止まりません。 || バラ、ハーブ、そして突然のアレルギー。赤い鼻とハンカチと一緒に帰ります。 || 香りの雲と、さらに大きなくしゃみ。ハクション。
spa.sauna_dizzy=暑さにやられます。部屋が回り、ベンチが揺れ、少しゆでダコ色で出てきます。 || 暑すぎて、長すぎました。ゼリーのような足で出ていきます。 || 自分は大丈夫だと言い聞かせます。サウナは同意しません。
spa.sauna_overheat=サウナで調子に乗ったら、サウナが勝ちました。世界が白くぐらつき、汗だくで這い出します。 || 汗、目の前のチカチカ、そして間違いだったという強い実感。熱中症が礼儀正しくノックして、そのままドアを蹴破ってきます。 || 暑さはリラックスではなく脅威になりました。なんとかドアにたどり着きます。
spa.pushy_staff=セラピストが、一番まずいタイミングでおしゃべりになります。微笑みますが、リラックスはできません。 || とても熱心なプロが、施術中ずっと話し続けます。リラックスは見つかりません。 || マッサージは問題ありません。実況が問題です。
spa.fail=あまりリラックスできませんでした。
spa.pass=ちゃんとしたリラックスタイムです。
mood_spouse.bonus=視線、微笑み、とても小さな「おいで」。あとは雰囲気がやってくれます。 || {t}はそっと笑って、あなたを引き寄せます。完璧です。 || 1分前まで重かったものは消えました。代わりに、温かい何かが残っています。
mood_spouse.crit_success=誰も何も言わないうちに、雰囲気は完璧です。{t}と溶け合って、世界全体が静かに、柔らかく、温かくなります。 || すべてがぴったりです。光、タイミング、そして相手。二人とも、また恋に落ちた気分です。 || 初めてのようで、100回目のようで、すべて同時です。痛みも不安もなく、{t}以外は何も気になりません。
mood_spouse.soft_fail=ちょっと照れくさいけれど、いい時間です。最後には二人ともたどり着きます。 || ちょっと気まずくて、たいてい甘いです。流してしまいます。 || 映画のワンシーンのようにはいきませんが、うまくいきます。
mood_spouse.crit_fail=いい雰囲気にしようとしたのに、足が冷たくてムードが壊れました。 || 顔を寄せたら、クッションにつまずいて、夜がおかしな方向へ。{t}は笑いながらため息をついています。 || ロマンチックな大事な瞬間は、とても大きな腹の音に邪魔されて、悲しい小さな沈黙が続きます。
mood_spouse.cold_feet=いい雰囲気にしようとしたのに、足が冷たくてムードが壊れました。 || 冷たい足が{t}の脚に触れます。悲鳴、ジャンプ、そしてムードは消えました。 || 冷えたつま先が温かいふくらはぎに触れた瞬間、ロマンスは終わります。
mood_spouse.cold_hands=手が凍るように冷たく、{t}はとても高い声でそれを教えてくれます。 || 冷たい手が、間違った場所に、間違った瞬間に触れます。ムードは部屋から出ていきます。 || やさしい気持ちのつもりでした。指は氷のつもりでした。
mood_spouse.phone_buzzes=最悪のタイミングでスマホが震えます。二人とも、もう聞かなかったことにできません。 || 通知。そしてまた通知。ムードはチャットから退出しました。 || 誰かがスマホをマナーモードにし忘れました。二人ともでした。
mood_spouse.pet_interrupts=肉球、ニャー、そしてドスンという大きな音。ペットが夜に参加しました。 || 猫が最悪のタイミングでベッドに飛び乗ります。ムードは生き残れません。 || 大きなふわふわの観客が見ています。誰も集中できません。
mood_spouse.giggle_fit=真面目にしようとしたら、{t}がくすくす笑い出して、もう二人とも止まりません。かわいいですが、色っぽくはありません。 || 最初の笑いはブッという吹き出しで、2回目でムードが終わりました。二人とも笑い泣きです。 || ロマンチックに始まって、笑いの発作に変わりました。それでも楽しい時間です。ただ、別の楽しさです。
mood_spouse.fail=いい雰囲気にしようとします。雰囲気には別の計画がありました。
mood_spouse.pass=ムードが決まりました。誰も何も言う必要はありません。
mood_lover.bonus=恋は冒険です。今、その体験を楽しんでいます! || {t}とのあいだに、ドキドキする小さな火花が散ります。二人とも気持ちが軽くなります。 || その瞬間は甘くて、ちょっと大胆で、とても楽しいです。
mood_lover.crit_success=恋は冒険です。その一分一秒を楽しんでいます。{t}も同じ気持ちです。 || すべてがカチッとはまります。視線、触れ合い、すべてを語る微笑み。 || 計画したわけではなく、自然に起こりました。そして、すばらしいです。
mood_lover.soft_fail=ちょっとぎこちないですが、{t}は水に流してくれます。 || 滑らかとは言えませんが、十分甘いです。 || 少し不器用でしたが、{t}はそれでも微笑みます。
mood_lover.crit_fail=雰囲気を完全に読み違えました。{t}は、頭がもう一つ生えたかのような目で見ます。 || ムードはゼロから一気に大惨事です。{t}は部屋を出る必要があります。 || 大勝負は、考えうる最も恥ずかしい形でスベりました。
mood_lover.slap=雰囲気づくりに顔を寄せたら、{t}は攻撃と受け取ってビンタしました! || ちょっと大胆すぎました。{t}のビンタの音が響き渡ります。
mood_lover.runaway={t}は何が来るかを察して、パニックで部屋から逃げ出します。 || あなたが動きます。{t}も動きます。ドアに向かって。
mood_lover.embarrassed={t}は真っ赤になって、あなたを見られません。あなたも同じです。 || その瞬間は刺激が強すぎました。{t}は両手で顔を隠します。
mood_lover.angry={t}は、あなたが試みたことに不機嫌です。にらみがすべてを物語ります。 || 読み違えました。{t}は、それをしっかり伝えてきます。
mood_lover.rejection={t}は身を引きます。丁寧で、きっぱりした「ノー」が宙に浮かびます。 || 今夜は違います。こういうのは違います。{t}は一歩下がります。
mood_lover.sad={t}は傷ついた顔をして、あなたもそれを感じます。沈黙が重いです。 || ムードはとても悲しい形で消えます。{t}はため息をついて目をそらします。
mood_lover.fight={t}は激怒し、口論は本物のケンカに変わります。 || ムードづくりだったものが、怒鳴り合いと突き飛ばしになりました。
mood_lover.fail=雰囲気づくりを試みますが、{t}はまだそこまで来ていません。
mood_lover.pass=相性バッチリです。
romance.bonus={t}はちょうどいい瞬間に笑い、さっきより近くにいます。何かが始まりつつあります。 || いい時間です。{t}とあなたは、ほんの少し長く見つめ合い、どちらも気にしません。 || 胸のドキドキは、お互いさまです。温かくて、ふわふわした気持ちで帰ります。
romance.crit_success=言葉がぴったりに出てきます。{t}は、月を飾ったのはあなたかのような目で見つめ、そっと「明日も空いてる?」と聞きます。 || すべてがそろいます。タイミング、微笑み、ちょうどいい場所の沈黙。{t}は少し息が上がり、あなたもです。 || こんなにスマートだったことはありません。{t}は赤くなり、部屋が10度ほど暖かくなったように感じます。
romance.soft_fail=悪くはありませんが、火花は散りません。二人とも散ったふりをします。 || {t}は丁寧に微笑みます。ウェイターに向けるような笑顔です。 || 大失敗でも、いい瞬間でもありません。空気はまったく同じ温度のままです。
romance.crit_fail=あまりに的外れなことを言って、{t}は体調が大丈夫か確認してきます。大丈夫ではありません。 || その瞬間はスローモーションで崩れます。{t}はあなたを見つめ、あなたは床を見つめ、床は助けてくれません。 || 口を開けたら、最悪の一文がこぼれ出ました。{t}は何年も覚えているでしょう。
romance.tongue_tied=シャワーの中で練習しました。口に出すと、ただの音です。 || 脳がチャットから退出しました。出てきたのは「えっと…うん」だけです。 || {t}は待ちます。あなたも待ちます。誰もロマンチックなことを言いません。
romance.turned_down={t}はとても優しい声で「友達のほうがいいと思う」と言います。それでも痛いです。 || 丁寧な「ごめんなさい」。その丁寧さが一番こたえます。 || {t}は本当に申し訳なさそうで、それがなぜかさらにつらいです。重い気持ちで帰ります。
romance.too_forward=ゼロから「ところで、子どもは?」まで、一文で到達しました。{t}は一歩下がります。 || 急に重い話でした。{t}には少し時間と、水が必要です。 || 9ステップくらい飛ばしました。{t}は、そのすべてに気づいています。
romance.cold_feet=結婚の話を出したら、{t}は急に天井がとても面白くなります。 || 「ところで、これからどうなると思う?」は、レンガのように落ちます。ムードは静かに去ります。 || {t}は、タイヤ跡が残るほどの速さで話題を変えます。
romance.sweaty_hands=手のひらは沼です。{t}は勇敢に握り続け、あとでズボンで手を拭きます。 || {t}の手をつかみます。しっとりして、震えていて、申し訳なさそうです。 || 手つなぎは、二人ともどれだけじっとりしているかに気づくまでの間だけ続きます。
romance.hand_yanked={t}は熱いフライパンのように手を引っこめます。まったく隠せていません。 || 手を伸ばすと、{t}は手をポケットに入れます。メッセージは明確です。 || 手は、とても丁寧に、とても素早く引っこめられます。痛い。
romance.slap={t}の手に手を伸ばしましたが、{t}は誤解してビンタしました! || 大胆すぎました。{t}のビンタの音が響き渡ります。
romance.cold_greeting=甘い挨拶は、濡れた靴下のようにベチャッと落ちます。{t}はうなずいて歩き続けます。 || 魅力全開で{t}に挨拶します。{t}は丁寧な「ふーん」で返します。 || 挨拶は期待を込めたふわっとした羽ばたきでした。床にぺしゃんと落ちました。
romance.confession_declined=胸をドキドキさせながら尋ねます。{t}はやさしく断り、ドキドキは沈んでいきます。 || {t}は傷つけないように断ってくれますが、全然「優しく」は感じません。 || 大きな質問に、小さくて優しくて破壊的な「そういうのじゃないの」が返ってきます。
romance.knockout={t}がキレてパンチを繰り出しました。命中し、洗濯物の袋みたいに床に倒れます。 || その行動が決定打でした。{t}が殴り、部屋が傾きます。気づくと天井を見ています。
romance.fight={t}はもう限界です。ひと突き、大声ひとつ、気づけばケンカの真っ最中です。 || 今のは一線を越えました。{t}は身構えて、殴りかかってきます。
romance.police={t}は堪忍袋の緒が切れて、もう電話をかけています。警察への届け出が届きそうです。 || 「警察を呼びます」。{t}は本気のようです。
romance.butterflies=ときめきはお互いさまです。{t}とあなたのあいだに、何かが静かに育っています。 || {t}とあなたは、隠しきれない笑顔で別れます。
romance.swept_off_feet=二人とも忘れられない瞬間です。{t}はメロメロで、あなたは輝いています。 || {t}は完全に落ちました。何時間も続く温かい気持ちが込み上げます。
romance.fail=魅力的に決めようとして、「説明書の音読」あたりに着地しました。 || 計画はロマンチックでした。実行は人質交渉でした。
romance.knockout_death={t}のパンチが決まり、床に倒れて、そのまま目を覚ましません。おしまい。 || {t}の一撃。倒れ、部屋が静まり、もう立ち上がれません。エンドロール。
conflict.bonus=鋭い一言が、うまく決まりました。{t}は、しぶしぶニヤリとします。 || 一歩も引かず、それが効きました。{t}は少しだけ認めてくれます。
conflict.crit_success=完璧に決まりました。{t}は言い返せず、部屋中があなたの勝ちを知っています。 || 見事なお手本です。{t}は口を開けて、閉じて、敬意を込めてうなずきます。 || 度胸が報われました。{t}は引き下がり、身長が3メートルになった気分です。
conflict.soft_fail=ふわっと着地しました。{t}は肩をすくめて先に進みます。 || 一番鋭い瞬間ではありませんが、誰も傷つきません。 || {t}は感心せず、問題は決着しないままです。
conflict.crit_fail=ひどい結果で、{t}は答える必要すらありません。自分の言葉が代わりに答えてくれました。 || 大一番は、見事に裏目に出ました。そのあとの沈黙が耳に痛いです。 || 一歩も引かず、壁に突っ込みました。{t}はとても興味深く見ています。
conflict.stiff=ジャブは固くて練習した感じで、{t}に見抜かれます。 || 強そうに話そうとしました。留守電のように聞こえます。
conflict.tease_backfires=からかいは不発で、{t}は本当に痛い一言で撃ち返します。 || {t}をつついたら、つつき返されました。 || {t}はおもしろがっていません。赤くなるのはあなたのほうです。
conflict.ridicule_backfires=あざけりは見事に返されて、拍手したくなるほどです。ほぼ。 || 逆に{t}に大笑いされ、始めなければよかったと思います。 || {t}をバカにしたら、もっといい返しが用意されていました。痛い。
conflict.stubborn=あなたが意地を張り、{t}も意地を張ります。誰も勝たず、ムードは台無しです。 || 声を大きくしても、正しくはなりません。{t}は聞くのをやめます。
conflict.line_crossed=線を引いたら、{t}の気持ちのど真ん中を通っていました。 || 真実が正直すぎる形で出ました。{t}は黙り込み、部屋が寒くなります。 || はっきり言いました。{t}もはっきり聞こえて、お互いに顔を見られません。
conflict.power_play_flops=力関係の駆け引きは大コケです。{t}はみんなの前で指摘し、そのせいで出費がかさみます。 || {t}は全然ひるんでいませんでした。いろんな意味で、しみます。 || 優位に立とうとして、その特権の代金を払うはめになります。
conflict.shown_the_door={t}がドアを指さします。ヒントを受け取り、傷ついたプライドと一緒に出ていきます。 || {t}に出ていくよう頼んだら、鋼も溶かす視線が返ってきました。 || 「出ていってください」は的外れで、外に出されたのはあなたのほうです。
conflict.greeting_backfires=失礼な挨拶に、もっと失礼な返事が来ました。始めたのはあなたなので、受け止めます。 || {t}は不機嫌な挨拶を根に持ち、利子をつけて返します。 || 悪役のように{t}へ挨拶しました。{t}は役に入って返してきます。
conflict.belittle_backfires=みんなの前で{t}をけなしました。{t}は証拠を持っていました。 || 責任は逆にあなたに降りかかり、おまけ付きです。 || {t}は冷静なままで、それが一番こたえます。みんな見ていました。
conflict.pent_up=言葉は予定より熱くあふれ出ます。{t}には、そこまで必要ありませんでした。 || 全部ぶちまけましたが、一部は別の誰かに向けたものでした。 || 気持ちは本物でした。タイミングは本物ではありませんでした。
conflict.extort_backfires=脅しは途中で崩れます。{t}は冷静なままで、怪しいのはあなたのほうです。 || 恐喝は、恐喝らしい結果になりました。{t}は激怒し、あなたがその代償を払います。 || {t}はまばたきひとつしません。罰金は容赦ありません。
conflict.caught_red_handed=誰かに見られました。全員に見られました。その場にいなかったふりをします。 || こっそり作戦に目撃者がいました。顔が真っ赤です。 || 秘密は、思ったより秘密ではありませんでした。
conflict.rumor_backfires=メッセージが違う人に届きました。夜は消す作業で終わります。 || 噂は広がり、おまけの詳細付きで自分に戻ってきます。 || その噂は、誰かの友達の話でした。しまった。
conflict.prank_backfires=いたずらは自分に降りかかりました。みんな笑いますが、あなたと一緒にではありません。 || ジョークにはもう一手間が必要でした。それを飛ばして、代償を払います。
conflict.knockout={t}がキレてパンチを繰り出しました。命中し、洗濯物の袋みたいに床に倒れます。 || 今のが決定打でした。{t}が殴り、部屋が傾きます。気づくと天井を見ています。
conflict.fight={t}はもう限界です。ひと突き、大声ひとつ、気づけばケンカの真っ最中です。 || やりすぎました。{t}は身構えて、殴りかかってきます。
conflict.police={t}は堪忍袋の緒が切れて、もう電話をかけています。警察への届け出が届きそうです。 || 「それは嫌がらせです。警察を呼びます」。{t}は本気です。
conflict.witty=いい一言で、{t}もそれをわかっています。しぶしぶの笑みと、少し増した敬意です。 || 無傷で言い合いに勝ちました。{t}は少し打ち解けます。
conflict.respect=あまりに見事に言い負かして、{t}は本気で感心します。自信がしばらく輝きます。 || {t}はうなずいて引き下がります。今日は本物の敬意を勝ち取りました。
conflict.fail=大胆に行ったつもりが、恥ずかしいところに着きました。 || セリフはよかったです。言い方がくしゃみでした。
conflict.knockout_death={t}のパンチが決まり、床に倒れて、そのまま目を覚ましません。おしまい。 || {t}の一撃。倒れ、部屋が静まり、もう立ち上がれません。エンドロール。
passion.bonus=共通の趣味で会話が弾みます。{t}はうなずき、二人とも元気をもらって帰ります。 || 二人とも大好きな話題で、楽しい小話です。{t}はもっととせがみます。
passion.crit_success=二人とも、まったく同じものが大好きだとわかりました。{t}と気づかないまま何時間も語り合います。 || 似た者同士が出会いました。{t}はランプのように顔を輝かせ、あなたもです。 || 話題が完璧にハマります。{t}はすべてを知りたがり、喜んで教えます。
passion.soft_fail=いくつか話すことは見つかり、{t}もです。まあ悪くありません。 || 共通点はありますが、火花はあまりありません。 || 話題は、礼儀正しく尻すぼみになります。
passion.crit_fail={t}が一番大事にしている話題について、自信満々に間違ったことを言います。沈黙が落ちます。 || あなたの情熱は、{t}の情熱とまったく別物でした。会話は立ち直れません。 || ある話題に全力投球し、{t}は顔をしかめます。どちらがより恥ずかしいのか、わかりません。
passion.dull_topic=その話題を10分語り続けます。{t}の目は、3分あたりからどんよりしています。 || あなたは夢中です。{t}は時間を確認しています。 || その話題はあなたにはスリリングですが、部屋の誰にとってもそうではありません。
passion.hot_take=とても大胆な意見を投下し、{t}は好意的に受け取りません。 || 過激な持論で、場が一気に冷めます。{t}は大声で反対します。 || {t}は話題を個人的に受け止め、もう討論になりました。
passion.dance_stumble=技を見せようとして、自分の足につまずき、ぐるっと回って山積みになります。{t}は同情して顔をしかめます。 || そのダンスの技は、今のスペースでは足りません。床の勝ちです。 || ちょっと欲張りすぎた一歩で、重力が取り立てにきました。
passion.muscle_strain=トレーニングの技を披露したら、何かが引っ張られました。{t}はクッションとたっぷりの同情をくれます。 || 熱意がウォームアップを上回りました。腰が苦情を出します。 || 力みすぎて、必要だった何かを痛めました。
passion.voice_cracks_song=自信満々で高音に挑みます。高音は応えてくれません。 || 声が派手に裏返り、{t}は窓がないか見回します。 || 一緒に歌うのは最高です、あなたがリードを取るまでは。
passion.off_key=弾いたコードは、曲にはありませんでした。{t}は、創作の一部だったことにしてくれます。 || ギターは音が外れていて、雰囲気も全部外れています。 || 情熱を込めて、間違った音でかき鳴らします。
passion.meat_debate=お肉の話を始めたら、{t}には部位について強いこだわりがありました。議論になります。 || ステーキ論争が白熱します。レアとウェルダンは両立しません。 || 「ウェルダンで」と言うと、{t}は家族を侮辱されたような目で見ます。
passion.recipe_war=あなたのレシピ対{t}のレシピ。誰も勝たず、みんなお腹が空いて、少しムッとしています。 || 隠し味はバターだと言います。{t}は忍耐だと言います。空気がピリつきます。 || {t}の調理法にダメ出ししました。失敗です。
passion.no_common_ground=好きなものを紹介します。{t}も紹介します。共通点がまったくありません。 || 好みが遠すぎます。会話は静かになります。 || {t}は「え、それが好きなの?」と、忘れられない口調で聞いてきます。
passion.shared_joy=二人とも好きなことを話すと、温かい気持ちになり、絆が強まります。 || {t}は笑って、自分の話も聞かせてくれます。距離がぐっと縮まりました。
passion.kindred_spirits={t}とは、同じタイプの人間だとわかりました。今日から強い友情が始まります。 || {t}はニヤッとして「今までどこにいたの?」と言います。あなたも同じ気持ちです。
passion.fail=共通点があると確信していましたが、思ったより少なかったです。 || 熱意は本物でした。知識は本物ではありませんでした。
selfcare.bonus=自分と向き合ういい時間です。すっきりして、静かな満足感があります。 || いい時間でした。来たときより軽い気持ちで帰ります。
selfcare.crit_success=まるで生まれ変わったような気分で終わります。すべてが少し明るく、ずっと穏やかです。 || 自分のためのいい時間でした。輝いていて、一日中が軽く感じます。 || 完全に心が落ち着く、めったにない瞬間です。
selfcare.soft_fail=まあまあです。魔法ではないけれど、悪くはありません。 || 特別なことも、悪いこともありません。そのまま続けます。 || 特に語ることもなく、時間が過ぎます。
selfcare.crit_fail=すべてが横道にそれて、始めたときより気分が悪くなります。 || 穏やかなひとときのはずが、ちょっとした大惨事になりました。
selfcare.off_day=頑張ってみますが、今日は気が乗りません。深いため息が出ます。 || 日によっては、休むことさえ重労働です。
selfcare.self_doubt=鏡とあなたが見つめ合います。先にまばたきしたのはあなたで、自信はありません。 || セリフを6回練習します。なぜか回数ごとに悪くなります。 || 自分を見て、直すところしか見つかりません。自分への励ましも効きません。
selfcare.mind_wanders=頭がスローダウンしてくれません。考えがどんどん別の考えになります。 || 座って、深呼吸して、送り忘れたメールを思い出しました。安らぎは中止です。 || 穏やかさはなかなか来ません。始めたときよりそわそわして帰ります。
selfcare.bad_omen=結果はあいまいで不吉で、ちょっと失礼です。落ち着かない気持ちで帰ります。 || 未来は曇り空です。聞かなければよかったと思います。 || カードか水晶玉が、悪い知らせを明るい口調で伝えます。なぜかそれがもっと悪く感じます。
selfcare.bad_sleep=寝返りを打ち、ごろごろして、枕と戦います。朝は早すぎる到来です。 || 一応、寝ました。寝た気はしません。 || うとうとするたびに、何かがガタガタ鳴ります。疲れが日常になりました。
selfcare.nightmare=歯のついた、しゃべるサンドイッチが出てくる、とても変な夢です。震えながら、ぐったりして目が覚めます。 || 悪夢はまるで現実です。暗い中で起き上がり、少し時間が必要です。 || 何かに遅刻する夢を見ます。遅れて、疲れて起きますが、何に遅れたのかわかりません。
selfcare.firewood_boom=薪を放り込むと、火が「ドン!」と答えます。火の玉、すすの雲、気づけば公園で一番汚い人です。 || 薪は湿っていて、火は怒っています。ドカン! 頭から足まで灰まみれです。 || 薪をもう1本足したのが余計でした。たき火は煙と火花とともに爆発し、煙突掃除人のような姿になります。
selfcare.dust_fizzles=魔法の粉をふりかけると、火はくしゃみをしただけでした。何も起こらず、靴に少しキラキラがつきました。 || 粉は一瞬きらめき、小さな悲しいポンという音で消えます。 || 今日は、火が魔法の気分ではないのかもしれません。
selfcare.otherworldly_visitor=炎がゆらぎ、曲がり、目がやたらと多い何かが火から這い出し始めます。笑ってしまいます。笑いが止まりません。かなり引きつった笑いです。 || 煙の中に人影が立ち上がり、あなたをまっすぐ見て、何も言いません。大丈夫です。まったく大丈夫です。あはは。あはははは。 || 火がどこからともない声で名前をささやきます。自分のものとは思えないクスクス笑いで返事をします。
selfcare.sparkler_burn=花火が火花を撒き散らします。ひとつが袖と尊厳に着地しました。 || ちょっと熱心に振りすぎました。火花も振り返してきます。 || 手の中で、とても小さくて失礼なシューッという音を立てて消えます。
selfcare.smoke_in_eyes=風向きが変わり、どこに座っても煙がついてきます。目は火を一生許しません。 || 腰を落ち着けると、煙も一緒に落ち着きます。咳が始まります。 || 火は温かく、煙は温かくありません。火のまわりを3回移動しても、煙はついてきます。
selfcare.stubbed_toe=思い切り蹴ります。物は気にしませんが、つま先は気にします。 || 物に怒りをぶつけるのは、一瞬だけ最高です。そのあと、つま先がズキズキします。 || 物の勝ちです。足とプライドを抱えて、ぴょんぴょん跳ね回ります。
selfcare.sunburn=日なたでうとうとします。夕方には、誰も頼んでいない輝き方をしています。 || 日焼け止めを塗り忘れた箇所があります。今、その箇所はとても真っ赤です。 || 日差しが多すぎて、分別が足りませんでした。肌が苦情を出します。
selfcare.hammock_flip=ハンモックがひっくり返り、あなたも砂の上にひっくり返ります。 || とても優雅に横になり、あまり優雅でなく起き上がります。 || サンベッドには、座り方に意見があります。サンベッドの勝ちです。
selfcare.smoky_flue=煙道が閉まっていて、リビングが燻されます。咳き込みながら一番近い窓にたどり着きます。 || 火はくすぶり、煙は煙突以外のあらゆる場所に行きます。目がしみます。 || 火をつけると煙が出ます。あおぐと、もっと煙が出ます。
selfcare.backfire_soot=暖炉がすすの火の玉を、あなたの真正面に咳き出します。今や、とてもお祭りらしい黒色です。 || ボワッ! 火花と灰が爆ぜ、焦げて見えるのは暖炉のラグだけではありません。 || 火がドンと点き、煙突から這い出したような姿になります。
selfcare.ash_cloud=火を消したら、灰が大きな灰色の雲になって舞い上がります。威厳を保って手で払います。 || 最後の燃えさしがすねて、灰の煙を顔面に吹きかけます。 || 火は消えました。ヘアスタイルも消えました。
selfcare.burnt_fingers=手をちょっと近づけすぎました。火が礼儀正しく指先を焦がします。 || 温かい手、熱い手、そして超速い手。 || 火は、1メートル離れたところのほうが親切でした。
selfcare.blessing=魔法の粉が温かい金色の光に咲きます。一瞬、すべてを同時に感じます。休まって、満たされて、清らかで、軽い。火は微笑んでいます。たぶん。 || 炎は日の出の色に変わり、あなたを包みます。消えるころには、痛みも不安も病気もすべて消えています。 || 金色の火花がやわらかく降り注ぎ、世界がまた筋が通ります。治って、元気になって、静かにうれしい気持ちです。
selfcare.fail=自分との時間は、ベストとは言えませんでした。
games.bonus=堂々の勝利です。気分は最高で、頭も冴えています。 || いいプレイでした。ささやかな勝利のダンスをしましょう。
games.crit_success=パーフェクトです。誰もいない観客が歓声をあげ、それでもチャンピオンの気分です。 || 完璧な精度です。マシンも感心した顔をしています。 || 今日はゲームがあなたの思いのままです。なんて快感でしょう。
games.soft_fail=負けましたが、楽しめるくらいの接戦でした。 || 今日はダメでした。次のラウンドに期待です。 || 惜しくも届きませんでした。誰も見ていないので、ノーカンです。
games.crit_fail=豪快な敗北です。別の街への引っ越しを検討します。 || 起こりうるすべてが、最も恥ずかしい順番で起こります。
games.so_close=惜しい。もうほんの少しで手に入りました。 || 髪の毛一本の差で外れました。髪の毛は感心していません。
games.sore_loser=負けて、しかも潔くありません。いくつか言葉が飛び出します。 || マシンのせい、ラグのせい、ちょっとした風のせいにします。
games.claw_empty=アームは何もつかまず、ぬいぐるみがニヤつきます。コインが数枚消えました。 || 完璧に狙いを定めます。アームは離してしまいます。もちろんです。
games.dart_stray=ダーツは的を通り過ぎ、壁に刺さりました。誰も何も見ていません。 || ブルズアイを狙いました。ダーツは床を狙いました。
games.gutter_ball=ボールがゆっくりとガターに転がります。最後まで見届けます。 || レーンが1メートル左なら完璧な一投でした。
games.air_ball=ボールはリングも、ボードも、尊厳もすべて外します。 || 撃って、外して、ボールは探したくない場所へ跳ねていきます。
games.button_mash=全部のボタンを同時に連打します。キャラは変な動きをして即負けます。 || コントローラーが反撃してきます。負けも反撃してきます。
games.eats_coins=マシンはコインを取って、返してくれません。悪びれません。 || 筐体はお礼もなくコインを食べます。始める前から「ゲームオーバー」の表示です。
games.wild_throw=ボールは缶を越え、屋台を越え、もう少しで海に入りそうです。 || 自信満々で投げます。缶はまったく動きません。 || 素晴らしい投球でしたが、まったく別の場所に飛びました。
games.seesaw_bonk=シーソーがはずんで、あごにゴツンと当たります。 || 小さな馬にちょっと強く乗ったら、反撃されました。
games.arcade_win=マシンが払い出し、コインが数枚手に落ちます。 || ささやかな景品に、大きなニコニコ顔です。
games.jackpot=ライトが点滅し、ベルが鳴り、コインがあふれ出ます。こんなに運がいいと感じたことはありません。 || ジャックポットです! ゲーセン中が振り向きます。
games.fail=このラウンドはゲームの勝ちです。
photo.bonus=ピントはシャープで、光は最高、{t}も完璧です。残しておきたい一枚です。 || 澄んだ温かい写真に、すてきな笑顔です。プリントしたくなります。 || 完璧な構図と完璧なタイミング。写真はその場の空気をそのまま捉えました。
photo.crit_success=額に入れたくなるほどの写真です。{t}はコピーと、バックアップ用にもう1枚欲しがります。 || 雑誌クオリティの一枚です。{t}とあなたは画面を見つめます。 || やらせに見えるほど完璧な瞬間を捉えました。写真の神様も認めています。
photo.soft_fail=写真はイマイチですが、一応撮れました。あとでもう一枚撮ると言います。 || 平凡な一枚です。{t}は「いいんじゃない」と言いますが、半分だけ本気です。 || 写真ではあります。何が写っているかはわかります。それだけです。
photo.crit_fail=考えうる限りすべてがひどい写真です。{t}は絶対に見せないでほしいと主張します。 || 写真と照明と雰囲気を同時に台無しにしました。失敗の傑作です。 || カメラが誤作動し、フラッシュが変に光って、写真は呪われました。{t}は削除を求めます。
photo.blurry=シャッターを押したら、写真全体がにじんで出ます。{t}は真顔で「アートだね」と言います。 || 心霊写真のようなブレ具合です。{t}は、手をもっと安定させてもう一度撮ることを提案します。 || とてもブレた「何か」の完璧な写真が撮れました。{t}は礼儀正しく「味がある」と言います。
photo.blink={t}のまばたきの瞬間を捉えました。写真だと夢の中のように見えます。 || フラッシュが光り、{t}は最悪のタイミングでまばたきします。目を閉じた素敵なポートレートです。 || カシャ。写真の{t}は半分寝ているようです。削除を、きっぱりと求められます。
photo.finger=指がレンズの半分をふさぎ、写真の主役はあなたの指です。 || 完璧に構図を決めたのに、写っているのはほぼ親指です。ライティング抜群の親指です。 || 写真には{t}と素敵な背景と、隅っこのピンクのぼやけ、つまりあなたが写っています。
photo.phone_drop=自撮りはうまくいっていましたが、スマホが手から滑り落ちます。{t}は、ガシャンという音にビクッとします。 || 完璧な角度を狙って伸ばしたら、スマホが手から飛び出します。自撮りは床になりました。 || 自撮りの途中で、スマホが小さくダイブします。{t}はスマホを見て、あなたを見て、何も言いません。
photo.camera_shy={t}はカメラが出た途端に顔を隠します。写真には手と、そこにない笑顔だけ。 || カメラを構えると、{t}は恥ずかしがります。写っているのは半分の顔と大きな後悔です。 || {t}はギリギリでフレームから消えます。あなたの写真は、壁の完璧な一枚です。
photo.viral_pic=撮った写真がバズりました。あるページが${m}で権利を買い取ります。{t}はクレジットを要求します。 || ネットで誰かがあなたの写真を気に入り、使用料として${m}を送ってきます。スマホのカメラがランチ代を稼ぎました。 || 写真を投稿したら大炎上、いえ大バズりです。あるブランドが${m}を払い、{t}は分け前を欲しがります。
tv.bonus=ぴったりの番組に当たりました。今日はいい日です。 || チャンネルがまさに好みです。純粋なテレビの魔法です。
tv.crit_success=テレビがくっきり鮮明に映ります。アンテナまで拍手しています。
tv.soft_fail=映像はぼやけていますが、横をバシッと叩いて何とかなりました。
tv.fire=テレビがシューッと鳴り、パチンと弾け、自分に火をつけました。こんなにホットな配信は初めてです。 || テレビの背面から煙が立ち、そのまま全体が燃えます。リモコン一つでは荷が重かったようです。 || ボタンを押すと、テレビは炎で答えます。評価は賛否両論です。
tv.shock_break=電源ボタンを押します。テレビはパチンと弾け、プシュッと鳴って煙とともに息絶え、残った電流がそれでもあなたを襲います。 || バン、閃光、そしてテレビは完全に真っ暗になります。感電は、とどめの追い打ちです。 || リモコンを押すと、テレビ全体が人生をあきらめ、あなたの髪型のご機嫌も道連れにします。
tv.shock=リモコンを握ったら、飛び出た配線に気づいていませんでした。いい感じにビリビリ来ます。電池ってこんなに強力だったっけ?! || テレビをつけたら、古い機械が噛みついてきます。髪が逆立ち、魂が一瞬体から抜けます。 || テレビがパチパチ火花を散らし、あなたを新しいアンテナと決めました。ビリビリビリ! || 電源ボタンを押します。テレビも押し返します。強めに。
tv.fire_safe=テレビがポンと小さく鳴り、静かになります。ただの小さな火花でよかった... || 画面の裏で何かがバンと鳴ります。とても小さくて、とても大げさです。テレビはとても恥ずかしそうです。 || 短いポンという音のあと、静寂。もっとひどいことにならなくてよかったです。
tv.pass=テレビがパッと点きます。プライムタイムの始まりです。
shower.bonus=お湯がちょうどいい具合に当たります。給湯器がギブアップするまでここにいられそうです。 || 最高のシャワーです。生まれ変わったゾイのような気分で出てきます。
shower.crit_success=人生最高のシャワーです。湯気、完璧な水圧、そして録音したくなる歌まで出ます。
shower.soft_fail=お湯は少しぬるいですが、がんばって乗り切ります。
shower.crit_fail=足を踏み入れたら、混合栓が裏切ります。冷たいどころか氷河です。魂が排水口から抜けていきます。 || 配管がうなり、水は北極の冷たさに変わり、自分にあると知らなかった高音で叫びます。
shower.fail=シャワーを浴びますが、混合栓が故障して凍える冷たさです! 明日きっと後悔します。 || お湯は温かく始まり、意地悪にも氷に変わります。震えながら飛び出します。
shower.pass=ごく普通のシャワーです。何も爆発せず、何も凍りません。
housework.bonus=ピカピカです! 部屋は輝き、気分も輝いています。 || 今日は掃除が不思議と気持ちいいです。家中できそうです。
housework.crit_success=部屋はモデルルームのように輝きます。ホコリのかたまりまで拍手しています。
housework.soft_fail=ちょっとスジが残り、不満もたっぷりですが、仕事は終わります。
housework.crit_fail=水浸し、すってんころりん、機械の故障が一度に起こります。ここまで徹底的に失敗するには才能が要ります。
housework.slip=さっきモップがけした濡れた場所を踏みます。床の勝ちで、フィギュアスケーターのように回ります。 || 掃除は順調でしたが、足が石けんの水たまりに触れます。ウィーーー…ドスン。
housework.frustrated=ごしごし、ほうきでサッサッ、ため息。ゴミは意地悪で生え戻ります。 || 一か所きれいにするたび、新しい汚れが二か所現れます。もう平静を装うのはやめました。
housework.water_break=蛇口をあと一回ひねったところで、パイプがあきらめます。水があふれ、シンクは再起不能です。 || 怪しいシューッという音、ポンという音、そして噴水。配管は辞職し、床は湖になりました。
housework.break=機械をいじったら、中でガチャンと音がします。そのあと静寂。最高です。 || 間違ったところを押して、家電は悲しいウィーンという音とともに息絶えます。
housework.messy=なぜかモップが床より汚くて、すべてがさらに散らかりました。どこもかしこも汚れだらけ! || つかんだスポンジは、どうやらホコリの農場でした。今や部屋は1987年から誰も来ていないかのようです。 || はたきを振ったら、部屋がもっとホコリっぽくなりました。物理学にも疑問があります。あなたにもです。 || 掃除機が、今まで飲み込んだすべてを吐き出します。おめでとう、逆掃除を発明しました。 || 雑巾を絞ったら、なぜかホコリの雨が降ります。棚も床も全部です。クモの巣まで苦情を出しました。 || ほうきがくしゃみをしました。部屋全体がホコリの嵐です。掃除は間違いでした。
housework.sigh=家事の山を前にため息をつきます。家事の山は気にしません。 || もっと汚いものは必ずあります。自由時間の死を少し悼みます。
housework.dust_allergy=何年も待っていたホコリの雲を巻き上げます。ハクション。鼻が苦情を出します。 || ほうきが、ありとあらゆるホコリの塊を起こします。耳がキーンとなるまでくしゃみが出ます。 || 古いホコリの雲が鼻を直撃します。自分の掃除に、正式にアレルギーになりました。
housework.clean_house=掃除パワーがほとばしり、一気に家中がピカピカになります。ホコリ一つ生き残れません。 || 完璧な掃除のリズムに乗ります。どの面も床もピカピカです。この人は誰? || 何かがハマります。ホコリのかたまりごと、栄光のひと掃きで家全体を片付けます。
repair.crit_success=何かがハマります。ここの壊れたものが全部一気に息を吹き返し、修理の伝説のように立ち去ります。 || 手が勝手に動きます。道具を置くころには、ここに壊れたものは残っていません。ヒーローの所業です。 || 完璧な修理、また一つ、そして全部。周りの壊れたものがすべて復活し、工具箱が拍手します。
repair.soft_fail=修理はほぼ成功です。ほぼ。一歩下がると、それは肩をすくめます。 || 締めて、ひねって、試します。まだ動きません。ちょっと気を悪くしているようにも見えます。 || 惜しいけれど違います。その物は、もう少し壊れたままでいることにしたようです。
repair.shock=間違った配線に触れて、機械がとても強い意見を返してきます。髪が拍手のように逆立ちます。 || ビリッ! 修理は火花と悲鳴と焦げた髪のにおいで終わります。 || 説明書には「まず電源を抜く」とありました。その一行は、火花のあとに読みました。
repair.sparks=中で何かがパチッと弾け、プシュッと音を立て、煙がもわっと出ます。とても慎重な顔で一歩下がります。 || 火花のシャワー、焦げたにおい、長い沈黙。何も見なかったことにします。 || 機械はうなり、一度火花を散らして、あきらめます。このラウンドは誰の負けか、わかりません。
repair.flood=パイプをもう一本緩めたところで、水がパーティーに参加します。床は池になりました。 || レンチが滑り、パイプが外れ、噴水が誕生します。ザバーン。 || 小さな水漏れが、小さくない問題になります。床は濡れ、あなたも濡れます。
repair.soaked=水が顔面を直撃します。今や正式に配管の一部です。 || パイプが横に噴射し、全部を浴びます。おめでとう、とてもきれいになって、とても冷たいです。 || 間違ったバルブを回して、無料のシャワーです。もちろん服は着たままです。
repair.fumble=このラウンドはドライバーの勝ちです。全部を落として、いくつか言葉をこぼします。 || 工具を1秒置いたら消えました。物は壊れたままで、堪忍袋は壊れそうです。 || 触るネジが全部転がっていきます。物は壊れたまま、あなたはイライラしたままです。
repair.wrong_part=自信満々で、違う部品を直します。正しい部品は壊れたままで、あなたは疲れました。 || 交換不要な部品を交換しました。本当の問題が、隅っこから手を振っています。 || 直りました! まあ、何かは。壊れていたものではありませんが。
repair.thumb=ハンマーが親指に出会います。親指は正式に苦情を出します。 || ちょっとした手元の狂いで、大きな「痛い」。手を押さえて、何もなかったふりをします。 || 狙ったところにきっちり当たりました。ただし、自分の指でした。
repair.flood_safe=パイプが小さな水たまりを吐き出し、考え直して止まります。床は濡れ、靴も濡れ、プライドは乾いたままです。 || 少しの水がこっそり出て、水たまりになります。モップで片付く程度ですが、それでもじっと見つめてしまいます。 || パイプが少しの水を床にゲップします。ただの水たまりですが、自分の水たまりです。
repair.repair_all=何かがハマります。ここの壊れたものが全部一気に息を吹き返し、修理の伝説のように立ち去ります。 || 手が勝手に動きます。道具を置くころには、ここに壊れたものは残っていません。ヒーローの所業です。 || 完璧な修理、また一つ、そして全部。周りの壊れたものがすべて復活し、工具箱が拍手します。
repair.shock_death=機械の中に手を伸ばすと…まばゆい閃光が、最後に見たものでした。おしまい。 || ビリッ。照明がちらつき、倒れ、修理マニュアルは静かに自分で閉じます。エンドロール。 || 間違った配線を、間違った瞬間に。しばらくの間は、立派な修理屋でした。おしまい。
laundry.bonus=服はふんわり温かく、春の草原の香りで仕上がります。たたむのも楽しいくらいです。 || 完璧な洗濯です。靴下はすべてペアがそろい、ピンク色のものは一つもありません。 || 洗濯物は染み一つなく、完璧に乾いています。洗濯のプロになった気分です。
laundry.crit_success=洗濯の完成形です。白は白く、色は鮮やかで、ホテルのようにたためます。 || 洗濯が終わり、服は新品同様です。近くで聖歌隊がハミングしています。 || 汚れはすべて消え、靴下はすべてそろい、シャツはパリッとしています。洗濯の神様も満足です。
laundry.soft_fail=洗濯物はちょっとシワシワで少し湿っていますが、着られます。 || いくつかの染みは洗濯を生き延びました。それは個性だと決めます。 || スタートを押して、祈って、服はだいたい大丈夫に仕上がりました。
laundry.crit_fail=縮んで、ピンクで、水浸しで、靴下は片方なし。洗濯事故の傑作です。 || 洗濯機は水漏れし、シャツは縮み、赤い靴下がまた暴れます。カオス部門のメダルを獲得です。 || 泡の洪水、台無しのワードローブ、行方不明の靴下が一回の洗濯で揃います。ある意味、見事です。
laundry.shrunk=お気に入りのセーターをお湯で洗いました。今では、とても小さなクマ用です。 || ラベルには水洗いと書いてありました。洗濯のあとに読みました。シャツはクロップド丈になりました。 || 洗濯機を開けてジーンズを取り出します。人形サイズになっています。洗濯機はドヤ顔です。
laundry.pink=赤い靴下1枚が白物にこっそり混ざりました。持っているものが全部ピンクです。 || 真っ白なシャツがほしかったのに、バラ色の夕焼けと仕分けの教訓が手に入りました。 || 洗濯物は一色に仕上がりました。サーモンピンクです。ワードローブは大胆な新時代に突入です。
laundry.lost_sock=靴下を2回数えます。1枚が、また洗濯機の隠れた次元に消えました。 || 靴下7枚が入って、6枚が出ます。洗濯機はコレクションしています。 || ドラムの中から、ひとりぼっちの靴下が見つめ返します。ペアは永遠に消えました。
laundry.slip=洗濯機から続く泡の跡を踏みます。床の勝ちで、フィギュアスケーターのように回ります。 || 石けん水の水たまりが靴下を待ち伏せします。ウィーー…ドスン。 || かごを持ったまま、濡れた場所に突入します。洗濯物は飛び、あなたも飛びます。
laundry.flood=ホースが外れ、洗濯機が床を水浸しにします。立っているのは、とてもきれいな湖の中です。 || 洗剤が多すぎて、判断が足りませんでした。泡の波が部屋を占領し、洗濯機はあきらめます。 || ゴボゴボという大きな音、バン、そして石けん水の噴水。洗濯室はプールになりました。
laundry.break=押してはいけないボタンを押しました。洗濯機はうなり、暗くなります。 || 中でガチャン、ガタガタ、そして停止。ドラムは途中で止まり、あなたの気分も止まります。 || 洗濯機は震え、少し煙を出して息絶えます。楽しい思い出をありがとう。
laundry.burnout=洗濯機は悲鳴をあげ、火花を散らし、煙をまとった小さな炎を出して力尽きます。洗濯の日は中止です。 || 煙、火花、そして背面からの短い炎。いい洗濯機でした。古い洗濯機でした。 || 中が過熱し、洗濯機は煙とともに消えます。服はお預けです。
laundry.laundry_cash=洗濯物を確認すると、古いズボンのポケットに${m}が折りたたまれていました。洗濯機が紙吹雪に変える1秒前です。 || 空っぽだと誓ったジーンズに、くしゃくしゃの${m}がありました。洗濯機はジーンズを、あなたは現金を手に入れます。 || 洗濯前にポケットを全部叩いて、大当たりです: ${m}。過去の自分は天才でした。今の自分はお金持ちです。 || 謎が解けました。${m}はここに消えていたのです。ずっとズボンの中に隠れていました。 || 脱水が始まる直前に、ポケットから${m}を見つけました。洗濯機は取り損ねてがっかりしているようです。
laundry.flood_safe=洗濯機がガタガタ鳴り、ほこりの雲を咳き出して止まります。ホコリのかたまりが足元に転がって止まります。 || ガチャンという大きな音、悲しいブスブスという音、そしてドラムが静かになります。靴の横に小さなホコリがふわっと落ちます。 || 洗濯が詰まり、洗濯機は灰色のホコリを一息ゲップします。床に小さなホコリのかたまりが落ち、責められるのはあなたです。
cooking.bonus=いい香りです。味見して、テレビのシェフのようにうなずきます。 || ほんの少しの幸運で、料理は完璧に仕上がります。
cooking.crit_success=傑作です。レストランが頭を下げてでも欲しがるレシピです。
cooking.soft_fail=写真とはまったく違う見た目ですが、食べられます。たぶん。
cooking.crit_fail=煙、火花、そして混乱するコック。今日は台所事故の新しいレベルを発明しました。
cooking.burn=熱いフライパンを素手で堂々とつかみます。フライパンは同意しません。手をあおぎながらぴょんぴょん跳ねます。 || 蒸気にやられ、フライパンにもやられます。料理は危険なものなんですね。
cooking.food_poison=料理は怪しいにおいで、怪しい味で、おなかが復讐ツアーを計画し始めます。 || 自信満々で、衛生ゼロで料理しました。おなかが後ほど感想を送ってきます。
cooking.mess=天井に小麦粉、壁にソース、そして煙を出すフライパン。レシピのどこで間違えたのでしょう? || 台所は戦場のようです。負傷者は自分だけです。
cooking.fire=1秒目を離した隙に、フライパンから火が出ます。台所があなたの料理に意見を持っています。 || 炎です! コンロはクリエイティブになることにして、あなたはまったく準備できていません。 || 油が野心を燃やし、炎が高くなり、夕食は正式に火災の危険物になります。逃げて!
cooking.explosion=オーブンから、オーブンが出してはいけない音がします。そのあと、もっと大きい音。夕食は事件現場になりました。 || 中にあったのは、加熱してはいけないものでした。台所は大きなバンで答えます。 || スタートを押すと、オーブンは考え込み、そして花火のように爆発します。
cooking.appliance_break=ボタンを押すと、機械はバンと鳴ってから死にます。夕食はテイクアウトです。 || オーブンの中で何かが火花を散らします。謝ろうと振り向いたときには、もう手遅れです。
cooking.takeout=夕食は絶望的なので、テイクアウトを注文します。すぐ届いて、${m}かかります。料理は旅です。 || 敗北を認めてピザ屋に電話します。${m}後には、みんな幸せです。 || 火災報知器が検討中なので、デリバリーにします。合計: ${m}。
cooking.explosion_safe=オーブンが小さくバンと鳴って、静かになります。スパイスだったことにします。 || 小さなバンと、ずいぶん芝居がかったオーブン。誰もケガせず、ただ気分を害しただけです。 || オーブンが一度、大きくポンと鳴ります。小さな爆発でよかったです。
cooking.fire_safe=フライパンが爆竹のようにポンと鳴り、悲鳴が出て、そのあとすべてが静まります。ただの小さなポンでよかった... || コンロが小さなバンを咳き出し、考え直して止まります。ただの小さなバンでよかった... || 小さなポン、何もない煙、そして、行われなかったバーベキューのにおいが漂う台所。
dining.bonus=冷蔵庫に、まさに食べたかったものがあって、見た目以上においしいです。ささやかな勝利です。 || 完璧な温度に、完璧な量。大事な用事があるかのように食べます。 || ひと口ごとにヒットします。お皿もパンくず一つ残さず完食します。
dining.crit_success=拍手に値する食事です。お皿をなめても誰にも止められません。 || シェフなら泣きます。あなたはただ食べるだけ。純粋な喜びです。 || 今週最高のひと口です。目を閉じて、しばらくそのままです。
dining.soft_fail=ちょっとこぼして、ちょっと「おっと」。テーブルを拭いて、なかったことにします。 || 食べ物は少し味が落ちますが、それでも完食します。プライドはソースです。 || 落としそうになって、キャッチして、計画通りのようにうなずきます。
dining.crit_fail=お皿を自信満々に運び、次に慌てて運び、最後には運べなくなります。食事は床に、あなたも床に。 || ボウルが飛び出し、スープが床を占領します。あなたも床を占領します。ランチはもう笑い話です。 || くしゃみ、こぼれ、最悪の着地。食事とプライドがそこらじゅうに散らばります。
dining.spill=ボウルが傾き、夕食が床に落ちます。なぜか床はもともとホコリっぽく、今や現場です。 || 食事を半分落とし、パンくずとホコリの雲が立ち上ります。台所は不機嫌です。 || ぎこちなく傾き、ガチャンと音がして、床に散らかりが広がります。片付けはあとです。
dining.burnt_tongue=冷める前にかぶりつきます。舌が苦情を出し、目も苦情を出します。 || 熱すぎて、速すぎました。とても小さなドラゴンのように口をあおぎます。 || ひと口目は溶岩です。ふた口目は悪い考えです。それでも食べます。
dining.choke=ひと口が変なところに入ります。咳き込み、ゼーゼー言い、とても威厳のあるうなずきで復活します。 || 食事を半分吸い込み、一部が出たがっています。水、今すぐ。 || 激しい咳、少しの涙、そしてサムズアップ。大丈夫です。お皿はあなたを見下しています。
dining.food_coma=お皿の半分で、もう今日は終わりです。まぶたが最初にギブアップします。 || 重い食事、重いため息、そして何もない場所を長く見つめます。昼寝が手招きしています。 || 食べ物は最高でした。体は今、メンテナンスのためオフラインです。
dining.bad_leftovers=その残り物は普通のにおいでした。それは残り物がつく嘘です。おなかが異議を唱え始めます。 || 冷蔵庫の奥にあったものを食べます。冷蔵庫は警告しようとしていました。 || 見た目もよく、味もよかったです。おなかは別の意見を持っています。
dining.machine_eats_coin=自販機はコインを取って、堂々と何も出しません。 || ボタンを押します。機械はうなり、考え込み、お金を持っていきます。
dining.fountain_splash=水が思ったより高く跳ねます。シャツは噴水の一部になりました。 || ひと口飲もうと身を乗り出したら、顔に冷たい水を浴びました。
programming.bonus=コードが一発でコンパイルできます。怪しいですが、ありがたいです。 || エレガントな解法が見つかり、魔法使いになった気分です。
programming.crit_success=完璧なコード、バグゼロ、そして誰もいない部屋からのスタンディングオベーションです。
programming.soft_fail=だいたい動きます。警告は将来の自分の問題です。
programming.crit_fail=消してはいけないものを rm -rf して、ハードウェアまで道連れになります。システム全面崩壊です。
programming.stress=コードは5回目でコンパイルでき、6回目で壊れます。目がリズムに合わせてピクピクします。 || セミコロン一つの抜けで、1時間を失います。コーヒー、いかがですか?
programming.frustrated=1分前まではすべて動いていました。何も触っていません。絶対です。 || バグが消えて、戻ってきて、また別の場所に現れます。机をバンと叩きます。
programming.shock_break=パンという音、閃光、そしてパソコンは煙とともに真っ暗になります。感電は、とどめの追い打ちです。 || エンターを押すと、マシンが殴り返してきます。文字通り、火花が飛びます。
programming.crash=画面が青くなり、黒くなり、そして死にます。保存していない作業も一緒に消えます。 || パソコンは小さくため息をついて終了します。もう限界でした。
programming.hack=自分のソフトはハッキング不可能だと断言していました。ハッカーがそれを覆し、銀行口座から${m}を引き出しました。メモには「ヒントをありがとう」とあります。 || 超安全なパスワードは「password1」でした。コーヒーを飲み終える前に、誰かが口座から${m}を抜き取りました。 || 閉め忘れたバックドアを見知らぬ人が見つけ、${m}を頂戴しました。過去の自分との見事な連携プレーです。
programming.bounty=有名アプリの重大なバグを見つけて、丁寧に報告します。報奨金は${m}です。最初から計画通りだったふりをします。 || あなたのプルリクが、何年も誰も直せなかった問題を直します。メンテナーは${m}と、とても長いお礼を送ってきます。 || ある会社があなたのきれいな脆弱性レポートを読み、${m}を振り込みます。パーカーは良い投資でした。
programming.freelance=クライアントが、ちょっとした頼みごとに${m}を支払います。10分で終わり、経験3年分の仕事でした。 || 見知らぬ人のサイトをチャットで直すと、${m}を送ると言って聞きません。断る理由はありません。 || ちょっとした副業が受信箱に届き、すぐ後ろから${m}が口座に届きます。
logic.bonus=パズルのピースがハマります。ちゃんと賢くなった気分です。 || 誰よりも先に、議論の欠陥に気づきます。静かな、ドヤ顔の喜びです。 || 事実、論理、そして本当に筋の通った結論。気持ちいいです。
logic.crit_success=すべての質問に答え、すべての引っかけを見抜きます。授業ができそうです。 || パズルは紙のように折りたたまれます。椅子にもたれると、椅子が敬意を込めてきしみます。 || 最初から最後まで、完璧な推論の流れです。実にお見事です。
logic.soft_fail=惜しいですが、論理にトラックが通れるほどの穴があります。 || もう少しでわかります。「もう少し」が大活躍しています。 || 答えは近くにあります。どこかは、はっきりわかりません。
logic.crit_fail=とても説得力のある議論を、とても間違った場所まで追いかけました。全面崩壊です。 || 3分前に信じていたことは、すべて間違いでした。今信じていることもです。 || 自信、大失敗、そして頭の完全リブート。ゼロからやり直しです。
logic.headache=タブが多すぎて、事実も多すぎます。頭がズキズキし始めます。 || 同じ段落を6回読んでも、いっこうに楽になりません。 || 目の奥の鈍い痛みが、今日はもう考えるのは十分だと告げます。
logic.rabbit_hole=リンクからリンクへ飛んで、頭の中は午前3時です。 || 簡単な質問から始めて、中世のチーズについて読んでいます。 || 調べものがおもしろくなりました。調べものがとても長くなりました。
logic.wrong_answer=あれほど自信がありました。答え合わせは、必要以上に優しいものでした。 || 自信満々で答えます。答えは、同じくらい自信満々で間違っています。 || 大胆な推測でしたが、大胆さのほうが正しさより上回りました。
logic.overthinking=質問について考えすぎて、何だったか忘れます。 || 分析すればするほど、意味がわからなくなります。皮肉にも、考えることは痛いです。 || 完璧な理論を組み立てたあと、最初の事実から間違っていたと気づきます。
logic.argument=あなたは論理を説明します。{t}はなぜ間違いか説明します。今や二人とも説明しています。 || 完璧な議論に、見えない穴がありました。{t}は気づいて、大声で黙ります。 || 頭の中では議論に勝ちました。口に出すと、{t}が一言で勝ちます。
logic.lost_thread=きれいな主張から始めて、文の途中で見失います。{t}は優しく、思い出すのを待ちます。 || 論理は途中で崩れます。{t}にまばたきして「何の話だっけ」と言います。 || 完璧な議論が、完璧に途中で止まります。{t}は筋が通っているかのようにうなずきます。
logic.pedantic={t}の細かい点を訂正します。{t}は、最後のクッキーを食べた人を見るような目で見ます。 || 厳密には、あなたが正しいです。{t}は、閉まったドアのようなエネルギーで見つめます。 || 誰も気にしないポイントを取りました。{t}は長く息を吸います。
logic.falls_asleep_reading=本はとても静かです。一度まばたきして、気づけば40ページ目で、頬に跡がついています。 || 3行読むと、文字が動き始めます。昼寝をしてしまいました。
logic.quiz_prize=司会者が言い終える前に最後の問題に答えます。賞金は${m}と、めったにない優越感です。 || 雑学の知識がついに報われました: ${m}。あの変な豆知識は投資でした。 || なぞなぞを記録的な速さで解き、ポップアップが${m}を払います。メンサにコメントは求められませんでした。
finance.bonus=数字がそろい、珍しく直感が当たります。静かなささやかな勝利です。 || チャートを本のように読めて、チャートも素直に動きます。とてもスムーズです。 || 賢い判断、安定した手、そして緑の画面。自分にうなずきます。
finance.crit_success=どの判断も的中します。市場はあなたが大好きで、あなたは謙虚なふりをします。 || 安く買って高く売り、なぜか全部狙い通りでした。伝説です。 || チャートは有利な方向に急上昇します。映画の悪役のようにノートパソコンを閉じます。
finance.soft_fail=世紀の大事件ではなく、ちょっと下がって目を凝らしただけです。 || トントンで、勉強になったと言います。とても退屈な勉強です。 || 市場は肩をすくめ、あなたも肩をすくめます。
finance.crit_fail=底で売って、天井で買うという、珍しいダブルをやってのけます。市場も気づきます。 || ひとつのクリックミスで、計画全部が赤くなります。胃がチャートと一緒に落ちます。 || チャートは急降下、しかも逆方向です。謝ってほしいかのように見つめます。
finance.bad_trade=これは自信がありました。チャートは大声で反対します。 || ヒントはとても自信満々の見知らぬ人から来ました。それが最初の間違いでした。 || ちょっと長く持ちすぎて、ちょっと売るのが遅すぎます。王道です。
finance.panic=ラインが落ち、心臓も一緒に落ちます。ページを9回更新します。 || 赤い数字だらけです。比喩的に、紙袋に息を吹き込みます。 || 手が売却ボタンの上で止まり、震えます。市場は待ってくれません。
finance.rage=礼儀正しいパソコンには聞かせられない言葉で、市場を罵ります。 || 机を叩いても、株価チャートは下がり続けます。失礼です。 || 拳と机が短い会議を開きます。机の勝ちです。
finance.glitch=取引サイトが最悪の瞬間にクラッシュします。パソコンもです。 || ポップアップ、回るマーク、そして固まった画面。市場があなたのセッションを人質に取りました。 || 機械は、あなたの悪い判断の重みに耐えかねて、あきらめます。
finance.scam=メッセージで、何かに当選したと知らされます。クリックします。${m}が急いで口座から出ていきます。 || とても親切な王子様が、ささやかなお願いをしてきました。そのお願いは${m}かかりました。 || 投資話はロゴつきで本物に見えました。ただのロゴでした。${m}は消えました。
finance.lottery_counterfeit=宝くじは偽物でした。店員はとても申し訳なさそうで、あなたは${m}の損です。 || 偽の宝くじ、陽気な笑顔、そして${m}が消えます。プリンターの笑い声が聞こえてきそうです。 || 数字は正しそうなのに、紙が怪しい。とても精巧な偽物で、${m}を失います。
finance.lottery_washed=宝くじがジーンズと一緒に洗濯されます。残ったのは灰色の紙吹雪と、失った${m}です。 || 乾燥機で宝くじを見つけます。今や小さな紙の玉です。賞金は受け取れず、宝くじは${m}でした。 || ポケット、洗濯機、そしてふやけた宝くじ。雨の日で、${m}の損です。
finance.lottery_old_draw=丸1分お祝いしてから、先週の抽選だと気づきます。宝くじは${m}で、プライドも同じ額だけ傷つきました。 || 数字は完璧です。残念ながら、日付が違います。とても高い授業料が${m}です。 || 大当たり、小さな注意書き、そしてポケットから${m}。抽選は先週でした。
finance.lottery_text_scam=賞品が当たったので、手数料を少し払うだけだとメッセージが来ます。手数料は${m}です。賞品は届きません。 || とてもフレンドリーなメッセージ、押してはいけなかったリンク、そして${m}が消えます。 || 「今すぐ賞品を受け取ろう!」受け取りました。${m}かかりました。
finance.card_swallowed=機械はカードを飲み込み、「幸運を祈る」と書かれたレシートを出します。 || 隠れた手数料が現れます。変わるかもしれないかのように見つめます。
finance.hidden_fee=気づかなかった小さな手数料が、お金をちょっとかじります。 || ああ、「利便性手数料」。誰かにとっては便利ですね。
finance.lottery_dud=削って、祈って、外れます。宝くじはとても高いしおりです。 || 数字が3つ合っています。6つのうち。そして、その3つではありません。
finance.lottery_jackpot=6つの数字、すべてあなたのものです。宝くじを3回読み、さらに1回声に出して読みます。賞金は${m}です。 || 数字が次々にそろい、宝くじが急に重く感じます。${m}が口座に入ります。 || ${m}が当たりました。落とし穴を探しても見つからず、とても責任感のあるパーティーを計画し始めます。
finance.lottery_lucky=ささやかな賞金: ${m}。人生は変わりませんが、もう1枚買うには十分です。 || 宝くじは${m}を払い戻します。これはサインだと言い張って、確率は礼儀正しく無視します。 || 数字が2つ合って、苦労賃に${m}です。宇宙がウィンクしています。
finance.dividends=忘れていた株が${m}を払ってくれます。過去の自分がよろしくと言っています。 || 小さな配当が届きます: ${m}。大した額ではありませんが、自分のものです。 || ポートフォリオが、お行儀のいい猫のように${m}を吐き出します。ありがたく受け取ります。
finance.lottery_soft=2つ数字が合い、1つは1桁違い、残りはかすりもしません。宝くじは希望の引き出しにしまわれます。 || 儀式のように丁寧に削ります。何もありません。念のため、もう一度削ります。 || ハズレです。宝くじは、とても小さくて礼儀正しい「次こそは」という音を出します。
gaming.bonus=堂々の勝利です。反射神経は冴え、分隊はおしゃべりで、ドロップは気前よく出ます。いい夜です。 || 作戦を出し、チームがついてきて、画面に「VICTORY」と出ます。椅子が少し回ります。 || すべてがハマります。エイム、タイミング、お菓子。あなたが主人公です。
gaming.crit_success=完璧なプレイです。チャットはスタンディングオベーション、あなたも、かろうじて立ち上がります。 || 誰も勝てないと思った試合に勝ちます。立ち上がって、ささやかなウイニングランをします。 || 1位、ノーデス、そして全員に送りたくなるクリップです。
gaming.soft_fail=ラウンドは落としましたが、冷静を保ちます。だいたい。 || 惜しい負けです。ラグのせいにして、次のラウンドを始めます。 || ベストでもワーストでもない試合です。コントローラーは無事です。
gaming.crit_fail=味方が抜け、ネットが落ち、電源まで落ちます。完璧なプレイの最中に画面が真っ暗です。 || キレすぎて、キーボードが接近禁止命令を申請します。試合は負け、おまけつきです。 || 抜けて、再戦して、負けて、抜けて。どこかでコントローラーが飛びます。誰も誇れません。
gaming.rage_quit=明らかにゲームのせいのバグで負けます。とても冷静です。まったく冷静ではありません。 || 勝利まであと5分のところで、ポップアップが現れて試合が終わります。言葉が漏れます。 || ラスボスに9回目のワンパンを食らいます。椅子があなたの怒りを受け止めます。
gaming.burnout=3時間もやって、目は乾き、親指は痛みます。休憩したほうがいいかもしれません。 || あと1試合と約束しました。それは6試合前でした。腰が苦情を出します。 || ゲームはまだ続きます。あなたは続きません。長いため息と長いストレッチです。
gaming.crash=ゲームがフリーズし、ファンが悲鳴をあげ、画面が真っ暗になります。パソコンは、あなたのゲームにもう限界です。 || タブが多すぎ、MODも多すぎ、ボス戦もあと一回多すぎます。マシンがあきらめます。 || ケースから大きなポンという音がして、静寂。セーブデータはあの世のどこかです。
gaming.pc_fire=PCのファンが悲鳴をあげ、ケースから炎が飛び出し、すべてが暗くなります。セーブデータは頑張りました。 || 煙、小さな炎、そして死んだパソコン。どのみち買い替え時だったかもしれません。 || グラフィックボードが暴力を選びました。炎、そして黒い画面。誰もあなたを責めません。全員があなたを責めます。
gaming.microtransaction=ピカピカのボタンを押して、何が起こるか見ます。起こったのは${m}の課金でした。剣は帽子でした。 || ガチャが花火とともに開き、${m}が引き落とされます。中身は、とても小さなトロフィーです。 || ゲームが期間限定のスターターパックを提案します。その期間は今、価格は${m}でした。
gaming.tournament=体力1の状態で最終ラウンドを逆転します。賞金は${m}です。とても静かな部屋で叫びます。 || 小さなオンライン大会、小さな賞、大きな自信アップ: ${m}があなたのものです。 || チームが勝ち、全員がボイスチャットで叫びます。賞金は${m}で、試合の内容は何も覚えていません。
gaming.stream_tips=配信を見ていた誰かが${m}と「ナイスプレイ」のメッセージを送ってくれます。どちらも嬉しいです。 || 視聴者がノリで${m}を投げてくれます。配信上で、2回お礼を言います。 || ごく少ない視聴者、${m}の投げ銭、そして明日も配信するのに十分な自信です。
media.bonus=カットが流れ、色が映え、ファイルはエラーなしで書き出されます。魔法です。 || 編集にリズムがあります。Bロールまで意図的に見えます。 || きれいなレンダリング、きれいなタイムライン、そしてドヤ顔のうなずきです。
media.crit_success=傑作の誕生です。とても静かな敬意を込めて保存を押します。 || 動画は本物の映画のようです。確認のために3回見直します。 || どのフレームも正しく、どのカットも完璧です。もう立派な作家です。
media.soft_fail=書き出せましたが、音声がほんの少しずれています。誰も気づきません。たぶん。 || 色が少しおかしく、カットも少し荒いです。ほぼ十分です。 || まずまずの出来です。最終結果は「要改善」と言っています。
media.crit_fail=ソフトが3時間分の作業を食べ、さらにプロジェクト全体を食べます。バックアップもありません。 || レンダリングを押すと、パソコンが殴り返してきます。火花、煙、そしてとても静かな部屋です。 || 書き出しがクラッシュし、ファイルが壊れ、タイムラインは後悔の地図です。
media.render_crash=レンダリングバーが99%に達し、マシンは永遠に眠りにつきます。 || パソコンはうるさくなり、熱くなり、そしてとても、とても静かになります。 || ファンが悲鳴をあげ、画面がちらつき、プロジェクトは炎の中で死にます。
media.corrupted=ファイルが開きません。9回試します。9回拒否されます。 || ひとつのクリックミスで、クリップが緑のノイズになります。 || プロジェクトは、とても小さくてとても壊れたファイルとして自己保存しました。
media.burnout=8時間編集しても、タイムラインは同じに見えます。目は時計に同意しません。 || 同じ2秒の映像を1時間見つめます。向こうも見つめ返してきます。 || 腰は「ノー」、目は「ノー」、タイムラインは「また明日」と言っています。
media.bad_take=完成版を見て顔をしかめます。少しずつ、すべてがうまくいきませんでした。 || 音は小さく、映像は暗く、ネタはスベっています。 || アイデアと動画の間のどこかで、アイデアが迷子になりました。
media.copyright=動画に著作権の申し立てが出ます。その曲は「たった5秒」でした。罰金は${m}です。 || スタジオが、「十分編集した」はずのクリップを見つけます。向こうの弁護士が${m}を請求してきます。 || 傑作は、有名な曲を無許可で使っていました。賠償金として${m}が出ていきます。
media.viral=動画が一夜でバズり、広告収益が届きます: ${m}。コメント欄には「1番乗り」。いつもです。 || 消しそうになったクリップがバズります。プラットフォームが${m}を送り、スマホは鳴りっぱなしです。 || 全員があなたの編集をシェアしています。あるブランドが${m}と、妙に温かいメールとともに滑り込んできます。
media.sponsor=小さなブランドがあなたのチャンネルを気に入り、隅のロゴが映えると言って${m}を送ってくれます。 || スポンサーが8秒間の紹介のために${m}を払います。あなたは9秒紹介します。 || 割引コードと、手間賃の${m}です。マーケティングは本当に効きます。
music.bonus=どこからともなくメロディーが現れ、自分の家のように座ります。いいですね。 || コードは、待っていたかのようにぴったりです。ビートは落ち着いていて確かです。 || フックを口ずさむと、自然にハマります。残しておく価値のある曲です。
music.crit_success=ヒット曲です。観客が一緒に歌う声が聞こえますが、その観客はあなた一人です。 || 曲は勝手に書かれ、勝手に演奏され、ちょっと泣けてきます。美しいです。 || 完璧なフック、完璧なビート、完璧な終わり方。本物の名曲です。
music.soft_fail=メロディーはいいけれど、残りはイマイチです。「下書き14」として保存します。 || まずまずの出だしと、とても未完成の中盤です。 || 曲はどこかへ行きます。ただ、いい場所ではありません。
music.crit_fail=トンネルの中でピアノの上を猫が歩いたような曲です。全員が耳をふさぎます。 || 誤ってセッションを丸ごと消します。静寂がとても勉強になります。 || 曲はひどく、さらになぜかもっとひどくなります。新記録です。
music.off_key=曲の残りが同意しない音を出します。大声で。 || Aメロとサビの間のどこかで、あなたに断りなく調が変わりました。 || 外れた音、長い間、そしてとても正直なしかめっ面です。
music.block=空のトラックを1時間見つめます。空のトラックの勝ちです。 || どのアイデアも、聞いたことのあるものに聞こえます。実際に聞いたことがあるからです。 || ひらめきは今日お休みで、書き置きもありません。
music.lost_file=プロジェクトが保存されずに閉じます。曲は風船のように飛んでいきます。 || クリックミスで、トラックの一番いい部分が消えます。いいところでした。 || セーブデータは空っぽでした。あなたの天才は、とても静かに消えました。
music.studio_bill=スタジオがちょっとしたセッションを予約してくれます。請求額は${m}で、座ったことのない椅子の料金までついています。 || 雰囲気のために、いいマイクを借ります。その雰囲気は${m}です。 || セッションミュージシャンが直前にキャンセルし、手付金を持っていきます: ${m}。ギターソロは、どのみち幻でした。
music.string_snaps=ギターの弦がバチンと切れて、顔をはじきます。痛いし、プライドも痛いです。 || 弦が、あってはならない形で「ビヨーン」と鳴ります。
music.dropped_stick=ドラムスティックが手から飛び出し、不運な場所に落ちます。 || ビートを刻みます。スティックは床を刻みます。ビートは消えました。
music.sticky_keys=鍵盤が抵抗します。どのコードも少し間違っていて、しかも自信満々です。 || 指が交差して、猫がキーボードを歩いたような音になります。
music.dj_scratch=スクラッチは大きくて、間違っていて、とても得意げです。 || 間違ったボタンを押して、曲がピタッと止まります。静寂が残酷です。
music.royalties=どこかのカフェであなたの曲が流れ、印税が届きます: ${m}。内なるロックスターが起き上がります。 || ある番組があなたのメロディーを使い、${m}を送ってきます。その日は残りずっと口ずさみます。 || ストリーミングの小切手に${m}が入っています。リスナーは数十人。もしかすると数百人。まあ、いとこかもしれません。
music.tips=友人がデモを気に入りすぎて、${m}を送ってくれます。芸術を応援しましょう。 || リスナーが「もっとお願い」というメッセージとともに${m}を送ります。すぐに応えます。 || 誰かが仮想の帽子に${m}を入れます。厳密には、それは帽子です。
performance.bonus=リズムが乗り移り、すべてのビートに合わせます。会場はあなたのものです。 || 生まれつきのように、ルーティンを滑らかにこなします。
performance.crit_success=観客1人のスタンディングオベーションです。それでも輝きます。
performance.soft_fail=1、2ステップ外しますが、ノリは保ちます。誰も気づきません。たぶん。
performance.crit_fail=滑って、回って、恥のしぶきの中に着地します。ビートさえも黙祷します。
performance.embarrassed=動きは大胆ですが、タイミングは大胆ではありません。ステップの途中で固まり、音楽が止まったふりをします。 || みんなが見ていますが、いい意味ではありません。ぎこちなく手を振って、ステージを降ります。
performance.stage_fright=スポットライトが当たり、足がすべてを忘れます。聞こえるのは自分の鼓動だけです。 || 一歩出ると、リズムは離れます。どこかで観客ゼロがあなたを審査しています。
performance.sad=誰も見ていないかのように踊って、実際に誰も見ていなかったと気づきます。静かなため息が出ます。 || 音楽が終わり、自信も終わります。また今度にしましょう。
performance.fined=近所の人が騒音の苦情を出し、市が${m}の罰金を科します。芸術には、いつも代償があります。 || 検査官が、あなたのパフォーマンスには許可が必要だと言います。その通りです。罰金は${m}です。 || 誰かがあなたのパフォーマンスを通報します。チケットは${m}で、ショーは魂の中で続きます。
performance.flat_note=最初の音は素敵です。2つ目はどこかへ行きました。{t}は微笑んで耐えます。 || 心を狙って、違う鍵を叩きました。{t}は礼儀正しく、努力を称えて拍手します。 || セレナーデが、犬がいたら吠えるような音を出します。{t}は勇敢にうなずきます。
performance.forgot_lyrics=曲の途中で歌詞を忘れます。{t}は手を組んで、やさしい表情で待ちます。 || 歌詞が頭から消えます。ハミングしてごまかし、わざとだったふりをします。 || サビで詰まります。{t}は微笑んで、次の歌詞を口パクで教えてくれます。
performance.too_loud={t}がびくっとするほど大声で歌います。近所にも聞こえたかもしれません。 || セレナーデは情熱的で、とにかく耳をつんざきます。{t}は礼儀正しく片耳をふさぎます。 || 音量は大きく、コントロールは足りません。{t}は曲が終わってほしいと思っていますが、優しくです。
performance.mic_feedback=マイクがハウリングで悲鳴をあげます。全員が耳をふさぎます。 || 耳をつんざく音、唖然とした沈黙、そして申し訳なさそうに手を振ります。
performance.joke_dies=オチが来ます。誰も笑いません。コオロギは笑いました。 || ジョークを完璧に披露します。観客は沈黙を披露します。
performance.cracked_voice=大事な音で声が裏返り、必要以上に長く続きます。 || 高音は大胆な発想でした。ゼーゼーで終わりました。
performance.knockout={t}がキレてパンチを繰り出しました。命中し、洗濯物の袋みたいに床に倒れます。 || 今のジョークが決定打でした。{t}が殴り、部屋が傾きます。気づくと天井を見ています。 || {t}は真っ赤になって、顔面にパンチを入れます。床に着く前に、あなたの尊厳は建物から出ていきました。
performance.fight={t}はもう限界です。ひと突き、大声ひとつ、気づけばケンカの真っ最中です。 || 今のは一線を越えました。{t}は身構えて、殴りかかってきます。 || {t}はとても根に持って、拳で答えることにしました。自業自得です。
performance.police={t}は堪忍袋の緒が切れて、もう電話をかけています。警察への届け出が届きそうです。 || {t}は一瞬あなたを見つめて「警察を呼びます」と言いました。かなり本気に聞こえます。 || 最悪の展開です。謝り終わる前に、{t}はあなたを通報しました。
performance.big_tip=通りすがりの人が帽子に${m}を入れて、何も言いません。沈黙が褒め言葉です。 || 観客が大盛り上がりし、見知らぬ人が${m}をチップにくれます。お辞儀して、2回数えます。 || スカウトは現れませんが、${m}は現れます。ありがたくいただきます。
performance.busking_tips=数枚のコインが、曲の終わりには${m}になります。誰かが拍手までしてくれました。 || 子どもが帽子に${m}を入れて走り去ります。小さな芸術の支援者です。 || 帽子が今朝より重いです: ${m}。ハトが拍手しています。
performance.knockout_death={t}のパンチが決まり、床に倒れて、そのまま目を覚ましません。おしまい。 || {t}の一撃。倒れ、部屋が静まり、もう立ち上がれません。エンドロール。 || {t}の一発のパンチ。それが、残念ながら人生で最後に気づいたものでした。おしまい。
dance.bonus=ビートが落ち、体はもう行き先を知っています。滑らかで、楽々で、ちょっとドヤ顔です。 || 振付師があなただけのために書いたかのように、すべての動きを決めます。 || 近くの誰かが手拍子を始めます。気づかないふりをして、ターンを足します。
dance.crit_success=純粋なリズムです。家具まで一緒に揺れているようです。 || あまりにきれいな動きに、自分で拍手しそうになります。 || 部屋が1秒静まり、そしてフィナーレを決めます。伝説の仲間入りです。
dance.soft_fail=1、2ステップ外しますが、ノリは保ちます。誰も気づきません。たぶん。 || ちょっとつまずき、素早くシャッフルして、振付だったかのように続けます。 || タイミングが数ビートずれ、そして戻ってきます。
dance.crit_fail=ターンに全力を注ぎ、床も勝利に全力を注ぎます。重力1点、あなた0点。 || 足は一方へ、残りの体は別の意見です。着地は優雅ではありません。 || 頭の中ではかっこいい動きでした。部屋はそれを見てしまい、忘れられません。
dance.puddle_slip=怪しい水たまりがダンスフロアで待っています。ターンで見つけます。 || 大技を繰り出し、足が水たまりを見つけ、残りは別種のダンスです。 || 誰もその水たまりに気づきませんでした。全員が、あなたがその中にいるのを見ることになります。
dance.embarrassed=動きは大胆ですが、タイミングは大胆ではありません。ステップの途中で固まり、曲が変わったふりをします。 || 決めのポーズをとると、曲はあなたを置いて進みます。 || 誰かが見ていますが、いい意味ではありません。ぎこちなく手を振って、アートだと言い張ります。
dance.exhausted=3曲目で、足が苦情を出します。もう終わりで、バッテリーも終わりです。 || 熱意はありました。スタミナは夜のお休みを取りました。 || 膝が声を上げるまで踊り、座って自分の選択を考えます。
dance.sad=誰も見ていないかのように踊って、実際に誰もいなかったと気づきます。静かなため息が出ます。 || 音楽が終わり、自信も終わります。また今度にしましょう。 || ダンスフロアは空っぽです。一瞬、あなたも空っぽです。
dance.stepped_on=落ちてくるピアノのような優雅さで{t}の足を踏みます。痛くないふりには努力が要ります。 || ダンスは3歩目までうまくいきます。{t}は片足でぴょんぴょん跳ね、だいたい笑ってごまかします。 || 左足が2本、あなたのも相手のも。{t}は「私のせい」と言いますが、二人とも違うとわかっています。
dance.dizzy=ターンが速すぎて、部屋が傾きます。{t}とあなたはもつれ合って、目が回りながら笑います。 || 回って、世界も回り続け、バランスを崩します。{t}が受け止めます、あるいは受け止めようとします。 || くるくる回って、地面が消えます。{t}はうめきながら、まだ離しません。
dance.dip_dropped=ディップが失敗して、{t}が腕から滑り落ちます。厳密には、優雅な転倒です。 || ディップに入ると、{t}は逆に傾き、床が二人とも受け止めます。重力とダンスです。 || ディップの途中で、握力があきらめます。{t}は床に落ちて、「いてっ」と2音節で言います。
dance.in_sync={t}とあなたは一つのように動きます。リズムがハマり、二人のあいだに温かさが生まれます。 || すべてのステップがそろいます。{t}は、やった甲斐があったと言いたげに微笑みます。 || 絶妙なタイミングのターン、共有の笑い。{t}とあなたは、始めたときより近づいてダンスを終えます。
dating.bonus=プロフィールがいい反応をもらい、面白い返信が来ます。悪くありません。 || チャットは弾み、ジョークは決まり、誰かがユーモアのセンスが好きだと言います。 || マッチして、笑って、期待できそうな予定です。画面を見て赤面します。
dating.crit_success=完璧なマッチ、最高のチャット、映画のようなデートの約束です。顔が輝いています。 || 3人が同時に返信してきて、みんな素敵です。うれしい悩みです。 || 写真もプロフィールもタイミングも完璧です。ネットはあなたが大好きです。
dating.soft_fail=礼儀正しい返信がいくつかあり、火花はありません。プロフィールを見直す必要があります。 || 誰かとマッチして、「こんにちは」のあとにチャットが途絶えます。 || アプリはいくつかの顔を見せてくれます。誰も手を振り返してくれません。
dating.crit_fail=違う人に、違うメッセージを、違う写真つきで送ります。すべて同時にです。 || マッチした人にプロフィールを通報されます。なぜか、あなたのせいです。 || 大惨事です: 名前の誤字、ぼやけた写真、そして「どちら様?」という返信。
dating.ghosted=チャットはとてもうまくいっていたのに、相手が消えました。さよならもなく。 || 入力中の点々が現れ、消え、二度と戻りません。それでも見つめてしまいます。 || メッセージは既読になり、そのままです。沈黙が耳に痛いです。
dating.catfish=写真は本人とまったく違いました。まったくです。種族まで違うほどです。 || 魅力的なマッチ相手は、とてもよくできた台本のボットでした。 || プロフィールには「背が高くて、楽しくて、正直」とありました。チャットでは「ギフトカードを送って」と言われました。
dating.awkward=最初のメッセージは、説明がたくさん必要な、とても長いジョークでした。 || 「笑」と返信しましたが、とても悲しげに出ます。 || 見ていられないナンパのセリフを、弁解できない自信とともに送ります。
dating.typo=オートコレクトが、甘いメッセージを、非常に残念なものに変えます。 || 送信して、誤字に気づきます。誤字は最初の単語にあります。 || ささいなミスが、意味を大きく変えます。この件は忘れないでしょう。
medicine.bonus=薬がすぐ効き、詰まった頭がすっきりします。ほとんど生まれ変わった気分です。 || 正しい量を、正しいタイミングで。鼻も、気分も通ります。 || 錠剤は静かに仕事をします。もっと薬を信じようと決めます。
medicine.crit_success=完璧な量、完璧なタイミング。病気になる前より元気です。 || 薬は映画のモンタージュのように効き始めます。ティッシュが舞い、音楽が流れ、完治です。 || 教科書通りの治療です。どこかで医者が、不思議な誇りを感じています。
medicine.soft_fail=ボトルを振って、ため息をついて、仕事をしているふりをします。 || 風邪はそんなに悪くないと決めます。風邪は同意しません。 || 薬は後回しにします。「後で」は、はるか先です。
medicine.crit_fail=間違ったボトルをつかみます。ラベルには「植物用」とありました。やけに葉っぱになった気分です。 || 錠剤がソファの下に転がり、隣のものを飲みます。大胆ですが、賢くはありません。 || まったく別の用途の薬を飲んでしまいます。体が正式に苦情を出します。
medicine.wrong_dose=ラベルに目を細め、勘で飲んで、勘が外れます。薬はそういうゲームではありません。 || 少なすぎて、次は多すぎます。風邪は居座り、変な気分です。 || 説明書ははっきりしていたのに、1行も読みませんでした。風邪はまだここにいます。
medicine.side_effects=薬は何も治さず、眠気だけ連れてきます。おめでとう、頭痛つきの風邪です。 || 胃が錠剤を気に入りません。風邪は気にしません。 || 副作用は飲んだあとで読みました。思ったより、たくさんありました。
mourning.bonus=長くて温かいハグです。{t}は、一日中こらえていたような息を吐きます。 || あまり言葉はかけませんが、必要ありません。{t}が寄りかかり、部屋が少し静かになります。
mourning.crit_success={t}を抱きしめると、言葉は意味を失います。二人で泣いて、少し笑って、今日初めて、乗り越えられる気がしてきます。 || {t}が腕の中で崩れ落ち、そのまま受け止めます。終わるころ、二人とも始めたときより軽くなっています。 || 他では伝えられないことを伝えるハグがあります。これはすべてを伝え、二人にのしかかる重さが一度にゆるみます。
mourning.soft_fail=ハグはぎこちなく、短いものです。{t}は丁寧にうなずき、喪失感は前より少し重くのしかかります。 || バス停の他人のように、{t}の背中をポンポンと叩きます。二人とも、ズレを感じます。 || 腕はそこにありますが、言葉はありません。そのあとの沈黙は長く、悲しいものです。
mourning.crit_fail=ほんの少し長く抱きしめ、一番まずい言葉をかけ、{t}はさらに激しく泣き出します。あなたもです。 || ハグは、間違った種類の号泣大会になりました。悲しみは重くなり、二人で等しく分け合います。 || 気持ちは本当に善意です。出てきたのは、言ってはいけない最悪の言葉でした。{t}は黙り込み、あなたも黙ります。
mourning.fail=カードを読み上げるように「ご愁傷さまです」と言います。{t}はお礼を言いますが、どちらも気分は晴れません。 || ハグは間違ったタイミングで決まり、悲しみはさらに大きくなります。誰も手の置き場がわかりません。 || {t}を慰めようとして、二人とも、失われたすべてを思い出させてしまいます。
mourning.pass=いいハグです。何も解決はしませんが、助けになります。 || しばらく{t}を抱きしめます。誰かが一緒に背負ってくれると、楽になることもあります。
sink.bonus=水が一発で温かく出ます。上の階の誰かがあなたを好きなようです。 || 手がキュッと鳴るほどきれいになります。外科医もうらやむ仕上がりです。 || 完璧な水圧、完璧な温度。洗面所のささやかな奇跡です。
sink.crit_success=手も、顔も、歯も、すべてピカピカです。鏡が拍手します。 || 洗面台があまりに行儀よく、メダルに値します。
sink.soft_fail=水はぬるく、石けんはほぼ空ですが、なんとかします。 || ちょっと水しぶき、たっぷり不満、そして十分きれいになりました。
sink.crit_fail=あらあら、大変なことになりましたね。足元に気をつけて、滑らないで! || 蛇口をひねると、洗面台まるごとがあきらめます。水はそこらじゅうに、尊厳はどこにもありません。 || パイプがうなり、ポンと鳴り、間欠泉が噴き出します。洗面所はプールになりました。
sink.flood=あらあら、大変なことになりましたね。足元に気をつけて、滑らないで! || 蛇口がポキッと折れて、水があふれ出ます。水たまりに気をつけて、天才さん。 || ピシッ、シューッ、噴水。洗面台は壊れ、足元にはちょうど水たまりです。
sink.frustrated=蛇口と格闘して、降参させます。冷静ではいられません。 || ハンドルを回すたびに悪くなります。パイプを、お金を貸しているかのようににらみます。
sink.splash=自分の顔に思い切り水をはねて、1分巻き戻したくなります。 || 蛇口が横に噴射して、シャツがびしょ濡れです。とてもエレガントです。
sink.slip=さっき自分で作った濡れた場所を踏みます。重力が苦情を出します。 || 床はつるつる、靴下もつるつる、運もつるつるです。
sink.fail=蛇口がゴホゴホと咳き込み、顔に水を噴きかけます。失礼です。 || 水は冷たくなり、熱くなり、また冷たくなります。洗面台には個性があります。 || 蛇口と戦い、蛇口が勝ちます。
sink.pass=普通で、退屈で、まったく問題ない洗顔です。
toilet.bonus=すべてが問題なく動きます。大事なのは、小さな勝利です。 || 完璧な用足しです。陶器の玉座も認めています。
toilet.crit_success=カタログに載せたいほど滑らかな流れです。 || 完璧な用足しです。トイレはスパのような香りです。
toilet.soft_fail=2回流す必要がありましたが、流れました。誰も何も見ていません。 || ちょっとうるさくて、ちょっと遅いですが、終わりました。
toilet.crit_fail=トイレが、高くつきそうな音でゴボゴボいいます。足元に気をつけて! || 用足し中に、配管に何かが起きました。落ち着いて、滑らないように。 || 恐ろしいゴボゴボ音と、足元に広がる怪しい水たまり。威厳たっぷりに立ち去ります。
toilet.overflow=トイレが不穏にゴボゴボ鳴り、今や水が広がっています。足元に気をつけて、滑らないで! || 足元に水たまりがあります。何も起きていないふりをします。 || 便器が突然の波を吐き出しました。今は水たまりの中に立ち、威厳を保とうとしています。
toilet.clog=レバーを押すと、水がゴボゴボと鳴り、考え込み、あきらめました。無言で便器を見つめます。 || 流れません。もう一度、さらにもう一度試します。トイレは暴力を選びました。
toilet.gross=あなたの前にここにいた誰かが、サプライズを残しました。胃はおもしろくありません。 || 便器をのぞき込み、後悔して、猛スピードで目をそらします。
toilet.embarrassed=今の音は絶対に誰かに聞かれました。配管のせいにします。 || 鍵がかかっていませんでした。誰もこの件について話す必要はありません。
toilet.fail=流れが弱く、トイレは失礼な音を出します。何もなかったふりをします。 || 便座は冷たく、紙はなく、一日は最悪のスタートです。
toilet.pass=ミッション完了です。何も爆発しませんでした。
