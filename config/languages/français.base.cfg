fitness.bonus=Quelque chose se débloque. Les poids paraissent plus légers et ta posture a l'air suspectement pro. || Tu trouves ton rythme et tu te sens inarrêtable. Le miroir de la salle approuve d'un signe de tête.
fitness.crit_success=Répétition légendaire ! Quelque part, un shaker de protéines pleure de fierté.
fitness.soft_fail=Série difficile, mais tu la finis quand même à la dure. || Ta posture flanche et ton ego aussi, mais la répétition est faite.
fitness.crit_fail=Tu te donnes à fond sur la charge et ton corps dépose une plainte officielle. La série est finie avant d'avoir commencé. || Ton dos émet un son qu'aucun dos ne devrait émettre. Répétition annulée. || La barre gagne. Elle gagne toujours. Tu t'éclipses avec ta fierté en écharpe.
fitness.heat=L'entraînement vire au sauna. Tu t'éventes, la sueur ruisselle et la salle se met à tourner. || Tu en fais trop avec cette chaleur. T-shirt trempé, visage rouge, ton corps réclame un ventilateur, un océan et une sieste. || Le coup de chaleur frappe poliment, puis défonce la porte. Tu ressors en titubant, dégoulinant de sueur.
fitness.exhausted=Tes jambes lâchent à la dernière répétition. Tu t'effondres et fixes le plafond en repensant à tes choix de vie. || Tu dépasses ta limite et la limite te le rend bien. Tu tombes.
fitness.sore=Quelque chose dans ton corps dépose une plainte que tu sentiras pendant deux jours. Demain sera sportif. || Tu as poussé trop fort. Tes muscles déclarent une grève avec effet immédiat.
fitness.slip=Ton pied glisse au pire moment et la gravité gagne le débat. || Tu perds l'équilibre et tu tournoies comme un pas de danse mal préparé.
fitness.embarrassed=Quelqu'un a forcément vu ça. Tu fais comme si ça faisait partie de la routine. || Tu rates ton mouvement si fort que même le matériel détourne les yeux.
fitness.sweat_cold=Tu zappes la serviette et le ventilateur de la salle te cueille pile comme il faut. Le soir, tu renifles. Rhume mérité. || Sueur, clim et mauvais jugement donnent un rhume. Tu l'avais senti venir. || Ton corps juge la séance un peu abusée et t'envoie un rhume en guise d'avis.
fitness.lift_drop=Tu soulèves {t} avec tout ton amour, et la gravité reprend ses droits. Tu retombes sur tes pieds, ou presque. || Le soulevé monte à moitié avant que tes bras ne déposent plainte. {t} tombe au sol en riant. || Tu balances {t} en l'air, tu perds ta prise, et vous finissez tous les deux en tas par terre.
fitness.back_strain=Tu soulèves {t} et quelque chose dans ton dos dit non. Tu tiens la pose une seconde et tu le regrettes. || L'amour est puissant, mais tes lombaires ne sont pas d'accord. {t} te repose et grimace avec toi. || Le grand soulevé se termine par un gros craquement de ta colonne. {t} demande si ça va, tu réponds que non.
fitness.show_off_fail=Tu veux faire le costaud et soulever {t} comme un héros. Tu as l'air de quelqu'un qui porte un meuble. || Le grand geste tombe entre l'impressionnant et l'hilarant. {t} applaudit doucement. || Tu fais saillir tes muscles avant de soulever. Ça tourne mal. {t} regarde tes bras, puis toi.
fitness.mine_strain=Tu balances la pioche avec trop d'assurance. Ton dos dépose une plainte officielle. || Le rocher gagne. Tu récoltes une ampoule et beaucoup de poussière.
fitness.treadmill_stumble=Le tapis continue. Pas toi, l'espace d'un instant. || Un petit déséquilibre se transforme en trébuchement très public.
fitness.fail=Tes bras arrêtent de coopérer à mi-course. Tu fais comme si tu avais prévu une pause. || Tu regardes les poids et les poids te regardent. Pas aujourd'hui.
fitness.pass=Tu enchaînes la série sans accroc. || Bonne posture, respiration régulière. Une journée comme les autres au bureau.
kiss.bonus=Celui-là était spécial. {t} s'en souviendra un moment. || Des étincelles ! {t} rayonne, et toi aussi.
kiss.crit_success=Un baiser pour les livres d'histoire. {t} oublie son propre nom.
kiss.soft_fail=Le baiser est un peu maladroit et un peu gênant, mais {t} laisse passer.
kiss.slap=Tu te penches pour embrasser {t}, mais la surprise de {t} se transforme en gifle !
kiss.runaway=Tu te penches pour un baiser et {t} détale comme si tu lui tendais un formulaire d'impôts. || {t} jette un œil au baiser qui arrive et file ventre à terre. Stratégie audacieuse, {a}.
kiss.embarrassed=Tu te penches pour un baiser. {t} devient écarlate, étudie ses chaussures et rêve que le sol l'avale. || {t} se fige, rougit jusqu'aux oreilles et marmonne un truc sur la météo.
kiss.angry={t} n'a pas apprécié la bouche en cœur. Te voilà noté en colère, {a}. || Tu vises le baiser et {t} vise la mine fâchée. Échange équitable ?
kiss.rejection={t} refuse le baiser, poliment mais fermement. Le silence fait plus de bruit que le refus. || {t} tourne la tête juste à temps. Fluide, {a}. Très fluide.
kiss.sad={t} te lance un regard peiné et un long soupir. Pas comme ça. || Le baiser rate sa cible, et l'ambiance aussi. {t} détourne le regard.
kiss.knockout={t} perd son sang-froid et lance un coup de poing. Il touche, et tu t'écroules comme un sac de linge. || Cette blague était la goutte d'eau. {t} frappe, et la pièce bascule. Tu te réveilles face au plafond. || {t} devient rouge vif et te frappe en pleine figure. Ta dignité quitte les lieux avant que tu touches le sol.
kiss.fight={t} en a assez. Une bousculade, un mot qui claque, et te voilà en pleine bagarre. || Un pas de trop. {t} se campe et fonce sur toi, poings en avant. || {t} le prend très mal et choisit de répondre avec les poings. Tu l'as cherché.
kiss.police={t} n'en peut plus et compose déjà le numéro. Un signalement à la police arrive. || {t} te fixe une seconde et lâche « J'appelle la police. » Ça sonne très sérieux. || Ça a mal tourné. {t} porte plainte contre toi avant que tu aies fini de t'excuser.
kiss.spark=Une étincelle que vous avez ressentie tous les deux. Quelque chose de chaud flotte entre toi et {t}. || Le moment laisse une lueur. Toi et {t} vous sentez un peu plus proches. || Un petit frisson, un sourire discret. L'air entre toi et {t} reste tout en douceur.
kiss.knockout_death=Le coup de poing de {t} touche, tu t'écroules... et tu ne te réveilles pas. Fin. || Un seul coup de {t}. Tu t'effondres, le silence se fait, et tu ne te relèves pas. Générique de fin. || {t} lance un seul coup de poing. C'est, hélas, la dernière chose que tu remarques. Fin.
kiss.pass=Le baiser se pose tout en douceur. {t} fond un peu. || Un moment tendre. {t} te sourit ensuite.
chat.bonus=La conversation coule toute seule. Toi et {t} perdez la notion du temps, de la meilleure façon. || Une discussion facile, un vrai fou rire et l'impression de pouvoir tout dire. Une belle. || {t} s'ouvre un peu, et toi aussi. Ça paraît facile.
chat.crit_success=Tu dis exactement la bonne chose au bon moment. {t} sourit d'une façon dont tu te souviendras. || Une discussion parfaite. Chaque phrase touche et chaque pause est chaleureuse. {t} ne veut plus s'arrêter. || La conversation atteint un niveau plus profond sans que personne ne le remarque. {t} te regarde comme si tu venais de le comprendre.
chat.soft_fail=La discussion traîne et se termine poliment. Aucun de vous deux ne dit ce qu'il voulait. || Une conversation terne qui ne mène nulle part. Vous repartez un peu plus légers et un peu plus ennuyés. || C'est bien. C'est juste bien. Vous hochez la tête et passez à autre chose.
chat.crit_fail=Chaque phrase tombe de travers. À la fin, {t} voudrait être n'importe où ailleurs. || Tu dis un truc vraiment malheureux. L'air devient solide et {t} fixe le mur. || Un désastre de conversation. {t} va avoir besoin d'une minute, et sans doute d'un en-cas.
chat.silence=Tu ouvres la bouche et rien ne sort. {t} comble le silence en étudiant le plafond. || La conversation s'éteint à mi-chemin. Toi et {t} vous hochez la tête comme de vieux meubles. || Un blanc gênant s'installe. Vous faites semblant que c'est un silence confortable.
chat.wrong_topic=Tu tombes pile sur le seul sujet que {t} déteste. Le sourire de {t} se fige en quelque chose de poli et de distant. || Tu abordes le mauvais sujet au mauvais moment. {t} change de sujet avec la grâce d'un accident de voiture. || Tu marches sans le vouloir sur un point sensible. {t} dit « bien sûr » sur un ton qui veut dire « non ».
chat.overshare=Tu en dis beaucoup trop, beaucoup trop vite. {t} a l'air de quelqu'un qui lit des conditions d'utilisation interminables. || Ta petite causette tourne à la confession. {t} écoute en hochant lentement la tête et cherche les sorties. || Tu passes de « ça va ? » à l'histoire de ta vie d'une seule traite. {t} a besoin d'un moment.
chat.voice_cracks=Ta voix déraille au milieu des grands mots. {t} reste gentil, mais le moment est fragile désormais. || Tu as répété ça. La répétition n'a servi à rien. Ta voix tremble et abandonne. || Les mots sortent plus petits que dans ta tête. {t} attend poliment que tu réessaies.
chat.too_intense=C'était beaucoup, et trop vite. {t} recule d'un demi-pas et sourit avec précaution. || Tu le dis de tout ton cœur. {t} l'entend avec un peu trop de panique. || La promesse tombe lourdement. {t} rit nerveusement et change de sujet.
chat.advice_backfires=Tu demandes conseil, puis tu contestes chaque mot. {t} abandonne et acquiesce. || Le conseil est bon. Tu l'ignores à voix haute. {t} a l'air de quelqu'un qui a déjà vu ce film. || {t} te donne un conseil honnête. Tu le prends mal, et l'ambiance se refroidit.
chat.awkward_hello=Tu dis bonjour, et ta voix choisit une hauteur au hasard. {t} répond bonjour sur la même hauteur, par pitié. || Le salut passe par trois versions avant d'atterrir. || « Salut. Bonjour. Hey. » Tu as réussi les trois en même temps.
chat.makeup_fails=Tu dis que tu es désolé. {t} entend « désolé que tu le prennes comme ça ». Ce n'est pas pareil. || Les excuses tournent en rond. {t} a toujours mal, et en plus ne comprend plus rien. || Tu essaies de te réconcilier, et tu ajoutes une deuxième dispute sans trop savoir comment.
chat.life_talk_drags=La discussion profonde devient de plus en plus profonde et lourde, jusqu'à ce que plus personne ne sache quelle était la question. || Tu philosophes un moment. {t} bâille discrètement dans sa manche. || « Quel est le sens de tout ça ? » est une ouverture bien lourde. La conversation ne s'en remet pas.
chat.gossip_leaks=Le ragot que tu partages est un peu trop croustillant. {t} se vexe d'être embarqué là-dedans. || Chuchoter s'avère moins discret que prévu. Quelqu'un a tout entendu. || Tu balances le thé et une partie atterrit sur {t}.
chat.advice_ignored=Tu donnes un sage conseil de couple. {t} n'en écoute rien et s'agace un peu. || Ton conseil est parfaitement bon et totalement non désiré. {t} soupire. || Tu dis « fais-moi confiance ». {t} non.
chat.kindness_unnoticed=Tu fais un geste gentil et {t} ne le remarque pas. Ça compte quand même, te dis-tu. || Un petit acte de gentillesse, poliment ignoré. Tu te sens un peu bête. || C'était un geste adorable. Il a reçu un haussement d'épaules poli.
chat.flat_greeting=Ton bonjour ressemble à une faute de frappe. {t} fait poliment semblant de ne pas avoir entendu. || Le salut sort raide et une seconde trop tard. {t} fait un petit signe gêné. || Tu dis les bons mots avec la mauvaise voix.
chat.rumor_awkward=La rumeur devient bizarre très vite. Personne ne sait où regarder. || Tu écoutes, tu hoches la tête et tu ne dis rien, très fort. || La discussion démarre chaleureuse et tiédit doucement.
chat.fire_silence=Vous êtes assis près du feu et aucun de vous ne trouve rien à dire. Les crépitements parlent pour vous. || Le silence s'étire. {t} fixe les flammes, et toi aussi, un peu trop longtemps. || Tu voulais partager un moment tranquille. Ça devient juste un moment tranquille.
chat.lesson_flops=Tu expliques les bases trois fois. L'élève acquiesce sans rien comprendre. || Tes talents de prof s'avèrent plus faibles que tes talents tout court. Vous êtes épuisés tous les deux. || La leçon part de travers et finit par un gêné « on réessaie demain ».
chat.knockout={t} perd son sang-froid et lance un coup de poing. Il touche, et tu t'écroules comme un sac de linge. || Cette blague était la goutte d'eau. {t} frappe, et la pièce bascule. Tu te réveilles face au plafond. || {t} devient rouge vif et te frappe en pleine figure. Ta dignité quitte les lieux avant que tu touches le sol.
chat.fight={t} en a assez. Une bousculade, un mot qui claque, et te voilà en pleine bagarre. || Un pas de trop. {t} se campe et fonce sur toi, poings en avant. || {t} le prend très mal et choisit de répondre avec les poings. Tu l'as cherché.
chat.police={t} n'en peut plus et compose déjà le numéro. Un signalement à la police arrive. || {t} te fixe une seconde et lâche « J'appelle la police. » Ça sonne très sérieux. || Ça a mal tourné. {t} porte plainte contre toi avant que tu aies fini de t'excuser.
chat.deep_bond=Un instant, toi et {t} êtes sur la même longueur d'onde. On dirait une amitié vieille de plusieurs années. || Les mots viennent facilement et rien n'est retenu. {t} te regarde comme un membre de la famille. || Une vraie discussion profonde. Tu en repars avec un lien plus fort et une chaleur qui dure.
chat.closer=Cette discussion vous a rapprochés. Tu le sens avant même que {t} dise quoi que ce soit. || Quelque chose bouge dans le bon sens. Toi et {t} êtes un peu plus à l'aise maintenant. || La discussion devient un vrai moment. Toi et {t} en repartez plus proches.
chat.knockout_death=Le coup de poing de {t} touche, tu t'écroules... et tu ne te réveilles pas. Fin. || Un seul coup de {t}. Tu t'effondres, le silence se fait, et tu ne te relèves pas. Générique de fin. || {t} lance un seul coup de poing. C'est, hélas, la dernière chose que tu remarques. Fin.
etiquette.bonus=Un échange franc et amical. {t} te regarde avec une lueur de respect. || Des manières parfaites et juste ce qu'il faut d'assurance. L'ambiance est détendue et chaleureuse. || Tu fais ça comme si c'était facile. {t} se détend, et toute la salle se détend avec {t}.
etiquette.crit_success=Impeccable. {t} sourit comme si tu venais de conclure une affaire, et peut-être que c'est le cas. || Charme, timing et poignée de main parfaite. l'effet sur {t} est évident, et {t} tient à ce que tu le saches. || Tu es un pro. Un vrai. {t} note mentalement de te présenter à tout le monde.
etiquette.soft_fail=C'est raide et un peu bizarre, mais ça a techniquement lieu. || Un sourire forcé, un signe de tête rapide et un silence légèrement étrange. Pas ta meilleure heure. || Ni désastre ni triomphe. Tu passes vite à autre chose.
etiquette.crit_fail=Tout part de travers au même instant. {t} fait poliment comme si rien ne s'était passé. || Tu réussis à être grossier, maladroit et bruyant en un seul geste. Un exploit rare. || Le moment s'effondre comme un mauvais soufflé. {t} en reparlera dans trois ans environ.
etiquette.sweaty_palm=Ta paume est moite. {t} te serre la main, puis s'essuie discrètement sur le pantalon en espérant que personne n'a vu. || La poignée de main est une chose molle et humide. {t} sourit poliment et compte les secondes. || Tu serres trop fort, puis trop mollement, puis tu transpires partout. {t} se souviendra de cette poignée de main.
etiquette.card_drop=Tu tends ta carte de visite et elle voltige dans une flaque de rien du tout. {t} la ramasse pour toi, toute pliée. || La carte glisse de tes doigts et atterrit face contre terre. {t} lit le verso par gentillesse. || Tu donnes une carte avec une trace de café dessus. {t} dit merci comme on le dit chez le dentiste.
etiquette.toast_spill=Tu lèves ton verre avec un peu trop d'enthousiasme. La boisson finit sur {t}, les vivats ne vont nulle part. || Tchin. Splash. {t} regarde la chemise, puis toi, puis de nouveau la chemise. || Le toast est parfait jusqu'à ce que le verre penche. La moitié finit sur la table, l'autre sur la dignité.
etiquette.bribe_caught=Tu glisses l'enveloppe. {t} compte les billets à voix haute, et toute la salle entend. ${m} s'envolent, et ta réputation avec. || Quelqu'un voit l'échange. Le « cadeau » te coûte ${m} et une très longue explication. || Le pot-de-vin devait rester discret. {t} annonce le montant à toute la salle, et ${m} disparaissent de ton compte.
etiquette.errand_refused={t} regarde la liste, te regarde, et dit « je ne suis pas un service de livraison ». || Tu demandes un service. {t} soupire profondément, puis semble à la fois offusqué et fatigué. || La demande de course tombe mal. {t} croise les bras. La course reste à faire.
etiquette.pitch_flop=Tu commences par du jargon d'affaires et tu finis avec rien. {t} hoche la tête comme devant un spam. || Le pitch sonne malin dans ta tête. À voix haute, {t} te demande si ça va. || Tu dis « synergie » deux fois et « levier » une fois. {t} jette discrètement un œil à son téléphone.
etiquette.stiff=Tu parles comme un robot qui lit un manuel de management. {t} te fixe sans savoir s'il faut rire. || Le geste est poli et raide comme une planche. Le moment passe sans que personne ne ressente quoi que ce soit. || Tu veux faire professionnel et tu atterris en « statue gênée ». {t} tente de rattraper le coup et échoue.
etiquette.pitch_ignored=Tu présentes ton idée avec énergie. {t} hoche la tête et ne note rien. || « Intéressant », dit {t}, sur le ton qu'on prend pour dire « non ». || Tu exposes tes objectifs et {t} te rend un sourire poli.
etiquette.info_leaked=L'information que tu partages se révèle fausse, et les dégâts sont pour toi. || Tu partages un tuyau qui devait rester privé. {t} explose de colère, et ça te coûte. || Un détail confidentiel t'échappe. Ça coûte cher.
etiquette.forced_cheer=Tu dis que tu te réjouis de la croissance. On dirait une vidéo d'otage. || L'enthousiasme est si forcé que {t} demande si tout va bien. || Ton enthousiasme est répété à l'avance, et ça se voit.
etiquette.formal_flub=Tu salues {t} avec beaucoup de cérémonie et le mauvais titre. || Trop formel, puis trop décontracté, puis les deux à la fois. {t} ne sait plus où donner de la tête. || Le bonjour poli s'emmêle dans ses propres bonnes manières.
etiquette.nosy_question=Tu poses une question un peu trop curieuse. {t} répond sèchement. || La question flotte dans l'air un instant de trop. {t} détourne les yeux. || Tu voulais faire la conversation. Tu as eu un regard fixe.
etiquette.too_personal=Cette question était un pas de trop. {t} n'apprécie pas du tout. || Tu poses une question très privée d'une voix très publique. {t} se raidit. || {t} répond sur un ton dont tu te souviendras. Et tous les autres aussi.
etiquette.coin_refused=Tu demandes des pièces et tu obtiens un non poli et un très long regard. || Mendier des pièces de resort ne se passe pas bien. Tu repars avec un ego plus léger. || La réponse est un non très gentil et très ferme.
etiquette.gift_flop=Tu tends le cadeau. {t} sourit, et tu sens que ce n'est pas le bon. || Le cadeau est un peu... étrange. {t} te remercie avec beaucoup d'efforts. || {t} ouvre le paquet et s'efforce de faire bonne figure.
etiquette.knockout={t} perd son sang-froid et lance un coup de poing. Il touche, et tu t'écroules comme un sac de linge. || Cette blague était la goutte d'eau. {t} frappe, et la pièce bascule. Tu te réveilles face au plafond. || {t} devient rouge vif et te frappe en pleine figure. Ta dignité quitte les lieux avant que tu touches le sol.
etiquette.fight={t} en a assez. Une bousculade, un mot qui claque, et te voilà en pleine bagarre. || Un pas de trop. {t} se campe et fonce sur toi, poings en avant. || {t} le prend très mal et choisit de répondre avec les poings. Tu l'as cherché.
etiquette.police={t} n'en peut plus et compose déjà le numéro. Un signalement à la police arrive. || {t} te fixe une seconde et lâche « J'appelle la police. » Ça sonne très sérieux. || Ça a mal tourné. {t} porte plainte contre toi avant que tu aies fini de t'excuser.
etiquette.deal={t} connaît quelqu'un qui connaît quelqu'un, et un nouveau contact t'envoie ${m} pour « un petit boulot ». Le réseau, ça marche. || Ta bonne impression devient un service, et le service devient ${m}. Voilà comment se font les affaires. || {t} se porte garant de toi auprès d'un client. Un peu plus tard, ${m} arrivent sur ton compte.
etiquette.insider_tip=L'information que tu as partagée se révèle précieuse. {t} te glisse un remerciement pour ça. || Un tuyau devient une affaire. Tu repars avec un peu d'argent en plus.
etiquette.gift_hit={t} adore le cadeau. C'tombe pile sur ses envies, et ça se voit. || Le cadeau fait mouche. {t} te serre dans ses bras un poil trop longtemps.
etiquette.knockout_death=Le coup de poing de {t} touche, tu t'écroules... et tu ne te réveilles pas. Fin. || Un seul coup de {t}. Tu t'effondres, le silence se fait, et tu ne te relèves pas. Générique de fin. || {t} lance un seul coup de poing. C'est, hélas, la dernière chose que tu remarques. Fin.
humor.bonus=La blague tombe pile. {t} rit tellement qu'il faut lui trouver une chaise. || Ton timing est excellent et le rire est sincère. Aujourd'hui, tu es drôle. || Un rire franc et facile. {t} essuie une larme et en redemande une autre.
humor.crit_success=Génie comique. {t} pleure de rire, te supplie d'arrêter, puis en réclame encore. || Une blague parfaite au moment parfait. Toute la salle applaudirait si elle le pouvait. || Tu fais tellement rire {t} qu'on en oublie de respirer. Un numéro légendaire.
humor.soft_fail=Ce n'est pas ton meilleur matériel, mais {t} sourit pour être gentil. || Un rire faible et une chute encore plus faible. Tu passes vite à autre chose. || Un petit gloussement, un peu de pitié. La blague est déjà oubliée.
humor.crit_fail=La blague meurt bruyamment. {t} n'a jamais été aussi silencieux. || Une blague si mauvaise qu'elle crée un nouveau genre de silence. {t} fixe l'horizon. || Tu fais un tel flop que la pièce se refroidit. {t} a besoin d'une minute.
humor.flop=Tu sors ta blague avec une confiance totale. {t} te regarde en clignant des yeux, attendant la suite. || La chute retombe avec un petit bruit sourd. {t} rit avec une demi-seconde de retard. || Tu ris de ta propre blague. Tout seul. {t} lui accorde un « héhé » poli.
humor.unfunny=La blague est tellement pas drôle qu'elle fait le tour et devient déroutante. {t} hoche lentement la tête. || Tu la racontes avec un timing parfait, et elle reste mauvaise. {t} sourit gentiment. || Un grognement, un soupir, un roulement d'yeux. {t} remporte le prix du public le plus poli.
humor.slapstick_hurt=Tu t'engages un peu trop dans la gamelle. Le sol gagne, comme toujours. {t} arrête de rire et commence à s'inquiéter. || Le gag tourne mal de la façon la plus douloureuse. {t} grimace, puis rit, puis grimace encore. || Tu te prends les pieds dans ton propre numéro. Ça fait mal, et le public d'une personne ne sait pas s'il faut applaudir.
humor.money_gun=Tu tires avec le pistolet à billets et les billets volent partout. C'étaient des vrais. ${m} s'envolent et {t} rit sans pouvoir s'arrêter. || Le pistolet était chargé de vrai cash. ${m} filent par la fenêtre et {t} n'arrive plus à respirer tellement ça le fait rire. || Oups. Le pistolet n'était pas fait pour du faux argent. Tu arroses l'air de ${m} et {t} jure n'avoir rien vu.
humor.dirty_offended=La blague salée passe mal. {t} te regarde avec une profonde déception, sans rien dire. || Tu racontes une blague qui n'est pas pour ce public. {t} ne rit pas. {t} te fixe. || La blague tombe comme une enclume. {t} ne rit pas, et tu le sais.
humor.compliment_creepy=Le compliment sonne flippant, et {t} recule d'un petit pas. Tu t'entends le redire. || Tu dis un truc gentil, et ça sonne comme autre chose. {t} regarde le sol. || Le compliment tombe bizarrement. {t} te remercie d'une voix d'otage.
humor.memes_cringe=Tu expliques un mème mort depuis trois ans. {t} hoche poliment la tête sans rien dire. || Le mème demande un cours complet pour être compris, et ne l'est toujours pas. {t} te regarde avec une pitié bienveillante. || Tu montres à {t} un mème tendance. Il n'est pas tendance. Il ne l'a jamais été.
humor.high_five_miss=Tu lances un high five et tu claques l'air. {t} te laisse en plan avec un visage très aimable. || Le high five atterrit quelque part entre une tape et une claque. {t} secoue la main et sourit quand même. || Tu rates la main d'un centimètre et ton bras continue. {t} fait poliment comme si c'était un étirement.
humor.powerup_fizzle=Tu tends le poing pour un power-up et rien ne scintille. {t} y cogne quand même le sien, un peu gêné. || Le power-up de l'amitié crépite d'un petit pop. {t} applaudit une fois, par loyauté. || Tu cries le power-up, et l'énergie ne va nulle part. {t} lève le pouce par gentillesse.
humor.flex_fail=Tu bombes le torse, et un bruit très malvenu sort de ton épaule. {t} grimace. || La pose était féroce. Elle a aussi duré une seconde de trop et quelque chose s'est crampé. || Tu exhibes tes muscles. {t} reste de marbre, et un muscle est blessé.
humor.knockout={t} perd son sang-froid et lance un coup de poing. Il touche, et tu t'écroules comme un sac de linge. || Cette blague était la goutte d'eau. {t} frappe, et la pièce bascule. Tu te réveilles face au plafond. || {t} devient rouge vif et te frappe en pleine figure. Ta dignité quitte les lieux avant que tu touches le sol.
humor.fight={t} en a assez. Une bousculade, un mot qui claque, et te voilà en pleine bagarre. || Un pas de trop. {t} se campe et fonce sur toi, poings en avant. || {t} le prend très mal et choisit de répondre avec les poings. Tu l'as cherché.
humor.police={t} n'en peut plus et compose déjà le numéro. Un signalement à la police arrive. || {t} te fixe une seconde et lâche « J'appelle la police. » Ça sonne très sérieux. || Ça a mal tourné. {t} porte plainte contre toi avant que tu aies fini de t'excuser.
humor.money_rain=Le pistolet à billets vous arrose tous les deux, et tu rattrapes ${m} avant que le vent n'emporte le reste. {t} applaudit. || Le cash pleut en arc parfait. {t} rit pendant que tu fourres ${m} dans ta poche. || Le pistolet tire une rafale légendaire. Tu repars avec ${m} de plus et {t} rit encore.
humor.inside_joke=Cette blague devient une private joke entre toi et {t}. Elle reviendra pendant des semaines. || Toi et {t} riez au même moment et c'est génial. Vous voilà un peu plus proches. || Un moment idiot devient un petit lien. Toi et {t} la citerez pour toujours.
humor.knockout_death=Le coup de poing de {t} touche, tu t'écroules... et tu ne te réveilles pas. Fin. || Un seul coup de {t}. Tu t'effondres, le silence se fait, et tu ne te relèves pas. Générique de fin. || {t} lance un seul coup de poing. C'est, hélas, la dernière chose que tu remarques. Fin.
family.bonus=Un petit moment chaleureux avec ton {k}. Vous repartez tous les deux un peu plus légers. || {t} sourit comme seule la famille sait le faire. Pas besoin d'explication. || Facile, gentil et un peu drôle. Exactement ce que ça devait être.
family.crit_success=Tout fait mouche. Toi et {t} finissez par rire comme quand vous étiez petits, et ça fait penser à la maison. || Un rare moment parfait entre ton {k} et toi. Personne ne le dit, tout le monde le ressent. || Le genre de discussion de famille dont on se souvient des années. {t} s'attarde un peu plus que d'habitude.
family.soft_fail=C'est plutôt sympa. Les histoires de famille sont comme ça. || Tu parles, {t} hoche la tête, et la journée continue. || Rien de spécial. Rien de mal non plus.
family.crit_fail=Tu dis exactement la pire chose devant ton {k}, et toute la pièce l'entend. || Ça devient l'une de ces scènes de famille que tout le monde ressortira aux repas pendant des années. || Une petite remarque devient une grosse. {t} s'en va avec un regard dont tu te souviendras.
family.awkward_pause=Un silence s'installe, et seul ton {k} peut le rendre aussi bruyant. || Vous cherchez tous les deux un sujet en même temps et aucun ne le dit. || La conversation cale et l'horloge devient soudain très intéressante.
family.old_argument=Tu te retrouves, on ne sait comment, dans la même dispute qu'il y a des années. Mêmes répliques, mêmes sorties. || {t} ressort cette histoire de cette fois-là. Tu aurais préféré que non. || Tu marques un vieux point sensible, et il n'a jamais cicatrisé.
family.rusty_visit=Ça fait un moment, et ça se voit. Vous êtes de la famille, mais un peu des inconnus aussi. || Vous dites tous les deux les bons mots dans un ordre légèrement faux. || Ne pas vivre ensemble, c'est d'abord se remettre à jour. Vous ne dépassez jamais la remise à jour.
family.house_rules=Vivre ensemble, c'est que la vaisselle revient toujours sur le tapis. Et elle y revient maintenant. || Quelqu'un a laissé un truc par terre. C'est évidemment la faute de ton {k}. || La même maison, deux idées très différentes du rangement.
family.spouse_bickers=Le mariage, c'est refaire la même petite dispute sous de nouvelles formes. Aujourd'hui, c'est une nouvelle forme. || {t} te lance le regard que seul un conjoint maîtrise, ce qui veut dire que tu as déjà des ennuis. || Un petit désaccord sur rien de précis, ce qui est le pire genre.
family.plan_clash=Vous planifiez l'avenir ensemble et, un instant, on dirait deux avenirs différents. || {t} veut une chose, tu en veux une autre. Le compromis, c'est le silence. || Les grands projets rencontrent la petite réalité. Aucun de vous ne cède cette fois.
family.lecture_flops=Ton sermon atterrit à peu près aussi doucement qu'une brique. {t} hoche la tête comme les enfants qui ont arrêté d'écouter. || Tu expliques un truc important. {t} entend « bla bla » et un peu de fierté. || Ça sonnait plus sage dans ta tête.
family.chide_backfires=Tu grondes et ça se retourne contre toi. {t} te renvoie un regard qui dit « tu as fait pareil ». || Le savon devient un « tu n'écoutes jamais » larmoyant. Personne ne gagne. || Tu élèves la voix et tu aurais préféré ne pas le faire.
family.eye_roll=Ton parent commence une phrase et tu connais déjà la fin. Il a vu le roulement d'yeux. || Le conseil est bon. Le recevoir, c'est ça le problème. || Tu écoutes avec beaucoup d'efforts. Ça se sent.
family.generation_gap=Le fossé des générations s'ouvre pile entre vous. Tu fais coucou de l'autre côté. || Certaines choses ne s'expliquent pas à un grand-parent. Celle-ci en fait partie. || Toi et {t} parlez la même langue, mais pas de la même décennie.
family.grandchild_bored=L'histoire du bon vieux temps était excellente. Ton petit-enfant n'est pas arrivé jusque-là. || Ton petit-enfant regarde déjà un écran. Le bon vieux temps attendra. || Tu offres ta sagesse. Tu reçois un « mm-hm » poli.
family.sibling_spat=Logique de fratrie : c'est toi qui as commencé, {t} a terminé, et vous revendiquez tous les deux la victoire. || Un commentaire de trop et te revoilà à dix ans, à te disputer pour un canapé. || Le classique. Une blague pour taquiner va un cran trop loin.
family.wrong_mood=Tu évoques le mauvais sentiment au mauvais moment. {t} recule d'un pas. || L'émotion était sincère. Le timing, non. || Tous les sentiments n'ont pas besoin d'être partagés tout de suite. Celui-ci en faisait partie.
family.allowance_gone=Tu remets l'argent de poche et tu reçois un merci très bref, et pas de monnaie. || L'argent de poche disparaît plus vite que le ticket de caisse. Tu ne sauras jamais où. || L'argent change de mains et un sermon suit. Tu as payé les deux.
family.apology_stumbles=Les excuses sortent dans le désordre. « Pardon » arrive en dernier. || Tu essaies de rattraper les choses, et les mots se marchent dessus. || Les excuses sont sincères. La livraison est un désastre.
family.hug_too_tight=L'étreinte dure un peu trop et la pression est un peu trop forte. {t} déclare forfait. || Tu serres ton {k} dans tes bras et quelque chose craque. Peut-être son dos. || Une étreinte enthousiaste, un tout petit craquement et un rire gêné.
family.kid_not_listening=Le petit écoute tout sauf toi. || Tu le dis trois fois. À la quatrième, ça passe enfin, ou l'enfant s'en va. || Tu es très bon dans ce que tu fais. L'enfant est très fort pour l'ignorer.
family.family_warmth=La proximité familiale est discrète. C'est l'un de ces moments, et tu le sens. || Un petit rien devient quelque chose de chaleureux avec {t}.
family.family_bond=Tout s'enclenche. Toi et {t} avez l'impression d'être une vraie famille, pas juste des proches. || Un moment dont vous vous souviendrez tous les deux. Le lien grandit, la chaleur aussi.
family.fail=Ça commence bien et ça dérive vers un endroit que ni l'un ni l'autre n'avait prévu.
art.bonus=Le tableau prend joliment forme. Quelques coups de pinceau audacieux ont fait tout le travail. || De belles couleurs, une belle composition. Quelqu'un l'accrocherait. || Tu finis avec de la peinture sur les mains et un petit sourire tranquille.
art.crit_success=Le pinceau bouge tout seul. Quand tu prends du recul, c'est la plus belle chose que tu aies jamais faite. || Des couleurs, de la lumière, un peu de magie. Tu signes d'une main très sûre. || Ce n'est plus un tableau, c'est un sentiment. Tu pourrais le regarder toute la journée.
art.soft_fail=Ce n'est pas ton meilleur travail, mais c'est le tien. || Les couleurs sont un peu à côté, et la composition un peu timide. || Correct, comme un premier brouillon est correct.
art.crit_fail=Le tableau devient une très grande flaque très marron de regrets. || Tout ce que tu essaies empire les choses. À un moment, tu t'arrêtes. || Le résultat ressemble à une erreur qui a des opinions.
art.uninspired=Tu fixes la toile. La toile gagne le concours de regards. || La muse est en pause, et n'a laissé aucune adresse. || Rien ne vient. Pas une idée, pas un trait, pas une couleur.
art.muddy_colors=Toutes les couleurs se mélangent dans la même nuance de marron. Un marron très constant. || Chaque mélange vire à la boue. Tu visais le coucher de soleil, tu as atterri dans le marécage. || Tu as ajouté une couleur de plus, et le tout est devenu gris.
art.paint_spill=Le bac de peinture bascule et une éclaboussure atterrit pile où il ne fallait pas. Peinture sur les vêtements, sur les chaussures, sur toi. || Tu recules pour admirer ton travail et tu marches dans la peinture à la place. || Une grosse vague de peinture atteint ton t-shirt en premier. Le tableau va bien. Pas toi.
art.ruined_canvas=Un coup de pinceau de trop et toute la toile est fichue. Tu lâches un mot qui n'est pas dans les manuels d'art. || La toile se déchire, la peinture coule et une heure de travail s'évapore. || Tu essaies de réparer un coin et tu abîmes les trois autres.
art.mural_drips=La peinture sur le mur coule en longues traînées tristes, et un peu sur toi. || Tu vises le mur et le mur partage avec toi. || La fresque ressort un peu fondue, et toi un peu peint.
art.caught_tagging=Un voisin voit ton œuvre. Une amende pour graffiti illégal suit. L'art a un prix. || Un passant appelle ça du vandalisme. La contravention l'appelle ${m}. || Le mur n'était pas à toi. La ville t'envoie la facture : ${m}.
art.art_confusing=Tu la regardes longtemps. Elle te regarde aussi et ne dit rien d'utile. || Tout le monde dit que c'est profond. Toi, tu vois une banane et un long silence. || Tu hoches la tête d'un air songeur comme on le fait dans les galeries, sans rien comprendre.
art.painting_sale=Un passant tombe amoureux de ton tableau et le paie ${m} sur-le-champ. || Un collectionneur entend parler de ton travail et t'envoie ${m} avec un message très enthousiaste. || Ton œuvre se vend ${m}. Ton premier vrai fan est un inconnu.
art.art_praise=Un ami voit le tableau et te glisse ${m} « pour le prochain ». || Quelqu'un en achète un petit tirage pour ${m}. Te voilà officiellement professionnel.
art.fail=Ça ne ressemble pas à ce que tu avais en tête.
art.pass=Un travail solide.
spa.bonus=Chaud, calme et exactement ce qu'il te fallait. Tu ressors comme neuf. || Une super séance. Des muscles dont tu avais oublié l'existence te disent merci. || Tout ton corps soupire, et toi aussi.
spa.crit_success=Chaque nœud lâche d'un coup. Tu sors en flottant, sans os, calme et plus grand d'environ trois centimètres. || Pur bonheur. Le monde ralentit, tes épaules retombent et tu oublies ce qu'était le stress. || Un soin parfait. Tu pourrais rester dans cet état toute une semaine.
spa.soft_fail=C'est correct. Assez relaxant, sans être magique. || Agréable, mais ton esprit est ailleurs. || Un soin honnête. Tu as connu mieux.
spa.crit_fail=Tout part de travers comme seule une journée au spa sait le faire. Tu ressors plus tendu qu'en entrant. || Ce qui devait détendre devient une petite épreuve. Ton pauvre corps ne comprend pas ce qui lui arrive. || Tu paies pour la détente et tu reçois une histoire que tu raconteras pendant des années.
spa.restless=Tu es allongé là, mais ton esprit refuse de s'éteindre. Chaque pensée est une liste de choses à faire. || Se détendre, c'est du boulot. Aujourd'hui, tu es nul à ça. || Le soin est très bien. Le problème, c'est toi.
spa.tense_knot=Ils tombent sur un nœud dont tu ignorais l'existence. Tu vois des étoiles, et les étoiles disent aïe. || La tension se cachait dans tes épaules et elle se défend. Tu repars endolori plutôt qu'apaisé. || Un pouce très ferme trouve exactement le mauvais endroit et y reste.
spa.too_hard=La pression est bien trop forte. Tu souris poliment et songes discrètement à changer de vie. || Ils ont dit massage profond. Ils n'ont pas dit « jusqu'à l'os ». Tu as mal pendant des heures. || Ça fait mal d'une façon censée être bonne pour toi, et tu n'es pas convaincu.
spa.ticklish=Tes pieds sont bien plus chatouilleux que tu ne le pensais. Tu ris, tu te tortilles et tu envoies presque les poissons hors de l'eau. || Les chatouilles sont insupportables. Tu glousses jusqu'à ce que ça n'ait plus rien de relaxant. || Les poissons docteurs sont très enthousiastes envers tes orteils. Personne n'a prévenu tes orteils.
spa.fell_asleep=Tu t'endors en plein massage et tu te réveilles avec une flaque de bave et zéro dignité. || Un gros ronflement te réveille. La pièce est très silencieuse. Tout le monde a entendu. || Tu piques du nez, tu te réveilles en sursaut et tu fais semblant de t'être juste reposé les yeux.
spa.salt_sting=Le sel trouve une minuscule égratignure dont tu ignorais tout. Tu gardes un visage calme. De justesse. || Une surprise très salée. Tu dis « mmm » et tu penses « aïe ». || Le bain de sel pique plus qu'il n'apaise.
spa.aroma_allergy=Les huiles sont délicieuses, et ton nez a d'autres avis. Les éternuements commencent et ne s'arrêtent plus. || Roses, herbes et une allergie très soudaine. Tu repars avec le nez rouge et un mouchoir. || Un nuage de parfum et un éternuement encore plus gros. Atchoum.
spa.sauna_dizzy=La chaleur te monte à la tête. La pièce tourne, les bancs tanguent et tu sors de couleur homard. || Trop chaud, trop longtemps. Tu repars sur des jambes en gelée. || Tu te dis que tout va bien. Le sauna n'est pas d'accord.
spa.sauna_overheat=Tu forces ta chance au sauna et le sauna gagne. Le monde devient blanc et flou, et tu rampes dehors en dégoulinant. || Sueur, points noirs devant les yeux et forte impression d'avoir fait une erreur. Le coup de chaleur frappe poliment, puis défonce la porte. || La chaleur a cessé d'être relaxante pour devenir une menace. Tu atteins la porte à peine.
spa.pushy_staff=Le praticien devient bavard pile au mauvais moment. Tu souris, et tu ne te détends pas. || Un pro très enthousiaste parle pendant tout le soin. La détente est difficile à trouver. || Le massage est bien. Ce sont les commentaires le problème.
spa.fail=Tu n'arrives pas tout à fait à te détendre.
spa.pass=Un vrai moment de détente.
mood_spouse.bonus=Un regard, un sourire, un « viens là » très discret. L'ambiance fait le reste. || {t} rit doucement et te rapproche. Parfait. || Ce qui pesait il y a une minute a disparu. Quelque chose de chaud a pris sa place.
mood_spouse.crit_success=L'ambiance est parfaite avant que quiconque dise un mot. Toi et {t} fondez l'un dans l'autre, et le monde entier devient plus calme, plus doux, plus chaud. || Tout est bien : la lumière, le moment, la personne. Vous retombez amoureux tous les deux. || C'est comme la première fois, et la centième, à la fois. Rien ne fait mal, rien n'inquiète, rien ne compte à part {t}.
mood_spouse.soft_fail=Le moment est agréable, même un peu timide. Vous y arrivez tous les deux à la fin. || Un peu gênant, surtout doux. Tu laisses couler. || Ce n'est pas tout à fait la scène de film, mais ça marche.
mood_spouse.crit_fail=Tu veux de l'intimité, mais tes pieds froids cassent l'ambiance. || Tu te penches, tu trébuches sur un coussin et toute la soirée part de travers. {t} rit et soupire en même temps. || Le grand moment romantique est interrompu par un ventre très bruyant, suivi d'un petit silence triste.
mood_spouse.cold_feet=Tu voulais de l'intimité, mais tes pieds glacés ont cassé l'ambiance. || Tes pieds glacés touchent la jambe de {t}. Un cri, un sursaut, et l'ambiance s'évapore. || La romance s'arrête à la seconde où tes orteils froids rencontrent un mollet chaud.
mood_spouse.cold_hands=Tes mains sont gelées, et {t} te le fait savoir d'une voix très aiguë. || Une main froide au mauvais endroit au mauvais moment. L'ambiance quitte la pièce. || Tu le fais avec tendresse. Tes doigts le font avec de la glace.
mood_spouse.phone_buzzes=Un téléphone vibre pile au pire moment. Aucun de vous ne peut l'oublier. || Une notification. Puis une autre. L'ambiance a quitté la conversation. || Quelqu'un a oublié de couper un téléphone. C'était vous deux.
mood_spouse.pet_interrupts=Une patte, un miaou et un gros bruit sourd. L'animal a rejoint la soirée. || Le chat saute sur le lit pile au mauvais moment. L'ambiance n'y survit pas. || Un très grand public poilu vous regarde. Personne ne peut se concentrer.
mood_spouse.giggle_fit=Tu essaies d'être sérieux, {t} commence à pouffer, et maintenant aucun de vous ne peut s'arrêter. Mignon, mais pas franchement torride. || Le premier rire était un reniflement. Le deuxième a tué l'ambiance. Vous pleurez de rire tous les deux. || Ça a commencé romantique et ça a viré au fou rire. Toujours un bon moment, juste un autre.
mood_spouse.fail=Tu essaies de créer l'ambiance. L'ambiance a d'autres projets.
mood_spouse.pass=L'ambiance prend. Personne n'a besoin de dire quoi que ce soit.
mood_lover.bonus=L'amour est une aventure, et tu profites du voyage ! || Une petite étincelle excitante entre toi et {t}. Vous vous sentez plus légers tous les deux. || Le moment est doux, un peu audacieux et très amusant.
mood_lover.crit_success=L'amour est une aventure, et tu en savoures chaque minute. {t} le ressent aussi. || Tout s'enclenche. Un regard, un contact, un sourire qui dit tout. || Tu ne le planifies pas, ça arrive, tout simplement. Et c'est merveilleux.
mood_lover.soft_fail=C'est un peu raide, mais {t} laisse couler. || Pas vraiment fluide, mais assez doux. || Un peu maladroit. {t} sourit quand même.
mood_lover.crit_fail=Tu lis complètement de travers la situation. {t} te regarde comme si tu avais une deuxième tête. || L'ambiance passe de zéro au désastre. {t} doit quitter la pièce. || Le grand geste tombe à plat de la façon la plus gênante possible.
mood_lover.slap=Tu te penches pour créer l'ambiance, mais {t} y voit une attaque et te gifle ! || C'était un peu trop audacieux. {t} te gifle, et le bruit se propage.
mood_lover.runaway={t} voit venir la suite, panique et sort de la pièce en courant. || Tu fais ton geste. {t} en fait un aussi, vers la porte.
mood_lover.embarrassed={t} devient rouge vif et n'arrive plus à te regarder. Toi non plus. || Le moment devient trop fort. {t} se cache derrière ses deux mains.
mood_lover.angry={t} n'apprécie pas du tout ce que tu as tenté. Le regard dit tout. || Tu as mal jugé, et {t} s'assure que tu le saches.
mood_lover.rejection={t} se dégage. Un « non » poli et ferme flotte dans l'air. || Pas ce soir. Pas comme ça. {t} recule.
mood_lover.sad={t} a mal, et tu le ressens aussi. Le silence est lourd. || L'ambiance meurt de façon très triste. {t} soupire et détourne le regard.
mood_lover.fight=la colère de {t} monte et la dispute vire à la vraie bagarre. || Ce qui avait commencé comme une ambiance s'est transformé en échange de cris et en bousculade.
mood_lover.fail=Tu essaies de créer l'ambiance et {t} n'y est pas tout à fait encore.
mood_lover.pass=Bonne alchimie.
romance.bonus={t} rit au bon moment et reste plus près qu'avant. Quelque chose commence. || Un bon moment. Toi et {t} vous regardez dans les yeux un battement de trop, et ça ne gêne ni l'un ni l'autre. || Des papillons, et réciproques. Tu repars avec une sensation chaude et frémissante.
romance.crit_success=Les mots sortent exactement comme il faut. {t} te regarde comme si tu avais décroché la lune, puis demande doucement si tu es libre demain aussi. || Tout s'aligne : le timing, le sourire, le silence au bon endroit. {t} a le souffle un peu court, toi aussi. || Tu n'as jamais été aussi fluide. {t} rougit, et la pièce paraît dix degrés plus chaude.
romance.soft_fail=C'est assez sympa, mais l'étincelle ne vient jamais vraiment. Vous faites semblant tous les deux. || {t} sourit poliment. C'est le sourire qu'on offre à un serveur. || Ni désastre, ni moment. L'air reste exactement à la même température.
romance.crit_fail=Tu dis un truc tellement à côté que {t} vérifie si tu te sens bien. Non. || Le moment s'effondre au ralenti. {t} te fixe, tu fixes le sol, et le sol ne t'aide pas. || Tu ouvres la bouche, une phrase tombe, et c'est la pire disponible. {t} s'en souviendra des années.
romance.tongue_tied=Tu as répété ça sous la douche. À voix haute, ce ne sont que des sons. || Ton cerveau quitte la conversation. Tout ce que tu arrives à dire, c'est « donc... voilà. » || {t} attend. Tu attends. Personne ne dit rien de romantique.
romance.turned_down={t} dit « je crois qu'on est mieux en amis » d'une voix très douce. Ça fait mal quand même. || Un « non merci » poli. La politesse, c'est le pire. || {t} semble sincèrement désolé, ce qui rend les choses pires, on ne sait pourquoi. Tu rentres le cœur lourd.
romance.too_forward=Tu passes de zéro à « alors, des enfants ? » en une phrase. {t} recule d'un pas. || C'était beaucoup, très vite. {t} a besoin d'une minute et d'un verre d'eau. || Tu as sauté environ neuf étapes. {t} les a toutes remarquées.
romance.cold_feet=Tu parles mariage et {t} trouve soudain le plafond très intéressant. || « Alors, où tu vois ça aller ? » tombe comme une brique. L'ambiance s'éclipse en silence. || {t} change de sujet si vite que ça laisse des traces de pneus.
romance.sweaty_hands=Ta paume est un marécage. {t} s'accroche courageusement et s'essuie la main sur son pantalon ensuite. || Tu attrapes la main de {t}. Elle est moite, tremblante et pleine d'excuses. || La main tenue dure juste le temps que vous remarquiez tous les deux à quel point tu es moite.
romance.hand_yanked={t} retire sa main comme si c'était une poêle brûlante. Ce n'est pas discret. || Tu tends la main et {t} met la sienne dans sa poche. Le message est clair. || La main se retire, très poliment et très vite. Aïe.
romance.slap=Tu cherches la main de {t}, mais {t} le prend mal et te gifle à la place ! || C'était beaucoup trop audacieux. {t} réagit par une gifle, et le bruit résonne.
romance.cold_greeting=Ton doux bonjour tombe comme une chaussette mouillée. {t} hoche la tête et continue de marcher. || Tu salues {t} avec tout ton charme. {t} répond par un « hm » poli. || Le salut était un battement d'espoir. Il s'est écrasé au sol.
romance.confession_declined=Tu te lances, le cœur battant. {t} dit non avec douceur, et ton cœur qui bat coule à pic. || {t} t'éconduit en douceur, et « en douceur » n'est pas ce que tu ressens. || Ta grande question reçoit un petit, gentil et dévastateur « pas comme ça ».
romance.knockout={t} perd son sang-froid et lance un coup de poing. Il touche, et tu t'écroules comme un sac de linge. || Ce geste était la goutte d'eau. {t} frappe, et la pièce bascule. Tu te réveilles face au plafond.
romance.fight={t} en a assez. Une bousculade, un mot qui claque, et te voilà en pleine bagarre. || Un pas de trop. {t} se campe et fonce sur toi, poings en avant.
romance.police={t} n'en peut plus et compose déjà le numéro. Un signalement à la police arrive. || « J'appelle la police. » {t} a l'air de le penser vraiment.
romance.butterflies=Les papillons sont réciproques. Quelque chose grandit doucement entre toi et {t}. || Toi et {t} vous séparez avec un sourire que vous ne cachez pas vraiment.
romance.swept_off_feet=C'est l'un de ces moments dont vous vous souviendrez tous les deux. {t} craque complètement, et toi, tu rayonnes. || {t} a complètement marché. Tu ressens une vague de chaleur qui dure des heures.
romance.fail=Tu vises le charmant et tu atterris près de « lecture d'un manuel à voix haute ». || Le plan était romantique. L'exécution, une négociation de prise d'otages.
romance.knockout_death=Le coup de poing de {t} touche, tu t'écroules... et tu ne te réveilles pas. Fin. || Un seul coup de {t}. Tu t'effondres, le silence se fait, et tu ne te relèves pas. Générique de fin.
conflict.bonus=Une réplique cinglante, bien envoyée. {t} esquisse un sourire à contrecœur. || Tu tiens bon, et ça marche. {t} te respecte un peu.
conflict.crit_success=Tu l'envoies parfaitement. {t} n'a aucune repartie, et toute la salle sait que tu as gagné. || Une leçon magistrale. {t} ouvre la bouche, la referme, et acquiesce avec respect. || Ton cran paie. {t} cède, et tu te sens grand comme une tour.
conflict.soft_fail=Ça tombe mollement. {t} hausse les épaules et passe à autre chose. || Pas ton moment le plus affûté, mais personne n'est blessé. || {t} reste de marbre, et l'affaire reste en suspens.
conflict.crit_fail=Ça tourne si mal que {t} n'a même pas besoin de répondre. Tes propres mots s'en sont chargés. || Ton grand moment se retourne contre toi de façon spectaculaire. Le silence qui suit est assourdissant. || Tu as tenu bon, droit dans le mur. {t} regarde avec un grand intérêt.
conflict.stiff=La pique est raide et répétée, et {t} voit clair dedans. || Tu essaies de faire le dur. Tu sonnes comme un répondeur.
conflict.tease_backfires=La taquinerie ne passe pas, et {t} réplique avec quelque chose qui fait vraiment mal. || Tu piques {t} et la piqûre te mord à la place. || {t} ne rit pas. C'est toi qui rougis.
conflict.ridicule_backfires=Ta moquerie se retourne si proprement que tu as presque envie d'applaudir. Presque. || {t} se moque de toi à la place, bruyamment, et tu regrettes d'avoir commencé. || Tu te moques de {t}, qui a une meilleure réplique en réserve. Aïe.
conflict.stubborn=Tu t'accroches, et {t} aussi. Personne ne gagne, et l'ambiance est gâchée. || Insister plus fort ne te donne pas plus raison. {t} arrête d'écouter.
conflict.line_crossed=Tu traces la ligne, et elle passe en plein dans les sentiments de {t}. || La vérité est sortie un peu trop franche. {t} se tait, et la pièce se refroidit. || Tu l'as dit sans détour. {t} l'a entendu sans détour, et plus aucun de vous ne peut regarder l'autre.
conflict.power_play_flops=Ton coup de force s'écrase. {t} te recadre devant tout le monde, et ça te coûte. || Il s'avère que {t} n'était pas du tout intimidé. Ça pique, à plus d'un titre. || Tu cherches un levier et tu finis par payer pour le privilège.
conflict.shown_the_door={t} montre la porte. Tu comprends l'allusion et tu repars avec un peu de fierté meurtrie. || Tu demandes à {t} de partir, et {t} répond par un regard à faire fondre l'acier. || Le « s'il te plaît, pars » passe mal, et c'est toi qui te retrouves dehors.
conflict.greeting_backfires=Ton bonjour désagréable reçoit une réponse encore plus désagréable. C'est toi qui as commencé, assume. || {t} prend la salutation aigre personnellement et la renvoie avec les intérêts. || Tu salues {t} comme un méchant de film. {t} répond dans le même rôle.
conflict.belittle_backfires=Tu rabaisses {t} devant tout le monde. Il s'avère que {t} a gardé les preuves. || Le blâme retombe sur toi, avec des annotations. || {t} reste calme, et c'est pire. Tout le monde a vu.
conflict.pent_up=Les mots débordent, plus chauds que prévu. {t} n'avait pas besoin de tout ça. || Tu lâches tout, et une partie était destinée à quelqu'un d'autre. || Les sentiments étaient réels. Le moment ne l'était pas.
conflict.extort_backfires=Ta menace s'effondre à mi-chemin. {t} reste calme, et c'est toi qui as l'air coupable. || Le chantage se passe comme se passe tout chantage. la colère de {t} éclate et tu en paies le prix. || {t} ne cille pas. L'amende, si.
conflict.caught_red_handed=Quelqu'un t'a vu. Tout le monde t'a vu. Tu fais comme si tu n'avais jamais été là. || Ton plan sournois a un témoin. Tu es tout rouge. || Le secret était moins secret que prévu.
conflict.rumor_backfires=Le message part à la mauvaise personne. Tu passes la soirée à tout supprimer. || La rumeur se répand, puis revient vers toi avec quelques détails en plus. || Il s'avère que le ragot concernait un ami de quelqu'un. Oups.
conflict.prank_backfires=La blague se retourne contre toi. Tout le monde rit, et pas avec toi. || Il manquait une étape à la blague. Tu l'as sautée, et tu paies.
conflict.knockout={t} perd son sang-froid et lance un coup de poing. Il touche, et tu t'écroules comme un sac de linge. || C'était la goutte d'eau. {t} frappe, et la pièce bascule. Tu te réveilles face au plafond.
conflict.fight={t} en a assez. Une bousculade, un mot qui claque, et te voilà en pleine bagarre. || Tu as poussé trop loin. {t} se campe et fonce sur toi, poings en avant.
conflict.police={t} n'en peut plus et compose déjà le numéro. Un signalement à la police arrive. || « C'est du harcèlement, et j'appelle la police. » {t} a l'air sérieux.
conflict.witty=La réplique est bonne et {t} le sait. Un sourire à contrecœur et un peu plus de respect. || Tu gagnes l'échange sans une égratignure. {t} se détend un peu.
conflict.respect=Tu gagnes la dispute si proprement que {t} l'admire pour de bon. Ta confiance rayonne un moment. || {t} s'incline d'un signe de tête. Tu as gagné un vrai respect aujourd'hui.
conflict.fail=Tu as visé l'audace et tu es arrivé à la gêne. || La réplique était bonne. La livraison, un éternuement.
conflict.knockout_death=Le coup de poing de {t} touche, tu t'écroules... et tu ne te réveilles pas. Fin. || Un seul coup de {t}. Tu t'effondres, le silence se fait, et tu ne te relèves pas. Générique de fin.
passion.bonus=Votre intérêt commun lance une bonne discussion. {t} acquiesce et vous repartez tous les deux regonflés. || Une chouette petite discussion sur un sujet que vous aimez tous les deux. {t} en redemande.
passion.crit_success=Il s'avère que vous aimez exactement la même chose. Toi et {t} discutez pendant des heures sans le voir passer. || Deux âmes sœurs se trouvent. {t} s'illumine comme une lampe, et toi aussi. || Le sujet s'enclenche parfaitement. {t} veut tout savoir, et tu le lui racontes avec plaisir.
passion.soft_fail=Tu trouves deux ou trois choses à dire, et {t} aussi. C'est correct. || Un terrain d'entente, mais pas grande étincelle. || Le sujet s'éteint poliment.
passion.crit_fail=Tu dis avec aplomb une bêtise sur le seul sujet qui compte le plus pour {t}. Un silence tombe. || Ta passion s'avère très différente de celle de {t}. La conversation ne s'en remet pas. || Tu t'engages à fond sur un sujet et {t} grimace. Tu ne sais pas lequel de vous deux est le plus gêné.
passion.dull_topic=Tu parles du sujet pendant dix minutes. Le regard de {t} se vide vers la troisième minute. || Tu es fasciné. {t} vérifie l'heure. || Le sujet te passionne, toi et personne d'autre dans la pièce.
passion.hot_take=Tu balances une opinion très tranchée et {t} le prend mal. || Ton avis tranché refroidit la salle. {t} n'est pas d'accord, bruyamment. || {t} prend le sujet personnellement, et ça devient un débat.
passion.dance_stumble=Tu veux montrer un pas, tu te prends les pieds et tu finis en tas. {t} grimace par compassion. || Le pas de danse demande plus de place que tu n'en as. Le sol gagne. || Un pas trop ambitieux, et la gravité réclame son dû.
passion.muscle_strain=Tu fais une démonstration d'exercice et quelque chose se tire. {t} propose un coussin et beaucoup de compassion. || L'enthousiasme dépasse ton échauffement. Ton dos dépose une plainte. || Tu bombes trop le torse et tu te froisses quelque chose dont tu avais besoin.
passion.voice_cracks_song=Tu attaques la note aiguë avec assurance. La note ne répond pas. || Ta voix dérape si fort que {t} cherche une vitre à vérifier. || Chanter ensemble, c'est super, jusqu'à ce que tu prennes la tête.
passion.off_key=L'accord que tu joues n'a jamais fait partie de la chanson. {t} fait poliment comme si c'était un choix créatif. || Ta guitare est désaccordée, et l'ambiance avec. || Tu grattes avec passion et avec les mauvaises notes.
passion.meat_debate=Tu parles de viande et {t} a des avis tranchés sur les morceaux. Ça tourne au débat. || La querelle du steak s'échauffe. Saignant et bien cuit ne sont pas compatibles. || Tu dis « bien cuit » et {t} te regarde comme si tu avais insulté sa famille.
passion.recipe_war=Ta recette contre celle de {t}. Personne ne gagne, tout le monde a faim et se sent un peu vexé. || Tu dis que l'ingrédient secret, c'est le beurre. {t} dit que c'est la patience. La tension monte. || Tu critiques la technique de {t}. Erreur.
passion.no_common_ground=Tu partages tes trucs préférés. {t} partage les siens. Ils n'ont rien en commun. || Vos goûts ne pourraient pas être plus éloignés. La conversation se tait. || {t} demande « attends, tu aimes ça ? » sur un ton dont tu te souviendras.
passion.shared_joy=Parler de ce que vous aimez tous les deux te réchauffe le cœur et renforce votre lien. || {t} rit et raconte une histoire à lui. Vous voilà plus proches.
passion.kindred_spirits=Toi et {t} découvrez que vous êtes faits du même bois. Une belle amitié commence aujourd'hui. || {t} sourit et dit « t'étais où toute ma vie ? » Tu le ressens aussi.
passion.fail=Tu étais sûr d'avoir quelque chose en commun. Tu en avais moins que prévu. || L'enthousiasme était réel. Les connaissances, non.
selfcare.bonus=Un bon moment avec toi-même. Tu te sens ressourcé et tranquillement content. || Ça t'a fait du bien. Tu repars plus léger qu'en arrivant.
selfcare.crit_success=Tu finis en te sentant comme une personne neuve. Tout est un peu plus lumineux et beaucoup plus calme. || Du temps bien investi pour toi. Tu rayonnes, et toute la journée paraît plus légère. || Un de ces rares moments où tu te sens complètement en paix.
selfcare.soft_fail=C'est bien. Pas magique, mais bien. || Rien de spécial, rien de mal. Tu continues. || Le moment passe sans grand-chose à en dire.
selfcare.crit_fail=Tout part de travers, et tu te sens pire qu'au départ. || Ce qui devait être un moment calme devient un petit désastre.
selfcare.off_day=Tu essaies, mais ton cœur n'y est pas aujourd'hui. Un grand soupir suit. || Certains jours, même se détendre est un travail.
selfcare.self_doubt=Le miroir et toi vous regardez en chiens de faïence. Tu cliges le premier, et sans confiance. || Tu répètes la phrase six fois. Ça empire à chaque fois, allez savoir pourquoi. || Tu te regardes et tu ne trouves que des choses à corriger. Le discours d'encouragement n'y change rien.
selfcare.mind_wanders=Ton esprit refuse de ralentir. Chaque pensée est une autre pensée. || Tu t'assois, tu respires, et tu te souviens d'un mail que tu as oublié d'envoyer. Paix annulée. || Le calme n'arrive jamais vraiment. Tu repars plus agité qu'avant.
selfcare.bad_omen=La lecture est vague, sinistre et un peu impolie. Tu repars troublé. || L'avenir paraît nuageux. Tu regrettes d'avoir demandé. || Les cartes ou la boule ont de mauvaises nouvelles sur un ton joyeux. D'une certaine façon, c'est pire.
selfcare.bad_sleep=Tu te tournes, te retournes et te bats avec l'oreiller. Le matin arrive trop vite. || Tu dors, techniquement. Ça ne se sent pas. || Chaque fois que tu commences à glisser, quelque chose cliquette. La fatigue devient la norme.
selfcare.nightmare=Un rêve très étrange, avec des dents et un sandwich qui parle. Tu te réveilles secoué et épuisé. || Le cauchemar paraît complètement réel. Tu te redresses dans le noir et il te faut une minute. || Tu rêves que tu es en retard pour quelque chose. Tu te réveilles en retard, fatigué, sans savoir pour quoi.
selfcare.firewood_boom=Tu jettes la bûche et le feu répond par un BANG. Une boule de feu, un nuage de suie, et te voilà la personne la plus sale du parc. || Le bois était humide, le feu était furieux. Boum ! Tu es couvert de cendres de la tête aux pieds. || Une bûche de trop. Le feu de camp explose dans un nuage de fumée et d'étincelles, et tu ressors tel un ramoneur.
selfcare.dust_fizzles=Tu saupoudres la poussière magique et le feu éternue, tout simplement. Il ne se passe rien, à part un peu de paillettes sur tes chaussures. || La poussière scintille une seconde, puis s'éteint avec un petit pop triste. || Peut-être que le feu n'a pas envie de magie aujourd'hui.
selfcare.otherworldly_visitor=Les flammes vacillent, se tordent, et quelque chose avec beaucoup trop d'yeux commence à ramper hors du feu. Tu ris. Tu n'arrives plus à t'arrêter. C'est un rire très nerveux. || Une forme se dresse dans la fumée, te regarde droit dans les yeux et ne dit rien. Ça va. Ça va très bien. Ha. Ha ha ha. || Le feu murmure ton nom d'une voix venue de nulle part. Tu réponds par un gloussement que tu ne reconnais pas comme le tien.
selfcare.sparkler_burn=Le cierge magique crache des étincelles partout. L'une atterrit sur ta manche et sur ta dignité. || Tu l'agites avec un peu trop d'enthousiasme. Les étincelles te répondent. || Il s'éteint dans ta main, avec un tout petit sifflement très impoli.
selfcare.smoke_in_eyes=Le vent tourne et la fumée te suit où que tu t'assoies. Tes yeux ne pardonneront jamais le feu. || Tu t'installes et la fumée s'installe avec toi. La toux commence. || Le feu est chaud, la fumée non. Tu fais trois fois le tour du feu et elle te suit.
selfcare.stubbed_toe=Tu lui mets un grand coup de pied. Lui s'en fiche, mais ton orteil non. || Passer sa colère sur un objet fait un bien fou une seconde. Puis l'orteil se met à pulser. || L'objet gagne. Tu sautilles en tenant ton pied et ta fierté.
selfcare.sunburn=Tu t'assoupis au soleil. Le soir, tu rayonnes d'une façon que personne n'avait demandée. || L'huile a loupé un endroit. L'endroit est maintenant très, très rouge. || Trop de soleil, pas assez de bon sens. Ta peau dépose une plainte.
selfcare.hammock_flip=Le hamac se retourne et toi aussi, direct dans le sable. || Tu t'allonges avec beaucoup de grâce, et tu te relèves avec beaucoup moins. || Le transat a des opinions sur ta façon de t'asseoir. Il gagne.
selfcare.smoky_flue=Le conduit était fermé, et le salon prend un bon fumage. Tu tousses jusqu'à la fenêtre la plus proche. || Le feu crachote, la fumée va partout sauf dans la cheminée. Tes yeux piquent. || Tu l'allumes, ça fume. Tu l'éventes, ça fume plus fort.
selfcare.backfire_soot=La cheminée crache une boule de suie droit sur toi. Te voilà d'un noir très festif. || WHOUMP ! Une rafale d'étincelles et de cendres, et le tapis du foyer n'est pas le seul à avoir l'air carbonisé. || Le feu s'allume dans un bang et tu ressors comme si tu sortais du conduit.
selfcare.ash_cloud=Tu éteins le feu et les cendres montent en un gros nuage gris. Tu l'écartes avec dignité. || La dernière braise boude et t'envoie un nuage de cendres en pleine figure. || Le feu est éteint. Ta coiffure aussi.
selfcare.burnt_fingers=Tu tends les mains un peu trop près. Le feu te brûle poliment le bout d'un doigt. || Mains chaudes, puis mains brûlantes, puis mains très rapides. || Le feu était plus sympa à un mètre de distance.
selfcare.blessing=La poussière magique éclot en une chaude lueur dorée. Un instant, tu ressens tout à la fois : reposé, nourri, propre et léger. Le feu sourit. Probablement. || Les flammes prennent la couleur d'un lever de soleil et t'enveloppent. Quand elles s'estompent, tous tes maux, soucis et maladies ont disparu. || Une douce pluie d'étincelles dorées, et le monde retrouve du sens. Tu es guéri, ressourcé et discrètement ravi.
selfcare.fail=Ce n'était pas ta meilleure séance avec toi-même.
games.bonus=Une belle victoire. Tu es de super humeur et l'esprit vif. || Bien joué. Une petite danse de la victoire s'impose.
games.crit_success=Partie parfaite. Une foule de personne t'acclame, et tu te sens champion quand même. || Précision absolue. La machine elle-même a l'air impressionnée. || Le jeu se plie à ta volonté aujourd'hui. Quelle poussée d'adrénaline.
games.soft_fail=Tu perds, mais c'était assez serré pour être divertissant. || Pas aujourd'hui. Meilleure chance à la prochaine manche. || Un échec de peu. Personne n'a rien vu, donc ça ne compte pas.
games.crit_fail=Une défaite spectaculaire. Tu envisages de déménager dans une autre ville. || Tout ce qui pouvait mal tourner tourne mal, dans l'ordre le plus gênant possible.
games.so_close=Si proche. Un tout petit peu plus et c'était pour toi. || Tu rates d'un cheveu. Le cheveu n'est pas impressionné.
games.sore_loser=Tu perds, et tu n'es pas beau joueur. Plusieurs mots sont prononcés. || Tu accuses la machine, le lag et un petit courant d'air.
games.claw_empty=La pince se referme sur rien et la peluche te nargue. Quelques pièces s'évaporent. || Tu t'alignes parfaitement. La pince lâche. Évidemment.
games.dart_stray=La fléchette passe devant la cible et trouve un mur à la place. Personne n'a rien vu. || Tu vises le centre. La fléchette vise le sol.
games.gutter_ball=La boule roule doucement vers la rigole. Tu la regardes jusqu'au bout. || Un tir parfait, si la piste était trois pieds plus à gauche.
games.air_ball=Le ballon rate tout, le panier, le panneau et ta dignité. || Tu tires, tu rates, et le ballon rebondit quelque part où tu n'iras pas le chercher.
games.button_mash=Tu matraques tous les boutons à la fois. Le personnage fait un truc bizarre et perd aussitôt. || La manette se défend. La défaite aussi.
games.eats_coins=La machine prend tes pièces et les garde. Elle n'est pas désolée. || La borne avale les pièces sans un merci. L'écran affiche « game over » avant que tu commences.
games.wild_throw=La balle passe devant les boîtes, devant le stand et manque de finir à la mer. || Tu lances avec confiance. Les boîtes restent parfaitement immobiles. || Un super lancer, mais ailleurs.
games.seesaw_bonk=La bascule rebondit et te cogne pile sur le menton. || Tu chevauches le petit cheval un peu trop fort et il se rebelle.
games.arcade_win=La machine paie et quelques pièces tombent dans ta main. || Un petit lot, un grand sourire.
games.jackpot=Les lumières clignotent, les cloches sonnent et les pièces ruissellent. Tu ne t'es jamais senti aussi chanceux. || Un jackpot ! Toute la salle d'arcade se retourne.
games.fail=Le jeu remporte cette manche.
photo.bonus=La photo est nette, la lumière est super et {t} est parfait sur l'écran. Une photo à garder. || Une photo claire et chaleureuse avec un beau sourire. Tu voudras l'imprimer. || Cadrage parfait, timing parfait. La photo capture l'ambiance exactement.
photo.crit_success=Une photo si réussie qu'on pourrait l'encadrer. {t} en veut un exemplaire, et un deuxième en secours. || Le cliché est digne d'un magazine. Toi et {t} fixez l'écran. || Tu captures un moment si parfait qu'on dirait une mise en scène. Les dieux de la photo approuvent.
photo.soft_fail=La photo n'est pas terrible, mais elle existe. Tu dis que tu en referas une autre plus tard. || Un cliché moyen. {t} dit que c'est bien et le pense à moitié. || C'est une photo. On voit ce que c'est. C'est tout.
photo.crit_fail=La photo est un désastre à tous points de vue. {t} exige qu'elle ne soit jamais montrée. || Tu réussis à gâcher la photo, la lumière et l'ambiance d'un coup. Un chef-d'œuvre d'échec. || L'appareil fait des siennes, le flash part de travers et le cliché devient maudit. {t} demande à l'effacer.
photo.blurry=Tu appuies sur le déclencheur et toute la photo sort en bouillie. {t} dit « artistique » sans broncher. || Le cliché est flou comme une apparition de fantôme. {t} te suggère de réessayer, peut-être d'une main plus stable. || Tu obtiens une photo parfaite d'un rien très flou. {t} dit poliment que ça a du caractère.
photo.blink=Tu attrapes {t} en plein clignement. La photo donne un air de rêve. || Le flash part et {t} cligne au pire moment. Un joli portrait d'yeux fermés. || Clic. {t} a l'air à moitié endormi sur le cliché. On demande sa suppression, fermement.
photo.finger=Ton doigt couvre la moitié de l'objectif, et ton doigt est la star de la photo. || Tu cadres parfaitement et tu captures surtout ton pouce. Un pouce avec un super éclairage. || La photo contient {t}, un beau décor et un flou rose dans le coin : toi.
photo.phone_drop=Le selfie se passe bien jusqu'à ce que ton téléphone te glisse des mains. {t} sursaute au fracas. || Tu t'étires pour l'angle parfait et le téléphone saute de ta main. Le selfie, c'est le sol. || En plein selfie, le téléphone fait un petit plongeon. {t} le regarde, puis toi, et ne dit rien.
photo.camera_shy={t} se cache le visage dès que l'appareil sort. La photo, c'est une main et un sourire qui n'est pas là. || Tu lèves l'appareil et {t} devient timide. Le cliché, c'est la moitié d'un visage et beaucoup de regrets. || {t} sort du cadre à la dernière seconde. Ta photo est un portrait parfait du mur.
photo.viral_pic=Ta photo devient virale. Une page en rachète les droits pour ${m}. {t} exige d'être crédité. || Quelqu'un en ligne adore ton cliché et t'envoie ${m} pour l'utiliser. Ton appareil photo vient de payer le déjeuner. || Tu postes la photo et elle explose. Une marque la paie ${m}, et {t} veut sa part.
tv.bonus=Tu tombes sur l'émission parfaite. Aujourd'hui est un bon jour. || La chaîne est exactement à ton goût. Pure magie télévisuelle.
tv.crit_success=La télé capte avec une netteté cristalline. Même l'antenne applaudit.
tv.soft_fail=L'image est floue, mais tu t'en sors avec une tape sur le côté.
tv.fire=La télé siffle, claque et prend feu toute seule. Le streaming n'a jamais été aussi brûlant. || De la fumée s'échappe de l'arrière de la télé, puis tout l'appareil flambe. C'était beaucoup pour une télécommande. || Tu appuies sur un bouton et la télé répond par des flammes. Les avis sont mitigés.
tv.shock_break=Tu appuies sur le bouton d'alimentation. La télé claque, grésille et meurt dans un nuage de fumée, et la secousse restante te trouve quand même. || Un bang, un éclair, et la télé s'éteint pour de bon. La décharge n'est que l'insulte finale. || Tu cliques sur la télécommande et tout l'appareil renonce à la vie, emportant la bonne humeur de tes cheveux.
tv.shock=Tu attrapes la télécommande sans voir un fil qui dépasse. Tu prends une bonne décharge toute chaude. Qui aurait cru que les piles étaient si puissantes ?! || Tu allumes la télé et le vieux poste mord en retour. Tes cheveux se dressent et ton âme quitte brièvement ton corps. || La télé crépite, fait des étincelles et décide que tu es sa nouvelle antenne. Zzzzap ! || Tu appuies sur le bouton d'alimentation. La télé appuie en retour. Fort.
tv.fire_safe=La télé fait un minuscule pop et se tait. Heureusement, ce n'était qu'une petite étincelle... || Quelque chose claque derrière l'écran. Tout petit, très théâtral. La télé a l'air très gênée. || Un petit pop sec, puis le silence. Heureusement que ce n'était rien de pire.
tv.pass=La télé s'allume en grésillant. Le prime time t'attend.
shower.bonus=L'eau tombe juste comme il faut. Tu pourrais rester là jusqu'à ce que le chauffe-eau abandonne. || Une douche glorieuse. Tu ressors comme un tout nouveau Zoi.
shower.crit_success=La meilleure douche de ta vie. Vapeur, pression parfaite, et une chanson que tu voudrais presque enregistrer.
shower.soft_fail=L'eau est un peu tiède, mais tu t'y fais.
shower.crit_fail=Tu entres et le mitigeur te trahit. Ce n'est pas froid, c'est un glacier. Ton âme s'en va par la bonde. || Les tuyaux gémissent, l'eau devient arctique et tu pousses une note dont tu ignorais l'existence.
shower.fail=Tu prends une douche, mais le mitigeur a lâché et c'est glacial ! Tu vas le regretter demain. || L'eau commence tiède puis, par pure méchanceté, vire à la glace. Tu bondis dehors en grelottant.
shower.pass=Une douche parfaitement ordinaire. Rien n'a explosé, rien n'a gelé.
housework.bonus=Impeccable ! L'endroit brille et ton humeur aussi. || Le ménage est étrangement satisfaisant aujourd'hui. Tu ferais bien toute la maison.
housework.crit_success=La pièce étincelle comme un appartement témoin. Même les moutons de poussière applaudissent.
housework.soft_fail=Quelques traces et beaucoup de grognements, mais le boulot est fait.
housework.crit_fail=Une inondation, une glissade et une machine cassée d'un coup. Il faut du talent pour rater aussi complètement.
housework.slip=Tu marches dans la zone mouillée que tu viens de passer à la serpillière. Le sol gagne et tu tournoies comme un patineur. || Le ménage se passe très bien jusqu'à ce que ton pied rencontre une flaque de savon. Wheeee... boum.
housework.frustrated=Tu frottes, tu balaies, tu soupires. Le désordre repousse par pure méchanceté. || Chaque fois que tu nettoies un coin, deux nouveaux apparaissent. Tu as fini de jouer le calme.
housework.water_break=Tu tournes le robinet une fois de trop et le tuyau rend l'âme. De l'eau partout, et l'évier est foutu. || Un sifflement suspect, un pop, et une fontaine. La plomberie a démissionné et le sol est désormais un lac.
housework.break=Tu tripotes la machine et quelque chose dedans fait clonk. Puis le silence. Super. || Tu appuies sur le mauvais truc et l'appareil meurt dans un triste petit ronronnement.
housework.messy=Ta serpillière était visiblement plus sale que le sol et a tout rendu encore plus crade. De la saleté, de la saleté partout ! || L'éponge que tu as prise était apparemment une ferme à poussière. Maintenant, on dirait que personne n'est venu ici depuis 1987. || Tu secoues le plumeau et l'endroit devient plus poussiéreux. La physique a des questions. Toi aussi. || L'aspirateur recrache tout ce qu'il a jamais avalé. Félicitations, tu as inventé le ménage à l'envers. || Tu essores le chiffon et il pleut de la poussière, on ne sait comment. Chaque étagère, chaque sol, chaque surface. Même les toiles d'araignée ont déposé plainte. || Ton balai a éternué. Tout l'endroit est une tempête de poussière. Le ménage était une erreur.
housework.sigh=Tu soupires devant la pile de corvées. La pile de corvées s'en fiche. || Il y a toujours plus sale. Tu prends un instant pour pleurer ton temps libre.
housework.dust_allergy=Tu soulèves un nuage de poussière qui attendait ce moment depuis des années. Atchoum. Ton nez dépose une plainte. || Le balai réveille tous les moutons de poussière de la maison. Tu éternues à t'en faire éclater les oreilles. || Un nuage de vieille poussière t'attrape en plein dans le nez. Te voilà officiellement allergique à ton propre ménage.
housework.clean_house=Un élan de ménage et toute la maison étincelle d'un coup. Pas un grain de poussière n'a survécu. || Tu trouves le rythme de ménage parfait. Chaque surface et chaque sol sont impeccables. C'est qui, cette personne ? || Quelque chose se débloque. Tu ranges toute la maison d'un seul grand coup, moutons de poussière compris.
repair.crit_success=Quelque chose se débloque. Tout ce qui était cassé par ici revit d'un coup, et tu t'en vas comme une légende de la réparation. || Tes mains bougent toutes seules. Quand tu poses l'outil, plus rien n'est cassé ici. Du héros pur. || Une réparation parfaite, puis une autre, puis toutes. Tout ce qui était cassé revient, et la boîte à outils applaudit.
repair.soft_fail=La réparation marche presque. Presque. Tu recules et le truc hausse les épaules. || Tu serres, tu tournes, tu testes. Ça ne marche toujours pas. Ça a même l'air un peu vexé. || Presque, mais non. L'objet a décidé de rester cassé encore un peu.
repair.shock=Tu touches le mauvais fil et l'appareil te donne un avis très ferme là-dessus. Tes cheveux se dressent en applaudissant. || ZAP ! La réparation finit par une étincelle, un cri et une odeur de cheveux brûlés. || Le manuel disait « débranche d'abord ». Tu as lu cette ligne juste après l'étincelle.
repair.sparks=Quelque chose à l'intérieur claque, grésille et lâche un nuage de fumée. Tu recules avec un visage très prudent. || Une pluie d'étincelles, une odeur de brûlé et un long silence. Tu décides que tu n'as rien vu. || L'appareil ronronne, fait une étincelle et abandonne. Tu ne sais pas qui a perdu cette manche.
repair.flood=Tu desserres un tuyau de trop et l'eau se joint à la fête. Le sol est maintenant un étang. || La clé glisse, le tuyau lâche, et une fontaine naît. Splash. || Une minuscule fuite devient un problème pas si minuscule. Le sol est mouillé, et toi aussi.
repair.soaked=Une gerbe d'eau te frappe en pleine figure. Te voilà officiellement intégré à la plomberie. || Le tuyau gicle de côté et tu prends tout. Félicitations, tu es très propre et très frigorifié. || Tu tournes la mauvaise vanne et tu obtiens une douche gratuite. Tout habillé, bien sûr.
repair.fumble=Le tournevis remporte cette manche. Tu lâches tout et tu dis quelques mots. || Tu poses l'outil une seconde et il disparaît. L'objet est toujours cassé et ta patience aussi, mais pas dans le même sens. || Chaque vis que tu touches roule au loin. L'objet reste cassé et toi, agacé.
repair.wrong_part=Tu répares la mauvaise pièce, avec beaucoup d'assurance. La bonne pièce est toujours cassée et te voilà fatigué. || Tu changes une pièce qui n'avait pas besoin de l'être. Le vrai problème te fait coucou depuis le coin. || Réparé ! Enfin, quelque chose. Pas ce qui était cassé.
repair.thumb=Le marteau rencontre ton pouce. Ton pouce dépose une plainte officielle. || Un petit dérapage, un gros aïe. Tu te tiens la main et tu fais comme si de rien n'était. || Tu frappes exactement ce que tu visais, sauf que c'était ton doigt.
repair.flood_safe=Le tuyau crache une petite flaque, puis se ravise. Sol mouillé, chaussures mouillées, ego au sec. || Un peu d'eau se faufile et fait une flaque. Rien qu'une serpillière ne règle, mais tu la fixes quand même. || Le tuyau rote un peu d'eau sur le sol. Ce n'est qu'une flaque, mais c'est TA flaque.
repair.repair_all=Quelque chose se débloque. Tout ce qui était cassé par ici revit d'un coup, et tu t'en vas comme une légende de la réparation. || Tes mains bougent toutes seules. Quand tu poses l'outil, plus rien n'est cassé ici. Du héros pur. || Une réparation parfaite, puis une autre, puis toutes. Tout ce qui était cassé revient, et la boîte à outils applaudit.
repair.shock_death=Tu tends la main dans l'appareil... un éclair vif est la dernière chose que tu vois. Fin. || ZAP. Les lumières vacillent, tu t'écroules, et le manuel de réparation se referme tout seul. Générique de fin. || Le mauvais fil au mauvais moment. Tu étais un excellent réparateur... un temps. Fin.
laundry.bonus=Les vêtements sortent doux, chauds et parfumés comme une prairie de printemps. Plier devient presque amusant. || Un cycle sans faute. Chaque chaussette a sa jumelle, et aucune n'est rose. || Le linge est impeccable et parfaitement sec. Tu te sens pro de la lessive.
laundry.crit_success=Lessive parfaite. Les blancs sont plus blancs, les couleurs plus vives, et tu plies comme un hôtel. || Le cycle se termine et tes vêtements paraissent neufs. Une chorale fredonne quelque part. || Toutes les taches ont disparu, toutes les chaussettes sont assorties, toutes les chemises sont nettes. Les dieux de la lessive sont contents.
laundry.soft_fail=Le linge sort un peu froissé et un peu humide, mais portable. || Quelques taches survivent au cycle. Tu décides que ça fait du caractère. || Tu lances, tu espères, et les vêtements sortent à peu près bien.
laundry.crit_fail=Rétréci, rose, inondé et une chaussette en moins. Un chef-d'œuvre de désastres de lessive. || La machine déborde, ta chemise rétrécit, et la chaussette rouge frappe encore. Tu gagnes une médaille du chaos. || Un déluge de mousse, une garde-robe ruinée et une chaussette disparue en un seul cycle. Impressionnant, à sa façon.
laundry.shrunk=Tu laves ton pull préféré à chaud. Il irait maintenant à un très petit ours. || L'étiquette disait lavage à froid. Tu l'as lue après le cycle. La chemise est désormais un crop top. || Tu ouvres la machine et sors ton jean. Il est taille poupée. Le lave-linge est content de lui.
laundry.pink=Une seule chaussette rouge se glisse dans les blancs. Tout ce que tu possèdes est rose maintenant. || Tu voulais des chemises blanches fraîches. Tu as eu un coucher de soleil rosé et une leçon de tri. || Le linge ressort d'une seule couleur : saumon. Ta garde-robe entame une nouvelle ère audacieuse.
laundry.lost_sock=Tu comptes les chaussettes deux fois. L'une a encore disparu dans la dimension cachée de la machine. || Sept chaussettes entrent, six sortent. Le lave-linge fait collection. || Une chaussette solitaire te regarde depuis le tambour. Sa jumelle a disparu pour toujours.
laundry.slip=Tu marches sur une traînée de mousse de la machine. Le sol gagne et tu tournoies comme un patineur. || Une flaque d'eau savonneuse tend une embuscade à tes chaussettes. Wheee... boum. || Tu portes le panier droit dans une zone mouillée. Le linge vole, et toi aussi.
laundry.flood=Le tuyau se détache et la machine inonde le sol. Tu te retrouves dans un lac très propre. || Trop de lessive, pas assez de bon sens. Une vague de mousse envahit la pièce et la machine abandonne. || Un gargouillis, un bang, et une fontaine d'eau savonneuse. La buanderie est maintenant une piscine.
laundry.break=Tu appuies sur un bouton qui n'était pas fait pour ça. La machine gémit et s'éteint. || Quelque chose clonque, cliquette et s'arrête dedans. Le tambour est bloqué en plein cycle, et ton moral aussi. || La machine tremble, fume un peu et meurt. C'était sympa de la connaître.
laundry.burnout=La machine hurle, fait des étincelles et lâche une petite flamme fumante avant de mourir. Jour de lessive annulé. || De la fumée, des étincelles et une courte flamme à l'arrière de la machine. C'était un bon lave-linge. C'était un vieux lave-linge. || Quelque chose surchauffe à l'intérieur et la machine s'éteint dans un nuage de fumée. Tes vêtements attendront.
laundry.laundry_cash=Tu vérifies le linge et trouves ${m} pliés dans la poche de ton vieux pantalon, une seconde avant que la machine en fasse des confettis. || Une liasse froissée de ${m} dans le jean que tu jurais vide. Le lave-linge prend le jean, toi tu gardes le cash. || Tu fouilles toutes les poches avant le cycle et tu touches le jackpot : ${m}. Toi du passé était un génie. Toi du présent est riche. || Mystère résolu : c'est là que sont passés ${m}. Ils se cachaient dans ton pantalon depuis le début. || Tu trouves ${m} dans une poche juste avant l'essorage. La machine a l'air déçue de les avoir ratés.
laundry.flood_safe=La machine cliquette, crache un nuage de peluches et abandonne. Un seul mouton de poussière roule jusqu'à tes pieds. || Un gros clonk, un triste crachotement et le tambour se tait. Un petit nuage de poussière se pose près de tes chaussures. || Le cycle se bloque et la machine rote un petit nuage gris de peluches. Le sol reçoit un minuscule mouton de poussière et toi le blâme.
cooking.bonus=L'odeur est incroyable. Tu goûtes et tu hoches la tête comme un chef à la télé. || Une pincée de chance et le plat est parfait.
cooking.crit_success=Un chef-d'œuvre. Les restaurants supplieraient pour cette recette.
cooking.soft_fail=Ça ne ressemble en rien à la photo, mais c'est comestible. Probablement.
cooking.crit_fail=Fumée, étincelles et un cuisinier très perdu. Aujourd'hui, tu as inventé un nouveau niveau de catastrophe de cuisine.
cooking.burn=Tu attrapes la poêle brûlante à mains nues, très sûr de toi. Elle n'est pas d'accord. Tu sautilles en agitant la main. || La vapeur te prend et la poêle aussi. Cuisiner est dangereux, apparemment.
cooking.food_poison=Le plat sent le louche, a un goût louche, et ton estomac prépare une tournée de vengeance. || Tu cuisines avec beaucoup de confiance et zéro hygiène. Ton estomac enverra un avis plus tard.
cooking.mess=De la farine au plafond, de la sauce au mur et une poêle qui fume. Où la recette a-t-elle déraillé ? || La cuisine ressemble à un champ de bataille. Tu es la seule victime.
cooking.fire=Tu détournes les yeux une seconde et la poêle prend feu. La cuisine a des avis sur ta cuisine. || Des flammes ! La cuisinière a décidé de faire preuve de créativité et tu n'es vraiment pas prêt. || L'huile devient ambitieuse, la flamme grandit, et ton dîner devient officiellement un danger d'incendie. Cours !
cooking.explosion=Le four fait un bruit qu'aucun four ne devrait faire. Puis un plus gros. Le dîner est maintenant une scène de crime. || Quelque chose là-dedans n'était PAS censé être chauffé. La cuisine répond par un gros bang. || Tu lances, le four y réfléchit, puis explose comme un feu d'artifice.
cooking.appliance_break=Tu appuies sur le bouton et l'appareil fait bang, puis meurt. Le dîner sera à emporter. || Quelque chose étincelle dans le four. Tu te retournes pour t'excuser, mais il est déjà parti.
cooking.takeout=Le dîner est une cause perdue, alors tu commandes à emporter. Ça arrive vite et ça coûte ${m}. Cuisiner est un voyage. || Tu admets ta défaite et appelles la pizzeria. ${m} plus tard, tout le monde est content. || Le détecteur de fumée hésite, alors ce sera une livraison. Total : ${m}.
cooking.explosion_safe=Le four fait un petit bang, puis se tait. Tu choisis d'appeler ça de l'assaisonnement. || Un petit bang et un four très dramatique. Personne n'est blessé, juste vexé. || Le four claque une fois, fort. Heureusement que ce n'était qu'un petit boum.
cooking.fire_safe=La poêle claque comme un pétard, tu pousses un cri, puis tout redevient calme. Heureusement que ce n'était qu'un petit pop... || La cuisinière crache un minuscule bang, puis se ravise. Heureusement que ce n'était qu'un petit bang... || Un petit pop, un nuage de rien et une cuisine qui sent un barbecue qui n'a jamais eu lieu.
dining.bonus=Le frigo contient exactement ce que tu voulais, et c'est encore meilleur que ça en a l'air. Une petite victoire. || Température parfaite, portion parfaite. Tu manges comme si tu avais un rendez-vous important. || Chaque bouchée fait mouche. Tu finis même l'assiette sans une miette.
dining.crit_success=Un repas digne d'applaudissements. Tu lèches l'assiette et personne ne peut t'arrêter. || Un chef pleurerait. Toi, tu manges, c'est tout. Pur bonheur. || La meilleure bouchée de ta semaine. Tu fermes les yeux et tu restes là un moment.
dining.soft_fail=Un peu de sauce qui coule, un petit oups. Tu essuies la table et tu fais comme si rien ne s'était passé. || La nourriture est un peu limite mais tu la finis quand même. La fierté est une sauce. || Tu la laisses presque tomber, tu la rattrapes, et tu hoches la tête comme si c'était prévu.
dining.crit_fail=Tu portes l'assiette avec assurance, puis avec panique, puis plus du tout. Le sol reçoit le repas et toi le sol. || Le bol décolle et la soupe prend le sol. Toi aussi. Le déjeuner est devenu une anecdote. || Un éternuement, un renversement et le pire atterrissage possible. Le repas et ta fierté sont partout.
dining.spill=Le bol bascule et le dîner touche le sol. Le sol était déjà poussiéreux, et c'est maintenant une scène. || Tu laisses tomber la moitié du repas et un nuage de miettes et de poussière monte. La cuisine n'est pas contente. || Une inclinaison maladroite, un fracas, et un désordre s'étale sur le sol. Le nettoyage attendra.
dining.burnt_tongue=Tu croques avant que ça refroidisse. Ta langue dépose une plainte, et tes yeux aussi. || Trop chaud, trop vite. Tu t'éventes la bouche comme un tout petit dragon. || La première bouchée, c'est de la lave. La deuxième est une mauvaise idée. Tu la prends quand même.
dining.choke=Une bouchée passe de travers. Tu tousses, tu siffles, tu te remets avec un signe de tête très digne. || Tu inhales la moitié du repas et une partie veut ressortir. De l'eau, vite. || Une quinte de toux, quelques larmes et un pouce levé. Ça va. L'assiette te juge.
dining.food_coma=À mi-assiette, tu es déjà fini pour la journée. Tes paupières abandonnent les premières. || Un repas lourd, un lourd soupir et un long regard dans le vide. La sieste t'appelle. || La nourriture était géniale. Le corps est maintenant hors ligne pour maintenance.
dining.bad_leftovers=Ces restes sentaient bon, ce que les restes mentent toujours. Ton estomac commence à protester. || Tu manges le truc au fond du frigo. Le frigo essayait de te prévenir. || Ça avait l'air correct et ça avait bon goût. Ton estomac a d'autres avis.
dining.machine_eats_coin=Le distributeur prend ta pièce et ne te donne rien, avec assurance. || Tu appuies sur le bouton. La machine ronronne, réfléchit, et garde ton argent.
dining.fountain_splash=L'eau jaillit plus haut que prévu. Ton t-shirt fait maintenant partie de la fontaine. || Tu te penches pour boire et tu prends une gerbe d'eau froide en pleine figure.
programming.bonus=Le code compile du premier coup. Suspect, mais bienvenu. || Tu trouves la solution élégante et tu te sens comme un sorcier.
programming.crit_success=Code sans faille, zéro bug et une ovation debout dans une salle vide.
programming.soft_fail=Ça tourne, à peu près. Les avertissements seront un problème pour le toi du futur.
programming.crit_fail=Tu fais un rm -rf sur un truc qu'il ne fallait pas et le matériel se joint à la fête. Effondrement total du système.
programming.stress=Ton code compile à la cinquième tentative et plante à la sixième. Ton œil tressaille en rythme. || Un point-virgule manquant te prend une heure de vie. Un café, quelqu'un ?
programming.frustrated=Tout marchait il y a une minute. Tu n'as rien touché. Tu en es très sûr. || Le bug disparaît, puis revient, puis est ailleurs. Tu tapes sur le bureau.
programming.shock_break=Un pop, un éclair, et ton ordinateur s'éteint dans un nuage de fumée. La décharge n'est que l'insulte finale. || Tu appuies sur entrée et la machine riposte. Les étincelles volent, littéralement.
programming.crash=L'écran passe au bleu, puis au noir, puis meurt. Tout le travail non sauvegardé part avec. || Ton ordinateur pousse un petit soupir et jette l'éponge. Il en avait assez.
programming.hack=Tu jurais que ton logiciel était inpiratable. Un hacker vient de te donner tort et a retiré ${m} de ton compte. Son mot dit « merci pour le tuyau ». || Ton super mot de passe était « password1 ». Quelqu'un a vidé ${m} de ton compte avant que tu finisses ton café. || Un inconnu a trouvé la porte dérobée que tu avais oublié de fermer et s'est servi de ${m}. Belle coopération avec ton toi du passé.
programming.bounty=Tu trouves un bug critique dans une appli célèbre et tu le signales poliment. Ils paient une prime de ${m}. Tu fais comme si c'était prévu depuis le début. || Ta pull request corrige un truc que personne n'arrivait à régler depuis des années. Les mainteneurs t'envoient ${m} et un très long remerciement. || Une entreprise lit ton petit rapport d'exploit bien propre et te vire ${m}. Le sweat à capuche était un bon investissement.
programming.freelance=Un client paie ${m} pour un petit service. Dix minutes de travail et trois ans d'expérience. || Tu répares le site d'un inconnu par chat et il insiste pour t'envoyer ${m}. Qui es-tu pour refuser ? || Un petit boulot d'appoint tombe dans ta boîte, et ${m} tombent sur ton compte juste derrière.
logic.bonus=Les pièces s'emboîtent. Tu te sens vraiment malin. || Tu repères la faille dans l'argument avant tout le monde. Une joie discrète et suffisante. || Des faits, puis de la logique, puis une conclusion qui tient vraiment. Délicieux.
logic.crit_success=Chaque question résolue, chaque piège repéré. Tu pourrais donner un cours. || L'énigme se plie comme du papier. Tu te renverses en arrière et la chaise craque de respect. || Un raisonnement parfait, du début à la fin. Brillant, vraiment.
logic.soft_fail=Presque, mais la logique a un trou où passerait un camion. || Tu y es presque. « Presque » fait beaucoup de travail ici. || La réponse est tout près. Tu ne sais pas trop où.
logic.crit_fail=Tu suis un argument très convaincant jusqu'à un endroit très faux. Effondrement total. || Tout ce que tu croyais il y a trois minutes était faux. Et ce que tu crois maintenant aussi. || De l'assurance, une bourde et un redémarrage mental complet. Tu repars de zéro.
logic.headache=Trop d'onglets, trop de faits. Ta tête commence à pulser. || Tu relis le même paragraphe six fois et ça ne devient jamais plus facile. || Une douleur sourde derrière les yeux dit que c'est assez réfléchi pour aujourd'hui.
logic.rabbit_hole=Un lien en a amené un autre et dans ta tête, il est trois heures du matin. || Tu as commencé par une simple question et fini en lisant sur le fromage médiéval. || La recherche est devenue intéressante. La recherche est devenue très longue.
logic.wrong_answer=Tu étais si sûr. Le corrigé a été plus gentil que nécessaire. || Tu réponds avec assurance. La réponse est fausse avec la même assurance. || Une supposition audacieuse, plus audacieuse que juste.
logic.overthinking=Tu réfléchis tellement à la question que tu oublies laquelle c'était. || Plus tu analyses, moins ça a de sens. Réfléchir, ironiquement, fait mal. || Tu construis une théorie parfaite puis tu remarques que tu es parti du mauvais fait.
logic.argument=Tu expliques la logique. {t} explique pourquoi elle est fausse. Maintenant, vous expliquez tous les deux. || Ton argument parfait a un trou que tu n'avais pas vu. {t} le voit et ne dit rien, bruyamment. || Tu gagnes la discussion dans ta tête. À voix haute, {t} la gagne en une phrase.
logic.lost_thread=Tu pars d'un point clair et tu le perds en pleine phrase. {t} attend gentiment qu'il revienne. || La logique s'effondre à mi-chemin. Tu cliges des yeux vers {t} et tu dis « je disais quoi ? » || Un argument sans faille qui s'arrête sans faille au milieu. {t} hoche la tête comme si ça avait un sens.
logic.pedantic=Tu corriges {t} sur un minuscule détail. {t} te regarde comme si tu avais mangé le dernier biscuit. || Techniquement, tu as raison. {t} te fixe avec l'énergie d'une porte fermée. || Tu gagnes un point dont personne ne se souciait. {t} prend une longue inspiration.
logic.falls_asleep_reading=Le livre est si calme. Tu cliges des yeux une fois, et tu te réveilles à la page 40 avec une marque sur la joue. || Tu lis trois lignes, puis les mots commencent à bouger. Une sieste a été faite.
logic.quiz_prize=Tu réponds à la dernière question avant que l'animateur ait fini de la poser. Le prix est de ${m} et un rare sentiment de supériorité. || Tes connaissances en culture générale paient enfin : ${m}. Tous ces faits bizarres étaient un investissement. || Tu résous l'énigme en un temps record et une fenêtre te verse ${m}. Mensa n'a pas pu être joint pour commenter.
finance.bonus=Les chiffres s'alignent et ton instinct a raison pour une fois. Une petite victoire discrète. || Tu lis le graphique comme un livre et le graphique se tient bien. Très fluide. || Un bon coup, une main sûre et un écran vert. Tu t'adresses un signe de tête.
finance.crit_success=Chaque coup porte. Le marché t'adore et tu fais semblant d'être humble. || Tu achètes bas, tu vends haut et tout était voulu, étrangement. Légendaire. || Le graphique part à la verticale en ta faveur. Tu fermes le portable comme un méchant de film.
finance.soft_fail=Rien d'extraordinaire, juste un petit repli et beaucoup de plissements d'yeux. || Tu es à l'équilibre et tu appelles ça une leçon. Une leçon très ennuyeuse. || Le marché hausse les épaules et toi aussi.
finance.crit_fail=Tu vends au plus bas et tu achètes au plus haut, un rare doublé. Le marché le remarque. || Un mauvais clic et tout le plan part dans le rouge. Ton estomac chute avec le graphique. || Le graphique part à la verticale, dans le mauvais sens. Tu le fixes comme s'il te devait des excuses.
finance.bad_trade=Tu étais sûr de celui-là. Le graphique n'est pas d'accord, bruyamment. || Le tuyau venait d'un inconnu très confiant. C'était la première erreur. || Tu tiens un peu trop longtemps, puis tu vends un peu trop tard. Un classique.
finance.panic=La ligne chute et ton cœur avec. Tu rafraîchis la page neuf fois. || Des chiffres rouges partout. Tu respires dans un sac en papier, au figuré. || Ta main plane au-dessus du bouton vendre et tremble. Le marché n'attend pas.
finance.rage=Tu traites le marché de noms qu'un ordinateur poli ne devrait pas entendre. || Tu tapes sur le bureau et le graphique continue de descendre. Impoli. || Ton poing et le bureau tiennent une courte réunion. Le bureau gagne.
finance.glitch=Le site de trading plante à la pire seconde possible. Ton ordinateur aussi. || Une fenêtre, une roue qui tourne et un écran figé. Le marché a pris ta session en otage. || La machine abandonne sous le poids de tes mauvaises décisions.
finance.scam=Un message dit que tu as gagné quelque chose. Tu cliques. ${m} quittent ton compte en vitesse. || Un prince très aimable avait besoin d'un petit service. Le service a coûté ${m}. || L'investissement avait l'air sérieux, avec un logo et tout. Ce n'était qu'un logo. ${m} ont disparu.
finance.lottery_counterfeit=Le ticket est un faux. L'employé est vraiment désolé et tu perds ${m}. || Un ticket contrefait, un sourire jovial et ${m} envolés. Tu entends presque l'imprimante rire. || Les numéros ont l'air bons et le papier a l'air faux. Un faux très convaincant te coûte ${m}.
finance.lottery_washed=Le ticket passe à la machine avec ton jean. Il reste des confettis gris et ${m} de perdus. || Tu retrouves le ticket dans le sèche-linge, devenu une petite boule de papier. Le gain reste non réclamé et le ticket a coûté ${m}. || Une poche, un lave-linge et un ticket détrempé. Un jour de pluie, ${m} perdus.
finance.lottery_old_draw=Tu fêtes ça pendant une bonne minute avant de remarquer que c'était le tirage de la semaine dernière. Le ticket a coûté ${m}, ta fierté aussi. || Les numéros sont parfaits. La date, hélas, non. ${m} pour une leçon très chère. || Un gros gain, des petites lignes et ${m} sortis de ta poche. Le tirage datait de la semaine dernière.
finance.lottery_text_scam=Un SMS dit que tu as gagné un lot et que tu dois juste payer de petits frais. Les frais sont de ${m}. Le lot n'arrive jamais. || Un message très amical, un lien sur lequel il ne fallait pas cliquer et ${m} envolés. || « Réclame ton lot maintenant ! » Tu l'as fait. Ça a coûté ${m}.
finance.card_swallowed=La machine avale ta carte et imprime un reçu qui dit « bonne chance ». || Des frais cachés apparaissent. Tu les fixes comme s'ils allaient changer.
finance.hidden_fee=Des petits frais que tu n'avais pas vus venir grignotent un peu ton argent. || Ah, les « frais de commodité ». Commodes pour quelqu'un.
finance.lottery_dud=Tu grattes, tu espères, tu perds. Le ticket est un marque-page très cher. || Trois numéros correspondent. Sur six. Pas ces trois-là.
finance.lottery_jackpot=Six numéros, tous les tiens. Tu relis le ticket trois fois, puis une fois de plus à voix haute. Le gain est de ${m}. || Les numéros s'alignent un à un et le ticket devient soudain très lourd. ${m} arrivent sur ton compte. || Tu gagnes ${m}. Tu cherches l'arnaque, tu n'en trouves pas et tu commences à planifier une fête très responsable.
finance.lottery_lucky=Un petit lot : ${m}. Pas de quoi changer de vie, mais assez pour un autre ticket. || Le ticket rapporte ${m}. Tu y vois un signe et tu ignores poliment les probabilités. || Deux numéros identiques et ${m} pour ta peine. L'univers te fait un clin d'œil.
finance.dividends=Une action que tu avais oubliée verse ${m}. Toi du passé te dit bonjour. || Un petit dividende tombe : ${m}. Ce n'est pas grand-chose, mais c'est à toi. || Ton portefeuille crache ${m} comme un chat poli. Tu acceptes le cadeau.
finance.lottery_soft=Deux numéros correspondent, un autre est faux d'un chiffre et le reste est loin du compte. Le ticket rejoint le tiroir de l'espoir. || Tu grattes en grande cérémonie. Rien. Tu grattes encore, au cas où. || Pas gagnant. Le ticket fait un tout petit bruit très poli qui veut dire « une autre fois ».
gaming.bonus=Tes réflexes sont affûtés, l'équipe est bavarde et le butin est généreux. Une bonne soirée. || Tu lances le plan, l'équipe suit, et l'écran affiche VICTOIRE. Ta chaise tourne un peu. || Tout s'enclenche. La visée, le timing, le snack. Tu es le personnage principal.
gaming.crit_success=Une partie sans faute. Le chat est debout, et toi aussi, à peine. || Tu gagnes un match que personne ne croyait gagnable. Tu te lèves et fais un petit tour d'honneur. || Première place, zéro mort et un clip à envoyer à tout le monde.
gaming.soft_fail=Tu perds la manche mais tu gardes ton calme. À peu près. || Une défaite de peu. Tu accuses le lag et tu relances une manche. || Pas ton meilleur match, pas ton pire. La manette survit.
gaming.crit_fail=Ton coéquipier part, ta connexion part, puis le courant part. L'écran devient noir en pleine partie parfaite. || Tu rages tellement que le clavier demande une ordonnance de protection. Match perdu, et plus encore. || Quitter, revanche, perdre, quitter. Quelque part, une manette vole. Personne n'est fier.
gaming.rage_quit=Tu perds à cause d'un bug qui était clairement la faute du jeu. Tu es très calme. Tu n'es pas calme du tout. || À cinq minutes de la victoire, une fenêtre surgit et met fin au match. Tu dis des mots. || Le boss final t'élimine d'un coup pour la neuvième fois. La chaise encaisse ta frustration.
gaming.burnout=Trois heures de jeu, tes yeux sont secs et tes pouces ont mal. Une pause serait peut-être bienvenue. || Tu avais promis une dernière partie. C'était il y a six parties. Ton dos dépose une plainte. || Le jeu continue encore. Pas toi. Un long soupir et un long étirement.
gaming.crash=Le jeu se fige, le ventilateur hurle et l'écran s'éteint. L'ordinateur en a assez de tes parties. || Trop d'onglets, trop de mods et un combat de boss de trop. La machine abandonne. || Un gros pop venu du boîtier, puis le silence. Le fichier de sauvegarde est quelque part dans l'au-delà.
gaming.pc_fire=Les ventilateurs du PC hurlent, une flamme jaillit du boîtier et tout s'éteint. Ta sauvegarde a eu une belle vie. || De la fumée, une petite flamme et un ordinateur mort. Il était peut-être temps de le changer de toute façon. || La carte graphique a choisi la violence : une flamme, puis un écran noir. Personne ne t'en veut. Tout le monde t'en veut.
gaming.microtransaction=Tu tapes sur un bouton brillant pour voir ce qu'il fait. Il fait un achat de ${m}. L'épée est un chapeau. || Un coffre à butin s'ouvre dans un feu d'artifice avec une facture de ${m}. À l'intérieur : un tout petit trophée. || Le jeu propose un pack de départ pour une durée limitée. La durée, c'était maintenant, le prix, ${m}.
gaming.tournament=Tu remportes la dernière manche avec un seul point de vie. La cagnotte verse ${m}. Tu hurles dans une pièce très silencieuse. || Un minuscule tournoi en ligne, un minuscule prix et un gros coup pour l'ego : ${m} sont à toi. || Ton équipe gagne et tout le monde crie dans le chat vocal. Les gains sont de ${m}, et tu ne te souviens de rien du match.
gaming.stream_tips=Un spectateur de ton stream envoie ${m} avec le message « beau jeu ». Les deux font plaisir. || Un viewer lâche ${m} pour l'ambiance. Tu le remercies à l'antenne, deux fois. || Un tout petit public, un pourboire de ${m} et assez de confiance pour streamer demain aussi.
media.bonus=Le montage coule, les couleurs claquent et le fichier s'exporte sans une seule erreur. Magique. || Ton montage a du rythme. Même les plans de coupe ont l'air voulus. || Un rendu propre, une timeline propre et un hochement de tête très satisfait.
media.crit_success=Un chef-d'œuvre en devenir. Tu appuies sur enregistrer avec une révérence silencieuse. || La vidéo ressemble à un vrai film. Tu la revois trois fois pour être sûr. || Chaque image est juste, chaque coupe est parfaite. Te voilà auteur.
media.soft_fail=Ça s'exporte, mais le son est juste un peu décalé. Personne ne le remarquera. Probablement. || La couleur est un peu à côté, la coupe un peu brute. Assez bien, presque. || Une tentative honnête. Le résultat final dit « peut mieux faire ».
media.crit_fail=Le logiciel avale trois heures de travail, puis tout le projet. Pas même une sauvegarde. || Tu lances le rendu et l'ordinateur riposte. Étincelles, fumée et une pièce très silencieuse. || L'export plante, le fichier se corrompt et la timeline est une carte des regrets.
media.render_crash=La barre de rendu atteint 99 pour cent et la machine s'endort pour toujours. || L'ordinateur devient bruyant, brûlant, puis très, très silencieux. || Le ventilateur hurle, l'écran clignote et le projet meurt dans les flammes.
media.corrupted=Le fichier refuse de s'ouvrir. Tu essaies neuf fois. Il refuse neuf fois. || Un seul mauvais clic et le clip devient de la neige verte. || Le projet s'est enregistré en un tout petit fichier très cassé.
media.burnout=Huit heures de montage et la timeline a toujours la même tête. Tes yeux ne sont pas d'accord avec l'horloge. || Tu fixes les deux mêmes secondes de rushes pendant une heure. Elles te fixent en retour. || Ton dos dit non, tes yeux disent non et ta timeline dit peut-être demain.
media.bad_take=Tu regardes le montage final et tu grimaces. Un peu de tout a mal tourné. || Le son est faible, la vidéo sombre et la blague ne passe pas. || Quelque part entre l'idée et la vidéo, l'idée s'est perdue.
media.copyright=Une réclamation de droits d'auteur apparaît sur ta vidéo. La chanson ne durait « que cinq secondes ». L'amende est de ${m}. || Un studio retrouve le clip que tu avais « totalement assez modifié ». Leurs avocats te facturent ${m}. || Ton chef-d'œuvre utilise une bande-son très célèbre sans autorisation. ${m} partent en dommages.
media.viral=Ta vidéo explose du jour au lendemain et les revenus pub arrivent : ${m}. Les commentaires disent « premier ». Toujours. || Un clip que tu avais failli supprimer devient viral. La plateforme envoie ${m} et ton téléphone n'arrête plus de vibrer. || Tout le monde partage ton montage. Une marque débarque avec ${m} et un mail suspicieusement chaleureux.
media.sponsor=Une petite marque adore ta chaîne et envoie ${m} pour dire que ton logo est joli dans le coin. || Un sponsor paie ${m} pour être mentionné huit secondes. Tu le mentionnes neuf. || Un code promo et ${m} pour ta peine. Le marketing marche vraiment sur toi.
music.bonus=Une mélodie arrive de nulle part et s'assoit comme chez elle. Joli. || Les accords s'ajustent comme s'ils t'attendaient. Le rythme est détendu et sûr. || Tu fredonnes l'accroche et ça marche, tout simplement. Un air à garder.
music.crit_success=Un tube. Tu entends la foule chanter en chœur, et la foule, c'est toi. || La chanson s'écrit toute seule, puis se joue toute seule, puis te fait pleurer un peu. Magnifique. || L'accroche parfaite, le rythme parfait, la fin parfaite. Un vrai banger.
music.soft_fail=La mélodie est jolie, le reste non. Tu l'enregistres sous « brouillon 14 ». || Un début correct avec un milieu très inachevé. || La chanson va quelque part, mais pas nulle part de bien.
music.crit_fail=Le morceau sonne comme un chat qui marche sur un piano dans un tunnel. Tout le monde se bouche les oreilles. || Tu supprimes toute la session par accident. Le silence est très instructif. || La chanson est affreuse, puis elle empire, on ne sait comment. Un nouveau record.
music.off_key=Tu fais une note que le reste de la chanson désapprouve. Bruyamment. || Quelque part entre le couplet et le refrain, la tonalité a changé sans te prévenir. || Une fausse note, une longue pause et une grimace très honnête.
music.block=Tu fixes une piste vide pendant une heure. La piste vide gagne. || Chaque idée ressemble à quelque chose que tu as déjà entendu. Parce que tu l'as entendu. || L'inspiration a pris sa journée, sans laisser de mot.
music.lost_file=Le projet se ferme sans enregistrer. Ta chanson s'envole comme un ballon. || Un mauvais clic supprime le meilleur passage du morceau. C'était le bon. || Le fichier de sauvegarde s'avère vide. Ton génie a disparu, tout en silence.
music.studio_bill=Le studio te réserve pour une séance rapide. La facture est de ${m}, avec des frais pour une chaise où tu ne t'es jamais assis. || Tu loues un meilleur micro pour l'ambiance. L'ambiance coûte ${m}. || Un musicien de session annule au dernier moment et garde l'acompte : ${m}. Le solo de guitare était imaginaire de toute façon.
music.string_snaps=Une corde de guitare casse dans un bang et te fouette le visage. Ça pique, et ta fierté aussi. || La corde fait « twang » d'une façon qu'elle ne devrait pas.
music.dropped_stick=Une baguette de batterie s'envole de ta main et atterrit à un endroit fâcheux. || Tu tiens le rythme. La baguette tient le sol. Le rythme a disparu.
music.sticky_keys=Les touches te résistent. Chaque accord sort un peu faux, et avec tant d'assurance. || Tes doigts se croisent et le résultat sonne comme un chat qui marche sur un clavier.
music.dj_scratch=Le scratch est fort, faux et très fier de lui. || Tu appuies sur le mauvais bouton et le morceau s'arrête net. Le silence est brutal.
music.royalties=Ton morceau passe dans un café quelque part et les droits arrivent : ${m}. Ta rock star intérieure se redresse. || Une série achète les droits de ta mélodie et envoie ${m}. Tu la fredonnes pour toi le reste de la journée. || Un chèque de streaming arrive avec ${m} dedans. Des dizaines d'auditeurs. Peut-être des centaines. Bon, peut-être ton cousin.
music.tips=Un ami aime tellement ta démo qu'il t'envoie ${m}. Soutenons les arts. || Un auditeur envoie ${m} avec le message « encore, s'il te plaît ». Tu obéis immédiatement. || Quelqu'un lâche ${m} dans ton chapeau virtuel. C'est, techniquement, un chapeau.
performance.bonus=Le rythme prend le dessus et tu tombes sur chaque temps. La salle est à toi. || Tu glisses dans la chorégraphie comme si tu étais né pour ça.
performance.crit_success=Une ovation debout, dans une salle d'une personne. Tu rayonnes quand même.
performance.soft_fail=Tu rates un pas ou deux mais tu gardes le groove. Personne n'a remarqué. Probablement.
performance.crit_fail=Tu glisses, tu pivotes et tu atterris dans une gerbe de honte. Même le rythme fait une minute de silence.
performance.embarrassed=Tes mouvements sont audacieux, ton timing non. Tu te figes en plein pas et tu fais comme si la musique s'était arrêtée. || Tout le monde regarde, et pas dans le bon sens. Tu fais un signe gêné et tu quittes la scène.
performance.stage_fright=Le projecteur t'éclaire et tes jambes oublient tout. Tu n'entends que ton propre cœur battre. || Tu entres en scène et le rythme s'éclipse. Quelque part, un public de zéro personne te juge.
performance.sad=Tu danses comme si personne ne regardait, puis tu remarques que c'était vrai. Un petit soupir suit. || La musique s'arrête et ta confiance aussi. Une autre fois, peut-être.
performance.fined=Un voisin dépose une plainte pour tapage et la ville te met une amende de ${m}. L'art, comme toujours, a un prix. || Un inspecteur dit que ton numéro exige une autorisation. C'est vrai. L'amende est de ${m}. || Quelqu'un appelle les autorités à cause de ton spectacle. La contravention coûte ${m}, et le spectacle continue en esprit.
performance.flat_note=La première note est ravissante. La deuxième est ailleurs. {t} sourit et encaisse. || Tu vises le cœur et tu tombes sur une autre touche. {t} applaudit poliment l'effort. || La sérénade atteint une note qui ferait aboyer le chien, s'il y en avait un. {t} hoche la tête courageusement.
performance.forgot_lyrics=Tu oublies les paroles au milieu de la chanson. {t} attend, les mains jointes, avec un regard doux. || Les paroles s'effacent de ta tête. Tu fredonnes un peu et tu fais comme si c'était voulu. || Tu cales dans le refrain. {t} sourit et te souffle la ligne suivante.
performance.too_loud=Tu chantes si fort que {t} sursaute. Les voisins ont peut-être entendu aussi. || La sérénade est passionnée et absolument assourdissante. {t} se bouche poliment une oreille. || Trop de volume, pas assez de contrôle. {t} aimerait que la chanson se termine, mais en douceur.
performance.mic_feedback=Le micro hurle en boucle de larsen. Tout le monde se bouche les oreilles. || Un sifflement strident, un silence stupéfait et un signe d'excuse.
performance.joke_dies=La chute arrive. Personne ne rit. Un grillon, si. || Tu livres la blague à la perfection. Le public livre le silence.
performance.cracked_voice=Ta voix déraille sur la grande note et continue un peu plus longtemps qu'elle ne devrait. || La note aiguë était une idée audacieuse. Elle s'est terminée en sifflement.
performance.knockout={t} perd son sang-froid et lance un coup de poing. Il touche, et tu t'écroules comme un sac de linge. || Cette blague était la goutte d'eau. {t} frappe, et la pièce bascule. Tu te réveilles face au plafond. || {t} devient rouge vif et te frappe en pleine figure. Ta dignité quitte les lieux avant que tu touches le sol.
performance.fight={t} en a assez. Une bousculade, un mot qui claque, et te voilà en pleine bagarre. || Un pas de trop. {t} se campe et fonce sur toi, poings en avant. || {t} le prend très mal et choisit de répondre avec les poings. Tu l'as cherché.
performance.police={t} n'en peut plus et compose déjà le numéro. Un signalement à la police arrive. || {t} te fixe une seconde et lâche « J'appelle la police. » Ça sonne très sérieux. || Ça a mal tourné. {t} porte plainte contre toi avant que tu aies fini de t'excuser.
performance.big_tip=Un passant lâche ${m} dans ton chapeau sans rien dire. Le silence est le compliment. || La foule s'enflamme et un inconnu laisse ${m}. Tu salues, puis tu comptes deux fois. || Aucun chasseur de talents ne se montre, mais ${m}, si. Tu les prends.
performance.busking_tips=Quelques pièces deviennent ${m} à la fin de la chanson. Quelqu'un a même applaudi. || Un gamin lâche ${m} dans ton chapeau et s'enfuit. Un tout petit mécène des arts. || Ton chapeau est plus lourd que ce matin : ${m}. Les pigeons applaudissent.
performance.knockout_death=Le coup de poing de {t} touche, tu t'écroules... et tu ne te réveilles pas. Fin. || Un seul coup de {t}. Tu t'effondres, le silence se fait, et tu ne te relèves pas. Générique de fin. || {t} lance un seul coup de poing. C'est, hélas, la dernière chose que tu remarques. Fin.
dance.bonus=Le beat tombe et ton corps sait déjà où aller. Fluide, sans effort, un peu content de lui. || Tu enchaînes chaque mouvement comme si le chorégraphe l'avait écrit pour toi seul. || Quelqu'un tout près se met à applaudir en rythme. Tu fais semblant de ne rien voir et tu ajoutes un tour.
dance.crit_success=Rythme pur. Même les meubles semblent se balancer. || Tu réussis un mouvement si net que tu t'applaudirais presque. || La salle se tait une seconde, puis tu lances le final. Statut de légende.
dance.soft_fail=Tu rates un pas ou deux mais tu gardes le groove. Personne n'a remarqué. Probablement. || Un petit trébuchement, un rapide shuffle, et tu continues comme si c'était chorégraphié. || Ton timing dérive quelques temps, puis retrouve son chemin.
dance.crit_fail=Tu t'engages dans un tour et le sol s'engage à gagner. Gravité : 1, toi : 0. || Ton pied part d'un côté, le reste de toi n'est pas d'accord. L'atterrissage n'a rien de gracieux. || Le mouvement avait fière allure dans ta tête. La salle l'a vu et ne peut plus l'oublier.
dance.puddle_slip=Une flaque suspecte attend sur la piste de danse. Tu la trouves en pivotant. || Tu lances le grand mouvement, ton pied trouve une flaque, et la suite est une danse d'un autre genre. || Personne n'a vu cette flaque. Tout le monde est sur le point de te voir dedans.
dance.embarrassed=Tes mouvements sont audacieux, ton timing non. Tu te figes en plein pas et tu fais comme si la musique avait changé. || Tu prends la pose pour le grand final et la chanson continue sans toi. || Quelqu'un regarde, et pas dans le bon sens. Tu fais un signe gêné et tu appelles ça de l'art.
dance.exhausted=Trois chansons plus tard, tes jambes déposent une plainte. Tu as fini, et ta batterie aussi. || L'enthousiasme était là. L'endurance a pris sa soirée. || Tu danses jusqu'à ce que tes genoux prennent la parole, puis tu t'assois et tu repenses à tes choix.
dance.sad=Tu danses comme si personne ne regardait, puis tu réalises que c'était vrai. Un petit soupir suit. || La musique s'arrête et ta confiance aussi. Une autre fois, peut-être. || La piste de danse est vide. Un instant, toi aussi.
dance.stepped_on=Tu marches sur le pied de {t} avec la grâce d'un piano qui tombe. Faire comme si ça ne faisait pas mal demande des efforts. || La danse se passe bien jusqu'au troisième pas. {t} saute sur un pied et en rit, à peu près. || Deux pieds gauches, le tien et le sien. {t} dit « ma faute » et vous savez tous les deux que non.
dance.dizzy=Le tour est trop rapide et la pièce bascule. Toi et {t} vous tombez dans les bras l'un de l'autre, la tête qui tourne et le fou rire aux lèvres. || Tu tournes, le monde continue de tourner, et tu perds l'équilibre. {t} te rattrape, ou essaie. || Tourner, tourner jusqu'à ce que le sol disparaisse. {t} grogne, toujours accroché.
dance.dip_dropped=Le dip tourne mal et {t} t'échappe des bras. Une chute gracieuse, techniquement. || Tu te penches pour le dip, {t} se penche de l'autre côté, et le sol vous prend tous les deux. Danser avec la gravité. || À mi-descente du dip, ta prise lâche. {t} touche le sol et dit « aïe » en deux syllabes.
dance.in_sync=Toi et {t} bougez comme un seul. Le rythme s'enclenche et une petite chaleur monte entre vous. || Chaque pas s'aligne. {t} sourit d'une façon qui dit que ça valait le coup. || Un tour parfaitement synchronisé, un rire partagé. Toi et {t} finissez la danse plus proches qu'au début.
dating.bonus=Ton profil reçoit une bonne réaction et une réponse drôle. Pas mal du tout. || La conversation coule, les blagues passent et quelqu'un dit aimer ton sens de l'humour. || Un match, un rire et un projet prometteur. Tu rougis devant l'écran.
dating.crit_success=Un match parfait, une super conversation et un rendez-vous qui sonne comme un film. Tu rayonnes. || Trois personnes répondent en même temps et toutes sont adorables. Quel problème à avoir. || Ta photo, ta bio et ton timing sont parfaits. Internet t'adore.
dating.soft_fail=Quelques réponses polies et aucune étincelle. Le profil mérite un nouveau regard. || Tu matches avec quelqu'un et la conversation meurt après « salut ». || L'appli te montre quelques visages. Aucun ne te fait signe en retour.
dating.crit_fail=Tu envoies un message à la mauvaise personne, le mauvais message et la mauvaise photo. Tout à la fois. || Ton profil est signalé par quelqu'un avec qui tu as matché. D'une façon ou d'une autre, c'est ta faute. || Désastre total : une faute dans ton prénom, une photo floue et une réponse qui dit « qui ? ».
dating.ghosted=La conversation se passait si bien, et puis l'autre personne a disparu. Pas même un au revoir. || Trois points apparaissent, disparaissent et ne reviennent jamais. Tu les fixes quand même. || Ton message a été lu et ça s'arrête là. Le silence est assourdissant.
dating.catfish=Les photos étaient très différentes de la personne. Très différentes. D'une autre espèce, même. || Le match charmant s'avère être un bot avec un très bon script. || Son profil disait « grand, drôle, honnête ». La conversation disait « envoie-moi une carte cadeau ».
dating.awkward=Ton premier message était une très longue blague qui demandait beaucoup d'explications. || Tu réponds « haha » d'une façon qui sonne très triste. || Une phrase d'accroche à faire rougir, envoyée avec une assurance indéfendable.
dating.typo=La correction automatique transforme un message doux en quelque chose de profondément fâcheux. || Tu appuies sur envoyer, puis tu vois la faute. La faute est dans le premier mot. || Une toute petite erreur, une énorme différence de sens. Tu t'en souviendras.
medicine.bonus=Le médicament agit vite et ta tête embrumée se dégage. Tu te sens presque neuf. || Bonne dose, bon moment. Ton nez se dégage et ton humeur aussi. || La pilule fait son travail en silence. Tu décides de faire davantage confiance aux pilules.
medicine.crit_success=Dose parfaite, timing parfait. Tu te sens mieux qu'avant d'être malade. || Le médicament agit comme dans un montage de film. Les mouchoirs volent, la musique joue, te voilà guéri. || Traitement d'école. Quelque part, un médecin ressent une étrange fierté.
medicine.soft_fail=Tu secoues le flacon, tu soupires et tu fais semblant d'être productif. || Tu décides que le rhume n'est pas si grave. Le rhume n'est pas d'accord. || Tu poses le médicament pour plus tard. Plus tard est très loin.
medicine.crit_fail=Tu attrapes le mauvais flacon. L'étiquette disait « pour les plantes ». Tu te sens très feuillu. || La pilule roule sous le canapé et tu prends celle d'à côté. Audacieux. Pas malin. || Tu prends un médicament prévu pour tout autre chose. Ton corps dépose une plainte officielle.
medicine.wrong_dose=Tu plisses les yeux sur l'étiquette, tu devines et tu devines faux. Les médicaments, ce n'est pas ce genre de jeu. || Tu en prends un peu trop peu, puis un peu trop. Le rhume reste et tu te sens bizarre. || Les instructions étaient claires et tu n'en as lu aucune. Le rhume est toujours là.
medicine.side_effects=Le médicament ne règle rien et te rend somnolent. Félicitations : un rhume avec mal de tête. || Ton estomac n'aime pas la pilule. Ton rhume s'en fiche. || Tu lis les effets secondaires après avoir pris le médicament. Il y en avait plus que prévu.
mourning.bonus=Une longue étreinte chaleureuse. {t} relâche un souffle qui semble retenu depuis le matin. || Tu ne dis pas grand-chose, et tu n'as pas besoin. {t} se penche vers toi et la pièce devient un peu plus calme.
mourning.crit_success=Tu serres {t} et les mots n'ont plus d'importance. Vous pleurez tous les deux, riez un peu, et pour la première fois aujourd'hui, ça paraît supportable. || {t} s'effondre dans tes bras et tu le laisses faire. À la fin, vous êtes tous les deux plus légers qu'au début. || Certaines étreintes disent ce que rien d'autre ne peut dire. Celle-ci dit tout, et le poids qui pèse sur vous deux s'allège d'un coup.
mourning.soft_fail=L'étreinte est raide et brève. {t} hoche poliment la tête, et la perte pèse un peu plus lourd qu'avant. || Tu tapotes le dos de {t} comme un inconnu à un arrêt de bus. Vous sentez tous les deux le raté. || Tes bras sont là mais pas les mots. Le silence qui suit est long et triste.
mourning.crit_fail=Tu t'accroches un temps de trop, tu dis exactement la pire chose, et {t} pleure encore plus fort. Toi aussi. || L'étreinte tourne à la crise de sanglots du mauvais genre. Le chagrin est plus lourd maintenant, et partagé à parts égales. || Tu as de bonnes intentions, vraiment. Ça sort comme la pire chose possible. {t} se tait, et toi aussi.
mourning.fail=Tu dis « mes condoléances » comme si tu le lisais sur une carte. {t} te remercie, et aucun de vous ne se sent mieux. || L'étreinte tombe au mauvais moment et le chagrin ne fait que grandir. Personne ne sait où mettre ses mains. || Tu essaies de réconforter {t} et tu finis par rappeler à vous deux tout ce qui manque.
mourning.pass=Une bonne étreinte. Elle ne règle rien, mais elle aide. || Tu serres {t} un moment. Certaines choses sont plus faciles quand quelqu'un d'autre en porte une partie.
sink.bonus=L'eau coule chaude du premier coup. Quelqu'un là-haut t'apprécie. || Tes mains ressortent si propres qu'elles couinent. Les chirurgiens seraient jaloux. || Pression parfaite, température parfaite. Un petit miracle dans la salle de bain.
sink.crit_success=Mains, visage, dents, tout est impeccable. Le miroir applaudit. || Le lavabo se comporte si bien qu'il mérite une médaille.
sink.soft_fail=L'eau est tiède et le savon presque vide, mais tu t'en sors. || Un peu d'éclaboussures, beaucoup de grognements, et tu es assez propre.
sink.crit_fail=Oh, regarde le bazar que tu as mis. Attention où tu mets les pieds, ça glisse ! || Tu tournes le robinet et tout le lavabo rend l'âme. De l'eau partout, de la dignité nulle part. || Le tuyau lâche un grognement, un pop et un geyser. La salle de bain est maintenant une piscine.
sink.flood=Oh, regarde le bazar que tu as mis. Attention où tu mets les pieds, ça glisse ! || Le robinet se brise net et l'eau part partout. Attention à la flaque, génie. || Un craquement, un sifflement, une fontaine. Le lavabo est cassé et il y a une flaque juste sous tes pieds.
sink.frustrated=Tu te bats avec le robinet jusqu'à ce qu'il se rende. Tu n'es pas calme du tout. || Chaque fois que tu tournes la poignée, c'est pire. Tu fusilles les tuyaux du regard comme s'ils te devaient de l'argent.
sink.splash=Tu t'éclabousses en plein visage et tu aimerais pouvoir rembobiner d'une minute. || Le robinet gicle de côté et trempe ton t-shirt. Très élégant.
sink.slip=Tu marches sur la zone mouillée que tu viens de faire. La gravité dépose une plainte. || Le sol est glissant, tes chaussettes sont glissantes, et ta chance aussi.
sink.fail=Le robinet crachote, tousse et t'asperge le visage. Impoli. || L'eau passe de froide à chaude puis à froide encore. Le lavabo a une personnalité. || Tu te bats avec le robinet et le robinet gagne.
sink.pass=Un lavage normal, ennuyeux et parfaitement fonctionnel.
toilet.bonus=Tout fonctionne. Ce sont les petites victoires qui comptent. || Une visite sans faute. Le trône de porcelaine approuve.
toilet.crit_success=Une chasse d'eau si fluide qu'elle devrait figurer dans un catalogue. || Une visite parfaite. La salle de bain sent le spa.
toilet.soft_fail=Il faut deux chasses, mais ça marche. Personne n'a rien vu. || Un peu bruyant, un peu lent, et c'est fini.
toilet.crit_fail=Les toilettes gargouillent d'une façon qui sonne chère. Attention où tu mets les pieds ! || Quelque chose a mal tourné dans la plomberie pendant que tu étais occupé. Reste calme et ne glisse pas. || Un horrible gargouillis et une flaque suspecte qui s'étale à tes pieds. Tu t'éloignes avec une grande dignité.
toilet.overflow=Les toilettes ont gargouillé de façon inquiétante et maintenant l'eau se répand. Attention où tu mets les pieds, ça glisse ! || Il y a une flaque à tes pieds. Tu fais comme si de rien n'était. || La cuvette a recraché une vague surprise. Te voilà dans une flaque, à essayer de garder ta dignité.
toilet.clog=Tu as appuyé sur la chasse, elle a gargouillé, réfléchi et abandonné. Tu fixes la cuvette en silence. || La chasse ne fait rien. Tu réessaies, encore et encore. Les toilettes ont choisi la violence.
toilet.gross=Celui qui est passé avant toi a laissé une surprise. Ton estomac n'est pas amusé. || Tu regardes dans la cuvette, tu le regrettes, et tu détournes les yeux très vite.
toilet.embarrassed=Tu es presque sûr que quelqu'un a entendu ça. Tu fais comme si c'étaient les tuyaux. || La porte n'était pas verrouillée. Personne n'a besoin d'en parler.
toilet.fail=La chasse est faible et les toilettes font un bruit grossier. Tu fais comme si de rien n'était. || La lunette est froide, le papier a disparu, et la journée démarre mal.
toilet.pass=Mission accomplie. Rien n'a explosé.
