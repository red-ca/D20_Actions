# -- Fitness
fitness.bonus=Something clicks. The weights feel lighter and your form looks suspiciously professional. || You hit a groove and feel unstoppable. The gym mirror nods in approval.
fitness.crit_success=Legendary rep! Somewhere a protein shaker weeps with pride.
fitness.soft_fail=Rough set, but you grind it out anyway. || Your form wobbles and so does your ego, but the rep gets done.
fitness.crit_fail=You go all in on the lift and your body files a formal complaint. The set is over before it starts. || A sound comes out of your back that no human back should make. Rep cancelled. || The bar wins. It always wins. You slink away with your pride in a sling.
fitness.heat=The workout turns into a sauna session. You fan yourself, sweat pours down and the room starts to spin. || You overdo it in the heat. Your shirt is soaked, your face is red and your body demands a fan, an ocean and a nap. || Heat stroke knocks politely, then kicks the door in. You stagger out dripping with sweat.
fitness.exhausted=Your legs give out on the last rep. You collapse and stare at the ceiling, thinking about your life choices. || You push past your limit and the limit pushes back. Down you go.
fitness.sore=Something in your body files a complaint you will feel for two days. Tomorrow will be fun. || You pushed too hard. Your muscles call a strike effective immediately.
fitness.slip=Your foot slides at the worst moment and gravity wins the argument. || You lose your balance and spin like a badly planned dance move.
fitness.embarrassed=Someone definitely saw that. You pretend it was part of the routine. || You fumble the move so hard that even the equipment looks away.
fitness.sweat_cold=You skip the towel and the gym fan hits you just right. By evening you are sniffling. Cold earned. || Sweat, air conditioning and bad judgment make a cold. You called this one. || Your body decides this workout was a bit much and sends a cold as a review.
fitness.lift_drop=You lift {t} with all your love, and gravity takes {t} back. The landing is on both feet, mostly. || The lift gets halfway up before your arms file a complaint. {t} drops to the floor, laughing. || You swing {t} into the air, lose your grip, and both of you hit the floor in a pile.
fitness.back_strain=You lift {t} and something in your back says no. You hold the pose for a second and regret it. || Love is powerful, but your lower back disagrees. {t} puts you down and winces with you. || The big lift ends with a loud crack from your spine. {t} asks if you are okay, you say you are not.
fitness.show_off_fail=You try to look strong and lift {t} like a hero. You look like a person lifting furniture. || The big gesture lands somewhere between impressive and hilarious. {t} claps gently. || You flex before the lift. It goes badly. {t} stares at your arms, then at you.
fitness.mine_strain=You swing the pickaxe with too much confidence. Your back lodges a formal complaint. || The rock wins. You get a blister and a lot of dust.
fitness.treadmill_stumble=The treadmill keeps going. You do not, briefly. || A slight wobble turns into a very public stumble.
fitness.fail=Your arms stop cooperating halfway up. You pretend you meant to take a break. || You eye the weights and the weights eye you back. Not today.
fitness.pass=You push through the set without a hitch. || Solid form, steady breathing. Just another day at the office.

# -- Romance
kiss.bonus=That one was special. {t} will remember it for a while. || Sparks! {t} is glowing and so are you.
kiss.crit_success=A kiss for the history books. {t} forgets their own name.
kiss.soft_fail=The kiss is a little clumsy and a little awkward, but {t} lets it slide.
kiss.slap=You lean in to give {t} a kiss, but {t} is taken by surprise and launches a slap!
kiss.runaway=You lean in for a kiss and {t} bolts out of there like you offered them a tax form. || {t} takes one look at the incoming kiss and sprints away. Bold strategy, {a}.
kiss.embarrassed=You lean in for a kiss. {t} turns scarlet, studies their shoes and wishes the floor would swallow them. || {t} freezes, blushes to the ears and mumbles something about the weather.
kiss.angry={t} did not appreciate the pucker. You have been angrily noted, {a}. || You go for the kiss and {t} goes for the angry face. Fair trade?
kiss.rejection={t} politely but firmly declines the kiss. The silence is louder than the rejection. || {t} turns their head just in time. Smooth, {a}. Very smooth.
kiss.sad={t} gives you a pained look and a long sigh. Not like this. || The kiss misses and so does the mood. {t} looks away.
kiss.knockout={t} loses it and throws a punch. It lands, and you hit the floor like a sack of laundry. || That joke was the last straw. {t} swings, and the room tilts. You wake up looking at the ceiling. || {t} turns bright red and punches you square. Your dignity leaves the building before you hit the floor.
kiss.fight={t} is done with this. A quick shove, a loud word, and suddenly you are in a fight. || That was one step too far. {t} squares up and comes at you swinging. || {t} takes it very personally and decides to answer with fists. You asked for it.
kiss.police={t} has had enough and is already dialing. A police report is coming your way. || {t} stares at you for a second and says 'I'm calling the police.' It sounds a lot like they mean it. || That went badly. {t} files a report against you before you finish apologising.
kiss.spark=There is a spark you both felt. Something warm lingers between you and {t}. || The moment leaves a glow. You and {t} feel a little closer now. || A tiny flutter, a quiet smile. The air between you and {t} stays warm.
kiss.knockout_death={t}'s punch lands, and you fall to the floor... and don't wake up. The End. || One swing from {t}. You drop, the room goes quiet, and you do not get back up. Roll credits. || {t} throws a single punch. It is, unfortunately, the last thing you ever notice. The End.
kiss.pass=The kiss lands softly. {t} melts a little. || A tender moment. {t} smiles at you afterwards.

# -- Conversation
chat.bonus=The conversation just flows. You and {t} lose track of time in the best way. || An easy talk, a real laugh and a feeling that you can say anything. A good one. || {t} opens up a little and so do you. It feels easy.
chat.crit_success=You say exactly the right thing at exactly the right time. {t} smiles in a way you will remember. || A perfect talk. Every sentence lands and every pause feels warm. {t} does not want to stop. || The conversation hits a deeper level without anyone noticing. {t} looks at you like you just got them.
chat.soft_fail=The chat limps along and ends politely. Neither of you says what you wanted to. || A dull talk that goes nowhere. Both of you leave a little lighter and a little more bored. || It is fine. It is just fine. You both nod and move on.
chat.crit_fail=Every sentence lands wrong. By the end, {t} wants to be anywhere else. || You say something truly unfortunate. The air turns solid and {t} stares at the wall. || A conversational disaster. {t} will need a minute, and probably a snack.
chat.silence=You open your mouth and nothing happens. {t} fills the silence by studying the ceiling. || The conversation dries up halfway through. You and {t} nod at each other like old furniture. || An awkward gap grows between you. Both of you pretend it is a comfortable silence.
chat.wrong_topic=You pick the one topic {t} hates. The smile on {t} freezes into something polite and distant. || You bring up the wrong subject at the wrong time. {t} changes the topic with the grace of a car crash. || Somehow you step on a sensitive spot. {t} says 'sure' in a tone that means 'no'.
chat.overshare=You share way too much, way too fast. {t} gets a look like someone reading a very long terms of service. || Your small talk turns into a confession. {t} listens, nodding slowly, and starts looking for exits. || You go from 'how are you' to your life story in one breath. {t} needs a moment.
chat.voice_cracks=Your voice cracks halfway through the big words. {t} stays kind, but the moment is fragile now. || You have rehearsed this. The rehearsal did not help. Your voice wobbles and gives up. || The words come out smaller than they felt in your head. {t} waits, politely, for you to try again.
chat.too_intense=That was a lot, and too fast. {t} takes half a step back and smiles very carefully. || You say it with all your heart. {t} hears it with a little too much panic. || The promise lands heavy. {t} laughs nervously and changes the subject.
chat.advice_backfires=You ask for advice, then argue with every word of it. {t} gives up and nods along. || The advice is good. You ignore it out loud. {t} looks like someone who has seen this movie before. || {t} gives you honest advice. You take it badly, and the mood turns cold.
chat.awkward_hello=You say hello, and your voice picks a random pitch. {t} says hello back in the same pitch, out of mercy. || The greeting goes through three versions before it lands. || 'Hi. Hello. Hey.' You managed all three at once.
chat.makeup_fails=You say you are sorry. {t} hears 'I am sorry you feel that way'. It is not the same thing. || The apology goes in circles. {t} is still hurt, and now confused too. || You try to make up, and somehow add a second argument.
chat.life_talk_drags=The deep talk gets deeper and heavier until nobody knows what the original question was. || You philosophise for a while. {t} yawns discreetly into a sleeve. || 'What is the meaning of it all?' is a heavy opening. The conversation never recovers.
chat.gossip_leaks=The gossip you share is a bit too juicy. {t} takes offence at being dragged into it. || Whispering turns out to be less quiet than hoped. Someone heard everything. || You spill the tea and some of it lands on {t}.
chat.advice_ignored=You give wise relationship advice. {t} listens to none of it and gets slightly annoyed. || Your advice is perfectly good and completely unwanted. {t} sighs. || You say 'trust me'. {t} does not.
chat.kindness_unnoticed=You do a kind thing and {t} does not notice. It still counts, you tell yourself. || A small act of kindness, politely ignored. You feel a bit silly. || It was a sweet gesture. It landed with a polite shrug.
chat.flat_greeting=Your hello sounds like a typo. {t} politely pretends not to have heard. || The greeting comes out stiff and a second late. {t} gives a small awkward wave. || You say the right words in the wrong voice.
chat.rumor_awkward=The rumor gets weird fast. Nobody knows where to look. || You listen, nod and say nothing, loudly. || The chat starts warm and slowly goes lukewarm.
chat.fire_silence=You sit by the fire together and neither of you finds anything to say. The crackling does all the talking. || The silence stretches. {t} stares into the flames, and so do you, a little too long. || You mean to share a quiet moment. It just turns into a quiet moment.
chat.lesson_flops=You explain the basics three times. The student nods and understands none of it. || Your teaching skills turn out to be weaker than your skills. Both of you are exhausted. || The lesson goes sideways and ends with an awkward 'let us try again tomorrow'.
chat.knockout={t} loses it and throws a punch. It lands, and you hit the floor like a sack of laundry. || That joke was the last straw. {t} swings, and the room tilts. You wake up looking at the ceiling. || {t} turns bright red and punches you square. Your dignity leaves the building before you hit the floor.
chat.fight={t} is done with this. A quick shove, a loud word, and suddenly you are in a fight. || That was one step too far. {t} squares up and comes at you swinging. || {t} takes it very personally and decides to answer with fists. You asked for it.
chat.police={t} has had enough and is already dialing. A police report is coming your way. || {t} stares at you for a second and says 'I'm calling the police.' It sounds a lot like they mean it. || That went badly. {t} files a report against you before you finish apologising.
chat.deep_bond=For a moment you and {t} are on exactly the same page. It feels like a friendship that has been there for years. || Words come easily and nothing is held back. {t} looks at you like you are family. || A real, deep talk. You leave it with a stronger bond and a warm feeling that lasts.
chat.closer=That chat brought you closer. You feel it even before {t} says anything. || Something shifts in a good way. You and {t} are a little more comfortable now. || The talk turns into a real moment. You and {t} leave it feeling closer.
chat.knockout_death={t}'s punch lands, and you fall to the floor... and don't wake up. The End. || One swing from {t}. You drop, the room goes quiet, and you do not get back up. Roll credits. || {t} throws a single punch. It is, unfortunately, the last thing you ever notice. The End.

# -- Etiquette
etiquette.bonus=A firm, friendly exchange. {t} looks at you with a flicker of respect. || Perfect manners and just the right amount of confidence. The mood is relaxed and warm. || You make it look easy. {t} relaxes and the whole room relaxes with {t}.
etiquette.crit_success=Flawless. {t} smiles like you have just closed a deal, and maybe you did. || Charm, timing and a perfect handshake. {t} is clearly impressed and wants you to know it. || You are a professional. A real one. {t} makes a mental note to introduce you around.
etiquette.soft_fail=It is stiff and a little odd, but it technically happens. || A forced smile, a quick nod and a slightly weird silence. Not your finest hour. || Not a disaster, not a triumph. You move on quickly.
etiquette.crit_fail=Everything goes wrong at the exact same time. {t} politely pretends none of it happened. || You manage to be rude, clumsy and loud in one gesture. A rare feat. || The moment collapses like a bad soufflé. {t} will talk about this in about three years.
etiquette.sweaty_palm=Your palm is slick. {t} shakes it, then quietly wipes a hand on a pant leg as if nobody saw. || The handshake is a damp, limp little thing. {t} smiles politely and counts the seconds. || You grip too hard, then too soft, then sweat everywhere. {t} will remember this handshake.
etiquette.card_drop=You offer your business card and it flutters into a puddle of nothing. {t} picks it up for you, bent. || The card slips out of your fingers and lands face down. {t} reads the back out of kindness. || You hand over a card with a coffee ring on it. {t} says thanks the way people say it at the dentist.
etiquette.toast_spill=You raise your glass a little too enthusiastically. The drink goes on {t}, the cheers go nowhere. || Clink. Splash. {t} looks at the shirt, then at you, then at the shirt again. || The toast is perfect until the glass tilts. Half the drink lands on the table, the other half on dignity.
etiquette.bribe_caught=You slide over the envelope. {t} counts the bills out loud, and the room hears. ${m} is gone and so is your reputation. || Someone sees the exchange. The 'gift' costs you ${m} and a very long explanation. || The bribe was supposed to be subtle. {t} announces the amount to the whole room, and ${m} disappears from your account.
etiquette.errand_refused={t} looks at the list, looks at you, and says 'I am not a delivery service'. || You ask for an errand. {t} sighs deeply, then somehow manages to be offended and tired at once. || The errand request lands badly. {t} crosses both arms. The errand stays undone.
etiquette.pitch_flop=You start with business buzzwords and end with nothing. {t} nods the way people nod at spam. || The pitch sounds smart in your head. Out loud, {t} asks if you are okay. || You say 'synergy' twice and 'leverage' once. {t} quietly checks a phone.
etiquette.stiff=You sound like a robot reading a business manual. {t} stares, unsure whether to laugh. || The gesture is polite and stiff as a board. The moment passes without anyone feeling anything. || You try to be professional and land in 'awkward statue'. {t} tries to save it and fails.
etiquette.pitch_ignored=You present your idea with energy. {t} nods and writes nothing down. || 'Interesting,' says {t}, in the tone people use for 'no'. || You hand over your goals and {t} hands you back a polite smile.
etiquette.info_leaked=The information you share turns out to be wrong, and the damage is on you. || You share a tip that was supposed to be private. {t} is furious and it costs you. || A confidential detail slips out. Expensive.
etiquette.forced_cheer=You say you are happy about the growth. It sounds like a hostage video. || The cheer is so forced that {t} asks if you are alright. || Your enthusiasm is rehearsed and it shows.
etiquette.formal_flub=You greet {t} with great formality and the wrong title. || Too formal, then too casual, then both at once. {t} is lost. || The polite hello trips over its own manners.
etiquette.nosy_question=You ask a question that is a bit too curious. {t} answers shortly. || The question hangs in the air a moment too long. {t} looks away. || You wanted small talk. You got a stare.
etiquette.too_personal=That question was a step too far. {t} is not happy about it. || You ask something very private in a very public voice. {t} stiffens. || {t} answers in a tone you will remember. So will everyone else.
etiquette.coin_refused=You ask for coins and get a polite no and a very long look. || Begging for resort coins does not go well. You walk away with a lighter ego. || The answer is a very kind, very firm no.
etiquette.gift_flop=You hand over the gift. {t} smiles, and you can tell it is the wrong one. || The gift is a bit... odd. {t} thanks you with great effort. || {t} opens the present and tries very hard to look pleased.
etiquette.knockout={t} loses it and throws a punch. It lands, and you hit the floor like a sack of laundry. || That joke was the last straw. {t} swings, and the room tilts. You wake up looking at the ceiling. || {t} turns bright red and punches you square. Your dignity leaves the building before you hit the floor.
etiquette.fight={t} is done with this. A quick shove, a loud word, and suddenly you are in a fight. || That was one step too far. {t} squares up and comes at you swinging. || {t} takes it very personally and decides to answer with fists. You asked for it.
etiquette.police={t} has had enough and is already dialing. A police report is coming your way. || {t} stares at you for a second and says 'I'm calling the police.' It sounds a lot like they mean it. || That went badly. {t} files a report against you before you finish apologising.
etiquette.deal={t} knows someone who knows someone, and a new contact sends ${m} for 'a small job'. Networking works. || Your good impression turns into a favor, and the favor into ${m}. This is how business is made. || {t} vouches for you with a client. A little later ${m} lands in your account.
etiquette.insider_tip=The information you shared proves valuable. {t} slips you a thank you for it. || A tip turns into a deal. You walk away with some extra money.
etiquette.gift_hit={t} loves the gift. It is exactly what they wanted, and it shows. || The gift lands perfectly. {t} gives you a hug that lasts a bit too long.
etiquette.knockout_death={t}'s punch lands, and you fall to the floor... and don't wake up. The End. || One swing from {t}. You drop, the room goes quiet, and you do not get back up. Roll credits. || {t} throws a single punch. It is, unfortunately, the last thing you ever notice. The End.

# -- Humor
humor.bonus=The joke lands perfectly. {t} laughs so hard a seat is needed. || Your timing is excellent and the laughter is real. Today you are funny. || A clean, easy laugh. {t} wipes a tear and asks for another.
humor.crit_success=Comedy genius. {t} is crying from laughter and begs you to stop, then asks for more. || A perfect joke at a perfect moment. The whole room would applaud if it could. || You make {t} laugh so hard that breathing is forgotten. A legendary bit.
humor.soft_fail=It is not your best material, but {t} smiles to be nice. || A weak laugh and an even weaker punchline. You move on quickly. || A little chuckle, a little pity. The joke is already forgotten.
humor.crit_fail=The joke dies loudly. {t} has never been so quiet. || A joke so bad that it creates a new kind of silence. {t} stares into the distance. || You bomb so hard that the room feels cold. {t} needs a minute.
humor.flop=You deliver the joke with total confidence. {t} stares back, blinking, waiting for the rest. || The punchline lands with a soft thud. {t} laughs about half a second too late. || You laugh at your own joke. Alone. {t} gives it a polite 'heh'.
humor.unfunny=The joke is so unfunny it loops back to confusing. {t} nods slowly. || You tell it with perfect timing, and the joke is still bad. {t} smiles kindly. || A groan, a sigh and an eye-roll. {t} wins the 'most polite audience' award.
humor.slapstick_hurt=You commit to the pratfall a little too hard. The floor, as always, wins. {t} stops laughing and starts worrying. || The slapstick goes wrong in the most painful way. {t} winces, then laughs, then winces again. || You trip over your own bit. It hurts, and the audience of one is not sure whether to clap.
humor.money_gun=You shoot the money gun and bills fly everywhere. They were real. ${m} is gone and {t} is laughing uncontrollably. || The gun was loaded with actual cash. ${m} flutters out the window and {t} cannot breathe from laughing. || Oops. The gun was not for play money. You spray ${m} in the air and {t} swears nothing was seen.
humor.dirty_offended=The dirty joke lands badly. {t} just looks at you, deeply disappointed, and says nothing. || You tell a joke that is not for this crowd. {t} does not laugh. {t} stares. || The joke goes over like a lead balloon. {t} is not amused, and you know it.
humor.compliment_creepy=The compliment comes out creepy, and {t} takes a small step back. You hear yourself say it again. || You say something nice, and it sounds like something else. {t} stares at the floor. || The compliment lands weird. {t} thanks you with the voice of a hostage.
humor.memes_cringe=You explain a meme that died three years ago. {t} politely nods and says nothing. || The meme needs a full lecture to make sense, and still does not. {t} looks at you with kind pity. || You show {t} a trending meme. It is not trending. It never was.
humor.high_five_miss=You swing for the high five and slap thin air. {t} leaves you hanging with a very kind face. || The high five lands somewhere between a clap and a slap. {t} shakes out a hand and smiles anyway. || You miss the hand by an inch and your arm keeps going. {t} politely pretends it was a stretch.
humor.powerup_fizzle=You hold out your fist for a power-up and nothing sparks. {t} awkwardly bumps it anyway. || The friendship power-up fizzles with a little pop. {t} claps once, out of loyalty. || You yell the power-up, and the energy goes nowhere. {t} gives a thumbs up out of kindness.
humor.flex_fail=You flex, and a very unwelcome sound comes out of your shoulder. {t} winces. || The pose was fierce. The pose also lasted one second too long and something cramped. || You show off the muscles. {t} is unimpressed, and one muscle is hurt.
humor.knockout={t} loses it and throws a punch. It lands, and you hit the floor like a sack of laundry. || That joke was the last straw. {t} swings, and the room tilts. You wake up looking at the ceiling. || {t} turns bright red and punches you square. Your dignity leaves the building before you hit the floor.
humor.fight={t} is done with this. A quick shove, a loud word, and suddenly you are in a fight. || That was one step too far. {t} squares up and comes at you swinging. || {t} takes it very personally and decides to answer with fists. You asked for it.
humor.police={t} has had enough and is already dialing. A police report is coming your way. || {t} stares at you for a second and says 'I'm calling the police.' It sounds a lot like they mean it. || That went badly. {t} files a report against you before you finish apologising.
humor.money_rain=The money gun showers you both with bills, and you catch ${m} before the wind takes the rest. {t} cheers. || Cash rains down in a perfect arc. {t} laughs while you stuff ${m} into your pocket. || The gun fires a legendary burst. You walk away ${m} richer and {t} is still laughing.
humor.inside_joke=That joke becomes an inside joke between you and {t}. It will come back for weeks. || You and {t} laugh at the same moment and it feels great. A little closer now. || A silly moment turns into a small bond. You and {t} will be quoting it forever.
humor.knockout_death={t}'s punch lands, and you fall to the floor... and don't wake up. The End. || One swing from {t}. You drop, the room goes quiet, and you do not get back up. Roll credits. || {t} throws a single punch. It is, unfortunately, the last thing you ever notice. The End.

# -- Family Time
family.bonus=A warm little moment with your {k}. You both leave a bit lighter. || {t} smiles in the way only family does. It does not need explaining. || Easy, kind and a little funny. Exactly what it should be.
family.crit_success=Everything lands. You and {t} end up laughing like you did when you were little, and it feels like home. || A rare perfect moment between {k}s. Nobody says it, everybody feels it. || The kind of family conversation people remember for years. {t} holds on a little longer than usual.
family.soft_fail=It is nice enough. Family stuff is like that. || You talk, {t} nods, and the day goes on. || Nothing special. Nothing wrong either.
family.crit_fail=You say exactly the wrong thing to exactly the wrong {k}, and the whole room hears it. || It turns into one of those family scenes everyone will bring up at dinner for years. || A small comment becomes a big one. {t} leaves with a look you will remember.
family.awkward_pause=A silence settles that only your {k} can make this loud. || You both reach for a topic at the same time and neither says it. || The conversation stalls and the clock suddenly gets very interesting.
family.old_argument=Somehow you are back in the same argument from years ago. Same lines, same exits. || {t} brings up that thing from that time. You wish they had not. || You step on an old sore spot, and it turns out it never healed.
family.rusty_visit=It has been a while, and it shows. You are family but also a little strangers. || You both say the right words in a slightly wrong order. || Not living together means catching up first. You never get past the catching up.
family.house_rules=Living together means the dishes always come up. They come up now. || Someone left something on the floor. It is, of course, the {k}'s fault. || The same house, two very different ideas of tidy.
family.spouse_bickers=Marriage means having the same small argument in new ways. Today it is a new way. || {t} gives you the look only a spouse has, which means you are already in trouble. || A small disagreement about nothing in particular, which is the worst kind.
family.plan_clash=You plan the future together and, for a moment, it looks like two different futures. || {t} wants one thing, you want another. The compromise is silence. || The big plans meet small realities. Neither of you gives in this time.
family.lecture_flops=Your lecture lands about as softly as a brick. {t} nods the way kids do when they have stopped listening. || You explain something important. {t} hears 'blah blah' and a little pride. || It sounded wiser in your head.
family.chide_backfires=You scold and it backfires. {t} stares back with a look that says 'you did the same'. || The telling-off turns into a tearful 'you never listen'. Nobody wins. || You raise your voice and wish you had not.
family.eye_roll=Your parent starts a sentence and you already know how it ends. They see the eye roll. || The advice is good. Receiving it is the problem. || You listen with great effort. They can tell.
family.generation_gap=The generation gap opens right between you. You wave across it. || Some things you cannot explain to a grandparent. This is one of them. || You and {t} speak the same language, just not the same decade.
family.grandchild_bored=The story of the old days was excellent. The grandchild did not get that far. || Your grandchild is already looking at a screen. The old days will have to wait. || You offer wisdom. You get a polite 'mm-hm'.
family.sibling_spat=Sibling logic: you started it, {t} ended it, and you both claim victory. || One comment too many and you are ten years old again, fighting over a couch. || The classic. A teasing joke goes one step too far.
family.wrong_mood=You bring up the wrong feeling at the wrong time. {t} takes a step back. || The emotion was real. The timing was not. || Not every feeling needs to be shared right now. This was one of them.
family.allowance_gone=You hand over the allowance and get a very short thank you, and no change. || The allowance disappears faster than the receipt. You will never know where. || Money passes hands and a lecture follows. You paid for both.
family.apology_stumbles=The apology comes out in the wrong order. 'Sorry' arrives last. || You try to make it right, and the words trip over each other. || The apology is sincere. The delivery is a disaster.
family.hug_too_tight=The hug lasts a bit too long and the squeeze a bit too hard. {t} taps out. || You hug your {k} and something pops. Maybe their back. || An enthusiastic hug, a tiny crunch, and an awkward laugh.
family.kid_not_listening=The little one is listening to everything except you. || You say it three times. On the fourth it finally gets through, or the child leaves. || You are very good at what you do. The kid is very good at ignoring it.
family.family_warmth=Family closeness is quiet. This is one of those times, and you feel it. || Something small turns into something warm with {t}.
family.family_bond=The whole thing clicks. You and {t} feel like a real family, not just relatives. || A moment you will both remember. The bond grows and so does the warmth.
family.fail=It starts well and drifts somewhere neither of you planned.

# -- Art and Painting
art.bonus=The painting comes together nicely. A few bold strokes did all the work. || Good colors, good composition. Someone would hang this. || You finish with paint on your hands and a quiet little grin.
art.crit_success=The brush moves on its own. When you step back, it is the best thing you have ever made. || Colors, light, a little bit of magic. You sign it with a very steady hand. || It stops being a painting and starts being a feeling. You could stare at it all day.
art.soft_fail=It is not your best work, but it is yours. || The colors are slightly off, and the composition is slightly shy. || Fine, in the way a first draft is fine.
art.crit_fail=The painting turns into a very large, very brown puddle of regret. || Everything you try makes it worse. At some point you just stop. || The result looks like a mistake that has opinions.
art.uninspired=You stare at the canvas. The canvas wins the staring contest. || The muse is on break, and has left no forwarding address. || Nothing comes. Not an idea, not a line, not a color.
art.muddy_colors=All the colors blend into the same shade of brown. It is a very consistent brown. || Every mix goes muddy. You were aiming for sunset and landed on swamp. || You added one more color, and the whole thing turned gray.
art.paint_spill=The paint tray tips and a splash lands exactly where you would not want it. Paint on clothes, paint on shoes, paint on you. || You step back to admire your work and step into the paint instead. || A big wave of paint reaches your shirt first. The painting is fine. You are not.
art.ruined_canvas=One brushstroke too many and the whole canvas is ruined. You say a word that is not in the art books. || The canvas rips, the paint runs and the work of an hour is gone. || You try to fix one corner and break the other three.
art.mural_drips=The paint on the wall drips down in long, sad lines, and a little on you. || You aim for the wall and the wall shares with you. || The mural comes out a little melted, and you come out a little painted.
art.caught_tagging=A neighbor sees your artwork. A fine for illegal graffiti follows. Art has a price. || A passerby calls it vandalism. The ticket calls it ${m}. || The wall was not yours to paint. The city sends the bill: ${m}.
art.art_confusing=You look at it for a long time. It looks back and says nothing useful. || Everyone says it is deep. You see a banana and a long silence. || You nod thoughtfully the way people do at galleries, understanding nothing.
art.painting_sale=A passer-by falls in love with your painting and pays ${m} for it on the spot. || A collector hears about your work and sends ${m} and a very enthusiastic message. || Your piece sells for ${m}. Your first real fan is a stranger.
art.art_praise=A friend sees the painting and slips you ${m} 'for the next one'. || Someone buys a small print of it for ${m}. You are officially a professional.
art.fail=It did not turn out how you pictured it.
art.pass=A solid piece of work.

# -- Spa and Wellness
spa.bonus=Warm, quiet and exactly what you needed. You walk out feeling like new. || A great session. Muscles you forgot you had say thank you. || Your whole body sighs, and so do you.
spa.crit_success=Every knot lets go at once. You float out of there, boneless, calm and about three centimetres taller. || Pure bliss. The world slows down, your shoulders drop and you forget what stress felt like. || A perfect treatment. You could stay in this exact state for a week.
spa.soft_fail=It is okay. Relaxing enough, if not magical. || Pleasant, but your mind is somewhere else. || A decent treatment. You have had better.
spa.crit_fail=The whole thing goes wrong in a way only a spa day can. You leave more tense than you came in. || What was supposed to be relaxing becomes a small ordeal. Your poor body does not know what hit it. || You pay for relaxation and receive a story you will tell for years.
spa.restless=You lie there, but your mind refuses to switch off. Every thought is a to-do list. || Relaxing turns out to be hard work. You are very bad at it today. || The treatment is fine. You are the problem.
spa.tense_knot=They hit a knot you did not know you had. You see stars and the stars say ouch. || The tension was hiding in your shoulders and it fights back. You leave sore instead of soothed. || A very firm thumb finds the exact wrong spot and then stays there.
spa.too_hard=The pressure is far too much. You smile politely and quietly consider a new life. || They said deep tissue. They did not say 'down to the bone'. You are sore for hours. || It hurts in a way that is supposed to be good for you, and you are not convinced.
spa.ticklish=Your feet are far more ticklish than you thought. You laugh, squirm and nearly kick the fish out of the water. || The tickling is too much. You giggle until it is not relaxing at all. || Doctor fish are very enthusiastic about your toes. Nobody told your toes.
spa.fell_asleep=You fall asleep mid-massage and wake up with a drool puddle and zero dignity. || A loud snore wakes you up. The room is very quiet. Everyone heard. || You nod off, wake up with a start and pretend you were just resting your eyes.
spa.salt_sting=The salt finds a tiny scratch you did not know about. You keep a calm face. Barely. || A very salty surprise. You say 'mmm' and mean 'ouch'. || The salt soak stings more than it soothes.
spa.aroma_allergy=The oils are lovely, and your nose has other opinions. Sneezing starts and does not stop. || Roses, herbs and a very sudden allergy. You leave with a red nose and a handkerchief. || A cloud of scent and an even bigger sneeze. Achoo.
spa.sauna_dizzy=The heat gets to you. The room spins, the benches wobble and you step out slightly lobster-coloured. || Too hot, too long. You leave on legs made of jelly. || You tell yourself you are fine. The sauna disagrees.
spa.sauna_overheat=You push your luck in the sauna and the sauna wins. The world goes white and wobbly, and you crawl out dripping. || Sweat, spots, and a very serious feeling that this was a mistake. Heat stroke knocks politely, then kicks the door in. || The heat has stopped being relaxing and started being a threat. You barely make it to the door.
spa.pushy_staff=The therapist gets chatty at exactly the wrong time. You smile, and you do not relax. || A very enthusiastic professional talks through the whole thing. Relaxation is hard to find. || The massage is fine. The commentary is the problem.
spa.fail=You do not quite manage to relax.
spa.pass=A proper bit of relaxation.

# -- Setting the Mood (Spouse)
mood_spouse.bonus=A look, a smile, a very quiet 'come here'. The mood does the rest. || {t} laughs softly and pulls you closer. Perfect. || Whatever was heavy a minute ago is gone. Something warm took its place.
mood_spouse.crit_success=The mood is perfect before anyone says a word. You and {t} melt into each other, and the whole world gets quieter, softer, warmer. || Everything is right: the light, the timing, the person. You both feel lovestruck all over again. || It feels like the first time, and the hundredth, all at once. Nothing hurts, nothing worries, nothing matters but {t}.
mood_spouse.soft_fail=The moment is nice, if a little shy. You both get there in the end. || Slightly awkward, mostly sweet. You let it slide. || It is not quite the movie scene, but it works.
mood_spouse.crit_fail=You try to be intimate, but your feet were cold and broke the mood. || You lean in, trip over a pillow and the whole evening goes sideways. {t} is laughing and sighing at the same time. || The big romantic moment gets interrupted by a very loud stomach, and a sad little silence follows.
mood_spouse.cold_feet=You tried to be intimate, but your feet were cold and broke the mood. || Your icy feet touch {t}'s leg. A yelp, a jump, and the mood is gone. || Romance ends the second your cold toes meet a warm calf.
mood_spouse.cold_hands=Your hands are freezing, and {t} lets you know in a very high voice. || A cold hand in the wrong place at the wrong time. The mood leaves the room. || You mean it sweetly. Your fingers mean it like ice.
mood_spouse.phone_buzzes=A phone buzzes at the exact worst moment. Neither of you can unhear it. || A notification. Then another. The mood has left the chat. || Somebody forgot to silence a phone. It was both of you.
mood_spouse.pet_interrupts=A paw, a meow and a loud thud. The pet has joined the evening. || The cat jumps onto the bed at exactly the wrong time. The mood does not survive. || A very large furry audience watches. Nobody can concentrate.
mood_spouse.giggle_fit=You try to be serious, {t} starts giggling, and now neither of you can stop. Sweet, but not exactly steamy. || The first laugh was a snort. The second one ended the mood. You are both crying with laughter. || It started romantic and turned into a laughing fit. Still a good time, just a different one.
mood_spouse.fail=You try to set the mood. The mood has other plans.
mood_spouse.pass=The mood lands. Nobody needs to say anything.

# -- Setting the Mood (Partner)
mood_lover.bonus=Love is an adventure, and you're enjoying the experience! || A thrilling little spark between you and {t}. You both feel lighter. || The moment is sweet, a bit daring and a lot of fun.
mood_lover.crit_success=Love is an adventure, and you are enjoying every minute of it. {t} feels it too. || Everything clicks. A look, a touch, a smile that says it all. || You do not plan it, it just happens. And it is wonderful.
mood_lover.soft_fail=It is a little stiff, but {t} lets it go. || Not exactly smooth, but sweet enough. || A bit clumsy. {t} smiles anyway.
mood_lover.crit_fail=You read the moment completely wrong. {t} looks at you like you grew a second head. || The mood goes from zero to disaster. {t} needs to leave the room. || The big move falls flat in the most embarrassing way possible.
mood_lover.slap=You lean in to set the mood, but {t} reads it as an attack and slaps you! || That was a bit too bold. {t} slaps you, and the sound travels.
mood_lover.runaway={t} sees what is coming, panics and runs out of the room. || You make your move. {t} makes a move too, towards the door.
mood_lover.embarrassed={t} turns bright red and cannot look at you. Neither can you. || The moment becomes too much. {t} hides behind both hands.
mood_lover.angry={t} is not happy about what you tried. The glare says it all. || You misjudged it, and {t} makes sure you know.
mood_lover.rejection={t} pulls away. A polite, firm 'no' hangs in the air. || Not tonight. Not like this. {t} steps back.
mood_lover.sad={t} looks hurt, and you feel it too. The silence is heavy. || The mood dies in a very sad way. {t} sighs and looks away.
mood_lover.fight={t} is furious and the argument turns into a real fight. || What started as a mood turned into a shouting match and a shove.
mood_lover.fail=You try to set the mood and {t} is not quite there yet.
mood_lover.pass=Good chemistry.

# -- Romance
romance.bonus={t} laughs at the right moment and stays closer than before. Something is starting. || A good moment. You and {t} hold eye contact a beat too long, and neither of you minds. || Butterflies, mutual ones. You leave this with a warm, fluttery feeling.
romance.crit_success=The words come out exactly right. {t} looks at you like you hung the moon, then quietly asks if you are free tomorrow too. || Everything lines up: the timing, the smile, the silence in the right place. {t} is a little breathless and so are you. || You have never been smoother. {t} blushes, and the room feels about ten degrees warmer.
romance.soft_fail=It is nice enough, but it never quite sparks. Both of you pretend it did. || {t} smiles politely. It is the kind of smile you give a waiter. || Not a disaster, not a moment either. The air stays exactly the same temperature.
romance.crit_fail=You say something so wrong that {t} checks whether you are feeling alright. You are not. || The moment collapses in slow motion. {t} stares at you, you stare at the floor, and the floor is not helping. || You open your mouth, a sentence falls out, and it is the worst one available. {t} will remember it for years.
romance.tongue_tied=You rehearsed this in the shower. Out loud it is just sounds. || Your brain exits the chat. All you manage is 'so... yeah.' || {t} waits. You wait. Nobody says anything romantic.
romance.turned_down={t} says 'I think we are better as friends' in a very kind voice. It hurts anyway. || A polite 'no, thank you'. The politeness is the worst part. || {t} looks genuinely sorry, which somehow makes it worse. You go home with a heavy heart.
romance.too_forward=You go from zero to 'so, kids?' in one sentence. {t} takes a step back. || That was a lot, really fast. {t} needs a minute and a glass of water. || You skipped about nine steps. {t} noticed every single one.
romance.cold_feet=You ask about marriage and {t} suddenly finds the ceiling very interesting. || 'So, where do you see this going?' lands like a brick. The mood leaves quietly. || {t} changes the subject so fast it leaves skid marks.
romance.sweaty_hands=Your palm is a swamp. {t} holds on bravely and wipes their hand on their trousers afterwards. || You grab {t}'s hand. It is damp, trembling and apologetic. || The hand hold lasts exactly as long as it takes both of you to notice how clammy you are.
romance.hand_yanked={t} pulls their hand away as if it were a hot pan. It is not subtle. || You reach out and {t} puts their hand in a pocket. The message is clear. || The hand is withdrawn, very politely and very fast. Ouch.
romance.slap=You reach for {t}'s hand, but {t} takes it the wrong way and slaps you instead! || That was way too bold. {t} reacts with a slap, and the sound carries.
romance.cold_greeting=Your sweet hello lands like a wet sock. {t} nods and keeps walking. || You greet {t} with all your charm. {t} responds with a polite 'hm'. || The greeting was a hopeful flutter. It fell flat on the floor.
romance.confession_declined=You ask, heart pounding. {t} gently says no, and your pounding heart sinks. || {t} lets you down easy, and 'easy' is not how it feels. || Your big question gets a small, kind, devastating 'not like that'.
romance.knockout={t} loses it and throws a punch. It lands, and you hit the floor like a sack of laundry. || That move was the last straw. {t} swings, and the room tilts. You wake up looking at the ceiling.
romance.fight={t} is done with this. A quick shove, a loud word, and suddenly you are in a fight. || That was one step too far. {t} squares up and comes at you swinging.
romance.police={t} has had enough and is already dialing. A police report is coming your way. || 'I am calling the police.' {t} sounds like they mean it.
romance.butterflies=The flutters are mutual. Something quietly grows between you and {t}. || You and {t} part with a smile you cannot quite hide.
romance.swept_off_feet=It is one of those moments you will both remember. {t} is smitten, and you are glowing. || {t} has completely fallen for it. You feel a rush of warmth that lasts for hours.
romance.fail=You try for charming and land somewhere near 'reading a manual out loud'. || The plan was romantic. The execution was a hostage negotiation.
romance.knockout_death={t}'s punch lands, and you fall to the floor... and don't wake up. The End. || One swing from {t}. You drop, the room goes quiet, and you do not get back up. Roll credits.

# -- Conflict and Mischief
conflict.bonus=A sharp line, delivered well. {t} grudgingly smirks. || You hold your ground, and it works. {t} respects it a little.
conflict.crit_success=You land it perfectly. {t} has no comeback, and the whole room knows you won. || A masterclass. {t} opens their mouth, closes it, and nods in respect. || Your nerve pays off. {t} backs down, and you feel ten feet tall.
conflict.soft_fail=It lands softly. {t} shrugs and moves on. || Not your sharpest moment, but nobody is hurt. || {t} is unimpressed, and the matter stays unsettled.
conflict.crit_fail=It goes so badly that {t} does not even need to answer. Your own words did it for them. || Your big moment backfires in spectacular fashion. The silence afterwards is deafening. || You stood your ground right into a wall. {t} watches with great interest.
conflict.stiff=The jab is stiff and rehearsed, and {t} sees through it. || You try to sound tough. You sound like a voicemail.
conflict.tease_backfires=The tease does not land, and {t} fires back with something that actually hurts. || You poke at {t} and the poke bites you instead. || {t} is not amused. You are the one blushing.
conflict.ridicule_backfires=Your ridicule gets turned around so neatly that you almost want to applaud. Almost. || {t} laughs at you instead, loudly, and now you wish you had not started this. || You mock {t}, and they have a better line ready. Ouch.
conflict.stubborn=You dig in, and so does {t}. Nobody wins, and the mood is ruined. || Insisting louder does not make you more right. {t} stops listening.
conflict.line_crossed=You draw the line, and it turns out to be right through {t}'s feelings. || The truth came out a bit too honest. {t} goes quiet, and the room gets colder. || You said it plainly. {t} heard it plainly, and now neither of you can look at the other.
conflict.power_play_flops=Your power play flops hard. {t} calls you out in front of everyone and it costs you. || Turns out, {t} was not intimidated at all. It stings, in more ways than one. || You push for leverage and end up paying for the privilege.
conflict.shown_the_door={t} points at the door. You take the hint and a bit of bruised pride with you. || You ask {t} to leave, and {t} answers with a look that could melt steel. || The 'please leave' lands wrong, and now you are the one outside.
conflict.greeting_backfires=Your rude hello gets a ruder reply. You started it, so now you own it. || {t} takes the sour greeting personally and returns it with interest. || You greet {t} like a villain. {t} responds in character.
conflict.belittle_backfires=You put {t} down in front of everyone. It turns out {t} has receipts. || The blame lands on you instead, with notes. || {t} stays calm, and that is worse. Everyone saw it.
conflict.pent_up=The words spill out hotter than planned. {t} did not need all of that. || You let it all out, and some of it was meant for someone else. || The feelings were real. The timing was not.
conflict.extort_backfires=Your threat falls apart halfway. {t} stays calm, and you are the one who looks guilty. || The extortion goes as well as extortion ever goes. {t} is furious and you pay for it. || {t} does not blink. The fine does.
conflict.caught_red_handed=Somebody saw you. Everyone saw you. You pretend you were never there. || Your sneaky plan has a witness. You are very red in the face. || The secret was less secret than you hoped.
conflict.rumor_backfires=The message goes to the wrong person. You spend the evening deleting things. || The rumor spreads, and then spreads back to you with some extra details. || Turns out, the gossip was about someone's friend. Oops.
conflict.prank_backfires=The prank lands on you instead. Everyone laughs, and not with you. || The joke needed one more step. You skipped it, and you pay.
conflict.knockout={t} loses it and throws a punch. It lands, and you hit the floor like a sack of laundry. || That was the last straw. {t} swings, and the room tilts. You wake up looking at the ceiling.
conflict.fight={t} is done with this. A quick shove, a loud word, and suddenly you are in a fight. || You pushed too far. {t} squares up and comes at you swinging.
conflict.police={t} has had enough and is already dialing. A police report is coming your way. || 'That is harassment, and I am calling the police.' {t} sounds serious.
conflict.witty=The line is good and {t} knows it. A grudging smile and a bit more respect. || You win the exchange without a mark on you. {t} warms up a little.
conflict.respect=You win the argument so cleanly that {t} actually admires it. Your confidence glows for a while. || {t} bows out with a nod. You earned real respect today.
conflict.fail=You went for bold and arrived at embarrassing. || The line was good. The delivery was a sneeze.
conflict.knockout_death={t}'s punch lands, and you fall to the floor... and don't wake up. The End. || One swing from {t}. You drop, the room goes quiet, and you do not get back up. Roll credits.

# -- Shared Passion
passion.bonus=Your shared interest sparks a good chat. {t} nods along and you both leave energised. || A great little talk about something you both love. {t} asks for more.
passion.crit_success=It turns out you both love the exact same thing. You and {t} talk for hours without noticing. || Two kindred spirits find each other. {t} lights up like a lamp, and so do you. || The topic clicks perfectly. {t} wants to know everything, and you gladly tell them.
passion.soft_fail=You find a few things to say, and so does {t}. It is fine. || Common ground, but not much of a spark. || The topic fizzles out politely.
passion.crit_fail=You confidently say the wrong thing about the one subject {t} cares most about. Silence falls. || Your passion turns out to be a very different passion from {t}'s. The conversation never recovers. || You go all in on a topic and {t} winces. You are not sure which of you is more embarrassed.
passion.dull_topic=You go on about the topic for ten minutes. {t}'s eyes glaze over somewhere around minute three. || You are fascinated. {t} is checking the time. || The topic is thrilling to you and to nobody else in the room.
passion.hot_take=You drop a very bold opinion and {t} does not take it kindly. || Your hot take cools the room fast. {t} disagrees, loudly. || {t} takes the topic personally, and now it is a debate.
passion.dance_stumble=You try to show a move, trip over your own feet and spin into a heap. {t} winces in sympathy. || The dance move needs more room than you have. The floor wins. || One step too ambitious, and gravity collects its due.
passion.muscle_strain=You show off a workout move and something pulls. {t} offers a cushion and a lot of sympathy. || Enthusiasm outweighs your warm-up. Your back files a complaint. || You flex too hard and strain something that you needed.
passion.voice_cracks_song=You hit the high note with confidence. The note does not hit back. || Your voice cracks so loudly that {t} looks around for a window to check. || Singing together is great until you take the lead.
passion.off_key=The chord you play was never in the song. {t} politely pretends it was a creative choice. || Your guitar is out of tune and so is the whole mood. || You strum with passion and with the wrong notes.
passion.meat_debate=You start talking about meat and {t} has strong opinions about cuts. It turns into a debate. || The steak argument gets heated. Rare and well done are not compatible. || You say 'well done' and {t} looks at you like you insulted their family.
passion.recipe_war=Your recipe versus {t}'s recipe. Nobody wins, everybody is hungry and slightly offended. || You say the secret ingredient is butter. {t} says it is patience. Tension rises. || You criticise {t}'s technique. Mistake.
passion.no_common_ground=You share your favorite things. {t} shares theirs. They have nothing in common. || Your tastes could not be further apart. The conversation goes quiet. || {t} asks 'wait, you like that?' in a tone you will remember.
passion.shared_joy=Talking about what you both love gives you a warm feeling and a stronger bond. || {t} laughs and shares a story of their own. You are closer now.
passion.kindred_spirits=You and {t} discover you are cut from the same cloth. A strong friendship starts today. || {t} grins and says 'where have you been all my life?' You feel it too.
passion.fail=You were sure you had something in common. You had less than you thought. || The enthusiasm was real. The knowledge was not.

# -- Self Care and Leisure
selfcare.bonus=A good moment with yourself. You feel refreshed and quietly pleased. || That did you good. You walk away lighter than you came.
selfcare.crit_success=You finish feeling like a brand new person. Everything is a little brighter and a lot calmer. || Time well spent on yourself. You glow, and the whole day feels lighter. || One of those rare moments where you feel completely at peace.
selfcare.soft_fail=It is fine. Not magical, but fine. || Nothing special, nothing wrong. You carry on. || The moment passes without much to say about it.
selfcare.crit_fail=Everything goes sideways, and you end up feeling worse than when you started. || What was meant to be a calm moment turns into a small disaster.
selfcare.off_day=You try, but your heart is not in it today. A deep sigh follows. || Some days even relaxing is hard work.
selfcare.self_doubt=The mirror and you stare at each other. You blink first, and not with confidence. || You practice the line six times. It gets worse each time, somehow. || You look at yourself and find only things to fix. The pep talk does not help.
selfcare.mind_wanders=Your mind refuses to slow down. Every thought is a different thought. || You sit, you breathe, and you remember an email you forgot to send. Peace is cancelled. || The calm never quite arrives. You leave more restless than you started.
selfcare.bad_omen=The reading is vague, ominous and slightly rude. You leave unsettled. || The future looks cloudy. You wish you had not asked. || The cards or the ball have bad news and a cheerful tone. Somehow that is worse.
selfcare.bad_sleep=You toss, turn and fight the pillow. Morning arrives too soon. || You sleep, technically. It does not feel like it. || Every time you start to drift off, something rattles. Tired is the new normal.
selfcare.nightmare=A very strange dream, with teeth and a talking sandwich. You wake up shaken and exhausted. || The nightmare feels completely real. You sit up in the dark and need a minute. || You dream you are late for something. You wake up late, tired and not sure for what.
selfcare.firewood_boom=You toss the log on and the fire answers with a BANG. A fireball, a cloud of soot, and you are suddenly the dirtiest person in the park. || The firewood was damp, the fire was angry. Boom! You are covered in ash from head to toe. || One log too many. The campfire explodes in a puff of smoke and sparks, and you come out looking like a chimney sweep.
selfcare.dust_fizzles=You sprinkle the magic dust and the fire just sneezes. Nothing happens, except a little glitter on your shoes. || The dust sparkles for a second, then goes out with a sad little pop. || Maybe the fire is not in the mood for magic today.
selfcare.otherworldly_visitor=The flames flicker, bend, and something with far too many eyes starts to crawl out of the fire. You laugh. You cannot stop laughing. It is a very nervous laugh. || A shape rises in the smoke, looks right at you, and says nothing. You are fine. You are absolutely fine. Ha. Ha ha ha. || The fire whispers your name in a voice from nowhere. You answer with a giggle that you do not recognise as your own.
selfcare.sparkler_burn=The sparkler spits sparks everywhere. One lands on your sleeve and your dignity. || You wave it a bit too enthusiastically. The sparks wave back. || It fizzles out in your hand, with a very small, very rude hiss.
selfcare.smoke_in_eyes=The wind changes and the smoke follows you wherever you sit. Your eyes will never forgive the fire. || You settle in and the smoke settles in with you. Coughing starts. || The fire is warm, the smoke is not. You move around the fire three times and it follows.
selfcare.stubbed_toe=You kick it hard. It does not care, but your toe does. || Venting anger on an object feels great for a second. Then the toe starts to throb. || The object wins. You hop around holding your foot and your pride.
selfcare.sunburn=You doze off in the sun. By evening you glow in a way no one asked for. || The oil missed a spot. The spot is now very, very red. || Too much sun, not enough sense. Your skin files a complaint.
selfcare.hammock_flip=The hammock flips and so do you, straight into the sand. || You lie down very gracefully, and get up less so. || The sunbed has opinions about how you sit. It wins.
selfcare.smoky_flue=The flue was closed, and the living room gets a good smoke. You cough your way to the nearest window. || The fire sputters, the smoke goes everywhere except up the chimney. Your eyes sting. || You light it, it smokes. You fan it, it smokes harder.
selfcare.backfire_soot=The fireplace coughs a fireball of soot straight at you. You are now a very festive shade of black. || WHOOMP! A burst of sparks and ash, and the hearth rug is not the only thing that looks charred. || The fire lights with a bang and you come out looking like you just crawled out of the chimney.
selfcare.ash_cloud=You put out the fire and the ashes rise in a big grey cloud. You wave it away with dignity. || The last ember sulks and sends a puff of ash right in your face. || The fire is out. So is your hairdo.
selfcare.burnt_fingers=You hold your hands out a bit too close. The fire politely burns the tip of a finger. || Warm hands, then hot hands, then very quick hands. || The fire was friendlier from a metre back.
selfcare.blessing=The magic dust blooms into a warm golden glow. For a moment you feel everything at once: rested, fed, clean, and light. The fire smiles. Probably. || The flames turn the colour of a sunrise and wrap around you. When they fade, all your aches, worries and illnesses are gone. || A soft shower of golden sparks, and the world makes sense again. You are cured, refreshed and quietly delighted.
selfcare.fail=It was not your best session with yourself.

# -- Arcade and Games
games.bonus=A solid win. You are in a great mood and feel quick-witted. || Good play. A small victory dance is in order.
games.crit_success=Perfect run. A crowd of nobody cheers, and you feel like a champion anyway. || Absolute precision. The machine itself looks impressed. || The game bends to your will today. What a rush.
games.soft_fail=You lose, but it was close enough to be entertaining. || Not today. Better luck on the next round. || A narrow miss. Nobody saw it, so it does not count.
games.crit_fail=A spectacular loss. You consider moving to another city. || Everything that could go wrong, does, in the most embarrassing order possible.
games.so_close=So close. Just a tiny bit more and it would have been yours. || You miss by a hair. The hair is not impressed.
games.sore_loser=You lose, and you are not graceful about it. Several words are said. || You blame the machine, the lag and a small gust of wind.
games.claw_empty=The claw closes on nothing and the plush smirks at you. A few coins vanish. || You line it up perfectly. The claw lets go. Of course it does.
games.dart_stray=The dart sails past the board and finds a wall instead. Nobody saw anything. || You aim for the bullseye. The dart aims for the floor.
games.gutter_ball=The ball slowly rolls into the gutter. You watch it all the way. || A perfect shot, if the lane were three feet to the left.
games.air_ball=The ball misses everything, including the hoop, the board and your dignity. || You shoot, you miss, and the ball bounces somewhere you will not look for it.
games.button_mash=You mash every button at once. The character does something strange and loses immediately. || The controller fights back. So does the loss.
games.eats_coins=The machine takes your coins and keeps them. It is not sorry. || The cabinet eats the coins without a thank you. The screen says 'game over' before you start.
games.wild_throw=The ball sails past the cans, past the booth and almost into the sea. || You throw with confidence. The cans stay perfectly still. || A great throw, somewhere else entirely.
games.seesaw_bonk=The seesaw bounces and bonks you right on the chin. || You ride the little horse a bit too hard and it fights back.
games.arcade_win=The machine pays out and a few coins land in your hand. || A small prize, a big grin.
games.jackpot=Lights flash, bells ring and coins pour out. You have never felt so lucky. || A jackpot! The whole arcade turns to look.
games.fail=The game wins this round.

# -- Photography
photo.bonus=The shot is crisp, the light is great and {t} looks perfect. A photo to keep. || A clean, warm photo with a great smile. You will want to print this. || Perfect framing, perfect timing. The photo captures the mood exactly.
photo.crit_success=A photo so good it could be framed. {t} wants a copy and a second one as a backup. || The shot is magazine quality. You and {t} both stare at the screen. || You capture a moment so perfect it looks staged. Photography gods approve.
photo.soft_fail=The photo is not great, but it exists. You say you will take another one later. || A mediocre shot. {t} says it is fine and means it halfway. || It is a photo. You can tell what it is. That is all.
photo.crit_fail=The photo is a disaster in every possible way. {t} insists it never be shown. || You manage to ruin the photo, the lighting and the mood at once. A masterpiece of failure. || The camera misfires, the flash goes off wrong and the shot becomes cursed. {t} asks to delete it.
photo.blurry=You press the shutter and the whole photo comes out as a smear. {t} says 'artistic' with a straight face. || The shot is blurred like a ghost sighting. {t} suggests you try again, maybe with a steadier hand. || You get a perfect photo of a very blurry nothing. {t} politely says it has character.
photo.blink=You catch {t} mid-blink. The photo makes it look like a dream. || The flash goes off and {t} blinks at the exact wrong moment. A lovely portrait of closed eyes. || Click. {t} looks half asleep in the shot. Deleting it is requested, firmly.
photo.finger=Your finger covers half the lens, and your finger is the star of the photo. || You frame the shot perfectly and capture mostly your thumb. A thumb with great lighting. || The photo has {t}, a nice background and a pink blur in the corner: you.
photo.phone_drop=The selfie goes well until your phone slips out of your hand. {t} flinches at the clatter. || You stretch for the perfect angle and the phone leaps out of your hand. The selfie is the floor. || Mid-selfie, the phone does a little dive. {t} looks at it, then at you, and says nothing.
photo.camera_shy={t} hides a face as soon as the camera comes out. The photo is a hand and a smile that is not there. || You raise the camera and {t} gets shy. The shot is half a face and a lot of regret. || {t} ducks out of frame at the last second. Your photo is a perfect picture of the wall.
photo.viral_pic=The photo you took goes viral. A page buys the rights for ${m}. {t} demands credit. || Someone online loves your shot and sends ${m} for using it. Your phone camera just paid for lunch. || You post the photo and it explodes. A brand pays ${m} for it, and {t} wants a cut.

# -- TV
tv.bonus=You land on the perfect show. Today is a good day. || The channel is exactly your taste. Pure television magic.
tv.crit_success=The TV tunes in with crystal clarity. Even the rabbit ears applaud.
tv.soft_fail=The picture is fuzzy but you work it out with a smack on the side.
tv.fire=The TV hisses, pops and sets itself on fire. Streaming has never been this hot. || Smoke curls out of the back of the TV and then the whole thing is on fire. That was a lot for a remote. || You press a button and the TV answers with flames. Reviews are mixed.
tv.shock_break=You press the power button. The TV pops, fizzles and dies with a puff of smoke, and the leftover jolt finds you anyway. || A bang, a flash, and the TV goes dark for good. The shock is just the final insult. || You hit the remote and the whole set gives up on life, taking your hair's good mood with it.
tv.shock=You grab the remote and did not notice a wire sticking out. You get a nice toasty shock. Who knew batteries were this powerful?! || You flip the TV on and the old set bites back. Your hair stands on end and your soul briefly leaves your body. || The TV crackles, sparks, and decides you are the new antenna. Zzzzap! || You press the power button. The TV presses back. Hard.
tv.fire_safe=The TV gives a tiny pop and goes quiet. Good thing it was just a little spark... || Something goes bang behind the screen. Very small, very dramatic. The TV looks very embarrassed. || A short little pop, then silence. Good thing it was nothing worse.
tv.pass=The TV flickers on. Prime-time awaits.

# -- Shower
shower.bonus=The water hits just right. You could stay here until the heater gives up. || A glorious shower. You come out feeling like a brand new Zoi.
shower.crit_success=The best shower of your life. Steam, perfect pressure, and a song you almost want to record.
shower.soft_fail=The water is a little lukewarm, but you power through.
shower.crit_fail=You step in and the mixer betrays you. It is not cold, it is a glacier. Your soul leaves through the drain. || The pipes groan, the water turns arctic and you scream a note you did not know you had.
shower.fail=You take a shower, but the mixer failed and it is freezing cold! You are going to regret this tomorrow. || The water starts warm and then, out of spite, turns to ice. You jump out shivering.
shower.pass=A perfectly ordinary shower. Nothing exploded, nothing froze.

# -- Housework
housework.bonus=Spotless! The place is shining and so is your mood. || Cleaning feels weirdly satisfying today. You could do the whole place.
housework.crit_success=The room sparkles like a showroom. Even the dust bunnies applaud.
housework.soft_fail=A few streaks and a lot of grumbling, but the job gets done.
housework.crit_fail=A flood, a slip and a broken machine in one go. It takes talent to fail this thoroughly.
housework.slip=You step into the wet spot you just mopped. The floor wins and you spin like a figure skater. || Cleaning goes great until your foot meets a soap puddle. Wheeee... thud.
housework.frustrated=You scrub, you sweep, you sigh. The mess grows back out of spite. || Every time you clean one spot, two new ones appear. You are done pretending to stay calm.
housework.water_break=You twist the tap one time too many and the pipe gives up. Water everywhere, and the sink is done for. || A suspicious hiss, a pop, and a fountain. The plumbing has resigned and the floor is now a lake.
housework.break=You mess with the machine and something inside goes clunk. Then silence. Great. || You press the wrong thing and the appliance dies with a sad little whirr.
housework.messy=Somehow your mop was filthier than the floor and made everything even messier. Filth, filth everywhere! || The sponge you grabbed was apparently a dust farm. Now the whole place looks like nobody has been here since 1987. || You shake out the feather duster and the place gets dustier. Physics has questions. So do you. || The vacuum burps out everything it ever swallowed. Congratulations, you have invented reverse cleaning. || You wring the rag and it somehow rains dust. Every shelf, every floor, every surface. Even the cobwebs filed a complaint. || Your broom sneezed. The whole place is a dust storm now. Cleaning was a mistake.
housework.sigh=You sigh at the chore pile. The chore pile does not care. || There is always something dirtier. You take a moment to mourn your free time.
housework.dust_allergy=You stir up a cloud of dust that has been waiting years for this. Achoo. Your nose files a complaint. || The broom wakes up every dust bunny in the place. You sneeze until your ears pop. || A cloud of old dust gets you right in the nose. You are now officially allergic to your own cleaning.
housework.clean_house=A burst of cleaning energy and the whole place is sparkling in one go. Not one speck of dust survived. || You hit a perfect cleaning rhythm. Every surface and floor is spotless. Who is this person? || Something clicks. You tidy the entire place in one glorious sweep, dust bunnies and all.

# -- Repair
repair.crit_success=Something clicks. Everything broken around here hums back to life at once, and you walk off like a repair legend. || Your hands move on their own. By the time you put the tool down, nothing here is broken anymore. Hero stuff. || A perfect fix, then another, then all of them. Every broken thing around comes back, and the toolbox applauds.
repair.soft_fail=The repair almost works. Almost. You step back and the thing shrugs. || You tighten, twist and test. It still does not work. It does look a little offended. || Close, but no. The object has decided to stay broken a little longer.
repair.shock=You touch the wrong wire and the device gives you a very firm opinion about it. Your hair stands up in applause. || ZAP! The repair ends with a spark, a yelp and the smell of burnt hair. || The manual said 'unplug it first'. You read that line right after the spark.
repair.sparks=Something inside pops, fizzes and gives off a puff of smoke. You step back with a very careful face. || A shower of sparks, a burnt smell and a long silence. You decide you did not see anything. || The device hums, sparks once and gives up. You are not sure who lost this round.
repair.flood=You loosen one pipe too many and the water joins the party. The floor is now a pond. || The wrench slips, the pipe lets go, and a fountain is born. Splash. || A tiny leak turns into a not-so-tiny problem. The floor is wet, and so are you.
repair.soaked=A burst of water hits you right in the face. You are now officially part of the plumbing. || The pipe sprays sideways and you take the whole thing. Congratulations, you are very clean and very cold. || You turn the wrong valve and get a free shower. Fully dressed, of course.
repair.fumble=The screwdriver wins this round. You drop everything and say a few words. || You put the tool down for one second and it disappears. The object is still broken and your patience is not. || Every screw you touch rolls away. The object stays broken and you stay annoyed.
repair.wrong_part=You fix the wrong part, very confidently. The right part is still broken and now you are tired. || You swap in a part that did not need swapping. The real problem waves hello from the corner. || Fixed! Well, something. Not the thing that was broken.
repair.thumb=The hammer meets your thumb. Your thumb files a formal complaint. || A small slip, a big ouch. You hold your hand and pretend nothing happened. || You hit exactly what you aimed at, except it was your finger.
repair.flood_safe=The pipe spits out a small puddle and then thinks better of it. Wet floor, wet shoes, dry ego. || A little water sneaks out and makes a puddle. Nothing a mop cannot fix, but you stare at it anyway. || The pipe burps a bit of water onto the floor. It is just a puddle, but it is YOUR puddle.
repair.repair_all=Something clicks. Everything broken around here hums back to life at once, and you walk off like a repair legend. || Your hands move on their own. By the time you put the tool down, nothing here is broken anymore. Hero stuff. || A perfect fix, then another, then all of them. Every broken thing around comes back, and the toolbox applauds.
repair.shock_death=You reach into the device... a bright flash is the last thing you see. The End. || ZAP. The lights flicker, you drop, and the repair manual quietly closes itself. Roll credits. || The wrong wire at the wrong moment. You were a great repairer... for a while. The End.

# -- Laundry
laundry.bonus=The clothes come out soft, warm and smelling like a spring meadow. Folding is almost fun. || A flawless cycle. Every sock has a twin, and none of them are pink. || The load is spotless and perfectly dry. You feel like a laundry professional.
laundry.crit_success=Laundry perfection. The whites are whiter, the colors are brighter, and you fold like a hotel. || The cycle ends and your clothes look brand new. A choir hums somewhere nearby. || Every stain gone, every sock matched, every shirt crisp. The laundry gods are pleased.
laundry.soft_fail=The load comes out a little wrinkly and a little damp, but wearable. || A few stains survive the cycle. You decide that is character. || You press start, hope for the best, and the clothes come out mostly okay.
laundry.crit_fail=Shrunk, pink, flooded and one sock short. A masterpiece of laundry disasters. || The machine floods, your shirt shrinks, and the red sock strikes again. You earn a medal in chaos. || A sudsy flood, a ruined wardrobe and a missing sock in one cycle. Impressive, in its own way.
laundry.shrunk=You wash your favorite sweater on hot. It now fits a very small bear. || The label said cold wash. You read it after the cycle. The shirt is now a croptop. || You open the machine and pull out your jeans. They are doll-sized now. The washer is smug.
laundry.pink=A single red sock sneaks into the whites. Everything you own is pink now. || You wanted fresh white shirts. You got a rosy sunset and a lesson about sorting. || The load comes out one color: salmon. Your wardrobe is having a bold new era.
laundry.lost_sock=You count the socks twice. One vanished into the machine's hidden dimension again. || Seven socks go in, six come out. The washer keeps a collection. || A lonely sock stares back from the drum. Its twin is gone forever.
laundry.slip=You step on a trail of suds from the machine. The floor wins and you spin like a figure skater. || A puddle of soapy water ambushes your socks. Wheee... thud. || You carry the basket straight into a wet patch. The laundry flies and so do you.
laundry.flood=The hose pops loose and the machine floods the floor. You are standing in a very clean lake. || Too much detergent, too little sense. A wave of foam takes over the room and the machine gives up. || A loud gurgle, a bang, and a fountain of soapy water. The laundry room is now a pool.
laundry.break=You press a button that was not meant to be pressed. The machine groans and goes dark. || Something inside clunks, rattles, and stops. The drum is stuck mid-cycle and so is your mood. || The machine shudders, smokes a little and dies. It was nice knowing it.
laundry.burnout=The machine screams, sparks, and gives off a smoky little flame before dying. Laundry day is cancelled. || Smoke, sparks, and a short flame from the back of the machine. It was a good washer. It was an old washer. || Something inside overheats and the machine goes out in a puff of smoke. Your clothes will have to wait.
laundry.laundry_cash=You check the laundry and find ${m} folded in the pocket of your old pants, one second before the machine turns them into confetti. || A crumpled wad of ${m} in the jeans you swore were empty. The washer gets the jeans, you get the cash. || You pat down every pocket before the cycle and strike gold: ${m}. Past you was a genius. Present you is rich. || Mystery solved: that is where ${m} went. It was hiding in your pants the whole time. || You find ${m} in a pocket just before the spin cycle starts. The machine looks disappointed it missed it.
laundry.flood_safe=The machine rattles, coughs a cloud of lint and gives up. A single dust bunny rolls to a stop at your feet. || A loud clunk, a sad sputter and the drum goes quiet. A small puff of dust settles by your shoes. || The cycle jams and the machine burps out one grey puff of lint. The floor gets a tiny dust bunny and you get the blame.

# -- Cooking
cooking.bonus=The smell is amazing. You taste it and nod like a chef on TV. || A little pinch of luck and the dish turns out perfect.
cooking.crit_success=A masterpiece. Restaurants would beg for this recipe.
cooking.soft_fail=It looks nothing like the picture, but it is edible. Probably.
cooking.crit_fail=Smoke, sparks and a very confused cook. Today you have invented a new level of kitchen disaster.
cooking.burn=You grab the hot pan with bare confidence. It disagrees. You hop around fanning your hand. || The steam gets you and the pan gets you. Cooking is dangerous, apparently.
cooking.food_poison=The dish smells suspicious, tastes suspicious and your stomach starts planning a revenge tour. || You cook with great confidence and zero hygiene. Your stomach will send a review later.
cooking.mess=Flour on the ceiling, sauce on the wall, and a smoking pan. Where did the recipe go wrong? || The kitchen looks like a battlefield. You are the only casualty.
cooking.fire=You look away for one second and the pan catches fire. The kitchen has opinions about your cooking. || Flames! The stove decided to get creative and you are very much not ready for it. || The oil gets ambitious, the flame gets taller, and your dinner officially becomes a fire hazard. Run!
cooking.explosion=The oven makes a sound no oven should make. Then a bigger sound. Dinner is now a crime scene. || Something in there was NOT supposed to be heated. The kitchen answers with a loud bang. || You press start, the oven thinks about it, and then it goes off like a firework.
cooking.appliance_break=You press the button and the appliance goes bang, then dead. Dinner is now takeout. || Something sparks inside the oven. You turn to say sorry but it is already gone.
cooking.takeout=The dinner is a lost cause, so you order takeout. It arrives fast and costs ${m}. Cooking is a journey. || You admit defeat and call the pizza place. ${m} later, everybody is happy. || The smoke alarm is thinking about it, so delivery it is. Total: ${m}.
cooking.explosion_safe=The oven gives one small bang, then goes quiet. You choose to call it seasoning. || A small bang and one very dramatic oven. Nobody is hurt, just offended. || The oven pops once, loudly. Good thing it was only a little boom.
cooking.fire_safe=The pan pops like a firecracker, you yelp, and then everything goes quiet. Good thing it was just a little pop... || The stove coughs out a tiny bang, then thinks better of it. Good thing it was just a little bang... || A small pop, a puff of nothing, and a kitchen that smells like a barbecue that never happened.

# -- Dining
dining.bonus=The fridge has exactly what you wanted, and it tastes even better than it looks. A tiny win. || Perfect temperature, perfect portion. You eat like you have somewhere important to be. || Every bite lands. You even finish the plate without a crumb.
dining.crit_success=A meal worthy of applause. You lick the plate and nobody can stop you. || A chef would cry. You just eat it. Pure joy. || The best bite of your week. You close your eyes and stay there a moment.
dining.soft_fail=A little dribble, a little oops. You wipe the table and pretend it never happened. || The food is a bit off but you finish it anyway. Pride is a sauce. || You nearly drop it, catch it, and nod like it was the plan.
dining.crit_fail=You carry the plate with confidence, then with panic, then not at all. The floor gets the meal and you get the floor. || The bowl takes off and the soup takes the floor. You take the floor too. Lunch is a story now. || A sneeze, a spill and the worst possible landing. The meal and your pride are everywhere.
dining.spill=The bowl tips and dinner hits the floor. Somehow the floor was already dusty, and now it is a scene. || You drop half the meal and a cloud of crumbs and dust comes up. The kitchen is not happy. || A clumsy tilt, a clatter, and a mess spreads across the floor. The cleanup will wait.
dining.burnt_tongue=You bite in before it cools. Your tongue files a complaint and so do your eyes. || Too hot, too fast. You fan your mouth like a very small dragon. || The first bite is lava. The second bite is a bad idea. You take it anyway.
dining.choke=A bite goes down the wrong way. You cough, you wheeze, you recover with a very dignified nod. || You inhale half the meal and some of it wants out. Water, now. || A wild cough, a few tears and a thumbs up. You are fine. The plate is judging you.
dining.food_coma=Halfway through the plate you are already done for the day. Your eyelids give up first. || A heavy meal, a heavy sigh and a long stare at nothing. Naptime beckons. || The food was great. The body is now offline for maintenance.
dining.bad_leftovers=That leftover smelled fine, which is a lie leftovers tell. Your stomach starts to disagree. || You eat the thing in the back of the fridge. The fridge was trying to warn you. || It looked okay and tasted okay. Your stomach has other opinions.
dining.machine_eats_coin=The vending machine takes your coin and gives you nothing, with confidence. || You press the button. The machine hums, thinks, and keeps your money.
dining.fountain_splash=The water jumps higher than expected. Your shirt is now part of the fountain. || You lean in for a sip and get a face full of cold water.

# -- Programming
programming.bonus=The code compiles on the first try. Suspicious, but welcome. || You find the elegant solution and feel like a wizard.
programming.crit_success=Flawless code, zero bugs and a standing ovation from an empty room.
programming.soft_fail=It runs, mostly. The warnings will be your future problem.
programming.crit_fail=You rm -rf something you should not have and the hardware joins the party. Total system meltdown.
programming.stress=Your code compiles on the fifth try and breaks on the sixth. Your eye twitches in rhythm. || A missing semicolon takes an hour of your life. Coffee, anyone?
programming.frustrated=Everything worked a minute ago. You did not touch anything. You are very sure. || The bug is gone, then it is back, then it is somewhere else. You slam the desk.
programming.shock_break=A pop, a flash, and your computer goes dark with a puff of smoke. The shock is just the final insult. || You hit enter and the machine hits back. Sparks fly, literally.
programming.crash=The screen goes blue, then black, then dead. All the unsaved work goes with it. || Your computer gives a little sigh and quits. It had had enough.
programming.hack=You swore your software was unhackable. A hacker just proved you wrong and withdrew ${m} from your bank account. Their note says 'thanks for the tip'. || Your super secure password was 'password1'. Someone drained ${m} from your account before you finished your coffee. || A stranger found the backdoor you forgot to close and helped themselves to ${m}. Impressive teamwork with your past self.
programming.bounty=You find a critical bug in a famous app and report it politely. They pay a bounty of ${m}. You pretend this was always the plan. || Your pull request fixes something nobody could fix for years. The maintainers send ${m} and a very long thank-you. || A company reads your clean little exploit report and wires you ${m}. The hoodie was a good investment.
programming.freelance=A client pays ${m} for a quick favor. It took ten minutes and three years of experience. || You fix a stranger's website over chat and they insist on sending ${m}. Who are you to refuse? || A tiny side job lands in your inbox, and ${m} lands in your account right behind it.

# -- Critical Thinking
logic.bonus=The pieces click into place. You feel properly clever. || You spot the flaw in the argument before anyone else does. Quiet, smug joy. || Facts, then logic, then a conclusion that actually follows. Delightful.
logic.crit_success=Every question answered, every trick spotted. You could teach a class. || The puzzle folds like paper. You lean back and the chair creaks in respect. || A perfect line of reasoning, from start to finish. Brilliant, really.
logic.soft_fail=Close, but the logic has a hole you could drive a truck through. || You almost have it. Almost is doing a lot of work here. || The answer is nearby. You are not quite sure where.
logic.crit_fail=You follow a very convincing argument all the way to a very wrong place. Total collapse. || Everything you believed three minutes ago was wrong. And so is what you believe now. || Confidence, a blunder and a complete mental reboot. You start from zero.
logic.headache=Too many tabs, too many facts. Your head starts to throb. || You read the same paragraph six times and it never gets easier. || A dull ache behind your eyes says that is enough thinking for today.
logic.rabbit_hole=One link led to another and now it is three in the morning in your head. || You started with a simple question and ended up reading about medieval cheese. || The research got interesting. The research got very long.
logic.wrong_answer=You were so sure. The answer key was kinder than it needed to be. || You answer with confidence. The answer is wrong with equal confidence. || A bold guess that was bolder than it was right.
logic.overthinking=You think so hard about the question that you forget what it was. || The more you analyze, the less sense it makes. Thinking, ironically, hurts. || You build a perfect theory and then notice you started from the wrong fact.
logic.argument=You explain the logic. {t} explains why it is wrong. Now you are both explaining. || Your perfect argument has a hole you did not see. {t} sees it and says nothing, loudly. || You win the argument in your head. Out loud, {t} wins it with one sentence.
logic.lost_thread=You start with a clean point and lose it mid-sentence. {t} waits kindly for it to come back. || The logic collapses halfway through. You blink at {t} and say 'what was I saying'. || A flawless argument that stops flawlessly in the middle. {t} nods like it made sense.
logic.pedantic=You correct {t} on a tiny detail. {t} looks at you like you ate the last cookie. || Technically you are right. {t} stares at you with the energy of a closed door. || You win a point nobody cared about. {t} takes a long breath.
logic.falls_asleep_reading=The book is so quiet. You blink once, and wake up on page 40 with a mark on your cheek. || You read three lines, then the words start to move. A nap has been taken.
logic.quiz_prize=You answer the last question before the host finishes it. The prize is ${m} and a rare feeling of superiority. || Your trivia knowledge finally pays off: ${m}. All those weird facts were an investment. || You crack the riddle in record time and a pop-up pays you ${m}. Mensa could not be reached for comment.

# -- Finance
finance.bonus=The numbers line up and your instincts are right for once. A quiet little win. || You read the chart like a book and the chart behaves. Very smooth. || A smart call, a steady hand and a green screen. You nod at yourself.
finance.crit_success=Every call lands. The market loves you and you pretend to be humble about it. || You buy low, sell high and somehow it was all on purpose. Legendary. || The chart goes vertical in your favor. You close the laptop like a movie villain.
finance.soft_fail=Nothing earth shattering, just a tiny dip and a lot of squinting. || You break even and call it a lesson. A very boring lesson. || The market shrugs and so do you.
finance.crit_fail=You sell at the bottom and buy at the top, a rare double. The market notices. || One wrong click and the whole plan goes up in red. Your stomach drops with the chart. || The chart goes vertical, the wrong way. You stare at it like it owes you an apology.
finance.bad_trade=You were sure about this one. The chart disagrees, loudly. || The tip came from a very confident stranger. That was the first mistake. || You hold on a little too long, then sell a little too late. A classic.
finance.panic=The line drops and your heart drops with it. You refresh the page nine times. || Red numbers everywhere. You breathe into a paper bag, figuratively. || Your hand hovers over the sell button and shakes. The market does not wait.
finance.rage=You call the market names that a polite computer should not hear. || You slam the desk and the stock chart keeps going down. Rude. || Your fist and the desk have a short meeting. The desk wins.
finance.glitch=The trading site crashes at the worst possible second. So does your computer. || A pop-up, a spinning wheel and a frozen screen. The market took your session hostage. || The machine gives up under the weight of your bad decisions.
finance.scam=A message says you won something. You click it. ${m} leaves your account in a hurry. || A very kind prince needed a small favor. The favor cost ${m}. || The investment looked legit, with a logo and everything. It was just a logo. ${m} is gone.
finance.lottery_counterfeit=The ticket is a fake. The clerk is very sorry and you are out ${m}. || A counterfeit ticket, a cheerful smile and ${m} gone. You can almost hear the printer laughing. || The numbers look right and the paper looks wrong. A very convincing fake costs you ${m}.
finance.lottery_washed=The ticket goes through the wash with your jeans. What is left is grey confetti and a lost ${m}. || You find the ticket in the dryer, now a small ball of paper. The prize stays unclaimed and the ticket cost ${m}. || A pocket, a washing machine and a soggy ticket. A rainy day, ${m} lost.
finance.lottery_old_draw=You celebrate for a full minute before noticing it was last week's draw. The ticket cost ${m} and so did your pride. || The numbers are perfect. The date, sadly, is not. ${m} for a very expensive lesson. || A big win, some small print and ${m} out of your pocket. The draw was last week.
finance.lottery_text_scam=A text says you won a prize and only need to pay a small fee. The fee is ${m}. The prize never arrives. || A very friendly message, a link you should not have clicked and ${m} gone. || 'Claim your prize now!' You did. It cost ${m}.
finance.card_swallowed=The machine swallows your card and prints a receipt that says 'good luck'. || A hidden fee appears. You stare at it as if it might change.
finance.hidden_fee=A small fee you did not see coming takes a small bite out of your money. || Ah, the 'convenience charge'. Convenient for someone.
finance.lottery_dud=You scratch, you hope, you lose. The ticket is a very expensive bookmark. || Three numbers match. Out of six. Not those three.
finance.lottery_jackpot=Six numbers, all yours. You read the ticket three times, then once more out loud. The prize is ${m}. || The numbers line up one after another and the ticket suddenly feels very heavy. ${m} lands in your account. || You win ${m}. You look for a catch, find none and start planning a very responsible party.
finance.lottery_lucky=A small prize: ${m}. Not life changing, but enough for another ticket. || The ticket pays ${m}. You call it a sign and politely ignore the odds. || Two matching numbers and ${m} for your trouble. The universe winks.
finance.dividends=A stock you forgot about pays ${m}. Past you says hello. || A tiny dividend lands: ${m}. It is not much, but it is yours. || Your portfolio coughs up ${m} like a polite cat. You accept the gift.
finance.lottery_soft=Two numbers match, one is off by a digit and the rest are not even close. The ticket goes in the drawer of hope. || You scratch it with great ceremony. Nothing. You scratch it again, just in case. || Not a winner. The ticket makes a very small, very polite 'better luck next time' sound.

# -- Gaming
gaming.bonus=Your reflexes are sharp, the squad is chatty and the loot is generous. A good night. || You call the play, the team follows, and the screen says VICTORY. Your chair spins a little. || Everything clicks. The aim, the timing, the snack. You are the main character.
gaming.crit_success=A flawless run. The chat is on its feet and so are you, barely. || You win a match nobody thought was winnable. You stand up and do a small victory lap. || First place, no deaths, and a clip worth sending to everyone.
gaming.soft_fail=You lose the round but keep your cool. Mostly. || A narrow loss. You blame the lag and start another round. || Not your best match, not your worst. The controller survives.
gaming.crit_fail=Your teammate leaves, your internet leaves, then the power leaves. The screen goes black on a perfect run. || You rage so hard the keyboard files for a restraining order. Match lost, and then some. || Quit, rematch, lose, quit. Somewhere a controller flies. Nobody is proud.
gaming.rage_quit=You lose to a bug that was clearly the game's fault. You are very calm about it. You are not calm about it. || Five minutes from the win, a pop-up shows up and ends the match. You say words. || The final boss one-shots you for the ninth time. The chair takes your frustration.
gaming.burnout=Three hours deep, your eyes are dry and your thumbs hurt. Maybe a break would be good. || You promised one more match. It was six matches ago. Your back files a complaint. || The game still goes on. You do not. A long sigh and a long stretch.
gaming.crash=The game freezes, the fan screams and the screen goes dark. The computer has had enough of your gaming. || Too many tabs, too many mods and one too many boss fights. The machine gives up. || A loud pop from the case, then silence. The save file is somewhere in the afterlife.
gaming.pc_fire=The PC fans scream, a flame pops out of the case and everything goes dark. Your save file had a good run. || Smoke, a small flame, and a dead computer. Maybe it was time for an upgrade anyway. || The graphics card chose violence: a flame, then a black screen. Nobody blames you. Everybody blames you.
gaming.microtransaction=You tap a shiny button to see what it does. It does a ${m} purchase. The sword is a hat. || A loot box opens with fireworks and a ${m} charge. Inside: a very small trophy. || The game offers a starter pack for a limited time. The time was now, the price was ${m}.
gaming.tournament=You clutch the final round with one health left. The prize pool pays ${m}. You scream in a very quiet room. || A tiny online tournament, a tiny prize and a big ego boost: ${m} is yours. || Your team wins and everyone yells over voice chat. The winnings are ${m}, and you remember none of the match.
gaming.stream_tips=Someone watching your stream sends ${m} and the message 'nice moves'. Both feel good. || A viewer drops ${m} for the vibes. You thank them on air, twice. || A tiny audience, a tip of ${m} and enough confidence to stream tomorrow too.

# -- Media
media.bonus=The cut flows, the colors pop and the file exports without a single error. Magic. || Your edit has rhythm. Even the b-roll looks intentional. || A clean render, a clean timeline and a very smug nod.
media.crit_success=A masterpiece in the making. You press save with a very quiet reverence. || The video looks like a real film. You rewatch it three times to be sure. || Every frame is right, every cut is perfect. You are an auteur now.
media.soft_fail=It exports, but the audio is just slightly out of sync. Nobody will notice. Probably. || The color is a bit off, the cut is a bit rough. Good enough, almost. || A decent attempt. The final result says 'needs work'.
media.crit_fail=The software eats three hours of work and then the whole project. Not even a backup. || You hit render and the computer hits back. Sparks, smoke and a very quiet room. || The export crashes, the file corrupts and the timeline is a map of regrets.
media.render_crash=The render bar reaches 99 percent and the machine falls asleep forever. || The computer gets loud, hot and then very, very quiet. || The fan screams, the screen flickers and the project dies a fiery death.
media.corrupted=The file refuses to open. You try nine times. It refuses nine times. || A single wrong click and the clip turns into green static. || The project saved itself as a very small, very broken file.
media.burnout=Eight hours of editing and the timeline still looks the same. Your eyes disagree with the clock. || You stare at the same two seconds of footage for an hour. They stare back. || Your back says no, your eyes say no and your timeline says maybe tomorrow.
media.bad_take=You watch the final cut and wince. A little bit of everything went wrong. || The audio is quiet, the video is dark and the joke does not land. || Somewhere between the idea and the video, the idea got lost.
media.copyright=A copyright claim pops up on your video. The song was 'just five seconds'. The fine is ${m}. || A studio finds the clip you 'totally edited enough'. Their lawyers invoice you ${m}. || Your masterpiece uses a very famous soundtrack and no permission. ${m} goes out in damages.
media.viral=Your video explodes overnight and the ad revenue arrives: ${m}. The comments say 'first'. Always. || A clip you almost deleted goes viral. The platform sends ${m} and your phone has not stopped buzzing. || Everyone is sharing your edit. A brand slides in with ${m} and a suspiciously warm email.
media.sponsor=A small brand loves your channel and sends ${m} to say your logo looks good in the corner. || A sponsor pays ${m} to be mentioned for eight seconds. You mention them for nine. || A discount code and ${m} for your trouble. Marketing really does work on you.

# -- Composition
music.bonus=A melody arrives from nowhere and sits down like it lives there. Nice. || The chords fit like they were waiting for you. The beat is relaxed and sure. || You hum the hook and it just works. A tune worth keeping.
music.crit_success=A hit. You can hear the crowd singing along, and the crowd is only you. || The song writes itself, then plays itself, then makes you cry a little. Beautiful. || The perfect hook, the perfect beat, the perfect finish. A real banger.
music.soft_fail=The melody is nice, the rest is not. You save it as 'draft 14'. || A decent start with a very unfinished middle. || The song goes somewhere, just not anywhere good.
music.crit_fail=The track sounds like a cat walking on a piano in a tunnel. Everyone covers their ears. || You delete the whole session by accident. The silence is very educational. || The song is terrible, and then it somehow gets worse. A new record.
music.off_key=You hit a note that the rest of the song disagrees with. Loudly. || Somewhere between the verse and the chorus, the key changed without telling you. || A wrong note, a long pause and a very honest wince.
music.block=You stare at an empty track for an hour. The empty track wins. || Every idea sounds like something you have heard before. Because you have. || The inspiration took the day off, and left no note.
music.lost_file=The project closes without saving. Your song floats away like a balloon. || A wrong click deletes the best part of the track. It was the good part. || The save file turns out to be a blank one. Your genius is gone, in a very quiet way.
music.studio_bill=The studio books you for a quick session. The bill is ${m}, with a charge for a chair you never sat on. || You rent a nicer microphone for the vibe. The vibe costs ${m}. || A session musician cancels last minute and keeps the deposit: ${m}. The guitar solo was imaginary anyway.
music.string_snaps=A guitar string snaps with a bang and flicks you in the face. It stings, and so does your pride. || The string goes 'twang' in a way it is not supposed to.
music.dropped_stick=A drumstick flies out of your hand and lands somewhere unfortunate. || You hit the beat. The stick hits the floor. The beat is gone.
music.sticky_keys=The keys fight you. Every chord comes out slightly wrong, and so confident. || Your fingers cross and the result sounds like a cat walking on a keyboard.
music.dj_scratch=The scratch is loud, wrong and very proud of itself. || You press the wrong button and the track stops dead. The silence is brutal.
music.royalties=Your track plays in a cafe somewhere and the royalties arrive: ${m}. Your inner rock star sits up. || A show licenses your melody and sends ${m}. You hum it to yourself for the rest of the day. || A streaming check shows up with ${m} in it. Dozens of listeners. Maybe hundreds. Okay, maybe your cousin.
music.tips=A friend likes your demo so much they send you ${m}. Support the arts. || A listener sends ${m} with the message 'more please'. You immediately comply. || Someone drops ${m} in your virtual hat. It is, technically, a hat.

# -- Performance
performance.bonus=The rhythm takes over and you hit every beat. The room is yours. || You glide through the routine like you were born to it.
performance.crit_success=A standing ovation, in a room of one. You glow anyway.
performance.soft_fail=You miss a step or two but keep the groove. Nobody noticed. Probably.
performance.crit_fail=You slip, spin and land in a splash of shame. Even the beat takes a moment of silence.
performance.embarrassed=Your moves are bold, your timing is not. You freeze mid-step and pretend the music stopped. || Everyone is watching, and not in the good way. You wave awkwardly and leave the stage.
performance.stage_fright=The spotlight hits and your legs forget everything. All you can hear is your own heartbeat. || You step out and the rhythm steps away. Somewhere an audience of zero is judging you.
performance.sad=You dance like nobody is watching, and then notice that nobody was. A quiet sigh follows. || The music ends and so does your confidence. Maybe another day.
performance.fined=A neighbor files a noise complaint and the city fines you ${m}. Art, as always, has a price. || An inspector says your act needs a permit. It does. The fine is ${m}. || Somebody calls the authorities on your performance. The ticket costs ${m}, and the show goes on in spirit.
performance.flat_note=The first note is lovely. The second is somewhere else. {t} smiles and endures. || You aim for the heart and hit a different key. {t} politely applauds the effort. || The serenade hits a note that makes the dog bark, if there were a dog. {t} nods bravely.
performance.forgot_lyrics=You forget the words in the middle of the song. {t} waits, hands folded, with a gentle look. || The lyrics vanish from your head. You hum a bit and pretend it was on purpose. || You stall in the chorus. {t} smiles and mouths the next line for you.
performance.too_loud=You sing so loud that {t} flinches. The neighbors may have heard it too. || The serenade is passionate and absolutely deafening. {t} politely covers one ear. || Too much volume, not enough control. {t} would like the song to end, but gently.
performance.mic_feedback=The mic screams in a feedback loop. Everyone covers their ears. || A piercing squeal, a stunned silence, and an apologetic wave.
performance.joke_dies=The punchline arrives. Nobody laughs. A cricket does. || You deliver the joke perfectly. The audience delivers silence.
performance.cracked_voice=Your voice cracks on the big note and keeps going a bit longer than it should. || The high note was a bold idea. It ended in a wheeze.
performance.knockout={t} loses it and throws a punch. It lands, and you hit the floor like a sack of laundry. || That joke was the last straw. {t} swings, and the room tilts. You wake up looking at the ceiling. || {t} turns bright red and punches you square. Your dignity leaves the building before you hit the floor.
performance.fight={t} is done with this. A quick shove, a loud word, and suddenly you are in a fight. || That was one step too far. {t} squares up and comes at you swinging. || {t} takes it very personally and decides to answer with fists. You asked for it.
performance.police={t} has had enough and is already dialing. A police report is coming your way. || {t} stares at you for a second and says 'I'm calling the police.' It sounds a lot like they mean it. || That went badly. {t} files a report against you before you finish apologising.
performance.big_tip=A passerby drops ${m} in your hat and says nothing. The silence is the compliment. || The crowd goes wild and a stranger tips ${m}. You take a bow, then count it twice. || No talent scout shows up, but ${m} does. You will take it.
performance.busking_tips=A few coins turn into ${m} by the end of the song. Someone even clapped. || A kid drops ${m} in your hat and runs away. A tiny patron of the arts. || Your hat is heavier than it was this morning: ${m}. The pigeons applaud.
performance.knockout_death={t}'s punch lands, and you fall to the floor... and don't wake up. The End. || One swing from {t}. You drop, the room goes quiet, and you do not get back up. Roll credits. || {t} throws a single punch. It is, unfortunately, the last thing you ever notice. The End.

# -- Dance
dance.bonus=The beat drops and your body already knows where to go. Smooth, effortless, a little smug. || You land every move like the choreographer wrote it for you alone. || Someone nearby starts clapping along. You pretend not to notice and add a spin.
dance.crit_success=Pure rhythm. Even the furniture seems to sway along. || You hit a move so clean you almost applaud yourself. || The room goes quiet for one second, then you hit the finale. Legend status.
dance.soft_fail=You miss a step or two but keep the groove. Nobody noticed. Probably. || A small stumble, a quick shuffle, and you carry on like it was choreographed. || Your timing drifts for a few beats, then finds its way back.
dance.crit_fail=You commit to a spin and the floor commits to winning. Gravity: 1, you: 0. || Your foot goes one way, the rest of you disagrees. The landing is not graceful. || The move looked great in your head. The room has seen it now and cannot unsee it.
dance.puddle_slip=A suspicious puddle waits on the dance floor. You find it with a spin. || You launch the big move, your foot finds a puddle, and the rest is a dance of a different kind. || Nobody saw that puddle. Everybody is about to see you in it.
dance.embarrassed=Your moves are bold, your timing is not. You freeze mid-step and pretend the music changed. || You strike a pose for the big finish and the song keeps going without you. || Somebody is watching, and not in the good way. You wave awkwardly and call it art.
dance.exhausted=Three songs in, your legs file a complaint. You are done, and so is your battery. || The enthusiasm was there. The stamina took the night off. || You dance until your knees speak up, then sit down and think about your choices.
dance.sad=You dance like nobody is watching, and then realize nobody was. A quiet sigh follows. || The music ends and so does your confidence. Maybe another day. || The dance floor is empty. For a moment, so are you.
dance.stepped_on=You step on {t}'s foot with the grace of a falling piano. Pretending it did not hurt takes effort. || The dance goes well until the third step. {t} hops on one foot and laughs it off, mostly. || Two left feet, both yours and theirs. {t} says 'my fault' and you both know it is not.
dance.dizzy=The spin is too fast and the room tilts. You and {t} fall into each other, dizzy and laughing. || You spin, the world keeps spinning, and you lose your balance. {t} catches you, or tries to. || Round and round until the ground disappears. {t} groans, still holding on.
dance.dip_dropped=The dip goes wrong and {t} slips out of your arms. A graceful fall, technically. || You lean into the dip, {t} leans out, and the floor takes both of you. Dancing with gravity. || Halfway down the dip, your grip gives up. {t} hits the floor and says 'ow' in two syllables.
dance.in_sync=You and {t} move as one. The rhythm clicks and a little warmth builds between you. || Every step lines up. {t} smiles in a way that says this was worth it. || A perfectly timed spin, a shared laugh. You and {t} end the dance closer than you started.

# -- Online Dating
dating.bonus=Your profile gets a good reaction and a funny reply. Not bad at all. || The chat flows, the jokes land and someone says they like your sense of humor. || A match, a laugh and a promising plan. You blush at the screen.
dating.crit_success=A perfect match, a great chat and a date that sounds like a movie. You are glowing. || Three people reply at once and all of them are lovely. What a problem to have. || Your photo, your bio and your timing are all perfect. The internet loves you.
dating.soft_fail=A couple of polite replies and no sparks. The profile needs another look. || You match with someone and the chat dies after 'hi'. || The app shows you a few faces. None of them wave back.
dating.crit_fail=You send a message to the wrong person, the wrong message and the wrong photo. Everything at once. || Your profile gets reported by someone you matched with. Somehow, it is your fault. || Total disaster: a typo in your name, a blurry photo and a reply that says 'who?'.
dating.ghosted=The chat was going so well, and then the other person vanished. Not even a goodbye. || Three dots appear, disappear and never come back. You stare at them anyway. || They read your message and left it at that. The silence is deafening.
dating.catfish=The photos were very different from the person. Very different. Different species, even. || The charming match turns out to be a bot with a very good script. || Their profile said 'tall, fun, honest'. The chat said 'send me a gift card'.
dating.awkward=Your first message was a very long joke that required a lot of explaining. || You answer 'haha' in a way that comes out as very sad. || A cringe-worthy pickup line, sent with a confidence you cannot defend.
dating.typo=Autocorrect turns a sweet message into something deeply unfortunate. || You hit send, then see the typo. The typo is in the first word. || A tiny mistake, a huge difference in meaning. You will remember this one.

# -- Medicine
medicine.bonus=The medicine works fast and your stuffy head clears. You feel almost brand new. || Right dose, right time. Your nose clears up and so does your attitude. || The pill does its job quietly. You decide to trust pills more.
medicine.crit_success=Perfect dose, perfect timing. You feel better than before you got sick. || The medicine kicks in like a movie montage. Tissues fly, music plays, you are cured. || Textbook treatment. A doctor somewhere feels a strange sense of pride.
medicine.soft_fail=You shake the bottle, sigh and pretend to be productive. || You decide the cold is not that bad. The cold disagrees. || You put the medicine down for later. Later is a long way away.
medicine.crit_fail=You grab the wrong bottle. The label said 'for plants'. You feel very leafy. || The pill rolls under the sofa and you take the one next to it. Bold. Not smart. || You take medicine meant for something else entirely. Your body files a formal complaint.
medicine.wrong_dose=You squint at the label, take a guess and guess wrong. Medicine is not that kind of game. || You take a bit too little, then a bit too much. The cold stays and you feel weird. || The instructions were clear and you read none of them. The cold is still here.
medicine.side_effects=The medicine fixes nothing and makes you drowsy. Congratulations: a cold with a headache. || Your stomach does not like the pill. Your cold does not care. || You read the side effects after taking it. There were more than you thought.

# -- Funeral Comfort
mourning.bonus=A long, warm hug. {t} lets out a breath that sounds like it has been held all day. || You do not say much, and you do not need to. {t} leans in and the room gets a little quieter.
mourning.crit_success=You hold {t} and the words stop mattering. Both of you cry, laugh a little, and for the first time today it feels survivable. || {t} falls apart in your arms and you let them. By the end you are both lighter than when you started. || Some hugs say what nothing else can. This one says it all, and the weight on both of you eases at once.
mourning.soft_fail=The hug is stiff and brief. {t} nods politely, and the loss sits a little heavier than before. || You pat {t} on the back like a stranger at a bus stop. Both of you feel the miss. || Your arms are there but the words are not. The silence afterwards is long and sad.
mourning.crit_fail=You hold on a beat too long, say exactly the wrong thing, and {t} starts crying harder. So do you. || The hug turns into a sob-fest of the wrong kind. The grief is heavier now, and it is shared equally. || You mean well, truly. It comes out as the worst thing you could have said. {t} goes quiet, and so do you.
mourning.fail=You say "sorry for your loss" as if you were reading it off a card. {t} thanks you, and neither of you feels better. || The hug lands at the wrong moment and the grief only gets louder. Nobody knows where to put their hands. || You try to comfort {t} and end up reminding you both of everything that is missing.
mourning.pass=A good hug. It does not fix anything, but it helps. || You hold {t} for a while. Some things are easier when someone else is carrying part of them.

# -- Sink
sink.bonus=The water runs warm on the first try. Somebody upstairs likes you. || Your hands come out so clean they squeak. Surgeons would be jealous. || Perfect pressure, perfect temperature. A tiny miracle in the bathroom.
sink.crit_success=Hands, face, teeth, all spotless. The mirror applauds. || The sink behaves so well it deserves a medal.
sink.soft_fail=The water is lukewarm and the soap is almost empty, but you make it work. || A bit of splashing, a lot of grumbling, and you are clean enough.
sink.crit_fail=Oh look at the mess you did. Watch your step, don't slip! || You twist the tap and the whole sink gives up. Water everywhere, dignity nowhere. || The pipe lets out a groan, a pop, and a geyser. The bathroom is now a swimming pool.
sink.flood=Oh look at the mess you did. Watch your step, don't slip! || The faucet snaps off and the water goes everywhere. Mind the puddle, genius. || A crack, a hiss, a fountain. The sink is broken and there is a puddle right under your feet.
sink.frustrated=You wrestle the tap until it surrenders. You are not calm about it. || Every time you turn the handle it gets worse. You glare at the pipes like they owe you money.
sink.splash=You splash yourself right in the face and wish you could rewind a minute. || The tap sprays sideways and soaks your shirt. Very elegant.
sink.slip=You step on the wet spot you just made. Gravity files a complaint. || The floor is slippery, your socks are slippery, and so is your luck.
sink.fail=The tap sputters, coughs and sprays you in the face. Rude. || The water goes cold, then hot, then cold again. The sink has a personality. || You fight the faucet and the faucet wins.
sink.pass=A normal, boring, perfectly functional wash.

# -- Toilet
toilet.bonus=Everything works. It is the little victories that count. || A flawless visit. The porcelain throne approves.
toilet.crit_success=A flush so smooth it should be in a catalog. || A perfect visit. The bathroom smells like a spa.
toilet.soft_fail=It takes two flushes, but it works. Nobody saw anything. || A little noisy, a little slow, and you are done.
toilet.crit_fail=The toilet gurgles in a way that sounds expensive. Watch your step! || Something went wrong with the plumbing while you were busy. Stay calm and don't slip. || A horrible gurgle and a suspicious puddle spreading at your feet. You walk away with great dignity.
toilet.overflow=The toilet gurgled ominously and now the water is spreading. Watch your step, don't slip! || There is a puddle at your feet. You act like nothing is happening. || The bowl coughed up a surprise wave. Now you are standing in a puddle trying to look dignified.
toilet.clog=You pressed the handle and the flush gurgled, thought about it and gave up. You stare at the bowl in silence. || The flush does nothing. You try again, and again. The toilet has chosen violence.
toilet.gross=Whoever was here before you left a surprise. Your stomach is not amused. || You look into the bowl, regret it, and look away very fast.
toilet.embarrassed=You are pretty sure someone heard that. You pretend it was the pipes. || The lock was not locked. Nobody needs to talk about it.
toilet.fail=The flush is weak and the toilet makes a rude noise. You pretend nothing happened. || The seat is cold, the paper is gone, and the day is off to a bad start.
toilet.pass=Mission accomplished. Nothing exploded.