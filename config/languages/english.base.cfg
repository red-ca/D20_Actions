# ============================================================================
# ABOUT THIS FILE
# ============================================================================
# The texts the mod shows: the roll messages, the category names and, in the UI section, every label of the settings panel and the roll widget.
#
# How it is generated: the mod writes this file itself the first time it runs and rewrites it when the version number above changes (a mod update).
# Do not edit it, your changes would be replaced. Put them in another file next to it, for example english.my_pack.
#
# How files are combined: english.base first, then the other english files in alphabetical order. A chosen language (for example español.base) is
# applied on top and any line it does not have stays English. A row with the same key replaces the earlier one, a row with a new key is added.
#
# Format: key=text. Several variants of one message are separated by ' || ' and one is picked at random.
# Placeholders: {a} = your first name, {t} = the other character's first name, {m} = a money amount (with thousands separators, for example 1,000).
#
# To translate: copy this file to <language>.base (for example français.base) and translate only what is after the = sign. The keys never change.
#
# Sections: UI texts, Category names, Shared texts, Roll messages (one block per category).

