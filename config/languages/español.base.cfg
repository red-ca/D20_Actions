ui.dyndc=Dificultad dinámica
ui.dyndc_hint=ACTIVADO: la CD cambia según tu estado de ánimo y lo acumulada que esté la tirada (nunca menos de 5 ni más de 30). DESACTIVADO: cada prueba usa su CD fija.
romance.crit_success=Las palabras salen justo como debían. {t} te mira como si hubieras bajado la luna y te pregunta en voz baja si mañana también estás libre. || Todo encaja: el momento, la sonrisa, el silencio en el sitio justo. {t} se queda sin aliento, y tú también. || Nunca has estado tan suave. {t} se sonroja y la sala se siente diez grados más cálida.
romance.bonus={t} se ríe en el momento justo y se queda más cerca que antes. Algo está empezando. || Un buen momento. Tú y {t} os miráis un segundo de más y a ninguno le importa. || Mariposas, y de las dos partes. Te vas con una sensación cálida y revoltosa.
romance.soft_fail=Es agradable, pero nunca llega a saltar la chispa. Los dos fingís que sí. || {t} sonríe con educación. Es la sonrisa que se le da a un camarero. || No es un desastre, pero tampoco un momento. El aire sigue exactamente a la misma temperatura.
romance.fail=Intentas ser encantador y aterrizas cerca de 'leer un manual en voz alta'. || El plan era romántico. La ejecución fue una negociación de rehenes.
romance.crit_fail=Dices algo tan desafortunado que {t} comprueba si te encuentras bien. No es así. || El momento se desploma a cámara lenta. {t} te mira, tú miras el suelo, y el suelo no ayuda. || Abres la boca, se te cae una frase y es la peor disponible. {t} la recordará durante años.
romance.tongue_tied=Lo ensayaste en la ducha. En voz alta solo salen sonidos. || Tu cerebro abandona el chat. Solo consigues decir 'pues... sí.' || {t} espera. Tú esperas. Nadie dice nada romántico.
romance.turned_down={t} dice 'creo que somos mejores como amigos' con voz muy amable. Duele igual. || Un 'no, gracias' educado. Lo peor es la educación. || {t} parece sentirlo de verdad, y eso lo empeora. Vuelves a casa con el corazón pesado.
romance.too_forward=Pasas de cero a '¿y los niños?' en una sola frase. {t} da un paso atrás. || Fue mucho y muy rápido. {t} necesita un minuto y un vaso de agua. || Te saltaste unos nueve pasos. {t} los notó todos.
romance.cold_feet=Preguntas por el matrimonio y {t} de pronto encuentra el techo muy interesante. || '¿A dónde crees que va esto?' cae como un ladrillo. El ambiente se va en silencio. || {t} cambia de tema tan rápido que deja marcas de frenada.
romance.sweaty_hands=Tu palma es un pantano. {t} la sostiene con valentía y luego se limpia la mano en el pantalón. || Agarras la mano de {t}. Está húmeda, temblorosa y pidiendo perdón. || El agarre dura justo lo que tardáis en notar lo pegajosos que estáis.
romance.hand_yanked={t} retira la mano como si fuera una sartén caliente. No es nada sutil. || Extiendes la mano y {t} se la guarda en el bolsillo. El mensaje es claro. || La mano se retira con mucha educación y mucha prisa. Ay.
romance.slap=Vas a tomar la mano de {t}, pero {t} lo interpreta mal y te suelta una bofetada. || Eso fue demasiado atrevido. {t} reacciona con una bofetada y el sonido se oye por toda la casa.
romance.knockout={t} pierde los papeles y lanza un puñetazo. Acierta, y caes al suelo como un saco de ropa sucia. || Ese movimiento fue la gota que colmó el vaso. {t} golpea y la habitación se inclina. Despiertas mirando el techo.
romance.knockout_death=El puñetazo de {t} acierta, y caes al suelo... y no despiertas. Fin. || Un golpe de {t}. Caes, la sala se queda en silencio y no te vuelves a levantar. Créditos finales.
romance.fight={t} ya ha tenido bastante. Un empujón rápido, una palabra fuerte y de repente estáis en una pelea. || Eso fue un paso de más. {t} se planta y va a por ti a puñetazos.
romance.police={t} ha tenido suficiente y ya está marcando. Te va a llegar una denuncia. || 'Voy a llamar a la policía.' {t} suena como si lo dijera en serio.
romance.butterflies=Las mariposas son mutuas. Algo crece en silencio entre tú y {t}. || Tú y {t} os despedís con una sonrisa que no podéis esconder del todo.
romance.swept_off_feet=Es uno de esos momentos que ambos recordaréis. {t} está embelesado y tú resplandeces. || {t} ha caído por completo. Sientes una oleada de calidez que dura horas.
conflict.crit_success=Lo clavas. {t} no tiene respuesta y toda la sala sabe que has ganado. || Una clase magistral. {t} abre la boca, la cierra y asiente con respeto. || Tu valor da frutos. {t} se echa atrás y te sientes diez metros más alto.
conflict.bonus=Una frase afilada, bien dicha. {t} sonríe a regañadientes. || Te mantienes firme y funciona. {t} te respeta un poco por ello.
conflict.soft_fail=Cae con suavidad. {t} se encoge de hombros y sigue adelante. || No es tu momento más agudo, pero nadie sale herido. || {t} no se deja impresionar y el asunto queda sin resolver.
conflict.fail=Fuiste a por lo audaz y llegaste a lo vergonzoso. || La frase era buena. La entrega fue un estornudo.
conflict.crit_fail=Sale tan mal que {t} ni necesita responder. Tus propias palabras lo hicieron por ellos. || Tu gran momento sale por la culata de forma espectacular. El silencio posterior es ensordecedor. || Te mantuviste firme directamente contra una pared. {t} te mira con mucho interés.
conflict.stiff=La pulla sale rígida y ensayada, y {t} la ve venir. || Intentas sonar duro. Sonaste como un buzón de voz.
conflict.tease_backfires=La broma no cuela y {t} responde con algo que sí duele. || Pinchas a {t} y el pinchazo te muerde a ti. || {t} no se divierte. Quien se sonroja eres tú.
conflict.ridicule_backfires=Tu burla se vuelve en tu contra tan bien que casi quieres aplaudir. Casi. || {t} se ríe de ti, bien alto, y ahora desearías no haber empezado. || Te burlas de {t} y tienen una frase mejor preparada. Ay.
conflict.stubborn=Te atrincheras, y {t} también. Nadie gana y el ambiente queda arruinado. || Insistir más fuerte no te da más razón. {t} deja de escuchar.
conflict.line_crossed=Marcas el límite y resulta que pasa justo por encima de los sentimientos de {t}. || La verdad salió demasiado sincera. {t} se queda callado y la sala se enfría. || Lo dijiste claro. {t} lo oyó claro, y ahora ninguno puede mirar al otro.
conflict.power_play_flops=Tu jugada de poder fracasa. {t} te deja en evidencia delante de todos y te sale cara. || Resulta que {t} no se sintió intimidado en absoluto. Escuece, y de más de una manera. || Buscas ventaja y acabas pagando por el privilegio.
conflict.shown_the_door={t} señala la puerta. Captas la indirecta y te llevas algo de orgullo herido. || Le pides a {t} que se vaya, y {t} responde con una mirada que fundiría el acero. || El 'por favor, vete' cae mal, y ahora eres tú quien está fuera.
conflict.knockout={t} pierde los papeles y lanza un puñetazo. Acierta, y caes al suelo como un saco de ropa sucia. || Esa fue la gota que colmó el vaso. {t} golpea y la habitación se inclina. Despiertas mirando el techo.
conflict.knockout_death=El puñetazo de {t} acierta, y caes al suelo... y no despiertas. Fin. || Un golpe de {t}. Caes, la sala se queda en silencio y no te vuelves a levantar. Créditos finales.
conflict.fight={t} ya ha tenido bastante. Un empujón rápido, una palabra fuerte y de repente estáis en una pelea. || Te pasaste de la raya. {t} se planta y va a por ti a puñetazos.
conflict.police={t} ha tenido suficiente y ya está marcando. Te va a llegar una denuncia. || 'Eso es acoso y voy a llamar a la policía.' {t} suena serio.
conflict.witty=La frase es buena y {t} lo sabe. Una sonrisa a regañadientes y algo más de respeto. || Ganas el intercambio sin un rasguño. {t} se ablanda un poco.
conflict.respect=Ganas la discusión tan limpiamente que {t} lo admira de verdad. Tu confianza brilla un buen rato. || {t} se retira con un gesto de cabeza. Hoy te has ganado un respeto real.
passion.crit_success=Resulta que los dos amáis exactamente lo mismo. Tú y {t} habláis horas sin daros cuenta. || Dos almas gemelas se encuentran. {t} se ilumina como una lámpara, y tú también. || El tema encaja a la perfección. {t} quiere saberlo todo y tú se lo cuentas encantado.
passion.bonus=Vuestro interés común desata una buena charla. {t} asiente y los dos salís con energía. || Una charla estupenda sobre algo que os encanta a los dos. {t} pide más.
passion.soft_fail=Encuentras algunas cosas que decir, y {t} también. Está bien. || Terreno común, pero poca chispa. || El tema se apaga con educación.
passion.fail=Estabas seguro de tener algo en común. Teníais menos de lo que creías. || El entusiasmo era real. El conocimiento, no.
passion.crit_fail=Dices con seguridad lo equivocado sobre el tema que más le importa a {t}. Cae el silencio. || Tu pasión resulta ser una pasión muy distinta a la de {t}. La conversación no se recupera. || Te lanzas de lleno a un tema y {t} se estremece. No sabes cuál de los dos está más avergonzado.
passion.dull_topic=Hablas del tema diez minutos. A {t} se le vidrian los ojos hacia el minuto tres. || Tú estás fascinado. {t} mira la hora. || El tema es emocionante para ti y para nadie más en la sala.
passion.hot_take=Sueltas una opinión muy atrevida y {t} no se lo toma bien. || Tu opinión radical enfría la sala rápido. {t} discrepa, y alto. || {t} se toma el tema como algo personal, y ahora es un debate.
passion.dance_stumble=Intentas enseñar un paso, tropiezas con tus propios pies y giras hasta caer en un montón. {t} se estremece por compasión. || El paso necesita más espacio del que tienes. Gana el suelo. || Un paso demasiado ambicioso, y la gravedad cobra su deuda.
passion.muscle_strain=Muestras un ejercicio y algo se tira. {t} te ofrece un cojín y mucha compasión. || El entusiasmo supera tu calentamiento. Tu espalda presenta una queja. || Flexionas demasiado fuerte y fuerzas algo que necesitabas.
passion.voice_cracks_song=Alcanzas la nota alta con seguridad. La nota no te alcanza a ti. || Tu voz se quiebra tan fuerte que {t} mira alrededor para comprobar las ventanas. || Cantar juntos es genial hasta que tomas tú la voz principal.
passion.off_key=El acorde que tocas nunca estuvo en la canción. {t} finge con educación que fue una decisión creativa. || Tu guitarra está desafinada y todo el ambiente también. || Rasgueas con pasión y con las notas equivocadas.
passion.meat_debate=Empiezas a hablar de carne y {t} tiene opiniones firmes sobre los cortes. Acaba en debate. || La discusión del filete se calienta. Poco hecho y muy hecho no son compatibles. || Dices 'bien hecho' y {t} te mira como si hubieras insultado a su familia.
passion.recipe_war=Tu receta contra la receta de {t}. Nadie gana, todos tienen hambre y están algo ofendidos. || Dices que el ingrediente secreto es la mantequilla. {t} dice que es la paciencia. Sube la tensión. || Criticas la técnica de {t}. Error.
passion.shared_joy=Hablar de lo que os gusta a los dos te deja una sensación cálida y un vínculo más fuerte. || {t} se ríe y cuenta una historia propia. Ahora estáis más cerca.
passion.kindred_spirits=Tú y {t} descubrís que sois de la misma pasta. Hoy empieza una gran amistad. || {t} sonríe y dice '¿dónde has estado toda mi vida?' Tú también lo sientes.
chat.awkward_hello=Dices hola y tu voz elige un tono al azar. {t} responde con el mismo tono, por piedad. || El saludo pasa por tres versiones antes de salir. || 'Hola. Buenas. Qué tal.' Conseguiste decir las tres a la vez.
chat.makeup_fails=Dices que lo sientes. {t} oye 'siento que te sientas así'. No es lo mismo. || La disculpa da vueltas en círculo. {t} sigue dolido y ahora también confundido. || Intentas hacer las paces y de algún modo añades una segunda discusión.
chat.life_talk_drags=La charla profunda se vuelve más profunda y pesada hasta que nadie recuerda la pregunta original. || Filosofas un rato. {t} bosteza con discreción en la manga. || '¿Cuál es el sentido de todo?' es una apertura pesada. La conversación no se recupera.
chat.gossip_leaks=El cotilleo que cuentas es demasiado jugoso. {t} se ofende por salir mencionado. || Susurrar resulta menos discreto de lo esperado. Alguien lo oyó todo. || Sueltas el chisme y parte cae sobre {t}.
chat.advice_ignored=Das un sabio consejo de pareja. {t} no escucha nada y se molesta un poco. || Tu consejo es perfectamente bueno y totalmente no deseado. {t} suspira. || Dices 'confía en mí'. {t} no lo hace.
chat.kindness_unnoticed=Haces algo amable y {t} no lo nota. Aun así cuenta, te dices. || Un pequeño acto de bondad, ignorado con educación. Te sientes un poco tonto. || Fue un gesto dulce. Recibió un encogimiento de hombros educado.
etiquette.pitch_ignored=Presentas tu idea con energía. {t} asiente y no apunta nada. || 'Interesante', dice {t}, en el tono que la gente usa para decir 'no'. || Entregas tus objetivos y {t} te devuelve una sonrisa educada.
etiquette.info_leaked=La información que compartes resulta ser errónea, y el daño es tuyo. || Compartes un dato que debía ser privado. {t} está furioso y te cuesta caro. || Se escapa un detalle confidencial. Caro.
etiquette.forced_cheer=Dices que estás feliz por el crecimiento. Suena a vídeo de secuestro. || La alegría es tan forzada que {t} te pregunta si estás bien. || Tu entusiasmo está ensayado y se nota.
etiquette.gift_flop=Entregas el regalo. {t} sonríe y se nota que no es el adecuado. || El regalo es un poco... raro. {t} te lo agradece con mucho esfuerzo. || {t} abre el regalo e intenta con todas sus fuerzas parecer contento.
etiquette.insider_tip=La información que compartiste resulta valiosa. {t} te da algo de dinero como agradecimiento. || Un consejo se convierte en un trato. Te vas con algo de dinero extra.
etiquette.gift_hit=A {t} le encanta el regalo. Es justo lo que quería, y se nota. || El regalo cae a la perfección. {t} te da un abrazo que dura un poco de más.
cat.romance.label=Romance
cat.romance.check=Prueba de Romance
cat.conflict.check=Prueba de Valor
cat.passion.label=Pasión compartida
cat.passion.check=Prueba de Pasión
selfcare.crit_success=Terminas sintiéndote como una persona nueva. Todo es un poco más brillante y mucho más tranquilo. || Tiempo bien invertido en ti. Resplandeces y todo el día se siente más ligero. || Uno de esos raros momentos en los que te sientes completamente en paz.
selfcare.bonus=Un buen momento contigo mismo. Te sientes renovado y discretamente satisfecho. || Eso te sentó bien. Te vas más ligero de lo que llegaste.
selfcare.soft_fail=Está bien. No es mágico, pero está bien. || Nada especial, nada malo. Sigues adelante. || El momento pasa sin gran cosa que contar.
selfcare.fail=No fue tu mejor sesión contigo mismo.
selfcare.crit_fail=Todo se tuerce y acabas sintiéndote peor que al empezar. || Lo que iba a ser un momento tranquilo se convierte en un pequeño desastre.
selfcare.off_day=Lo intentas, pero hoy no tienes el corazón en ello. Sigue un suspiro profundo. || Hay días en que hasta relajarse es trabajo duro.
selfcare.self_doubt=El espejo y tú os miráis. Tú parpadeas primero, y no con seguridad. || Practicas la frase seis veces. Empeora cada vez, no sabes cómo. || Te miras y solo encuentras cosas que arreglar. La charla motivadora no ayuda.
selfcare.mind_wanders=Tu mente se niega a calmarse. Cada pensamiento es uno distinto. || Te sientas, respiras y recuerdas un correo que olvidaste enviar. La paz queda cancelada. || La calma nunca llega del todo. Te vas más inquieto de lo que empezaste.
selfcare.bad_omen=La lectura es vaga, ominosa y un poco grosera. Te vas inquieto. || El futuro se ve nublado. Ojalá no hubieras preguntado. || Las cartas o la bola traen malas noticias con tono alegre. De algún modo es peor.
selfcare.bad_sleep=Das vueltas y luchas con la almohada. La mañana llega demasiado pronto. || Duermes, técnicamente. No lo parece. || Cada vez que empiezas a dormirte, algo traquetea. Cansado es lo nuevo normal.
selfcare.nightmare=Un sueño rarísimo, con dientes y un sándwich parlante. Despiertas sacudido y agotado. || La pesadilla parece totalmente real. Te incorporas a oscuras y necesitas un minuto. || Sueñas que llegas tarde a algo. Despiertas tarde, cansado y sin saber a qué.
selfcare.stubbed_toe=Lo pateas fuerte. A él le da igual, pero a tu dedo no. || Desahogarte con un objeto sienta genial un segundo. Luego el dedo empieza a palpitar. || Gana el objeto. Saltas sujetándote el pie y el orgullo.
games.crit_success=Partida perfecta. Una multitud de nadie vitorea y te sientes campeón igualmente. || Precisión absoluta. La propia máquina parece impresionada. || El juego se doblega a tu voluntad hoy. Qué subidón.
games.bonus=Una victoria sólida. Estás de buen humor y te sientes ágil. || Buena jugada. Toca un pequeño baile de la victoria.
games.soft_fail=Pierdes, pero estuvo lo bastante cerca como para ser entretenido. || Hoy no. Más suerte en la próxima ronda. || Un fallo por poco. Nadie lo vio, así que no cuenta.
games.fail=El juego gana esta ronda.
games.crit_fail=Una derrota espectacular. Piensas en mudarte a otra ciudad. || Todo lo que podía salir mal sale, en el orden más vergonzoso posible.
games.so_close=Por muy poco. Un pelín más y habría sido tuyo. || Fallas por un pelo. Al pelo no le impresiona.
games.sore_loser=Pierdes y no lo llevas con gracia. Se dicen varias palabras. || Culpas a la máquina, al lag y a una pequeña ráfaga de viento.
games.claw_empty=La garra se cierra sobre nada y el peluche te sonríe con burla. Se esfuman unas monedas. || Lo alineas perfecto. La garra suelta. Por supuesto que suelta.
games.dart_stray=El dardo pasa de largo y encuentra la pared. Nadie vio nada. || Apuntas al centro. El dardo apunta al suelo.
games.gutter_ball=La bola rueda despacio a la canaleta. La sigues con la mirada hasta el final. || Un tiro perfecto, si la pista estuviera un metro a la izquierda.
games.air_ball=El balón falla todo: el aro, el tablero y tu dignidad. || Tiras, fallas y el balón rebota a un sitio que no vas a buscar.
games.button_mash=Aporreas todos los botones a la vez. El personaje hace algo raro y pierde enseguida. || El mando se defiende. La derrota también.
games.eats_coins=La máquina se queda con tus monedas. No lo siente. || El cabinet se come las monedas sin dar las gracias. La pantalla dice 'game over' antes de empezar.
games.arcade_win=La máquina paga y unas monedas caen en tu mano. || Un premio pequeño, una gran sonrisa.
games.jackpot=Luces, campanas y monedas a chorros. Nunca te habías sentido tan afortunado. || ¡Premio gordo! Todo el salón recreativo se gira a mirar.
music.string_snaps=Una cuerda de la guitarra se rompe con un chasquido y te azota la cara. Escuece, y el orgullo también. || La cuerda hace 'twang' de una forma que no debía.
music.dropped_stick=Una baqueta sale volando de tu mano y aterriza en un sitio desafortunado. || Marcas el ritmo. La baqueta marca el suelo. El ritmo desaparece.
music.sticky_keys=Las teclas te plantan cara. Cada acorde sale un poco mal, y con tanta seguridad. || Tus dedos se cruzan y suena como un gato paseando sobre un teclado.
music.dj_scratch=El scratch es fuerte, erróneo y muy orgulloso de sí mismo. || Pulsas el botón equivocado y la pista se para en seco. El silencio es brutal.
performance.mic_feedback=El micro chilla con un acople. Todos se tapan los oídos. || Un pitido agudo, un silencio atónito y un saludo de disculpa.
performance.joke_dies=Llega el remate. Nadie se ríe. Un grillo sí. || Cuentas el chiste perfecto. El público devuelve silencio.
performance.cracked_voice=Se te quiebra la voz en la nota importante y sigue un poco más de lo debido. || La nota alta fue una idea atrevida. Terminó en un resuello.
conflict.caught_red_handed=Alguien te vio. Todos te vieron. Finges que nunca estuviste ahí. || Tu plan sigiloso tiene un testigo. Estás rojísimo. || El secreto era menos secreto de lo que esperabas.
conflict.rumor_backfires=El mensaje llega a la persona equivocada. Pasas la noche borrando cosas. || El rumor se extiende y vuelve a ti con detalles extra. || Resulta que el chisme era sobre el amigo de alguien. Vaya.
conflict.prank_backfires=La broma te cae a ti. Todos se ríen, y no contigo. || A la broma le faltaba un paso. Te lo saltaste y lo pagas.
chat.lesson_flops=Explicas lo básico tres veces. El alumno asiente y no entiende nada. || Tus dotes de profesor resultan más débiles que tus conocimientos. Los dos acabáis agotados. || La clase se tuerce y termina con un incómodo 'probemos de nuevo mañana'.
finance.card_swallowed=La máquina se traga tu tarjeta e imprime un recibo que dice 'buena suerte'. || Aparece una comisión oculta. La miras como si fuera a cambiar.
finance.hidden_fee=Una pequeña comisión que no esperabas le da un pequeño mordisco a tu dinero. || Ah, el 'cargo por conveniencia'. Conveniente para alguien.
finance.lottery_dud=Rascas, esperas, pierdes. El boleto es un marcapáginas carísimo. || Aciertas tres números. De seis. No esos tres.
fitness.mine_strain=Das el golpe de pico con demasiada confianza. Tu espalda presenta una queja formal. || La roca gana. Te llevas una ampolla y mucho polvo.
fitness.treadmill_stumble=La cinta sigue. Tú, por un momento, no. || Un pequeño tambaleo se convierte en un tropiezo muy público.
dining.machine_eats_coin=La máquina se queda con tu moneda y no te da nada, con total seguridad. || Pulsas el botón. La máquina zumba, piensa y se queda con tu dinero.
dining.fountain_splash=El agua salta más alto de lo esperado. Tu camiseta ahora forma parte de la fuente. || Te inclinas a beber y te llevas una cara llena de agua fría.
logic.falls_asleep_reading=El libro es tan silencioso. Parpadeas una vez y despiertas en la página 40 con una marca en la mejilla. || Lees tres líneas y las palabras empiezan a moverse. Se ha echado una siesta.
cat.selfcare.label=Autocuidado y ocio
cat.selfcare.check=Prueba de Calma
cat.games.label=Recreativos y juegos
cat.games.check=Prueba de Juego
cat.conflict.label=Conflicto y travesuras
romance.cold_greeting=Tu dulce saludo cae como un calcetín mojado. {t} asiente y sigue andando. || Saludas a {t} con todo tu encanto. {t} responde con un educado 'mm'. || El saludo era un aleteo esperanzado. Cayó plano al suelo.
romance.confession_declined=Preguntas con el corazón a mil. {t} dice que no con suavidad, y tu corazón se hunde. || {t} te rechaza con delicadeza, y no se siente nada delicado. || Tu gran pregunta recibe un pequeño, amable y devastador 'no de esa forma'.
conflict.greeting_backfires=Tu saludo borde recibe una respuesta más borde. Empezaste tú, así que te toca. || {t} se toma el saludo agrio como algo personal y lo devuelve con intereses. || Saludas a {t} como un villano. {t} responde en el papel.
conflict.belittle_backfires=Menosprecias a {t} delante de todos. Resulta que {t} tiene pruebas. || La culpa te cae a ti, con anotaciones. || {t} se mantiene en calma, y eso es peor. Todos lo vieron.
conflict.pent_up=Las palabras salen más calientes de lo planeado. {t} no necesitaba todo eso. || Lo sueltas todo, y parte era para otra persona. || Los sentimientos eran reales. El momento no.
chat.flat_greeting=Tu hola suena a errata. {t} finge con educación no haberlo oído. || El saludo sale rígido y un segundo tarde. {t} hace un pequeño gesto incómodo. || Dices las palabras correctas con la voz equivocada.
etiquette.formal_flub=Saludas a {t} con gran formalidad y el título equivocado. || Demasiado formal, luego demasiado informal, luego las dos a la vez. {t} está perdido. || El saludo educado tropieza con sus propios modales.
humor.flex_fail=Flexionas y de tu hombro sale un sonido muy poco bienvenido. {t} se estremece. || La pose era feroz. También duró un segundo de más y algo se acalambró. || Muestras los músculos. {t} no se impresiona, y un músculo sale dañado.
passion.no_common_ground=Compartes tus cosas favoritas. {t} comparte las suyas. No tienen nada en común. || Vuestros gustos no podrían estar más lejos. La conversación se apaga. || {t} pregunta '¿espera, te gusta eso?' con un tono que recordarás.
selfcare.sunburn=Te duermes al sol. Por la tarde brillas de una forma que nadie pidió. || El aceite se saltó un punto. El punto ahora está muy, muy rojo. || Demasiado sol, poco sentido común. Tu piel presenta una queja.
selfcare.hammock_flip=La hamaca se vuelca y tú también, directo a la arena. || Te tumbas con mucha elegancia y te levantas con bastante menos. || La tumbona tiene opiniones sobre cómo te sientas. Gana ella.
games.wild_throw=La pelota pasa de largo las latas, el puesto y casi llega al mar. || Lanzas con confianza. Las latas siguen perfectamente quietas. || Un gran lanzamiento, en otro lugar completamente.
games.seesaw_bonk=El balancín rebota y te golpea en la barbilla. || Montas el caballito con demasiada fuerza y te responde.
conflict.extort_backfires=Tu amenaza se desmorona a medias. {t} mantiene la calma y quien parece culpable eres tú. || La extorsión sale como suelen salir las extorsiones. {t} está furioso y lo pagas. || {t} no parpadea. La multa tampoco.
etiquette.nosy_question=Haces una pregunta algo demasiado curiosa. {t} responde con sequedad. || La pregunta flota en el aire un momento de más. {t} aparta la mirada. || Querías charla ligera. Recibiste una mirada fija.
etiquette.too_personal=Esa pregunta fue un paso de más. {t} no está contento. || Preguntas algo muy privado con voz muy pública. {t} se pone rígido. || {t} responde con un tono que recordarás. Los demás también.
chat.rumor_awkward=El rumor se pone raro rápido. Nadie sabe dónde mirar. || Escuchas, asientes y no dices nada, con fuerza. || La charla empieza cálida y poco a poco se queda tibia.
selfcare.firewood_boom=Echas el leño y el fuego responde con un ¡PUM! Una bola de fuego, una nube de hollín y de pronto eres la persona más sucia del parque. || La leña estaba húmeda y el fuego, enfadado. ¡Bum! Estás cubierto de ceniza de pies a cabeza. || Un leño de más. La hoguera explota en una nube de humo y chispas, y sales con pinta de deshollinador.
selfcare.dust_fizzles=Espolvoreas el polvo mágico y el fuego solo estornuda. No pasa nada, salvo algo de purpurina en tus zapatos. || El polvo brilla un segundo y se apaga con un tristísimo pop. || Quizá hoy el fuego no está de humor para magia.
selfcare.otherworldly_visitor=Las llamas titilan, se doblan, y algo con demasiados ojos empieza a arrastrarse fuera del fuego. Te ríes. No puedes dejar de reír. Es una risa muy nerviosa. || Una silueta se alza en el humo, te mira directamente y no dice nada. Estás bien. Estás perfectamente bien. Ja. Ja ja ja. || El fuego susurra tu nombre con una voz de ninguna parte. Respondes con una risita que no reconoces como tuya.
selfcare.sparkler_burn=La bengala escupe chispas por todas partes. Una cae en tu manga y en tu dignidad. || La agitas con demasiado entusiasmo. Las chispas te devuelven el saludo. || Se apaga en tu mano con un siseo muy pequeño y muy grosero.
selfcare.smoke_in_eyes=El viento cambia y el humo te sigue donde te sientes. Tus ojos nunca perdonarán a la hoguera. || Te acomodas y el humo se acomoda contigo. Empieza la tos. || El fuego es cálido, el humo no. Das tres vueltas alrededor del fuego y te sigue.
selfcare.blessing=El polvo mágico florece en un cálido resplandor dorado. Por un momento sientes todo a la vez: descansado, alimentado, limpio y ligero. El fuego sonríe. Probablemente. || Las llamas toman el color de un amanecer y te envuelven. Cuando se apagan, todos tus dolores, preocupaciones y enfermedades han desaparecido. || Una suave lluvia de chispas doradas y el mundo vuelve a tener sentido. Estás curado, renovado y discretamente encantado.
selfcare.smoky_flue=La chimenea estaba cerrada y el salón se llena de humo. Toses hasta llegar a la ventana más cercana. || El fuego chisporrotea y el humo sale por todas partes menos por la chimenea. Te escuecen los ojos. || Lo enciendes y humea. Lo abanicas y humea más.
selfcare.backfire_soot=La chimenea escupe una bola de hollín directamente hacia ti. Ahora eres de un negro muy festivo. || ¡FUMF! Una ráfaga de chispas y ceniza, y la alfombra no es lo único que parece chamuscado. || El fuego prende con un estallido y sales con pinta de haber salido arrastrándote de la chimenea.
selfcare.ash_cloud=Apagas el fuego y las cenizas suben en una gran nube gris. La apartas con dignidad. || La última brasa se enfurruña y te lanza una bocanada de ceniza a la cara. || El fuego se apagó. Tu peinado también.
selfcare.burnt_fingers=Extiendes las manos un poco demasiado cerca. El fuego te quema educadamente la punta de un dedo. || Manos calientes, luego manos ardiendo, luego manos muy rápidas. || El fuego era más amable desde un metro de distancia.
chat.fire_silence=Os sentáis juntos junto al fuego y a ninguno se le ocurre nada que decir. El crepitar habla por los dos. || El silencio se alarga. {t} mira las llamas, y tú también, un poco más de la cuenta. || Querías compartir un momento tranquilo. Se queda en eso, un momento tranquilo.
family.crit_success=Todo sale perfecto. Tú y {t} acabáis riendo como cuando erais pequeños, y se siente como en casa. || Un momento perfecto entre familia. Nadie lo dice, todos lo sienten. || De esas conversaciones familiares que se recuerdan durante años. {t} se queda un poco más de lo habitual.
family.bonus=Un momento cálido con tu {k}. Los dos os vais más ligeros. || {t} sonríe como solo sonríe la familia. No hace falta explicarlo. || Fácil, amable y un poco gracioso. Justo lo que debía ser.
family.soft_fail=Está bien. Las cosas de familia son así. || Hablas, {t} asiente y el día sigue. || Nada especial. Nada malo tampoco.
family.fail=Empieza bien y deriva a un sitio que ninguno de los dos planeó.
family.crit_fail=Dices justo lo que no tocaba al familiar equivocado, y toda la sala lo oye. || Se convierte en una de esas escenas familiares que saldrán en cada cena durante años. || Un pequeño comentario se hace grande. {t} se va con una mirada que recordarás.
family.awkward_pause=Cae un silencio que solo un familiar puede hacer tan fuerte. || Los dos buscáis un tema a la vez y ninguno lo dice. || La conversación se detiene y el reloj de repente es muy interesante.
family.old_argument=De algún modo volvéis a la misma discusión de hace años. Mismas frases, mismas salidas. || {t} saca esa cosa de aquella vez. Ojalá no lo hubiera hecho. || Pisas una herida antigua y resulta que nunca cerró.
family.rusty_visit=Hace tiempo que no os veis, y se nota. Sois familia, pero también un poco desconocidos. || Los dos decís las palabras correctas en un orden ligeramente equivocado. || No vivir juntos significa ponerse al día primero. Nunca pasáis de ahí.
family.house_rules=Vivir juntos significa que siempre salen los platos. Salen ahora. || Alguien dejó algo en el suelo. Es, por supuesto, culpa del otro. || La misma casa, dos ideas muy distintas de lo ordenado.
family.spouse_bickers=Casarse es tener la misma pequeña discusión de maneras nuevas. Hoy es una manera nueva. || {t} te lanza esa mirada que solo tiene una pareja, así que ya estás metido en problemas. || Un pequeño desacuerdo sobre nada en particular, que es el peor tipo.
family.plan_clash=Planeáis el futuro juntos y, por un momento, parecen dos futuros distintos. || {t} quiere una cosa, tú otra. El compromiso es el silencio. || Los grandes planes se topan con pequeñas realidades. Esta vez ninguno cede.
family.lecture_flops=Tu sermón cae con la suavidad de un ladrillo. {t} asiente como asienten los niños cuando han dejado de escuchar. || Explicas algo importante. {t} oye 'bla bla' y un poco de orgullo. || Sonaba más sabio en tu cabeza.
family.chide_backfires=Regañas y sale el tiro por la culata. {t} te devuelve una mirada que dice 'tú hacías lo mismo'. || La reprimenda se convierte en un 'nunca me escuchas' con lágrimas. Nadie gana. || Levantas la voz y desearías no haberlo hecho.
family.eye_roll=Tu madre o padre empieza una frase y ya sabes cómo acaba. Ven cómo pones los ojos en blanco. || El consejo es bueno. Recibirlo es el problema. || Escuchas con mucho esfuerzo. Se nota.
family.generation_gap=La brecha generacional se abre justo entre vosotros. Os saludáis a través de ella. || Hay cosas que no se pueden explicar a un abuelo. Esta es una. || Tú y {t} habláis el mismo idioma, pero no la misma década.
family.grandchild_bored=La historia de los viejos tiempos era excelente. El nieto no llegó tan lejos. || Tu nieto ya está mirando una pantalla. Los viejos tiempos tendrán que esperar. || Ofreces sabiduría. Recibes un educado 'ajá'.
family.sibling_spat=Lógica de hermanos: tú empezaste, {t} terminó, y los dos cantáis victoria. || Un comentario de más y tenéis diez años otra vez, peleando por un sofá. || El clásico. Una broma se pasa un paso de la raya.
family.wrong_mood=Sacas el sentimiento equivocado en el momento equivocado. {t} da un paso atrás. || La emoción era real. El momento no. || No todos los sentimientos hay que compartirlos ahora mismo. Este era uno.
family.allowance_gone=Entregas la paga y recibes un gracias muy breve, y ningún cambio. || La paga desaparece más rápido que el recibo. Nunca sabrás dónde. || El dinero cambia de manos y sigue un sermón. Pagaste los dos.
family.apology_stumbles=La disculpa sale en el orden equivocado. 'Perdón' llega el último. || Intentas arreglarlo y las palabras tropiezan entre sí. || La disculpa es sincera. La entrega es un desastre.
family.hug_too_tight=El abrazo dura un poco de más y el apretón un poco demasiado fuerte. {t} se rinde. || Abrazas a tu familiar y algo cruje. Quizá su espalda. || Un abrazo entusiasta, un pequeño crujido y una risa incómoda.
family.kid_not_listening=El pequeño escucha todo menos a ti. || Lo dices tres veces. A la cuarta por fin llega, o el niño se va. || Eres muy bueno en lo tuyo. El niño es muy bueno ignorándolo.
family.family_warmth=La cercanía familiar es silenciosa. Este es uno de esos momentos, y lo sientes. || Algo pequeño se vuelve cálido con {t}.
family.family_bond=Todo encaja. Tú y {t} os sentís como una familia de verdad, no solo parientes. || Un momento que recordaréis los dos. El vínculo crece y la calidez también.
kin.spouse=pareja
kin.parent=madre o padre
