kiss.knockout={t} pierde los papeles y lanza un puñetazo. Aterriza, y caes al suelo como un saco de ropa. || Ese chiste fue la gota que colmó el vaso. {t} golpea y la habitación se inclina. Despiertas mirando el techo. || {t} se pone rojo y te da un puñetazo certero. Tu dignidad sale del edificio antes de que toques el suelo.
kiss.knockout_death=El puñetazo de {t} aterriza y caes al suelo... y no despiertas. Fin. || Un solo golpe de {t}. Caes, la habitación se queda en silencio y no vuelves a levantarte. Créditos. || {t} lanza un único puñetazo. Es, por desgracia, lo último que notas en tu vida. Fin.
