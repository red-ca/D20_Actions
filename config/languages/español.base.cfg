kin.grandparent=abuelo o abuela
kin.grandchild=nieto o nieta
kin.relative=familiar
kin.none=alguien cercano
cat.family.label=Momentos en familia
cat.family.check=Prueba Familiar
art.crit_success=El pincel se mueve solo. Cuando te alejas, es lo mejor que has hecho nunca. || Colores, luz y un poco de magia. Lo firmas con pulso firme. || Deja de ser un cuadro y empieza a ser un sentimiento. Podrías mirarlo todo el día.
art.bonus=El cuadro va tomando forma. Unas pocas pinceladas atrevidas hicieron todo el trabajo. || Buenos colores, buena composición. Alguien lo colgaría. || Terminas con pintura en las manos y una pequeña sonrisa tranquila.
art.pass=Una obra sólida.
art.soft_fail=No es tu mejor obra, pero es tuya. || Los colores están algo desviados y la composición algo tímida. || Bien, como está bien un primer borrador.
art.fail=No quedó como lo imaginabas.
art.crit_fail=El cuadro se convierte en un enorme y muy marrón charco de arrepentimiento. || Todo lo que intentas lo empeora. En algún momento simplemente paras. || El resultado parece un error con opiniones.
art.uninspired=Miras el lienzo. El lienzo gana el concurso de miradas. || La musa está de descanso y no dejó dirección. || No viene nada. Ni una idea, ni una línea, ni un color.
art.muddy_colors=Todos los colores se mezclan en el mismo tono marrón. Un marrón muy consistente. || Cada mezcla se ensucia. Apuntabas al atardecer y aterrizaste en pantano. || Añadiste un color más y todo se volvió gris.
art.paint_spill=La bandeja de pintura se vuelca y un chorro cae justo donde no querías. Pintura en la ropa, en los zapatos, en ti. || Das un paso atrás para admirar tu obra y pisas la pintura. || Una gran ola de pintura llega primero a tu camiseta. El cuadro está bien. Tú no.
art.ruined_canvas=Una pincelada de más y todo el lienzo está arruinado. Dices una palabra que no aparece en los libros de arte. || El lienzo se rasga, la pintura corre y el trabajo de una hora desaparece. || Intentas arreglar una esquina y rompes las otras tres.
art.mural_drips=La pintura de la pared gotea en largas y tristes líneas, y un poco sobre ti. || Apuntas a la pared y la pared comparte contigo. || El mural sale un poco derretido, y tú sales un poco pintado.
art.caught_tagging=Un vecino ve tu obra. Sigue una multa por grafiti ilegal. El arte tiene precio. || Un transeúnte lo llama vandalismo. La multa lo llama ${m}. || La pared no era tuya para pintar. La ciudad envía la factura: ${m}.
art.art_confusing=Lo miras mucho tiempo. Te devuelve la mirada y no dice nada útil. || Todos dicen que es profundo. Tú ves un plátano y un largo silencio. || Asientes pensativo como se hace en las galerías, sin entender nada.
art.painting_sale=Un transeúnte se enamora de tu cuadro y te paga ${m} en el acto. || Un coleccionista oye hablar de tu obra y envía ${m} y un mensaje muy entusiasta. || Tu obra se vende por ${m}. Tu primer fan de verdad es un desconocido.
art.art_praise=Un amigo ve el cuadro y te da ${m} 'para el siguiente'. || Alguien compra una pequeña copia por ${m}. Eres oficialmente un profesional.
cat.art.label=Arte y pintura
cat.art.check=Prueba de Arte
mood_spouse.crit_success=El ambiente es perfecto antes de que nadie diga una palabra. Tú y {t} os fundís, y el mundo entero se vuelve más callado, más suave, más cálido. || Todo es perfecto: la luz, el momento, la persona. Los dos os sentís flechados otra vez. || Se siente como la primera vez y como la centésima, todo a la vez. Nada duele, nada preocupa, nada importa salvo {t}.
mood_spouse.bonus=Una mirada, una sonrisa, un 'ven aquí' muy bajito. El ambiente hace el resto. || {t} se ríe suavemente y te acerca. Perfecto. || Lo que pesaba hace un minuto desapareció. Algo cálido ocupó su lugar.
mood_spouse.pass=El ambiente funciona. Nadie necesita decir nada.
mood_spouse.soft_fail=El momento es agradable, aunque un poco tímido. Los dos llegáis al final. || Algo incómodo, sobre todo dulce. Lo dejas pasar. || No es exactamente la escena de película, pero funciona.
mood_spouse.fail=Intentas crear ambiente. El ambiente tiene otros planes.
mood_spouse.crit_fail=Intentaste ser íntimo, pero tus pies fríos rompieron el ambiente. || Te inclinas, tropiezas con una almohada y toda la noche se tuerce. {t} se ríe y suspira a la vez. || El gran momento romántico se interrumpe por un estómago muy ruidoso, y sigue un pequeño y triste silencio.
mood_spouse.cold_feet=Intentaste ser íntimo, pero tus pies fríos rompieron el ambiente. || Tus pies helados tocan la pierna de {t}. Un grito, un salto, y el ambiente se fue. || El romance termina en cuanto tus dedos fríos se encuentran con una pantorrilla caliente.
mood_spouse.cold_hands=Tienes las manos heladas y {t} te lo hace saber con voz muy aguda. || Una mano fría en el lugar equivocado en el peor momento. El ambiente sale de la habitación. || Lo haces con cariño. Tus dedos lo hacen como hielo.
mood_spouse.phone_buzzes=Un móvil vibra en el peor momento exacto. Ninguno de los dos puede dejar de oírlo. || Una notificación. Luego otra. El ambiente salió del chat. || Alguien olvidó silenciar un móvil. Fuisteis los dos.
mood_spouse.pet_interrupts=Una pata, un maullido y un golpe fuerte. La mascota se ha unido a la velada. || El gato salta a la cama justo en el momento equivocado. El ambiente no sobrevive. || Un público peludo muy grande observa. Nadie puede concentrarse.
mood_spouse.giggle_fit=Intentas ponerte serio, {t} empieza a reírse y ahora ninguno puede parar. Dulce, pero no exactamente tórrido. || La primera risa fue un resoplido. La segunda acabó con el ambiente. Los dos lloráis de risa. || Empezó romántico y acabó en un ataque de risa. Sigue siendo un buen rato, solo que distinto.
mood_lover.crit_success=El amor es una aventura, y estás disfrutando cada minuto. {t} también lo siente. || Todo encaja. Una mirada, un roce, una sonrisa que lo dice todo. || No lo planeas, simplemente pasa. Y es maravilloso.
mood_lover.bonus=El amor es una aventura, ¡y estás disfrutando de la experiencia! || Una pequeña chispa emocionante entre tú y {t}. Los dos os sentís más ligeros. || El momento es dulce, algo atrevido y muy divertido.
mood_lover.pass=Buena química.
mood_lover.soft_fail=Es un poco rígido, pero {t} lo deja pasar. || No es exactamente suave, pero lo bastante dulce. || Algo torpe. {t} sonríe de todos modos.
mood_lover.fail=Intentas crear ambiente y {t} aún no está en ello.
mood_lover.crit_fail=Lees el momento completamente mal. {t} te mira como si te hubiera salido una segunda cabeza. || El ambiente pasa de cero a desastre. {t} necesita salir de la habitación. || El gran movimiento fracasa de la forma más vergonzosa posible.
mood_lover.slap=Te acercas para crear ambiente, pero {t} lo toma como un ataque y te da una bofetada. || Eso fue un poco demasiado atrevido. {t} te abofetea y el sonido se oye por todas partes.
mood_lover.runaway={t} ve lo que viene, entra en pánico y sale corriendo de la habitación. || Tú haces tu movimiento. {t} hace otro, hacia la puerta.
mood_lover.embarrassed={t} se pone rojísimo y no puede mirarte. Tú tampoco. || El momento se vuelve demasiado. {t} se esconde tras las dos manos.
mood_lover.angry={t} no está contento con lo que intentaste. La mirada lo dice todo. || Calculaste mal, y {t} se asegura de que lo sepas.
mood_lover.rejection={t} se aparta. Un 'no' educado y firme queda en el aire. || Esta noche no. No así. {t} da un paso atrás.
mood_lover.sad={t} parece herido, y tú también lo sientes. El silencio es pesado. || El ambiente muere de una forma muy triste. {t} suspira y aparta la mirada.
mood_lover.fight={t} está furioso y la discusión se convierte en una pelea de verdad. || Lo que empezó como un ambiente acabó en una pelea a gritos y un empujón.
cat.mood_spouse.label=Crear ambiente (pareja)
cat.mood_spouse.check=Prueba de Ambiente
cat.mood_lover.label=Crear ambiente (amante)
cat.mood_lover.check=Prueba de Encanto
spa.crit_success=Todos los nudos se sueltan a la vez. Sales flotando, sin huesos, tranquilo y unos tres centímetros más alto. || Pura felicidad. El mundo se vuelve lento, los hombros caen y olvidas cómo era el estrés. || Un tratamiento perfecto. Podrías quedarte en este estado una semana.
spa.bonus=Cálido, tranquilo y justo lo que necesitabas. Sales como nuevo. || Una gran sesión. Músculos que olvidaste que tenías dan las gracias. || Todo tu cuerpo suspira, y tú también.
spa.pass=Un buen rato de relajación.
spa.soft_fail=Está bien. Suficientemente relajante, aunque no mágico. || Agradable, pero tu mente está en otra parte. || Un tratamiento decente. Has tenido mejores.
spa.fail=No consigues relajarte del todo.
spa.crit_fail=Todo sale mal de una forma que solo un día de spa permite. Sales más tenso de lo que entraste. || Lo que debía ser relajante se convierte en un pequeño calvario. Tu pobre cuerpo no sabe qué le ha pasado. || Pagas por relajarte y recibes una historia que contarás durante años.
spa.restless=Te tumbas, pero tu mente se niega a apagarse. Cada pensamiento es una lista de tareas. || Relajarse resulta ser trabajo duro. Hoy se te da fatal. || El tratamiento está bien. El problema eres tú.
spa.tense_knot=Encuentran un nudo que no sabías que tenías. Ves las estrellas y las estrellas dicen ay. || La tensión se escondía en tus hombros y se defiende. Sales dolorido en vez de aliviado. || Un pulgar muy firme encuentra justo el sitio equivocado y se queda ahí.
spa.too_hard=La presión es excesiva. Sonríes con educación y consideras en silencio una nueva vida. || Dijeron tejido profundo. No dijeron 'hasta el hueso'. Estás dolorido durante horas. || Duele de esa forma que se supone que es buena para ti, y no te convence.
spa.ticklish=Tus pies tienen muchas más cosquillas de lo que creías. Te ríes, te retuerces y casi sacas el pez del agua de una patada. || Las cosquillas son demasiado. Te ríes hasta que ya no es relajante. || Los peces doctor están muy entusiasmados con tus dedos. Nadie se lo dijo a tus dedos.
spa.fell_asleep=Te duermes en pleno masaje y despiertas con un charco de baba y cero dignidad. || Un ronquido fuerte te despierta. La sala está en silencio. Todos lo oyeron. || Te quedas dormido, despiertas de golpe y finges que solo descansabas los ojos.
spa.salt_sting=La sal encuentra un pequeño arañazo que no sabías que tenías. Mantienes la cara serena. Por poco. || Una sorpresa muy salada. Dices 'mmm' y quieres decir 'ay'. || El baño de sal escuece más de lo que alivia.
spa.aroma_allergy=Los aceites son preciosos y tu nariz tiene otras opiniones. Empiezan los estornudos y no paran. || Rosas, hierbas y una alergia repentina. Sales con la nariz roja y un pañuelo. || Una nube de aroma y un estornudo aún mayor. Achís.
spa.sauna_dizzy=El calor te puede. La sala gira, los bancos se tambalean y sales ligeramente color langosta. || Demasiado calor, demasiado tiempo. Sales con las piernas de gelatina. || Te dices que estás bien. La sauna no opina lo mismo.
spa.sauna_overheat=Tientas a la suerte en la sauna y la sauna gana. El mundo se vuelve blanco y tambaleante, y sales a rastras goteando. || Sudor, manchas y una sensación muy seria de que fue un error. El golpe de calor llama con educación y luego tira la puerta. || El calor dejó de ser relajante y pasó a ser una amenaza. Apenas llegas a la puerta.
spa.pushy_staff=La terapeuta se pone parlanchina justo en el peor momento. Sonríes, y no te relajas. || Un profesional muy entusiasta habla durante todo el masaje. Es difícil relajarse. || El masaje está bien. El problema es el comentario.
etiquette.coin_refused=Pides monedas y recibes un no educado y una mirada muy larga. || Pedir monedas del resort no sale bien. Te vas con el ego más ligero. || La respuesta es un no muy amable y muy firme.
cat.spa.label=Spa y bienestar
cat.spa.check=Prueba de Relajación
laundry.flood_safe=La máquina traquetea, tose una nube de pelusa y se rinde. Una sola bola de polvo rueda hasta detenerse a tus pies. || Un golpe fuerte, un chisporroteo triste y el tambor se calla. Una pequeña nube de polvo se posa junto a tus zapatos. || El ciclo se atasca y la máquina suelta una bocanada de pelusa gris. El suelo gana una bolita de polvo y tú, la culpa.
finance.lottery_jackpot=Seis números, todos tuyos. Lees el boleto tres veces y una más en voz alta. El premio es ${m}. || Los números van encajando uno tras otro y el boleto de repente pesa mucho. ${m} llegan a tu cuenta. || Ganas ${m}. Buscas la trampa, no la encuentras y empiezas a planear una fiesta muy responsable.
finance.lottery_lucky=Un premio pequeño: ${m}. No cambia la vida, pero da para otro boleto. || El boleto paga ${m}. Lo llamas una señal e ignoras con educación las probabilidades. || Dos números acertados y ${m} por las molestias. El universo guiña un ojo.
finance.lottery_counterfeit=El boleto es falso. El dependiente lo siente mucho y tú te quedas sin ${m}. || Un boleto falsificado, una sonrisa alegre y ${m} menos. Casi oyes a la impresora riéndose. || Los números parecen correctos y el papel no. Una falsificación muy convincente te cuesta ${m}.
finance.lottery_washed=El boleto pasa por la lavadora con tus vaqueros. Queda confeti gris y ${m} perdidos. || Encuentras el boleto en la secadora, ahora una bolita de papel. El premio sigue sin reclamar y el boleto costó ${m}. || Un bolsillo, una lavadora y un boleto empapado. Un día de lluvia, ${m} perdidos.
finance.lottery_old_draw=Celebras durante un minuto entero antes de notar que era el sorteo de la semana pasada. El boleto costó ${m} y tu orgullo también. || Los números son perfectos. La fecha, por desgracia, no. ${m} por una lección muy cara. || Un gran premio, letra pequeña y ${m} fuera de tu bolsillo. El sorteo fue la semana pasada.
finance.lottery_text_scam=Un mensaje dice que ganaste un premio y solo debes pagar una pequeña tasa. La tasa son ${m}. El premio nunca llega. || Un mensaje muy amable, un enlace que no debiste pulsar y ${m} menos. || '¡Reclama tu premio ya!' Lo hiciste. Costó ${m}.
finance.lottery_soft=Dos números coinciden, uno falla por un dígito y el resto ni se acerca. El boleto va al cajón de la esperanza. || Lo rascas con gran ceremonia. Nada. Lo rascas otra vez, por si acaso. || No es un ganador. El boleto hace un sonido muy pequeño y muy educado de 'otra vez será'.
