mourning.crit_success=Abrazas a {t} y las palabras dejan de importar. Los dos lloran, se ríen un poco y, por primera vez hoy, se siente soportable. || {t} se derrumba en tus brazos y lo dejas. Al final los dos pesan menos que al empezar. || Hay abrazos que dicen lo que nada más puede. Este lo dice todo y el peso de los dos se aligera a la vez.
mourning.bonus=Un abrazo largo y cálido. {t} suelta un suspiro que parece llevar todo el día guardado. || No dices mucho y no hace falta. {t} se apoya en ti y la habitación se queda un poco más tranquila.
mourning.pass=Un buen abrazo. No arregla nada, pero ayuda. || Abrazas a {t} un rato. Algunas cosas pesan menos cuando alguien más carga una parte.
mourning.soft_fail=El abrazo es rígido y breve. {t} asiente con educación y la pérdida pesa un poco más que antes. || Le das palmaditas a {t} como a un desconocido en una parada de autobús. Los dos notan el fallo. || Tus brazos están ahí, pero las palabras no. El silencio de después es largo y triste.
mourning.fail=Dices “mi más sentido pésame” como si lo leyeras de una tarjeta. {t} te lo agradece y ninguno se siente mejor. || El abrazo llega en mal momento y el duelo solo suena más fuerte. Nadie sabe dónde poner las manos. || Intentas consolar a {t} y acabas recordándoos a los dos todo lo que falta.
mourning.crit_fail=Te quedas abrazando un segundo de más, dices justo lo que no tocaba y {t} llora aún más fuerte. Tú también. || El abrazo se convierte en un mar de lágrimas del tipo equivocado. El duelo pesa más ahora y se reparte a partes iguales. || Lo haces con toda la buena intención. Sale lo peor que podías decir. {t} se queda en silencio, y tú también.
cat.mourning.label=Consuelo en el funeral
cat.mourning.check=Prueba de Consuelo
repair.shock=Tocas el cable equivocado y el aparato te da una opinión muy firme. Tu pelo se levanta aplaudiendo. || ¡ZAP! La reparación termina con una chispa, un grito y olor a pelo quemado. || El manual decía 'desenchúfalo primero'. Leíste esa línea justo después de la chispa.
repair.shock_death=Metes la mano en el aparato... un destello brillante es lo último que ves. Fin. || ZAP. Las luces parpadean, caes y el manual de reparación se cierra solo. Créditos. || El cable equivocado en el momento equivocado. Fuiste un gran reparador... por un tiempo. Fin.
repair.sparks=Algo por dentro hace pop, chisporrotea y suelta una bocanada de humo. Retrocedes con cara muy prudente. || Lluvia de chispas, olor a quemado y un largo silencio. Decides que no viste nada. || El aparato zumba, echa una chispa y se rinde. No estás seguro de quién perdió esta ronda.
repair.flood=Aflojas un tubo de más y el agua se une a la fiesta. El suelo ahora es un estanque. || La llave resbala, el tubo se suelta y nace una fuente. Splash. || Una fuguita se convierte en un problema no tan pequeño. El suelo está mojado, y tú también.
repair.flood_safe=El tubo escupe un charquito y se lo piensa mejor. Suelo mojado, zapatos mojados, orgullo seco. || Un poco de agua se escapa y hace un charco. Nada que una fregona no arregle, pero igual lo miras fijamente. || El tubo suelta un poco de agua al suelo. Es solo un charco, pero es TU charco.
repair.soaked=Un chorro de agua te da de lleno en la cara. Ahora eres oficialmente parte de la fontanería. || El tubo rocía de lado y te llevas todo. Felicidades: estás muy limpio y muy frío. || Giras la válvula equivocada y recibes una ducha gratis. Con ropa, claro.
repair.fumble=El destornillador gana esta ronda. Sueltas todo y dices unas cuantas palabras. || Dejas la herramienta un segundo y desaparece. El objeto sigue roto y tu paciencia también. || Cada tornillo que tocas rueda lejos. El objeto sigue roto y tú sigues molesto.
repair.wrong_part=Arreglas la pieza equivocada, con mucha seguridad. La pieza correcta sigue rota y ahora estás cansado. || Cambias una pieza que no hacía falta cambiar. El verdadero problema te saluda desde la esquina. || ¡Arreglado! Bueno, algo. No lo que estaba roto.
repair.thumb=El martillo se encuentra con tu pulgar. Tu pulgar presenta una queja formal. || Un pequeño descuido, un gran ay. Te agarras la mano y finges que no pasó nada. || Le diste exactamente a lo que apuntabas, salvo que era tu dedo.
repair.soft_fail=La reparación casi funciona. Casi. Das un paso atrás y la cosa se encoge de hombros. || Aprietas, giras y pruebas. Sigue sin funcionar. Eso sí, parece algo ofendida. || Cerca, pero no. El objeto decidió seguir roto un poco más.
repair.repair_all=Algo hace clic. Todo lo roto de por aquí vuelve a la vida de golpe y te vas como una leyenda de la reparación. || Tus manos se mueven solas. Cuando sueltas la herramienta, ya nada aquí está roto. Cosas de héroe. || Un arreglo perfecto, luego otro, luego todos. Todo lo roto de alrededor vuelve y la caja de herramientas aplaude.
repair.crit_success=Algo hace clic. Todo lo roto de por aquí vuelve a la vida de golpe y te vas como una leyenda de la reparación. || Tus manos se mueven solas. Cuando sueltas la herramienta, ya nada aquí está roto. Cosas de héroe. || Un arreglo perfecto, luego otro, luego todos. Todo lo roto de alrededor vuelve y la caja de herramientas aplaude.
