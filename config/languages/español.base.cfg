# ^ Este archivo viene con el mod y se reescribe cuando cambia el número de versión. No lo edites: pon tus cambios en español.<tu_pack> (por ejemplo español.mis_textos). Lo que falte aquí se muestra en inglés.

# ============================================================================
# ACERCA DE ESTE ARCHIVO
# ============================================================================
# Traducción al español de los textos del mod. Los archivos de idioma se combinan así: primero english.base, luego este (español.base) encima;
# cualquier línea que no esté aquí se queda en inglés. Una fila con la misma clave reemplaza a la anterior y una clave nueva se añade.
# Formato: clave=texto. Las variantes de un mensaje se separan con ' || ' y se elige una al azar. {a} = tu nombre, {t} = el nombre del otro personaje, {m} = una cantidad de dinero.

# ============================================================================
