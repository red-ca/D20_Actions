# ============================================================================
# MENSAJES DE TIRADA (un bloque por categoría)
# ============================================================================
# bonus = éxito con bono, crit_success = 20 natural, soft_fail = fallo normal sin efecto, crit_fail = 1 natural. El resto son los resultados de fallo y los premios de la categoría.
# Da al menos 3 variantes a cada clave para que los mensajes no se repitan.

# -- Fitness
fitness.bonus=Algo hace clic. Las pesas se sienten más ligeras y tu postura parece sospechosamente profesional. || Entras en ritmo y te sientes imparable. El espejo del gimnasio asiente con aprobación.
fitness.crit_success=¡Repetición legendaria! En algún lugar un shaker de proteínas llora de orgullo.
fitness.soft_fail=Serie dura, pero la sacas adelante igual. || Tu postura se tambalea y tu ego también, pero la repetición sale.
fitness.crit_fail=Te lo juegas todo en la levantada y tu cuerpo presenta una queja formal. La serie termina antes de empezar. || De tu espalda sale un sonido que ninguna espalda humana debería hacer. Repetición cancelada. || La barra gana. Siempre gana. Te alejas con el orgullo en cabestrillo.
fitness.heat=El entrenamiento se convierte en una sesión de sauna. Te abanicas, el sudor te chorrea y la sala empieza a dar vueltas. || Te pasas con el calor. Tu camiseta está empapada, tu cara roja y tu cuerpo exige un ventilador, un océano y una siesta. || La insolación llama con educación y luego tumba la puerta. Sales tambaleándote, chorreando sudor.
fitness.exhausted=Se te doblan las piernas en la última repetición. Te desplomas y miras el techo, pensando en tus decisiones de vida. || Superas tu límite y el límite te devuelve el golpe. Al suelo.
fitness.sore=Algo en tu cuerpo presenta una queja que sentirás durante dos días. Mañana será divertido. || Te pasaste. Tus músculos declaran huelga con efecto inmediato.
fitness.slip=Tu pie resbala en el peor momento y la gravedad gana la discusión. || Pierdes el equilibrio y giras como un paso de baile mal planeado.
fitness.embarrassed=Alguien seguro lo vio. Finges que era parte de la rutina. || Fallas el movimiento con tanta fuerza que hasta el equipo mira hacia otro lado.
fitness.sweat_cold=Te saltas la toalla y el ventilador del gimnasio te da justo. Por la noche ya tienes mocos. Resfriado merecido. || Sudor, aire acondicionado y mal criterio dan un resfriado. Lo habías avisado. || Tu cuerpo decide que este entrenamiento fue demasiado y te manda un resfriado como reseña.
fitness.lift_drop=Levantas a {t} con todo tu amor y la gravedad se lo lleva de vuelta. Aterriza de pie, más o menos. || La elevación llega a medias antes de que tus brazos presenten una queja. {t} cae al suelo riendo. || Lanzas a {t} al aire, pierdes el agarre y los dos acabáis en el suelo en un montón.
fitness.back_strain=Levantas a {t} y algo en tu espalda dice que no. Aguantas la pose un segundo y te arrepientes. || El amor es poderoso, pero tu zona lumbar no está de acuerdo. {t} te baja y se encoge contigo. || La gran elevación termina con un crujido fuerte de tu columna. {t} pregunta si estás bien, tú dices que no.
fitness.show_off_fail=Intentas parecer fuerte y levantas a {t} como un héroe. Pareces alguien levantando un mueble. || El gran gesto cae entre impresionante e hilarante. {t} aplaude con suavidad. || Flexionas antes de levantar. Sale mal. {t} mira tus brazos y luego a ti.
fitness.fail=Tus brazos dejan de cooperar a mitad de camino. Finges que ibas a tomarte un descanso. || Miras las pesas y las pesas te miran a ti. Hoy no.
fitness.pass=Superas la serie sin ningún problema. || Buena técnica, respiración constante. Un día más en la oficina.

# -- Romance
kiss.bonus=Ese fue especial. {t} lo recordará por un buen rato. || ¡Chispas! {t} está resplandeciente y tú también.
kiss.crit_success=Un beso para los libros de historia. {t} olvida hasta su propio nombre.
kiss.soft_fail=El beso es un poco torpe y un poco incómodo, pero {t} lo deja pasar.
kiss.slap=Te acercas para besar a {t}, pero {t} se sorprende y ¡lanza una bofetada!
kiss.runaway=Te acercas para un beso y {t} sale corriendo como si le hubieras ofrecido un formulario de impuestos. || {t} mira el beso que se acerca y sale disparado. Estrategia audaz, {a}.
kiss.embarrassed=Te acercas para un beso. {t} se pone color escarlata, estudia sus zapatos y desea que el suelo se lo trague. || {t} se congela, se sonroja hasta las orejas y murmura algo sobre el clima.
kiss.angry={t} no apreció el besito. Tu nombre queda registrado con enojo, {a}. || Vas por el beso y {t} va por la cara de enojo. ¿Trato justo?
kiss.rejection={t} rechaza el beso con educación pero con firmeza. El silencio pesa más que el rechazo. || {t} gira la cabeza justo a tiempo. Qué elegante, {a}. Muy elegante.
kiss.sad={t} te lanza una mirada dolida y un largo suspiro. Así no. || El beso falla y el momento también. {t} desvía la mirada.
kiss.spark=Hubo una chispa que sentisteis los dos. Algo cálido se queda entre {t} y tú. || El momento deja un brillo. {t} y tú os sentís un poco más cerca. || Un pequeño aleteo, una sonrisa tranquila. El aire entre {t} y tú sigue siendo cálido.
kiss.pass=El beso aterriza con suavidad. {t} se derrite un poco. || Un momento tierno. {t} te sonríe después.

# -- Conversation
chat.bonus=La conversación simplemente fluye. {t} y tú perdéis la noción del tiempo de la mejor manera. || Una charla fácil, una risa de verdad y la sensación de poder decir cualquier cosa. De las buenas. || {t} se abre un poco y tú también. Se siente fácil.
chat.crit_success=Dices exactamente lo correcto en el momento exacto. {t} sonríe de un modo que recordarás. || Una charla perfecta. Cada frase acierta y cada pausa es cálida. {t} no quiere parar. || La conversación llega a un nivel más profundo sin que nadie lo note. {t} te mira como si acabaras de entenderle.
chat.soft_fail=La charla cojea y termina con educación. Ninguno dice lo que quería. || Una charla sosa que no lleva a ninguna parte. Los dos os vais un poco más ligeros y un poco más aburridos. || Está bien. Simplemente bien. Los dos asentís y seguís.
chat.crit_fail=Cada frase cae mal. Al final, {t} quiere estar en cualquier otro sitio. || Dices algo realmente desafortunado. El aire se vuelve sólido y {t} mira la pared. || Un desastre de conversación. {t} necesitará un minuto, y probablemente un tentempié.
chat.silence=Abres la boca y no pasa nada. {t} llena el silencio estudiando el techo. || La conversación se seca a medias. {t} y tú os miráis con un asentimiento de muebles viejos. || Un hueco incómodo crece entre vosotros. Los dos fingís que es un silencio cómodo.
chat.wrong_topic=Eliges el único tema que {t} odia. La sonrisa de {t} se congela en algo educado y distante. || Sacas el tema equivocado en el momento equivocado. {t} cambia de tema con la gracia de un choque de coches. || De algún modo pisas un punto sensible. {t} dice 'claro' con un tono que significa 'no'.
chat.overshare=Cuentas demasiado, demasiado rápido. {t} pone cara de estar leyendo unos términos de servicio larguísimos. || Tu charla se convierte en una confesión. {t} escucha, asiente despacio y busca la salida. || Pasas de 'qué tal' a la historia de tu vida en un suspiro. {t} necesita un momento.
chat.voice_cracks=Se te quiebra la voz en mitad de las palabras importantes. {t} sigue siendo amable, pero el momento ya es frágil. || Lo habías ensayado. El ensayo no ayudó. La voz tiembla y se rinde. || Las palabras salen más pequeñas de lo que sonaban en tu cabeza. {t} espera, con educación, a que lo intentes otra vez.
chat.too_intense=Eso fue mucho y demasiado rápido. {t} da medio paso atrás y sonríe con mucho cuidado. || Lo dices con todo el corazón. {t} lo oye con un poco demasiado pánico. || La promesa cae pesada. {t} se ríe con nervios y cambia de tema.
chat.advice_backfires=Pides consejo y discutes cada palabra. {t} se rinde y asiente. || El consejo es bueno. Lo ignoras en voz alta. {t} parece alguien que ya ha visto esta película. || {t} te da un consejo sincero. Lo recibes mal y el ambiente se enfría.
chat.deep_bond=Por un momento {t} y tú estáis exactamente en la misma página. Parece una amistad de años. || Las palabras salen fáciles y nada se guarda. {t} te mira como si fueras familia. || Una charla profunda y de verdad. Te vas con un vínculo más fuerte y una calidez que dura.
chat.closer=Esa charla os acercó. Lo notas incluso antes de que {t} diga nada. || Algo cambia para bien. {t} y tú estáis un poco más cómodos ahora. || La charla se convierte en un momento de verdad. {t} y tú os vais sintiendo más cerca.

# -- Etiquette
etiquette.bonus=Un intercambio firme y amable. {t} te mira con un destello de respeto. || Buenos modales y justo la confianza necesaria. El ambiente es relajado y cálido. || Lo haces parecer fácil. {t} se relaja y toda la sala se relaja con {t}.
etiquette.crit_success=Impecable. {t} sonríe como si acabaras de cerrar un trato, y quizá lo hiciste. || Encanto, ritmo y un apretón perfecto. {t} está claramente impresionado y quiere que lo sepas. || Eres un profesional. De los de verdad. {t} toma nota mental de presentarte a más gente.
etiquette.soft_fail=Es rígido y un poco raro, pero técnicamente ocurre. || Sonrisa forzada, un asentimiento rápido y un silencio algo extraño. No es tu mejor momento. || Ni desastre ni triunfo. Pasas página rápido.
etiquette.crit_fail=Todo sale mal al mismo tiempo. {t} finge con educación que nada de eso pasó. || Logras ser grosero, torpe y ruidoso en un solo gesto. Una hazaña rara. || El momento se hunde como un suflé malo. {t} hablará de esto dentro de unos tres años.
etiquette.sweaty_palm=Tienes la palma resbaladiza. {t} te la estrecha y luego se limpia la mano en el pantalón como si nadie lo viera. || El apretón es blando y húmedo. {t} sonríe con educación y cuenta los segundos. || Aprietas demasiado fuerte, luego demasiado flojo y sudas por todas partes. {t} recordará este apretón.
etiquette.card_drop=Ofreces tu tarjeta y se te cae en un charco de nada. {t} la recoge por ti, doblada. || La tarjeta se te escapa y cae boca abajo. {t} lee el reverso por amabilidad. || Entregas una tarjeta con la marca de una taza de café. {t} da las gracias como se dan en el dentista.
etiquette.toast_spill=Levantas la copa con demasiado entusiasmo. La bebida cae sobre {t} y el brindis no llega a ninguna parte. || Chin. Chof. {t} mira la camisa, luego a ti, luego otra vez la camisa. || El brindis es perfecto hasta que la copa se inclina. La mitad de la bebida acaba en la mesa y la otra mitad en la dignidad.
etiquette.bribe_caught=Deslizas el sobre. {t} cuenta los billetes en voz alta y toda la sala lo oye. Pierdes ${m} y tu reputación. || Alguien ve el intercambio. El regalo te cuesta ${m} y una explicación larguísima. || El soborno debía ser discreto. {t} anuncia la cantidad a todo el solar y ${m} desaparecen de tu cuenta.
etiquette.errand_refused={t} mira la lista, te mira a ti y dice: yo no soy un servicio de reparto. || Pides un recado. {t} suspira hondo y consigue ofenderse y cansarse a la vez. || La petición del recado cae mal. {t} cruza los brazos. El recado se queda sin hacer.
etiquette.pitch_flop=Empiezas con jerga de negocios y terminas en nada. {t} asiente como se asiente ante el spam. || El discurso suena inteligente en tu cabeza. En voz alta, {t} te pregunta si estás bien. || Dices sinergia dos veces y apalancamiento una. {t} mira el teléfono con disimulo.
etiquette.stiff=Suenas como un robot leyendo un manual de empresa. {t} te mira sin saber si reír. || El gesto es educado y rígido como una tabla. El momento pasa sin que nadie sienta nada. || Intentas ser profesional y acabas de estatua incómoda. {t} intenta salvarlo y no lo consigue.
etiquette.deal={t} conoce a alguien que conoce a alguien, y un nuevo contacto te envía ${m} por un trabajillo. Hacer contactos funciona. || Tu buena impresión se convierte en un favor, y el favor en ${m}. Así se hacen los negocios. || {t} responde por ti ante un cliente. Poco después caen ${m} en tu cuenta.

# -- Humor
humor.bonus=El chiste cae perfecto. {t} se ríe tanto que necesita sentarse. || Tu ritmo es excelente y la risa es de verdad. Hoy eres gracioso. || Una risa limpia y fácil. {t} se seca una lágrima y pide otro.
humor.crit_success=Genio de la comedia. {t} llora de la risa, te ruega que pares y luego te pide más. || Un chiste perfecto en un momento perfecto. Todo el solar aplaudiría si pudiera. || Haces reír a {t} tanto que se olvida de respirar. Un número legendario.
humor.soft_fail=No es tu mejor material, pero {t} sonríe por educación. || Una risa débil y un remate aún más débil. Pasas página rápido. || Una risita, un poco de pena. El chiste ya está olvidado.
humor.crit_fail=El chiste muere con estruendo. {t} nunca había estado tan callado. || Un chiste tan malo que crea un nuevo tipo de silencio. {t} mira al vacío. || Fracasas con tanta fuerza que la sala se enfría. {t} necesita un minuto.
humor.flop=Cuentas el chiste con total seguridad. {t} te mira parpadeando, esperando el resto. || El remate cae con un golpecito sordo. {t} se ríe medio segundo tarde. || Te ríes de tu propio chiste. Tú solo. {t} te regala un 'je' educado.
humor.unfunny=El chiste es tan poco gracioso que da la vuelta y resulta confuso. {t} asiente despacio. || Lo cuentas con el ritmo perfecto y el chiste sigue siendo malo. {t} sonríe con amabilidad. || Un gruñido, un suspiro y un giro de ojos. {t} gana el premio al público más educado.
humor.slapstick_hurt=Te entregas al batacazo con demasiada fuerza. El suelo, como siempre, gana. {t} deja de reír y empieza a preocuparse. || El slapstick sale mal de la forma más dolorosa. {t} se encoge, se ríe y se vuelve a encoger. || Tropiezas con tu propio número. Duele, y el público de una persona no sabe si aplaudir.
humor.money_gun=Disparas la pistola de dinero y los billetes vuelan por todas partes. Eran de verdad. Pierdes ${m} y {t} se ríe sin control. || La pistola estaba cargada de dinero real. ${m} salen por la ventana y {t} no puede respirar de la risa. || Ups. La pistola no era para dinero de juguete. Rocías ${m} por el aire y {t} jura que no ha visto nada.
humor.dirty_offended=El chiste verde cae fatal. {t} solo te mira, profundamente decepcionado, y no dice nada. || Cuentas un chiste que no es para este público. {t} no se ríe. {t} te mira fijamente. || El chiste cae como un globo de plomo. A {t} no le hace gracia y lo sabes.
humor.compliment_creepy=El cumplido suena raro y {t} da un pequeño paso atrás. Te oyes decirlo otra vez. || Dices algo bonito y suena a otra cosa. {t} mira al suelo. || El cumplido cae raro. {t} te da las gracias con voz de rehén.
humor.memes_cringe=Explicas un meme que murió hace tres años. {t} asiente con educación y no dice nada. || El meme necesita una clase entera para entenderse y aun así no se entiende. {t} te mira con compasión amable. || Le enseñas a {t} un meme de moda. No está de moda. Nunca lo estuvo.
humor.high_five_miss=Lanzas la mano para chocar los cinco y le das al aire. {t} te deja colgado con una cara amabilísima. || El choque de manos queda entre un aplauso y una bofetada. {t} se sacude la mano y sonríe igualmente. || Fallas la mano por un centímetro y tu brazo sigue de largo. {t} finge con educación que era un estiramiento.
humor.powerup_fizzle=Extiendes el puño para un power-up y no salta ninguna chispa. {t} lo choca igualmente, incómodo. || El power-up de la amistad se apaga con un pequeño pop. {t} aplaude una vez, por lealtad. || Gritas el power-up y la energía no llega a ninguna parte. {t} levanta el pulgar por amabilidad.
humor.money_rain=La pistola de dinero os baña de billetes y atrapas ${m} antes de que el viento se lleve el resto. {t} vitorea. || El dinero llueve en un arco perfecto. {t} se ríe mientras te guardas ${m} en el bolsillo. || La pistola dispara una ráfaga legendaria. Te vas ${m} más rico y {t} sigue riéndose.
humor.inside_joke=Ese chiste se convierte en un chiste privado entre {t} y tú. Volverá durante semanas. || {t} y tú os reís en el mismo momento y se siente genial. Ahora un poco más cerca. || Un momento tonto se convierte en un pequeño vínculo. {t} y tú lo citaréis para siempre.

# -- Photography
photo.bonus=La toma es nítida, la luz es genial y {t} sale perfecto. Una foto para guardar. || Una foto limpia y cálida con una gran sonrisa. Querrás imprimirla. || Encuadre perfecto, momento perfecto. La foto captura el ambiente exactamente.
photo.crit_success=Una foto tan buena que se podría enmarcar. {t} quiere una copia y otra de respaldo. || La toma tiene calidad de revista. {t} y tú miráis la pantalla en silencio. || Capturas un momento tan perfecto que parece montado. Los dioses de la fotografía aprueban.
photo.soft_fail=La foto no es gran cosa, pero existe. Dices que harás otra más tarde. || Una toma mediocre. {t} dice que está bien y lo dice a medias. || Es una foto. Se distingue lo que es. Eso es todo.
photo.crit_fail=La foto es un desastre en todos los sentidos. {t} insiste en que no se enseñe jamás. || Consigues arruinar la foto, la luz y el ambiente a la vez. Una obra maestra del fracaso. || La cámara falla, el flash dispara mal y la toma queda maldita. {t} pide que la borres.
photo.blurry=Pulsas el obturador y toda la foto sale como una mancha. {t} dice 'artístico' con la cara seria. || La toma sale borrosa como un avistamiento de fantasma. {t} sugiere intentarlo otra vez, quizá con pulso más firme. || Consigues una foto perfecta de la nada más borrosa. {t} dice con educación que tiene carácter.
photo.blink=Pillas a {t} parpadeando. En la foto parece que está soñando. || Salta el flash y {t} parpadea en el peor momento posible. Un precioso retrato de ojos cerrados. || Clic. {t} sale medio dormido en la toma. Pide que la borres.
photo.finger=Tu dedo tapa media lente y tu dedo es la estrella de la foto. || Encuadras la toma a la perfección y capturas sobre todo tu pulgar. Un pulgar con una luz excelente. || La foto tiene a {t}, un buen fondo y una mancha rosa en la esquina: tú.
photo.phone_drop=El selfie va bien hasta que el móvil se te escapa de la mano. {t} se sobresalta con el golpe. || Te estiras para el ángulo perfecto y el móvil salta de tu mano. El selfie es el suelo. || A mitad del selfie, el móvil se tira en picado. {t} lo mira, te mira a ti y no dice nada.
photo.camera_shy={t} se tapa la cara en cuanto sale la cámara. La foto es una mano y una sonrisa que no está. || Levantas la cámara y a {t} le da vergüenza. La toma es media cara y mucho arrepentimiento. || {t} se escapa del encuadre en el último segundo. Tu foto es un retrato perfecto de la pared.
photo.viral_pic=La foto que hiciste se hace viral. Una página compra los derechos por ${m}. {t} exige crédito. || A alguien en internet le encanta tu toma y te manda ${m} por usarla. La cámara de tu móvil acaba de pagar el almuerzo. || Publicas la foto y explota. Una marca paga ${m} por ella y {t} quiere su parte.

# -- TV
tv.bonus=Caes en el programa perfecto. Hoy es un buen día. || El canal es justo de tu gusto. Pura magia televisiva.
tv.crit_success=La tele sintoniza con claridad cristalina. Hasta las antenas aplauden.
tv.soft_fail=La imagen está borrosa, pero la arreglas con un golpecito al costado.
tv.shock_break=Pulsas el botón de encendido. La tele revienta, chisporrotea y muere con una nube de humo, y la descarga sobrante te alcanza de todos modos. || Un estallido, un destello y la tele se apaga para siempre. La descarga es el insulto final. || Aprietas el control y todo el aparato renuncia a la vida, llevándose consigo el buen humor de tu cabello.
tv.shock=Agarras el control y no notas un cable pelado. Recibes una buena descarga. ¡¿Quién iba a decir que las pilas eran tan potentes?! || Enciendes la tele y el aparato viejo te muerde. Se te erizan los pelos y tu alma sale un momento de tu cuerpo. || La tele cruje, echa chispas y decide que eres la nueva antena. ¡Zzzzap! || Pulsas el botón de encendido. La tele pulsa de vuelta. Fuerte.
tv.pass=La tele parpadea y se enciende. La hora estelar te espera.

# -- Shower
shower.bonus=El agua cae justo como debe. Podrías quedarte aquí hasta que el calentador se rinda. || Una ducha gloriosa. Sales sintiéndote como un Zoi nuevo.
shower.crit_success=La mejor ducha de tu vida. Vapor, presión perfecta y una canción que casi quieres grabar.
shower.soft_fail=El agua está un poco tibia, pero aguantas.
shower.crit_fail=Entras y la mezcladora te traiciona. No está fría, es un glaciar. Tu alma se va por el desagüe. || Las tuberías gimen, el agua se vuelve ártica y gritas una nota que no sabías que tenías.
shower.fail=Te das una ducha, pero la mezcladora falló y ¡el agua está helada! Mañana te vas a arrepentir. || El agua empieza tibia y luego, por pura maldad, se vuelve hielo. Sales de un salto, temblando.
shower.pass=Una ducha de lo más normal. Nada explotó, nada se congeló.

# -- Housework
housework.bonus=¡Impecable! El lugar brilla y tu ánimo también. || Limpiar se siente raramente satisfactorio hoy. Podrías limpiar todo el lugar.
housework.crit_success=La habitación brilla como un salón de exposición. Hasta los conejitos de polvo aplauden.
housework.soft_fail=Unas cuantas rayas y mucha queja, pero el trabajo queda hecho.
housework.crit_fail=Una inundación, un resbalón y una máquina rota de una sola vez. Hace falta talento para fracasar tan a fondo.
housework.slip=Pisas el charco que acabas de fregar. El suelo gana y giras como un patinador artístico. || Limpiar va genial hasta que tu pie encuentra un charco de jabón. Wiii... paf.
housework.frustrated=Frotas, barres, suspiras. La suciedad vuelve a crecer por pura maldad. || Cada vez que limpias un punto, aparecen dos nuevos. Ya no puedes seguir fingiendo calma.
housework.water_break=Giras el grifo una vez de más y la tubería se rinde. Agua por todas partes y el fregadero ya no sirve. || Un silbido sospechoso, un estallido y una fuente. La plomería renunció y el suelo es ahora un lago.
housework.break=Manipulas la máquina y algo por dentro hace clonc. Luego, silencio. Genial. || Aprietas lo que no era y el aparato muere con un triste zumbido.
housework.messy=De algún modo tu trapeador estaba más sucio que el suelo y lo ensució todo todavía más. ¡Suciedad, suciedad por todas partes! || La esponja que agarraste era, al parecer, una granja de polvo. Ahora el lugar parece abandonada desde 1987. || Sacudes el plumero y el lugar se llena aún más de polvo. La física tiene dudas. Tú también. || La aspiradora eructa todo lo que alguna vez se tragó. Felicidades, has inventado la limpieza al revés. || Exprimes el trapo y, de algún modo, llueve polvo. Cada estante, cada suelo, cada superficie. Hasta las telarañas presentaron una queja. || Tu escoba estornudó. Todo el lugar es una tormenta de polvo ahora. Limpiar fue un error.
housework.sigh=Suspiras ante la montaña de tareas. A la montaña de tareas no le importa. || Siempre hay algo más sucio. Te tomas un momento para llorar tu tiempo libre.
housework.dust_allergy=Levantas una nube de polvo que llevaba años esperando este momento. Achís. Tu nariz presenta una queja. || La escoba despierta a todas las pelusas del lugar. Estornudas hasta que te revientan los oídos. || Una nube de polvo viejo te da de lleno en la nariz. Ahora eres oficialmente alérgico a tu propia limpieza.
housework.clean_house=Una ráfaga de energía limpiadora y todo el lugar queda reluciente de una vez. Ni una mota de polvo sobrevivió. || Entras en un ritmo de limpieza perfecto. Cada superficie y cada suelo están impecables. ¿Quién eres? || Algo hace clic. Ordenas todo el lugar de un solo y glorioso barrido, conejitos de polvo incluidos.

# -- Laundry
laundry.bonus=La ropa sale suave, tibia y con olor a prado primaveral. Doblar casi es divertido. || Un ciclo impecable. Cada calcetín tiene pareja y ninguno es rosa. || La colada sale impecable y perfectamente seca. Te sientes un profesional de la lavandería.
laundry.crit_success=Perfección en la colada. Lo blanco más blanco, los colores más vivos, y doblas como en un hotel. || El ciclo termina y tu ropa parece nueva. En algún lugar cercano canta un coro. || Cero manchas, cada calcetín emparejado, cada camisa tiesa. Los dioses de la colada están contentos.
laundry.soft_fail=La colada sale un poco arrugada y un poco húmeda, pero se puede usar. || Algunas manchas sobreviven al ciclo. Decides que eso es carácter. || Pulsas inicio, esperas lo mejor y la ropa sale más o menos bien.
laundry.crit_fail=Encogida, rosa, inundada y con un calcetín menos. Una obra maestra de desastres de colada. || La máquina se inunda, tu camisa encoge y el calcetín rojo ataca otra vez. Ganas una medalla al caos. || Una inundación de espuma, un armario arruinado y un calcetín perdido en un solo ciclo. Impresionante, a su manera.
laundry.shrunk=Lavas tu jersey favorito en caliente. Ahora le queda bien a un osito. || La etiqueta decía agua fría. La leíste después del ciclo. La camiseta ahora es un top corto. || Abres la máquina y sacas tus vaqueros. Ahora son de muñeca. La lavadora está muy satisfecha.
laundry.pink=Un solo calcetín rojo se cuela entre lo blanco. Ahora todo lo que tienes es rosa. || Querías camisas blancas y frescas. Te salió un atardecer rosado y una lección sobre separar la ropa. || La colada sale de un solo color: salmón. Tu armario entra en una nueva era atrevida.
laundry.lost_sock=Cuentas los calcetines dos veces. Uno se ha esfumado otra vez en la dimensión oculta de la máquina. || Entran siete calcetines y salen seis. La lavadora hace colección. || Un calcetín solitario te mira desde el tambor. Su pareja se fue para siempre.
laundry.slip=Pisas un rastro de espuma de la máquina. El suelo gana y giras como un patinador artístico. || Un charco de agua con jabón embosca tus calcetines. ¡Uiii... zas! || Llevas la cesta directo a un charco. La ropa vuela y tú también.
laundry.flood=La manguera se suelta y la máquina inunda el suelo. Estás de pie en un lago muy limpio. || Demasiado detergente, poco juicio. Una ola de espuma se apodera de la habitación y la máquina se rinde. || Un gorgoteo fuerte, un golpe y una fuente de agua jabonosa. El cuarto de la colada es ahora una piscina.
laundry.break=Pulsas un botón que no estaba hecho para pulsarse. La máquina gruñe y se apaga. || Algo dentro hace clonc, traquetea y se detiene. El tambor se queda atascado a medio ciclo y tu ánimo también. || La máquina tiembla, echa un poco de humo y muere. Fue un placer conocerla.
laundry.laundry_cash=Revisas la ropa y encuentras ${m} doblados en el bolsillo de tus pantalones viejos, un segundo antes de que la máquina los convierta en confeti. || Un fajo arrugado de ${m} en los jeans que jurabas que estaban vacíos. La lavadora se queda con los jeans y tú con el dinero. || Revisas cada bolsillo antes del ciclo y das con el oro: ${m}. Tu yo del pasado fue un genio. Tu yo del presente es rico. || Misterio resuelto: ahí se fueron ${m}. Estaban escondidos en tus pantalones todo este tiempo. || Encuentras ${m} en un bolsillo justo antes del centrifugado. La máquina parece decepcionada de haberlo pasado por alto.

# -- Cooking
cooking.bonus=El olor es increíble. Pruebas un bocado y asientes como un chef de televisión. || Un poco de suerte y el plato sale perfecto.
cooking.crit_success=Una obra maestra. Los restaurantes suplicarían por esta receta.
cooking.soft_fail=No se parece en nada a la foto, pero es comestible. Probablemente.
cooking.crit_fail=Humo, chispas y un cocinero muy confundido. Hoy has inventado un nuevo nivel de desastre en la cocina.
cooking.burn=Agarras la sartén caliente con total confianza. Ella no está de acuerdo. Saltas por la cocina sacudiendo la mano. || El vapor te alcanza y la sartén también. Cocinar es peligroso, al parecer.
cooking.food_poison=El plato huele sospechoso, sabe sospechoso y tu estómago empieza a planear una gira de venganza. || Cocinas con mucha confianza y cero higiene. Tu estómago enviará una reseña más tarde.
cooking.mess=Harina en el techo, salsa en la pared y una sartén humeante. ¿En qué momento falló la receta? || La cocina parece un campo de batalla. Tú eres la única baja.
cooking.fire=Apartas la vista un segundo y la sartén se prende fuego. La cocina tiene opiniones sobre tu forma de cocinar. || ¡Llamas! La estufa decidió ponerse creativa y tú no estabas nada preparado. || El aceite se emociona, la llama crece y tu cena pasa a ser un riesgo de incendio. ¡Corre!
cooking.appliance_break=Pulsas el botón y el aparato hace pum y se apaga para siempre. La cena ahora es comida para llevar. || Algo chispea dentro del horno. Te vuelves para pedir perdón, pero ya no está.
cooking.takeout=La cena es una causa perdida, así que pides comida a domicilio. Llega rápido y cuesta ${m}. Cocinar es un viaje. || Admites la derrota y llamas a la pizzería. ${m} después, todos felices. || La alarma de humo se lo está pensando, así que pedimos a domicilio. Total: ${m}.

# -- Dining
dining.bonus=El refri tiene justo lo que querías, y sabe aún mejor de lo que se ve. Una pequeña victoria. || Temperatura perfecta, porción perfecta. Comes como si tuvieras algo importante que hacer. || Cada bocado acierta. Incluso terminas el plato sin una migaja.
dining.crit_success=Una comida digna de aplausos. Lames el plato y nadie puede detenerte. || Un chef lloraría. Tú solo te lo comes. Alegría pura. || El mejor bocado de tu semana. Cierras los ojos y te quedas ahí un momento.
dining.soft_fail=Un pequeño goteo, un pequeño ups. Limpias la mesa y finges que no pasó. || La comida está un poco rara pero la terminas igual. El orgullo es una salsa. || Casi se te cae, la atrapas y asientes como si fuera el plan.
dining.crit_fail=Llevas el plato con seguridad, luego con pánico, luego ya no. El suelo recibe la comida y tú recibes el suelo. || El plato despega y la sopa toma el suelo. Tú también. El almuerzo ya es una historia. || Un estornudo, un derrame y el peor aterrizaje posible. La comida y tu orgullo están por todas partes.
dining.spill=El plato se inclina y la cena cae al suelo. De algún modo el suelo ya estaba polvoriento, y ahora es una escena. || Se te cae media comida y sube una nube de migajas y polvo. La cocina no está contenta. || Una inclinación torpe, un estruendo y un desastre se extiende por el suelo. La limpieza puede esperar.
dining.burnt_tongue=Muerdes antes de que se enfríe. Tu lengua presenta una queja y tus ojos también. || Muy caliente, muy rápido. Te abanicas la boca como un dragón muy pequeño. || El primer bocado es lava. El segundo es mala idea. Lo tomas igual.
dining.choke=Un bocado se va por el camino equivocado. Toses, jadeas y te recuperas con un asentimiento muy digno. || Inhalas media comida y parte quiere salir. Agua, ya. || Una tos salvaje, unas lágrimas y un pulgar arriba. Estás bien. El plato te juzga.
dining.food_coma=A la mitad del plato ya estás fuera de combate. Los párpados se rinden primero. || Una comida pesada, un suspiro pesado y una larga mirada a la nada. La siesta llama. || La comida estaba genial. El cuerpo ahora está fuera de línea por mantenimiento.
dining.bad_leftovers=Esas sobras olían bien, que es la mentira que cuentan las sobras. Tu estómago empieza a discrepar. || Te comes lo del fondo de la nevera. La nevera intentaba avisarte. || Parecía bien y sabía bien. Tu estómago tiene otras opiniones.

# -- Programming
programming.bonus=El código compila a la primera. Sospechoso, pero bienvenido. || Encuentras la solución elegante y te sientes un mago.
programming.crit_success=Código impecable, cero errores y una ovación de pie de una sala vacía.
programming.soft_fail=Funciona, más o menos. Las advertencias serán problema de tu yo del futuro.
programming.crit_fail=Ejecutas un rm -rf que no debías y el hardware se une a la fiesta. Colapso total del sistema.
programming.stress=Tu código compila al quinto intento y se rompe al sexto. Tu ojo tiembla al ritmo. || Un punto y coma que falta te cuesta una hora de vida. ¿Alguien quiere café?
programming.frustrated=Hace un minuto todo funcionaba. No tocaste nada. Lo juras. || El error desaparece, vuelve, y luego está en otro lado. Golpeas el escritorio.
programming.shock_break=Un chasquido, un destello, y tu computadora se apaga con una nube de humo. La descarga es el insulto final. || Pulsas enter y la máquina contraataca. Saltan chispas, literalmente.
programming.crash=La pantalla se pone azul, luego negra, luego muerta. Todo el trabajo sin guardar se va con ella. || Tu computadora suelta un suspiro y se rinde. Ya había tenido suficiente.
programming.hack=Jurabas que tu software era imposible de hackear. Un hacker acaba de demostrar lo contrario y ha retirado ${m} de tu cuenta. Su nota dice: gracias por el consejo. || Tu contraseña supersegura era 'password1'. Alguien vació ${m} de tu cuenta antes de que acabaras el café. || Un desconocido encontró la puerta trasera que olvidaste cerrar y se llevó ${m}. Gran trabajo en equipo con tu yo del pasado.
programming.bounty=Encuentras un fallo crítico en una app famosa y lo reportas con educación. Te pagan una recompensa de ${m}. Finges que siempre fue el plan. || Tu pull request arregla algo que nadie lograba arreglar en años. Los mantenedores te envían ${m} y un agradecimiento larguísimo. || Una empresa lee tu pulcro informe del exploit y te transfiere ${m}. La sudadera fue una buena inversión.
programming.freelance=Un cliente te paga ${m} por un favor rápido. Fueron diez minutos y tres años de experiencia. || Arreglas la web de un desconocido por chat y insiste en enviarte ${m}. ¿Quién eres tú para negarte? || Un trabajillo cae en tu bandeja de entrada y ${m} caen en tu cuenta justo detrás.

# -- Critical Thinking
logic.bonus=Las piezas encajan. Te sientes bien listo. || Ves el fallo del argumento antes que nadie. Alegría callada y presumida. || Hechos, luego lógica y una conclusión que de verdad se sigue. Delicioso.
logic.crit_success=Cada pregunta respondida, cada truco descubierto. Podrías dar una clase. || El acertijo se pliega como papel. Te recuestas y la silla cruje con respeto. || Una línea de razonamiento perfecta, de principio a fin. Brillante, de verdad.
logic.soft_fail=Casi, pero la lógica tiene un hueco por donde cabe un camión. || Casi lo tienes. El casi está haciendo mucho trabajo aquí. || La respuesta anda cerca. No sabes bien dónde.
logic.crit_fail=Sigues un argumento muy convincente hasta un lugar muy equivocado. Colapso total. || Todo lo que creías hace tres minutos estaba mal. Y lo de ahora también. || Confianza, un error y un reinicio mental completo. Empiezas de cero.
logic.headache=Demasiadas pestañas, demasiados datos. La cabeza empieza a latirte. || Lees el mismo párrafo seis veces y nunca se hace más fácil. || Un dolor sordo detrás de los ojos dice que ya basta de pensar por hoy.
logic.rabbit_hole=Un enlace llevó a otro y ahora son las tres de la mañana en tu cabeza. || Empezaste con una pregunta simple y acabaste leyendo sobre queso medieval. || La investigación se puso interesante. La investigación se puso muy larga.
logic.wrong_answer=Estabas tan seguro. La hoja de respuestas fue más amable de lo necesario. || Respondes con confianza. La respuesta está mal con la misma confianza. || Una suposición audaz, más audaz que acertada.
logic.overthinking=Piensas tan fuerte en la pregunta que olvidas cuál era. || Cuanto más analizas, menos sentido tiene. Pensar, irónicamente, duele. || Construyes una teoría perfecta y notas que empezaste con el dato equivocado.
logic.argument=Explicas la lógica. {t} explica por qué está mal. Ahora los dos estáis explicando. || Tu argumento perfecto tiene un agujero que no viste. {t} lo ve y no dice nada, bien fuerte. || Ganas la discusión en tu cabeza. En voz alta, {t} la gana con una sola frase.
logic.lost_thread=Empiezas con un punto limpio y lo pierdes a mitad de frase. {t} espera con amabilidad a que vuelva. || La lógica se derrumba a medias. Parpadeas ante {t} y dices 'qué estaba diciendo'. || Un argumento impecable que se detiene impecablemente en mitad. {t} asiente como si tuviera sentido.
logic.pedantic=Corriges a {t} en un detalle minúsculo. {t} te mira como si te hubieras comido la última galleta. || Técnicamente tienes razón. {t} te mira con la energía de una puerta cerrada. || Ganas un punto que a nadie le importaba. {t} respira hondo.
logic.quiz_prize=Respondes la última pregunta antes de que el presentador la termine. El premio es de ${m} y una rara sensación de superioridad. || Tus conocimientos de trivial por fin dan fruto: ${m}. Todos esos datos raros eran una inversión. || Resuelves el acertijo en tiempo récord y un aviso te paga ${m}. Mensa no estuvo disponible para comentar.

# -- Finance
finance.bonus=Los números cuadran y tu instinto acierta por una vez. Una pequeña victoria silenciosa. || Lees la gráfica como un libro y la gráfica se porta bien. Todo muy suave. || Una jugada inteligente, pulso firme y pantalla en verde. Te asientes a ti mismo.
finance.crit_success=Cada jugada acierta. El mercado te adora y finges ser humilde al respecto. || Compras bajo, vendes alto y de algún modo fue a propósito. Legendario. || La gráfica sube en vertical a tu favor. Cierras el portátil como un villano de película.
finance.soft_fail=Nada del otro mundo, solo una pequeña caída y mucho entrecerrar los ojos. || Quedas en tablas y lo llamas una lección. Una lección muy aburrida. || El mercado se encoge de hombros y tú también.
finance.crit_fail=Vendes en el fondo y compras en el techo, un doble raro. El mercado lo nota. || Un clic equivocado y todo el plan se pone en rojo. Tu estómago cae con la gráfica. || La gráfica sube en vertical, pero al revés. La miras como si te debiera una disculpa.
finance.bad_trade=Estabas seguro de esta. La gráfica no está de acuerdo, y lo dice fuerte. || El consejo vino de un desconocido muy seguro. Ese fue el primer error. || Aguantas un poco de más y vendes un poco tarde. Un clásico.
finance.panic=La línea cae y tu corazón con ella. Actualizas la página nueve veces. || Números rojos por todos lados. Respiras en una bolsa de papel, figuradamente. || Tu mano flota sobre el botón de vender y tiembla. El mercado no espera.
finance.rage=Le dices al mercado cosas que un ordenador educado no debería oír. || Golpeas el escritorio y la gráfica sigue bajando. Qué grosería. || Tu puño y el escritorio tienen una reunión corta. Gana el escritorio.
finance.glitch=La página de trading se cae en el peor segundo posible. Tu ordenador también. || Una ventana, una rueda girando y la pantalla congelada. El mercado secuestró tu sesión. || La máquina se rinde bajo el peso de tus malas decisiones.
finance.scam=Un mensaje dice que ganaste algo. Pulsas el enlace. ${m} salen de tu cuenta a toda prisa. || Un príncipe muy amable necesitaba un pequeño favor. El favor costó ${m}. || La inversión parecía legítima, con logo y todo. Solo era un logo. ${m} han desaparecido.
finance.dividends=Una acción que habías olvidado paga ${m}. Tu yo del pasado te saluda. || Cae un pequeño dividendo: ${m}. No es mucho, pero es tuyo. || Tu cartera te suelta ${m} como un gato educado. Aceptas el regalo.

# -- Gaming
gaming.bonus=Tus reflejos están afilados, el equipo habla y el botín es generoso. Una buena noche. || Marcas la jugada, el equipo te sigue y la pantalla dice VICTORIA. Tu silla gira un poco. || Todo encaja. La puntería, el tiempo, el snack. Eres el protagonista.
gaming.crit_success=Una partida impecable. El chat se pone de pie y tú también, a duras penas. || Ganas una partida que nadie creía ganable. Te levantas y das una pequeña vuelta de victoria. || Primer lugar, sin muertes y un clip digno de mandar a todos.
gaming.soft_fail=Pierdes la ronda pero mantienes la calma. Más o menos. || Una derrota por poco. Culpas al lag y empiezas otra ronda. || No es tu mejor partida ni la peor. El mando sobrevive.
gaming.crit_fail=Tu compañero se va, tu internet se va y luego la luz. La pantalla se apaga en una partida perfecta. || Te enfadas tanto que el teclado pide una orden de alejamiento. Partida perdida, y más. || Salir, revancha, perder, salir. Por algún lado vuela un mando. Nadie está orgulloso.
gaming.rage_quit=Pierdes por un error que claramente fue culpa del juego. Estás muy tranquilo. No estás nada tranquilo. || A cinco minutos de ganar sale una ventana y termina la partida. Dices palabras. || El jefe final te mata de un golpe por novena vez. La silla recibe tu frustración.
gaming.burnout=Tres horas después, tus ojos están secos y los pulgares te duelen. Quizás un descanso sería bueno. || Prometiste una partida más. Fue hace seis partidas. La espalda presenta una queja. || El juego sigue. Tú no. Un suspiro largo y un estiramiento largo.
gaming.crash=El juego se congela, el ventilador grita y la pantalla se apaga. El ordenador ya tuvo suficiente de tus partidas. || Demasiadas pestañas, demasiados mods y un jefe de más. La máquina se rinde. || Un chasquido fuerte de la caja y luego silencio. El archivo guardado está en el más allá.
gaming.microtransaction=Tocas un botón brillante para ver qué hace. Hace una compra de ${m}. La espada es un sombrero. || Se abre un cofre con fuegos artificiales y un cargo de ${m}. Dentro: un trofeo muy pequeño. || El juego ofrece un pack de inicio por tiempo limitado. El tiempo era ahora, el precio ${m}.
gaming.tournament=Ganas la ronda final con un punto de vida. El bote paga ${m}. Gritas en una habitación muy silenciosa. || Un torneo online diminuto, un premio diminuto y un gran subidón de ego: ${m} son tuyos. || Tu equipo gana y todos gritan por el chat de voz. El premio es de ${m} y no recuerdas nada de la partida.
gaming.stream_tips=Alguien que ve tu directo envía ${m} y el mensaje 'buenas jugadas'. Las dos cosas sientan bien. || Un espectador deja ${m} por el buen rollo. Se lo agradeces en directo, dos veces. || Una audiencia pequeña, una propina de ${m} y confianza de sobra para hacer directo mañana también.

# -- Media
media.bonus=El corte fluye, los colores resaltan y el archivo se exporta sin un error. Magia. || Tu edición tiene ritmo. Hasta el material de relleno parece intencional. || Un render limpio, una línea de tiempo limpia y un gesto muy presumido.
media.crit_success=Una obra maestra en proceso. Pulsas guardar con una reverencia muy callada. || El video parece una película de verdad. Lo ves tres veces para estar seguro. || Cada fotograma es correcto, cada corte es perfecto. Ahora eres un autor.
media.soft_fail=Se exporta, pero el audio está un poco desfasado. Nadie lo notará. Probablemente. || El color está un poco mal, el corte un poco áspero. Casi suficiente. || Un intento decente. El resultado final dice 'necesita trabajo'.
media.crit_fail=El programa se come tres horas de trabajo y luego todo el proyecto. Ni una copia de seguridad. || Pulsas renderizar y el ordenador contraataca. Chispas, humo y una sala muy callada. || La exportación falla, el archivo se corrompe y la línea de tiempo es un mapa de arrepentimientos.
media.render_crash=La barra de render llega al 99 por ciento y la máquina se duerme para siempre. || El ordenador se pone ruidoso, caliente y luego muy, muy silencioso. || El ventilador grita, la pantalla parpadea y el proyecto muere en llamas.
media.corrupted=El archivo se niega a abrirse. Lo intentas nueve veces. Se niega nueve veces. || Un solo clic equivocado y el clip se vuelve estática verde. || El proyecto se guardó como un archivo muy pequeño y muy roto.
media.burnout=Ocho horas de edición y la línea de tiempo sigue igual. Tus ojos no están de acuerdo con el reloj. || Miras los mismos dos segundos de material durante una hora. Ellos te miran también. || Tu espalda dice no, tus ojos dicen no y tu línea de tiempo dice quizás mañana.
media.bad_take=Ves el corte final y te encoges. Un poco de todo salió mal. || El audio es bajo, el video es oscuro y el chiste no funciona. || En algún lugar entre la idea y el video, la idea se perdió.
media.copyright=Te llega una reclamación de derechos de autor por tu vídeo. La canción eran solo cinco segundos. La multa es de ${m}. || Un estudio encuentra el clip que según tú estaba muy editado. Sus abogados te facturan ${m}. || Tu obra maestra usa una banda sonora famosa sin permiso. Pagas ${m} en daños.
media.viral=Tu vídeo explota de la noche a la mañana y llegan los ingresos: ${m}. Los comentarios dicen 'primero'. Siempre. || Un clip que casi borras se hace viral. La plataforma te envía ${m} y el teléfono no para de vibrar. || Todo el mundo comparte tu montaje. Una marca aparece con ${m} y un correo sospechosamente cariñoso.
media.sponsor=Una marca pequeña adora tu canal y te manda ${m} por lo bien que queda su logo en la esquina. || Un patrocinador paga ${m} por una mención de ocho segundos. Tú los mencionas nueve. || Un código de descuento y ${m} por las molestias. El marketing funciona contigo.

# -- Composition
music.bonus=Una melodía llega de la nada y se sienta como si viviera ahí. Bonito. || Los acordes encajan como si te esperaran. El ritmo es relajado y seguro. || Tarareas el estribillo y simplemente funciona. Una melodía para guardar.
music.crit_success=Un éxito. Oyes al público cantando contigo, y el público eres solo tú. || La canción se escribe sola, se toca sola y te hace llorar un poco. Hermosa. || El estribillo perfecto, el ritmo perfecto, el final perfecto. Un verdadero éxito.
music.soft_fail=La melodía es bonita, el resto no. La guardas como 'borrador 14'. || Un comienzo decente con un medio muy inacabado. || La canción va a algún lado, pero no a uno bueno.
music.crit_fail=La pista suena como un gato caminando sobre un piano en un túnel. Todos se tapan los oídos. || Borras toda la sesión por accidente. El silencio es muy educativo. || La canción es terrible y de algún modo empeora. Un nuevo récord.
music.off_key=Das una nota con la que el resto de la canción no está de acuerdo. Fuerte. || En algún punto entre la estrofa y el estribillo, la tonalidad cambió sin avisarte. || Una nota equivocada, una pausa larga y una mueca muy honesta.
music.block=Miras una pista vacía durante una hora. Gana la pista vacía. || Cada idea suena a algo que ya oíste. Porque ya lo oíste. || La inspiración se tomó el día libre y no dejó una nota.
music.lost_file=El proyecto se cierra sin guardar. Tu canción se va flotando como un globo. || Un clic equivocado borra la mejor parte de la pista. Era la parte buena. || El archivo guardado resulta estar vacío. Tu genio se fue, de manera muy silenciosa.
music.studio_bill=El estudio te reserva para una sesión rápida. La factura es de ${m}, con un cargo por una silla en la que nunca te sentaste. || Alquilas un micrófono mejor por la vibra. La vibra cuesta ${m}. || Un músico de sesión cancela a última hora y se queda con el depósito: ${m}. El solo de guitarra era imaginario igualmente.
music.royalties=Tu tema suena en una cafetería y llegan las regalías: ${m}. Tu estrella de rock interior se incorpora. || Un programa licencia tu melodía y envía ${m}. Te pasas el resto del día tarareándola. || Llega un cheque de streaming con ${m}. Decenas de oyentes. Quizá cientos. Vale, quizá tu primo.
music.tips=A un amigo le gusta tanto tu demo que te manda ${m}. Apoya el arte. || Un oyente te manda ${m} con el mensaje 'más, por favor'. Obedeces de inmediato. || Alguien deja ${m} en tu sombrero virtual. Técnicamente, es un sombrero.

# -- Performance
performance.bonus=El ritmo toma el control y aciertas cada compás. La sala es tuya. || Te deslizas por la rutina como si hubieras nacido para esto.
performance.crit_success=Una ovación de pie, en una sala de una sola persona. Brillas igual.
performance.soft_fail=Fallas un paso o dos pero mantienes el ritmo. Nadie se dio cuenta. Probablemente.
performance.crit_fail=Resbalas, giras y aterrizas en un chapoteo de vergüenza. Hasta el ritmo guarda un momento de silencio.
performance.embarrassed=Tus movimientos son atrevidos, tu ritmo no. Te congelas a mitad del paso y finges que la música paró. || Todos te miran, y no de la buena manera. Saludas con torpeza y abandonas el escenario.
performance.stage_fright=El foco te alumbra y tus piernas olvidan todo. Solo oyes tu propio corazón. || Sales al escenario y el ritmo se aparta. En algún lugar, un público de cero personas te juzga.
performance.sad=Bailas como si nadie te viera, y entonces notas que, en efecto, nadie te veía. Sigue un suspiro silencioso. || La música termina y tu confianza también. Quizá otro día.
performance.fined=Un vecino presenta una queja por ruido y la ciudad te multa con ${m}. El arte, como siempre, tiene un precio. || Un inspector dice que tu número necesita un permiso. Lo necesita. La multa es de ${m}. || Alguien llama a las autoridades por tu actuación. La multa cuesta ${m} y el espectáculo sigue en espíritu.
performance.flat_note=La primera nota es preciosa. La segunda está en otro sitio. {t} sonríe y aguanta. || Apuntas al corazón y le das a otra tecla. {t} aplaude con educación el esfuerzo. || La serenata alcanza una nota que haría ladrar al perro, si hubiera perro. {t} asiente con valentía.
performance.forgot_lyrics=Se te olvida la letra en mitad de la canción. {t} espera, con las manos en el regazo, con mirada amable. || La letra desaparece de tu cabeza. Tarareas un poco y finges que fue a propósito. || Te atascas en el estribillo. {t} sonríe y te dice la siguiente línea moviendo los labios.
performance.too_loud=Cantas tan fuerte que {t} se sobresalta. Puede que los vecinos también lo hayan oído. || La serenata es apasionada y absolutamente ensordecedora. {t} se tapa un oído con educación. || Demasiado volumen, poco control. {t} querría que la canción acabara, pero con suavidad.
performance.big_tip=Un transeúnte deja ${m} en tu sombrero y no dice nada. El silencio es el cumplido. || El público se vuelve loco y un desconocido te da ${m} de propina. Saludas y lo cuentas dos veces. || No aparece ningún cazatalentos, pero ${m} sí. Los aceptas.
performance.busking_tips=Unas monedas se convierten en ${m} al final de la canción. Alguien incluso aplaudió. || Un niño deja ${m} en tu sombrero y sale corriendo. Un pequeño mecenas. || Tu sombrero pesa más que esta mañana: ${m}. Las palomas aplauden.

# -- Dance
dance.bonus=El ritmo cae y tu cuerpo ya sabe adónde ir. Suave, sin esfuerzo, un poco presumido. || Clavas cada paso como si el coreógrafo lo hubiera escrito solo para ti. || Alguien cerca empieza a aplaudir al ritmo. Finges no notarlo y añades un giro.
dance.crit_success=Ritmo puro. Hasta los muebles parecen mecerse contigo. || Haces un paso tan limpio que casi te aplaudes a ti mismo. || La sala se queda en silencio un segundo y entonces llega tu final. Estatus de leyenda.
dance.soft_fail=Fallas un paso o dos pero mantienes el ritmo. Nadie se dio cuenta. Probablemente. || Un pequeño tropiezo, un rápido arrastre de pies y sigues como si estuviera coreografiado. || Tu tiempo se desvía unos compases y luego encuentra el camino de vuelta.
dance.crit_fail=Te lanzas a un giro y el suelo se lanza a ganar. Gravedad: 1, tú: 0. || Tu pie va para un lado y el resto de ti no está de acuerdo. El aterrizaje no es elegante. || El paso se veía genial en tu cabeza. La sala ya lo vio y no puede olvidarlo.
dance.puddle_slip=Un charco sospechoso espera en la pista. Lo encuentras con un giro. || Lanzas el gran paso, tu pie encuentra un charco y el resto es un baile de otro tipo. || Nadie vio ese charco. Todos están a punto de verte dentro de él.
dance.embarrassed=Tus pasos son atrevidos, tu ritmo no. Te congelas a mitad del paso y finges que cambió la música. || Haces una pose para el gran final y la canción sigue sin ti. || Alguien te mira, y no de la buena manera. Saludas con torpeza y lo llamas arte.
dance.exhausted=A la tercera canción tus piernas presentan una queja. Tú terminaste y tu batería también. || El entusiasmo estaba. La resistencia se tomó la noche libre. || Bailas hasta que las rodillas hablan, luego te sientas a pensar en tus decisiones.
dance.sad=Bailas como si nadie te viera, y entonces notas que nadie te veía. Sigue un suspiro silencioso. || La música termina y tu confianza también. Quizás otro día. || La pista está vacía. Por un momento, tú también.
dance.stepped_on=Pisas el pie de {t} con la gracia de un piano cayendo. {t} finge que no dolió. || El baile va bien hasta el tercer paso. {t} salta a la pata coja y se lo toma a risa, más o menos. || Dos pies izquierdos, los tuyos y los de {t}. {t} dice 'culpa mía' y los dos sabéis que no.
dance.dizzy=El giro es demasiado rápido y la sala se inclina. {t} y tú caéis el uno sobre el otro, mareados y riendo. || Giras, el mundo sigue girando y pierdes el equilibrio. {t} te agarra, o lo intenta. || Vueltas y vueltas hasta que desaparece el suelo. {t} gruñe, todavía agarrado.
dance.dip_dropped=La inclinación sale mal y {t} se te escapa de los brazos. Una caída elegante, técnicamente. || Te inclinas, {t} se inclina hacia fuera y el suelo os recibe a los dos. Bailando con la gravedad. || A mitad de la inclinación, tu agarre se rinde. {t} da contra el suelo y dice 'ay' en dos sílabas.
dance.in_sync={t} y tú os movéis como uno. El ritmo encaja y se acumula un poco de calidez entre vosotros. || Cada paso encaja. {t} sonríe de un modo que dice que mereció la pena. || Un giro perfectamente medido, una risa compartida. {t} y tú terminas el baile más cerca que al empezar.

# -- Online Dating
dating.bonus=Tu perfil recibe buena reacción y una respuesta divertida. Nada mal. || El chat fluye, los chistes aciertan y alguien dice que le gusta tu humor. || Una pareja, una risa y un plan prometedor. Te sonrojas frente a la pantalla.
dating.crit_success=Una pareja perfecta, un gran chat y una cita que suena a película. Estás radiante. || Tres personas responden a la vez y todas son encantadoras. Qué problema tener. || Tu foto, tu bio y tu momento son perfectos. Internet te adora.
dating.soft_fail=Un par de respuestas educadas y ninguna chispa. El perfil necesita otra revisión. || Haces pareja con alguien y el chat muere después del 'hola'. || La aplicación te muestra unas caras. Ninguna te saluda.
dating.crit_fail=Mandas un mensaje a la persona equivocada, el mensaje equivocado y la foto equivocada. Todo a la vez. || Tu perfil es reportado por alguien con quien hiciste pareja. De algún modo, es tu culpa. || Desastre total: un error en tu nombre, una foto borrosa y una respuesta que dice '¿quién?'.
dating.ghosted=El chat iba tan bien, y entonces la otra persona desapareció. Ni un adiós. || Aparecen tres puntos, desaparecen y nunca vuelven. Los miras igual. || Leyeron tu mensaje y lo dejaron ahí. El silencio ensordece.
dating.catfish=Las fotos eran muy distintas de la persona. Muy distintas. De otra especie, casi. || La pareja encantadora resulta ser un bot con un guion muy bueno. || Su perfil decía 'alto, divertido, honesto'. El chat decía 'mándame una tarjeta de regalo'.
dating.awkward=Tu primer mensaje fue un chiste muy largo que necesitó mucha explicación. || Respondes 'jaja' de un modo que suena muy triste. || Una frase de ligue vergonzosa, enviada con una confianza que no puedes defender.
dating.typo=El autocorrector convierte un mensaje dulce en algo profundamente desafortunado. || Pulsas enviar y entonces ves el error. El error está en la primera palabra. || Un fallo pequeño, una diferencia enorme de significado. Lo recordarás.

# -- Medicine
medicine.bonus=La medicina hace efecto rápido y se te despeja la cabeza. Te sientes casi nuevo. || Dosis correcta, momento correcto. La nariz se despeja y el ánimo también. || La pastilla hace su trabajo en silencio. Decides confiar más en las pastillas.
medicine.crit_success=Dosis perfecta, momento perfecto. Te sientes mejor que antes de enfermar. || La medicina entra como en un montaje de película. Vuelan los pañuelos, suena la música y estás curado. || Tratamiento de manual. En algún lugar un médico siente un extraño orgullo.
medicine.soft_fail=Agitas el frasco, suspiras y finges ser productivo. || Decides que el resfriado no es tan grave. El resfriado no está de acuerdo. || Dejas la medicina para luego. Luego queda muy lejos.
medicine.crit_fail=Coges el frasco equivocado. La etiqueta decía 'para plantas'. Te sientes muy frondoso. || La pastilla rueda bajo el sofá y tomas la de al lado. Valiente. No inteligente. || Tomas una medicina pensada para otra cosa. Tu cuerpo presenta una queja formal.
medicine.wrong_dose=Entrecierras los ojos ante la etiqueta, adivinas y fallas. La medicina no es ese tipo de juego. || Tomas un poco de menos y luego un poco de más. El resfriado sigue y te sientes raro. || Las instrucciones eran claras y no leíste ninguna. El resfriado sigue aquí.
medicine.side_effects=La medicina no arregla nada y te da sueño. Enhorabuena: un resfriado con dolor de cabeza. || A tu estómago no le gusta la pastilla. A tu resfriado le da igual. || Lees los efectos secundarios después de tomarla. Había más de los que pensabas.

# -- Sink
sink.bonus=El agua sale tibia a la primera. Alguien allá arriba te quiere. || Tus manos quedan tan limpias que rechinan. Los cirujanos te envidiarían. || Presión perfecta, temperatura perfecta. Un pequeño milagro en el baño.
sink.crit_success=Manos, cara, dientes, todo impecable. El espejo aplaude. || El lavabo se porta tan bien que merece una medalla.
sink.soft_fail=El agua está tibia y al jabón casi no le queda, pero lo logras. || Un poco de salpicadura, mucha queja, y quedas lo bastante limpio.
sink.crit_fail=Mira nada más el desastre que armaste. ¡Cuidado con dónde pisas, que te resbalas! || Giras la llave y todo el lavabo se rinde. Agua por todas partes, dignidad por ninguna. || La tubería suelta un quejido, un chasquido y un géiser. El baño ahora es una alberca.
sink.flood=Mira nada más el desastre que armaste. ¡Cuidado con dónde pisas, que te resbalas! || El grifo se parte y el agua sale por todos lados. Cuidado con el charco, genio. || Un crujido, un silbido, una fuente. El lavabo está roto y hay un charco justo bajo tus pies.
sink.frustrated=Luchas con la llave hasta que se rinde. No estás nada tranquilo. || Cada vez que giras la manija empeora. Miras las tuberías como si te debieran dinero.
sink.splash=Te salpicas la cara de lleno y desearías poder rebobinar un minuto. || La llave rocía de lado y te empapa la camisa. Muy elegante.
sink.slip=Pisas el charco que tú mismo hiciste. La gravedad presenta una queja. || El piso está resbaloso, tus calcetines están resbalosos y tu suerte también.
sink.fail=La llave tose, escupe y te rocía la cara. Qué grosera. || El agua sale fría, luego caliente, luego fría otra vez. El lavabo tiene personalidad. || Peleas con el grifo y el grifo gana.
sink.pass=Un lavado normal, aburrido y perfectamente funcional.

# -- Toilet
toilet.bonus=Todo funciona. Son las pequeñas victorias las que cuentan. || Una visita perfecta. El trono de porcelana lo aprueba.
toilet.crit_success=Una descarga tan suave que debería salir en un catálogo. || Una visita perfecta. El baño huele a spa.
toilet.soft_fail=Hacen falta dos descargas, pero funciona. Nadie vio nada. || Un poco ruidoso, un poco lento, y listo.
toilet.crit_fail=El inodoro gorgotea de una forma que suena cara. ¡Cuidado con dónde pisas! || Algo salió mal con la plomería mientras estabas ocupado. Mantén la calma y no te resbales. || Un gorgoteo horrible y un charco sospechoso que se extiende a tus pies. Te vas con muchísima dignidad.
toilet.overflow=El inodoro gorgoteó con malas intenciones y ahora el agua se está extendiendo. ¡Cuidado con dónde pisas, que te resbalas! || Hay un charco a tus pies. Haces como si nada pasara. || La taza escupió una ola sorpresa. Ahora estás parado en un charco intentando mantener la dignidad.
toilet.clog=Apretaste la palanca y la descarga gorgoteó, lo pensó y se rindió. Miras la taza en silencio. || La descarga no hizo nada. Lo intentaste otra vez, y otra. El inodoro ha elegido la violencia.
toilet.gross=Quien estuvo antes que tú dejó una sorpresa. A tu estómago no le hace gracia. || Miras dentro de la taza, te arrepientes y apartas la vista rapidísimo.
toilet.embarrassed=Estás casi seguro de que alguien lo oyó. Finges que fueron las tuberías. || El pestillo no estaba puesto. Nadie necesita hablar de eso.
toilet.fail=La descarga es débil y el inodoro hace un ruido grosero. Finges que no pasó nada. || El asiento está frío, no queda papel y el día empieza mal.
toilet.pass=Misión cumplida. Nada explotó.

cooking.fire_safe=La sartén hace pop como un petardo, das un grito y luego todo queda en silencio. Menos mal que fue solo un pequeño pop... || La estufa suelta un bang diminuto y se lo piensa mejor. Menos mal que fue solo un pequeño bang... || Un pop suave, una bocanada de nada y una cocina que huele a una barbacoa que nunca ocurrió.
cooking.explosion=El horno hace un ruido que ningún horno debería hacer. Luego uno más fuerte. La cena ahora es una escena del crimen. || Algo ahí dentro NO debía calentarse. La cocina responde con un estruendo. || Pulsas inicio, el horno lo piensa un momento y estalla como un fuego artificial.
cooking.explosion_safe=El horno suelta un solo bang pequeño y se queda callado. Decides llamarlo sazón. || Una explosioncita y un horno muy dramático. Nadie salió herido, solo ofendido. || El horno hace pop una vez, con ganas. Menos mal que fue solo un pequeño bum.
tv.fire=La tele sisea, truena y se prende fuego. El streaming nunca estuvo tan caliente. || Sale humo por detrás de la tele y de pronto todo arde. Demasiado para un control remoto. || Pulsas un botón y la tele responde con llamas. Las críticas están divididas.
tv.fire_safe=La tele hace un pop diminuto y se apaga. Menos mal que fue solo una chispita... || Algo hace bang detrás de la pantalla. Muy pequeño, muy dramático. La tele está muy avergonzada. || Un pop corto y luego silencio. Menos mal que no fue nada peor.
laundry.burnout=La máquina chilla, echa chispas y suelta una llamita humeante antes de morir. Se cancela el día de la colada. || Humo, chispas y una llama corta por detrás de la máquina. Era una buena lavadora. Era una lavadora vieja. || Algo por dentro se sobrecalienta y la máquina se apaga entre una nube de humo. La ropa tendrá que esperar.
gaming.pc_fire=Los ventiladores del PC gritan, sale una llama de la torre y todo se apaga. Tu partida guardada tuvo una buena vida. || Humo, una llama pequeña y un ordenador muerto. Quizá ya tocaba una mejora. || La tarjeta gráfica eligió la violencia: una llama y pantalla negra. Nadie te culpa. Todos te culpan.
kiss.fight={t} ya no aguanta más. Un empujón rápido, un grito fuerte y de pronto estás metido en una pelea. || Eso fue un paso de más. {t} se pone en guardia y se lanza contra ti a golpes. || {t} se lo toma muy a pecho y decide responder con los puños. Te lo buscaste.
