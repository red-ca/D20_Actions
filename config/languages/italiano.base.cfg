fitness.bonus=Qualcosa scatta. I pesi sembrano più leggeri e la tua postura è sospettosamente da professionista. || Trovi il ritmo e ti senti inarrestabile. Lo specchio della palestra annuisce soddisfatto.
fitness.crit_success=Ripetizione leggendaria! Da qualche parte uno shaker di proteine piange di orgoglio.
fitness.soft_fail=Serie dura, ma stringi i denti e la porti a casa. || La postura traballa e l'ego pure, ma la ripetizione è fatta.
fitness.crit_fail=Ti butti nel sollevamento e il tuo corpo presenta reclamo formale. La serie finisce prima di cominciare. || Dalla tua schiena esce un suono che nessuna schiena dovrebbe fare. Ripetizione annullata. || Vince il bilanciere. Vince sempre. Te ne vai strisciando con l'orgoglio al collo in una fascia.
fitness.heat=L'allenamento diventa una seduta di sauna. Ti sventoli, il sudore cola e la stanza inizia a girare. || Esageri con il caldo. Maglietta fradicia, faccia rossa e il corpo che chiede un ventilatore, un oceano e un pisolino. || Il colpo di calore bussa educatamente, poi sfonda la porta. Esci barcollando, grondante di sudore.
fitness.exhausted=Le gambe cedono all'ultima ripetizione. Crolli e fissi il soffitto a riflettere sulle tue scelte di vita. || Spingi oltre il limite e il limite risponde. Giù si va.
fitness.sore=Qualcosa nel tuo corpo presenta un reclamo che sentirai per due giorni. Domani sarà divertente. || Hai spinto troppo. I muscoli proclamano lo sciopero, con effetto immediato.
fitness.slip=Il piede scivola nel momento peggiore e la gravità vince la discussione. || Perdi l'equilibrio e giri su te stesso come un passo di danza pianificato male.
fitness.embarrassed=Qualcuno ha sicuramente visto. Fai finta che facesse parte dell'esercizio. || Sbagli il movimento così male che persino gli attrezzi guardano altrove.
fitness.sweat_cold=Salti l'asciugamano e il ventilatore della palestra ti prende in pieno. A sera tiri su col naso. Raffreddore meritato. || Sudore, aria condizionata e poco giudizio fanno un raffreddore. L'avevi detto tu. || Il tuo corpo decide che l'allenamento era un po' troppo e ti manda un raffreddore come recensione.
fitness.lift_drop=Sollevi {t} con tutto il tuo amore e la gravità se lo riprende. Atterraggio in piedi, più o meno. || Il sollevamento arriva a metà prima che le braccia presentino reclamo. {t} finisce a terra ridendo. || Fai volare {t} in aria, perdi la presa e finite entrambi a terra in un mucchio.
fitness.back_strain=Sollevi {t} e qualcosa nella schiena dice no. Tieni la posa per un secondo e te ne penti. || L'amore è potente, ma la tua zona lombare non è d'accordo. {t} ti rimette giù e fa una smorfia con te. || Il grande sollevamento finisce con un sonoro crac della colonna. {t} ti chiede se stai bene, tu rispondi di no.
fitness.show_off_fail=Provi a fare il forte e sollevi {t} come un eroe. Sembri una persona che trasloca un mobile. || Il gesto plateale cade a metà tra l'impressionante e l'esilarante. {t} applaude piano. || Mostri i muscoli prima del sollevamento. Va male. {t} guarda le tue braccia, poi te.
fitness.mine_strain=Dai un colpo di piccone con troppa sicurezza. La schiena presenta reclamo formale. || Vince la roccia. Ti restano una vescica e un sacco di polvere.
fitness.treadmill_stumble=Il tapis roulant continua. Tu, per un attimo, no. || Un lieve traballare diventa un inciampo molto pubblico.
fitness.fail=Le braccia smettono di collaborare a metà salita. Fai finta di volerti prendere una pausa. || Guardi i pesi e i pesi guardano te. Oggi no.
fitness.pass=Porti a termine la serie senza intoppi. || Forma solida, respiro regolare. Un giorno qualunque in ufficio.
kiss.bonus=Quello è stato speciale. {t} se lo ricorderà per un bel po'. || Scintille! {t} è raggiante e anche tu.
kiss.crit_success=Un bacio da libri di storia. {t} dimentica il proprio nome.
kiss.soft_fail=Il bacio è un po' goffo e un po' imbarazzante, ma {t} lascia correre.
kiss.slap=Ti avvicini per dare un bacio a {t}, ma {t} reagisce d'istinto con uno schiaffo!
kiss.runaway=Ti avvicini per un bacio e {t} scappa via come se avessi offerto un modulo delle tasse. || {t} guarda il bacio in arrivo e se la dà a gambe. Strategia audace, {a}.
kiss.embarrassed=Ti avvicini per un bacio. {t} arrossisce, studia le scarpe e vorrebbe sprofondare. || {t} si blocca, arrossisce fino alle orecchie e borbotta qualcosa sul tempo.
kiss.angry=A {t} il bacetto non è piaciuto. Il tuo nome finisce nel taccuino della rabbia, {a}. || Tu vai per il bacio e {t} va per la faccia arrabbiata. Scambio equo?
kiss.rejection={t} rifiuta il bacio con garbo ma con fermezza. Il silenzio pesa più del rifiuto. || {t} gira la testa appena in tempo. Liscio, {a}. Molto liscio.
kiss.sad={t} ti lancia uno sguardo addolorato e un lungo sospiro. Non così. || Il bacio manca il bersaglio e l'atmosfera pure. {t} guarda altrove.
kiss.knockout={t} perde le staffe e tira un pugno. Arriva a segno e finisci a terra come un sacco di panni sporchi. || Quella battuta è stata la goccia. {t} sferra un colpo e la stanza si inclina. Ti svegli a fissare il soffitto. || {t} avvampa e ti colpisce in pieno. La tua dignità lascia l'edificio prima che tu tocchi terra.
kiss.fight={t} ne ha abbastanza. Una spinta, una parola ad alta voce e all'improvviso siete in una rissa. || Era un passo di troppo. {t} si mette in guardia e ti si getta addosso a pugni stretti. || {t} la prende molto sul personale e risponde a suon di pugni. Chi la fa, l'aspetti.
kiss.police={t} ne ha avuto abbastanza e sta già chiamando. Ti sta arrivando una denuncia. || {t} ti fissa per un secondo e dice: «Chiamo la polizia.» Sembra proprio che dica sul serio. || È andata male. {t} presenta denuncia contro di te prima ancora che finisca di scusarti.
kiss.spark=C'è una scintilla che avete sentito entrambi. Qualcosa di caldo aleggia tra te e {t}. || Il momento lascia un bagliore. Ora tra te e {t} c'è un po' più di vicinanza. || Un fremito leggero, un sorriso sommesso. L'aria tra te e {t} resta calda.
kiss.knockout_death=Il pugno di {t} arriva a segno e crolli a terra... e non ti svegli più. Fine. || Un colpo di {t}. Cadi, la stanza si fa silenziosa e non ti rialzi. Partono i titoli di coda. || {t} sferra un solo pugno. È, purtroppo, l'ultima cosa che noti. Fine.
kiss.pass=Il bacio arriva morbido. {t} si scioglie un po'. || Un momento tenero. Dopo, {t} ti sorride.
chat.bonus=La conversazione scorre e basta. Tu e {t} perdete la cognizione del tempo nel modo migliore. || Una chiacchierata facile, una vera risata e la sensazione di poter dire qualsiasi cosa. Una bella. || {t} si apre un po' e anche tu. Viene facile.
chat.crit_success=Dici esattamente la cosa giusta al momento giusto. {t} sorride in un modo che ricorderai. || Una conversazione perfetta. Ogni frase colpisce nel segno e ogni pausa è calda. {t} non vuole smettere. || La conversazione raggiunge un livello più profondo senza che nessuno se ne accorga. {t} ti guarda come se l'avessi capito davvero.
chat.soft_fail=La chiacchierata arranca e finisce con educazione. Nessuno dei due dice quello che voleva. || Una conversazione piatta che non porta da nessuna parte. Ve ne andate un po' più leggeri e un po' più annoiati. || Va bene. Va solo bene. Annuite entrambi e passate oltre.
chat.crit_fail=Ogni frase esce storta. Alla fine {t} vorrebbe essere ovunque tranne che lì. || Dici qualcosa di davvero sfortunato. L'aria diventa solida e {t} fissa il muro. || Un disastro conversazionale. A {t} serve un minuto, e probabilmente uno spuntino.
chat.silence=Apri la bocca e non succede niente. {t} riempie il silenzio studiando il soffitto. || La conversazione si secca a metà. Tu e {t} vi fate un cenno come vecchi mobili. || Tra voi si apre un vuoto imbarazzante. Fate finta che sia un silenzio confortevole.
chat.wrong_topic=Scegli l'unico argomento che {t} detesta. Il sorriso di {t} si congela in qualcosa di educato e distante. || Tiri fuori l'argomento sbagliato nel momento sbagliato. {t} cambia discorso con la grazia di un tamponamento. || Chissà come, pesti un punto delicato. {t} dice «certo» con un tono che significa «no».
chat.overshare=Condividi troppo, e troppo in fretta. {t} ha la faccia di chi legge dei termini di servizio lunghissimi. || Le tue chiacchiere diventano una confessione. {t} ascolta, annuendo piano, e comincia a cercare le uscite. || Passi da «come stai» alla storia della tua vita in un solo respiro. A {t} serve un attimo.
chat.voice_cracks=La voce ti si incrina nel mezzo delle parole importanti. {t} resta gentile, ma ormai il momento è fragile. || L'avevi provato. Le prove non sono servite. La voce traballa e si arrende. || Le parole escono più piccole di come le sentivi in testa. {t} aspetta, con garbo, che tu riprovi.
chat.too_intense=Era troppo, e troppo in fretta. {t} fa mezzo passo indietro e sorride con molta cautela. || Lo dici con tutto il cuore. {t} lo sente con un filo di panico di troppo. || La promessa cade pesante. {t} ride nervosamente e cambia argomento.
chat.advice_backfires=Chiedi un consiglio, poi discuti ogni parola. {t} getta la spugna e annuisce. || Il consiglio è buono. Tu lo ignori a voce alta. {t} ha l'aria di chi ha già visto questo film. || {t} ti dà un consiglio sincero. Lo prendi male e il clima si raffredda.
chat.awkward_hello=Dici ciao e la voce sceglie un tono a caso. {t} risponde sullo stesso tono, per pietà. || Il saluto passa per tre versioni prima di atterrare. || «Ciao. Salve. Ehi.» Li hai fatti tutti e tre insieme.
chat.makeup_fails=Dici che ti dispiace. {t} sente «mi dispiace che tu la prenda così». Non è la stessa cosa. || Le scuse girano in tondo. {t} è ancora scosso e ora pure in confusione. || Provi a fare pace e in qualche modo aggiungi una seconda discussione.
chat.life_talk_drags=Il discorso profondo diventa sempre più profondo e pesante finché nessuno ricorda più la domanda iniziale. || Fai un po' di filosofia. {t} sbadiglia discretamente nella manica. || «Qual è il senso di tutto?» è un'apertura pesante. La conversazione non si riprende più.
chat.gossip_leaks=Il pettegolezzo che racconti è un po' troppo succoso. {t} se la prende per essere finito in mezzo. || Sussurrare si rivela meno discreto del previsto. Qualcuno ha sentito tutto. || Spifferi tutto e un po' finisce addosso a {t}.
chat.advice_ignored=Dai un saggio consiglio di coppia. {t} non ne ascolta una parola e si irrita un po'. || Il tuo consiglio è ottimo e del tutto non richiesto. {t} sospira. || Dici «fidati». {t} no.
chat.kindness_unnoticed=Fai una gentilezza e {t} non se ne accorge. Conta lo stesso, ti dici. || Un piccolo gesto gentile, ignorato con educazione. Ti viene un po' da ridere di te. || Era un gesto dolce. È stato accolto con una cortese alzata di spalle.
chat.flat_greeting=Il tuo ciao suona come un refuso. {t} fa finta educatamente di non aver sentito. || Il saluto esce rigido e con un secondo di ritardo. {t} fa un piccolo cenno imbarazzato. || Dici le parole giuste con la voce sbagliata.
chat.rumor_awkward=La voce si fa strana in fretta. Nessuno sa dove guardare. || Ascolti, annuisci e non dici niente, a voce altissima. || La chiacchierata parte calda e piano piano diventa tiepida.
chat.fire_silence=Siete seduti insieme accanto al fuoco e nessuno dei due trova qualcosa da dire. Lo scoppiettio parla per tutti. || Il silenzio si allunga. {t} fissa le fiamme e anche tu, un po' troppo a lungo. || Volevi condividere un momento tranquillo. È diventato semplicemente un momento tranquillo.
chat.lesson_flops=Spieghi le basi per la terza volta. Chi impara annuisce e non capisce niente. || Le tue doti da insegnante si rivelano più scarse delle tue abilità. Siete a pezzi, tutti e due. || La lezione prende una brutta piega e finisce con un imbarazzato «riproviamo domani».
chat.knockout={t} perde le staffe e tira un pugno. Arriva a segno e finisci a terra come un sacco di panni sporchi. || Quella battuta è stata la goccia. {t} sferra un colpo e la stanza si inclina. Ti svegli a fissare il soffitto. || {t} avvampa e ti colpisce in pieno. La tua dignità lascia l'edificio prima che tu tocchi terra.
chat.fight={t} ne ha abbastanza. Una spinta, una parola ad alta voce e all'improvviso siete in una rissa. || Era un passo di troppo. {t} si mette in guardia e ti si getta addosso a pugni stretti. || {t} la prende molto sul personale e risponde a suon di pugni. Chi la fa, l'aspetti.
chat.police={t} ne ha avuto abbastanza e sta già chiamando. Ti sta arrivando una denuncia. || {t} ti fissa per un secondo e dice: «Chiamo la polizia.» Sembra proprio che dica sul serio. || È andata male. {t} presenta denuncia contro di te prima ancora che finisca di scusarti.
chat.deep_bond=Per un momento tu e {t} siete esattamente sulla stessa lunghezza d'onda. Sembra un'amicizia che esiste da anni. || Le parole vengono facili e nulla viene trattenuto. {t} ti guarda come se foste una famiglia. || Una conversazione vera e profonda. Ne esci con un legame più forte e una sensazione calda che resta.
chat.closer=Quella chiacchierata ha accorciato le distanze. Lo senti ancora prima che {t} dica qualcosa. || Qualcosa cambia in meglio. Tu e {t} siete un po' più a vostro agio ora. || La conversazione diventa un vero momento. Tu e {t} ne uscite con un legame in più.
chat.knockout_death=Il pugno di {t} arriva a segno e crolli a terra... e non ti svegli più. Fine. || Un colpo di {t}. Cadi, la stanza si fa silenziosa e non ti rialzi. Partono i titoli di coda. || {t} sferra un solo pugno. È, purtroppo, l'ultima cosa che noti. Fine.
etiquette.bonus=Uno scambio fermo e cordiale. {t} ti guarda con un lampo di rispetto. || Maniere perfette e giusto il pizzico di sicurezza. L'atmosfera è rilassata e calda. || Fai sembrare tutto facile. {t} si rilassa e con {t} si rilassa tutta la sala.
etiquette.crit_success=Impeccabile. {t} sorride come se aveste appena chiuso un affare, e magari è così. || Fascino, tempismo e una stretta di mano perfetta. A {t} hai fatto chiaramente colpo e vuole che tu lo sappia. || Roba da professionisti. Quelli veri. {t} si segna di presentarti in giro.
etiquette.soft_fail=È rigido e un po' strano, ma tecnicamente succede. || Un sorriso forzato, un cenno rapido e un silenzio un po' strano. Non è il tuo momento migliore. || Né un disastro né un trionfo. Passi oltre in fretta.
etiquette.crit_fail=Tutto va storto nello stesso istante. {t} fa finta, con garbo, che non sia successo niente. || Riesci a essere sgarbato, maldestro e rumoroso in un unico gesto. Un'impresa rara. || Il momento crolla come un soufflé venuto male. {t} ne parlerà tra tre anni circa.
etiquette.sweaty_palm=Il palmo è viscido. {t} lo stringe, poi si asciuga di nascosto la mano sui pantaloni come se nessuno avesse visto. || La stretta di mano è una cosa molle e umidiccia. {t} sorride con educazione e conta i secondi. || Stringi troppo forte, poi troppo piano, poi sudi ovunque. {t} si ricorderà questa stretta di mano.
etiquette.card_drop=Offri il biglietto da visita e svolazza in una pozza di niente. {t} te lo raccoglie, piegato. || Il biglietto ti scivola dalle dita e atterra a faccia in giù. {t} legge il retro per gentilezza. || Porgi un biglietto con un cerchio di caffè sopra. {t} dice grazie come si dice dal dentista.
etiquette.toast_spill=Alzi il bicchiere con un po' troppo entusiasmo. Il drink finisce su {t} e il brindisi non va da nessuna parte. || Cin. Splash. {t} guarda la camicia, poi te, poi di nuovo la camicia. || Il brindisi è perfetto finché il bicchiere non si inclina. Metà del drink finisce sul tavolo, l'altra metà sulla dignità.
etiquette.bribe_caught=Fai scivolare la busta. {t} conta le banconote ad alta voce e la sala sente. ${m} sono andati e con loro la tua reputazione. || Qualcuno vede lo scambio. Il «regalo» ti costa ${m} e una spiegazione lunghissima. || La mazzetta doveva essere discreta. {t} annuncia la cifra a tutta la sala e ${m} spariscono dal tuo conto.
etiquette.errand_refused={t} guarda la lista, guarda te e dice: «Non sono un servizio di consegne.» || Chiedi una commissione. {t} sospira a fondo, poi riesce a offendersi e a stancarsi insieme. || La richiesta cade male. {t} incrocia le braccia. La commissione resta da fare.
etiquette.pitch_flop=Parti con paroloni da business e finisci con niente. {t} annuisce come si annuisce davanti allo spam. || Il discorso suona intelligente nella tua testa. A voce alta, {t} ti chiede se stai bene. || Dici «sinergia» due volte e «leva» una. {t} controlla il telefono di nascosto.
etiquette.stiff=Sembri un robot che legge un manuale aziendale. {t} ti fissa, indeciso se ridere. || Il gesto è educato e rigido come un asse. Il momento passa senza che nessuno senta niente. || Provi a essere professionale e finisci in «statua imbarazzante». {t} cerca di salvare la situazione e non ci riesce.
etiquette.pitch_ignored=Presenti la tua idea con energia. {t} annuisce e non scrive niente. || «Interessante», dice {t}, con il tono che si usa per dire «no». || Porgi i tuoi obiettivi e {t} ti restituisce un sorriso educato.
etiquette.info_leaked=L'informazione che condividi si rivela sbagliata e i danni sono tuoi. || Condividi un consiglio che doveva restare privato. {t} è su tutte le furie e ti costa caro. || Sfugge un dettaglio riservato. Costoso.
etiquette.forced_cheer=Dici di essere felice della crescita. Sembra il video di un ostaggio. || L'allegria è così forzata che {t} ti chiede se va tutto bene. || Il tuo entusiasmo è provato e riprovato, e si vede.
etiquette.formal_flub=Saluti {t} con grande formalità e il titolo sbagliato. || Troppo formale, poi troppo disinvolto, poi tutte e due le cose insieme. {t} si perde. || Il saluto cortese inciampa nelle sue stesse buone maniere.
etiquette.nosy_question=Fai una domanda un po' troppo curiosa. {t} risponde asciutto. || La domanda resta in aria un attimo di troppo. {t} guarda altrove. || Volevi due chiacchiere. Hai ricevuto uno sguardo.
etiquette.too_personal=Quella domanda era un passo troppo in là. A {t} non è piaciuta per niente. || Chiedi una cosa molto privata con una voce molto pubblica. {t} si irrigidisce. || {t} risponde con un tono che ricorderai. E lo ricorderanno tutti gli altri.
etiquette.coin_refused=Chiedi delle monete e ricevi un no gentile e uno sguardo lunghissimo. || Elemosinare monete del resort non va bene. Te ne vai con l'ego più leggero. || La risposta è un no molto gentile e molto fermo.
etiquette.gift_flop=Consegni il regalo. {t} sorride e capisci che è quello sbagliato. || Il regalo è un po'... strano. {t} ti ringrazia con grande sforzo. || {t} apre il pacchetto e cerca con tutte le forze di sembrare felice.
etiquette.knockout={t} perde le staffe e tira un pugno. Arriva a segno e finisci a terra come un sacco di panni sporchi. || Quella battuta è stata la goccia. {t} sferra un colpo e la stanza si inclina. Ti svegli a fissare il soffitto. || {t} avvampa e ti colpisce in pieno. La tua dignità lascia l'edificio prima che tu tocchi terra.
etiquette.fight={t} ne ha abbastanza. Una spinta, una parola ad alta voce e all'improvviso siete in una rissa. || Era un passo di troppo. {t} si mette in guardia e ti si getta addosso a pugni stretti. || {t} la prende molto sul personale e risponde a suon di pugni. Chi la fa, l'aspetti.
etiquette.police={t} ne ha avuto abbastanza e sta già chiamando. Ti sta arrivando una denuncia. || {t} ti fissa per un secondo e dice: «Chiamo la polizia.» Sembra proprio che dica sul serio. || È andata male. {t} presenta denuncia contro di te prima ancora che finisca di scusarti.
etiquette.deal={t} conosce uno che conosce uno e un nuovo contatto manda ${m} per «un lavoretto». Il networking funziona. || La buona impressione diventa un favore, e il favore diventa ${m}. Così nascono gli affari. || {t} garantisce per te con un cliente. Poco dopo ${m} arrivano sul tuo conto.
etiquette.insider_tip=L'informazione che hai condiviso si rivela preziosa. {t} ti allunga un ringraziamento. || Una dritta diventa un affare. Te ne vai con qualche soldo in più.
etiquette.gift_hit=A {t} il regalo piace da matti. È esattamente ciò che voleva e si vede. || Il regalo centra il bersaglio. {t} ti abbraccia un po' più a lungo del solito.
etiquette.knockout_death=Il pugno di {t} arriva a segno e crolli a terra... e non ti svegli più. Fine. || Un colpo di {t}. Cadi, la stanza si fa silenziosa e non ti rialzi. Partono i titoli di coda. || {t} sferra un solo pugno. È, purtroppo, l'ultima cosa che noti. Fine.
humor.bonus=La battuta fa centro. {t} ride così tanto che serve una sedia. || Il tuo tempismo è ottimo e la risata è vera. Oggi sei in forma. || Una risata pulita e facile. {t} si asciuga una lacrima e ne chiede un'altra.
humor.crit_success=Genio comico. {t} piange dal ridere, ti implora di smettere e poi ne vuole ancora. || Una battuta perfetta al momento perfetto. Tutta la sala applaudirebbe, se potesse. || Fai ridere {t} tanto da dimenticare di respirare. Un numero leggendario.
humor.soft_fail=Non è il tuo pezzo migliore, ma {t} sorride per gentilezza. || Una risata fiacca e una battuta finale ancora più fiacca. Passi oltre in fretta. || Una risatina, un po' di pietà. La battuta è già dimenticata.
humor.crit_fail=La battuta muore rumorosamente. {t} non ha mai fatto così tanto silenzio. || Una battuta così brutta da creare un nuovo tipo di silenzio. {t} fissa il vuoto. || Fai un tale flop che la sala sembra gelata. A {t} serve un minuto.
humor.flop=Racconti la battuta con totale sicurezza. {t} ti fissa, sbattendo le palpebre, in attesa del resto. || La battuta finale atterra con un tonfo morbido. {t} ride con mezzo secondo di ritardo. || Ridi alla tua stessa battuta. In solitaria. {t} le concede un «eh» educato.
humor.unfunny=La battuta è talmente poco divertente che torna indietro e diventa confusa. {t} annuisce lentamente. || La racconti con un tempismo perfetto e la battuta resta brutta. {t} sorride gentilmente. || Un gemito, un sospiro e un'occhiata al cielo. {t} vince il premio per il pubblico più educato.
humor.slapstick_hurt=Ti butti nella caduta comica con un po' troppa convinzione. Il pavimento, come sempre, vince. {t} smette di ridere e inizia a preoccuparsi. || La gag va storta nel modo più doloroso. {t} fa una smorfia, poi ride, poi fa di nuovo la smorfia. || Inciampi nel tuo stesso numero. Fa male e il pubblico da una persona non sa se applaudire.
humor.money_gun=Spari con la pistola spara-soldi e le banconote volano ovunque. Erano vere. ${m} se ne vanno e {t} ride senza ritegno. || La pistola era carica di contanti veri. ${m} volano fuori dalla finestra e {t} non riesce a respirare dal ridere. || Ops. La pistola non era per soldi finti. Spruzzi ${m} in aria e {t} giura di non aver visto niente.
humor.dirty_offended=La battuta sporca cade male. {t} ti guarda soltanto, con profonda delusione, e non dice niente. || Racconti una battuta che non è per questo pubblico. {t} non ride. {t} fissa. || La battuta cade come un pallone di piombo. {t} non si diverte, e lo sai.
humor.compliment_creepy=Il complimento esce inquietante e {t} fa un piccolo passo indietro. Ti senti dirlo di nuovo. || Dici una cosa carina e suona come un'altra. {t} fissa il pavimento. || Il complimento atterra strano. {t} ti ringrazia con la voce di un ostaggio.
humor.memes_cringe=Spieghi un meme morto tre anni fa. {t} annuisce con educazione e non dice niente. || Il meme richiede una lezione intera per avere senso, e comunque non ce l'ha. {t} ti guarda con gentile pietà. || Mostri a {t} un meme di tendenza. Non è di tendenza. Non lo è mai stato.
humor.high_five_miss=Parti per il cinque e schiaffeggi l'aria. {t} ti lascia a mezz'aria con una faccia molto gentile. || Il cinque atterra a metà tra un applauso e uno schiaffo. {t} scuote la mano e sorride lo stesso. || Manchi la mano di un centimetro e il braccio continua. {t} finge con garbo che fosse uno stiramento.
humor.powerup_fizzle=Tendi il pugno per un potenziamento e non scatta nessuna scintilla. {t} lo tocca comunque, con imbarazzo. || Il potenziamento dell'amicizia si smorza con un piccolo pop. {t} batte le mani una volta, per lealtà. || Urli il potenziamento e l'energia non va da nessuna parte. {t} alza il pollice per gentilezza.
humor.flex_fail=Mostri i muscoli e dalla spalla esce un suono molto sgradito. {t} fa una smorfia. || La posa era feroce. La posa è anche durata un secondo di troppo e qualcosa si è contratto. || Fai sfoggio dei muscoli. {t} resta indifferente e un muscolo protesta.
humor.knockout={t} perde le staffe e tira un pugno. Arriva a segno e finisci a terra come un sacco di panni sporchi. || Quella battuta è stata la goccia. {t} sferra un colpo e la stanza si inclina. Ti svegli a fissare il soffitto. || {t} avvampa e ti colpisce in pieno. La tua dignità lascia l'edificio prima che tu tocchi terra.
humor.fight={t} ne ha abbastanza. Una spinta, una parola ad alta voce e all'improvviso siete in una rissa. || Era un passo di troppo. {t} si mette in guardia e ti si getta addosso a pugni stretti. || {t} la prende molto sul personale e risponde a suon di pugni. Chi la fa, l'aspetti.
humor.police={t} ne ha avuto abbastanza e sta già chiamando. Ti sta arrivando una denuncia. || {t} ti fissa per un secondo e dice: «Chiamo la polizia.» Sembra proprio che dica sul serio. || È andata male. {t} presenta denuncia contro di te prima ancora che finisca di scusarti.
humor.money_rain=La pistola spara-soldi vi inonda di banconote e tu ne afferri ${m} prima che il vento si porti via il resto. {t} esulta. || I contanti piovono in un arco perfetto. {t} ride mentre ti infili ${m} in tasca. || La pistola spara una raffica leggendaria. Te ne vai con ${m} in più e {t} sta ancora ridendo.
humor.inside_joke=Quella battuta diventa una battuta interna tra te e {t}. Tornerà fuori per settimane. || Tu e {t} ridete nello stesso istante ed è bellissimo. Ora c'è un po' più di vicinanza. || Un momento sciocco diventa un piccolo legame. Tu e {t} lo citerete per sempre.
humor.knockout_death=Il pugno di {t} arriva a segno e crolli a terra... e non ti svegli più. Fine. || Un colpo di {t}. Cadi, la stanza si fa silenziosa e non ti rialzi. Partono i titoli di coda. || {t} sferra un solo pugno. È, purtroppo, l'ultima cosa che noti. Fine.
family.bonus=Un piccolo momento caldo in famiglia, con {k}. Vi allontanate entrambi un po' più leggeri. || {t} sorride come sa fare solo la famiglia. Non serve spiegarlo. || Facile, gentile e un po' buffo. Esattamente come doveva essere.
family.crit_success=Tutto va a segno. Tu e {t} finite a ridere come quando eravate piccoli, e sa di casa. || Un raro momento perfetto in famiglia. Nessuno lo dice, tutti lo sentono. || Il tipo di conversazione di famiglia che si ricorda per anni. {t} resta un po' più a lungo del solito.
family.soft_fail=Carino, tutto sommato. Le cose di famiglia sono così. || Parli, {t} annuisce e la giornata va avanti. || Niente di speciale. Niente di sbagliato nemmeno.
family.crit_fail=Dici esattamente la cosa sbagliata a esattamente la persona sbagliata, per giunta {k}, e tutta la stanza sente. || Diventa una di quelle scene di famiglia che tutti tireranno fuori a cena per anni. || Un commentino diventa un commentone. {t} se ne va con uno sguardo che ricorderai.
family.awkward_pause=Scende un silenzio che solo {k} sa rendere così rumoroso. || Cercate un argomento nello stesso momento e nessuno lo dice. || La conversazione si blocca e l'orologio diventa all'improvviso molto interessante.
family.old_argument=In qualche modo siete di nuovo nella stessa discussione di anni fa. Stesse battute, stesse uscite di scena. || {t} tira fuori quella cosa di quella volta. Vorresti che non l'avesse fatto. || Pesti un vecchio tasto dolente e scopri che non è mai guarito.
family.rusty_visit=È passato un po' di tempo e si vede. Siete famiglia, ma anche un po' estranei. || Dite entrambi le parole giuste in un ordine leggermente sbagliato. || Non vivere insieme significa prima aggiornarsi. Non vai mai oltre gli aggiornamenti.
family.house_rules=Vivere insieme significa che i piatti saltano sempre fuori. Saltano fuori adesso. || Qualcuno ha lasciato qualcosa per terra. Colpa di {k}, ovviamente. || Stessa casa, due idee molto diverse di ordine.
family.spouse_bickers=Il matrimonio vuol dire fare la stessa piccola discussione in modi nuovi. Oggi è un modo nuovo. || {t} ti lancia l'occhiata che ha solo un coniuge, cioè sei già nei guai. || Un piccolo disaccordo per niente in particolare, che è il peggiore.
family.plan_clash=Progettate il futuro insieme e, per un momento, sembrano due futuri diversi. || {t} vuole una cosa, tu un'altra. Il compromesso è il silenzio. || I grandi piani incontrano le piccole realtà. Stavolta nessuno dei due cede.
family.lecture_flops=La tua predica cade più o meno come un mattone. {t} annuisce come fanno i ragazzini quando hanno smesso di ascoltare. || Spieghi una cosa importante. {t} sente «bla bla» e un po' di orgoglio. || Nella tua testa suonava più saggio.
family.chide_backfires=Rimproveri e ti si ritorce contro. {t} ti guarda con uno sguardo che dice «anche tu». || La ramanzina diventa un «tu non ascolti mai» in lacrime. Non vince nessuno. || Alzi la voce e vorresti non averlo fatto.
family.eye_roll=Un genitore inizia una frase e sai già come finisce. Vede l'occhio al cielo. || Il consiglio è buono. Il problema è riceverlo. || Ascolti con grande sforzo. Si vede.
family.generation_gap=Il divario generazionale si apre proprio tra voi. Vi salutate da una sponda all'altra. || Certe cose non si possono spiegare a un nonno. Questa è una di quelle. || Tu e {t} parlate la stessa lingua, ma non lo stesso decennio.
family.grandchild_bored=La storia dei vecchi tempi era ottima. Il nipote non è arrivato alla fine. || Il nipote sta già guardando uno schermo. I vecchi tempi dovranno aspettare. || Offri saggezza. Ricevi un «mm-hm» educato.
family.sibling_spat=Logica tra fratelli: hai cominciato tu, {t} ha finito e rivendicate entrambi la vittoria. || Un commento di troppo e hai di nuovo dieci anni, a litigare per un divano. || Il classico. Una battuta per prendersi in giro va un passo troppo in là.
family.wrong_mood=Tiri fuori il sentimento sbagliato nel momento sbagliato. {t} fa un passo indietro. || L'emozione era vera. Il tempismo no. || Non ogni sentimento va condiviso subito. Questo era uno di quelli.
family.allowance_gone=Consegni la paghetta e ricevi un grazie cortissimo, e niente resto. || La paghetta sparisce più in fretta dello scontrino. Non saprai mai dove. || I soldi passano di mano e segue una predica. Hai pagato per entrambe.
family.apology_stumbles=Le scuse escono nell'ordine sbagliato. «Scusa» arriva per ultimo. || Provi a sistemare le cose e le parole si inciampano a vicenda. || Le scuse sono sincere. La consegna è un disastro.
family.hug_too_tight=L'abbraccio dura un po' troppo e la stretta è un po' troppo forte. {t} si arrende. || Abbracci {k} e qualcosa scrocchia. Forse la schiena. || Un abbraccio entusiasta, un minuscolo crac e una risata imbarazzata.
family.kid_not_listening=Il piccolo ascolta tutto tranne te. || Lo dici tre volte. Alla quarta passa finalmente il messaggio, oppure il bambino se ne va. || Ci sai fare, in quello che fai. Il bambino ci sa fare a ignorarlo.
family.family_warmth=La vicinanza in famiglia è silenziosa. Questo è uno di quei momenti e lo senti. || Qualcosa di piccolo diventa qualcosa di caldo con {t}.
family.family_bond=Scatta tutto. Tu e {t} sembrate una vera famiglia, non solo parenti. || Un momento che ricorderete entrambi. Il legame cresce e con lui il calore.
family.fail=Comincia bene e va alla deriva verso un posto che nessuno dei due aveva previsto.
art.bonus=Il dipinto prende forma bene. Poche pennellate audaci hanno fatto tutto il lavoro. || Bei colori, bella composizione. Qualcuno lo appenderebbe. || Finisci con la vernice sulle mani e un piccolo sorriso tranquillo.
art.crit_success=Il pennello si muove da solo. Quando fai un passo indietro, è la cosa più bella che tu abbia mai fatto. || Colori, luce, un pizzico di magia. Lo firmi con mano ferma. || Smette di essere un dipinto e diventa una sensazione. Potresti guardarlo tutto il giorno.
art.soft_fail=Non è il tuo lavoro migliore, ma è tuo. || I colori sono un po' fuori e la composizione un po' timida. || Va bene, come va bene una prima bozza.
art.crit_fail=Il dipinto diventa una grandissima pozza marrone di rimpianti. || Tutto ciò che provi lo peggiora. A un certo punto smetti e basta. || Il risultato sembra un errore con delle opinioni.
art.uninspired=Fissi la tela. La tela vince la gara di sguardi. || La musa è in pausa e non ha lasciato l'indirizzo. || Non viene niente. Non un'idea, non una linea, non un colore.
art.muddy_colors=Tutti i colori si fondono nella stessa tonalità di marrone. Un marrone molto coerente. || Ogni miscela diventa fango. Miri al tramonto e finisci in una palude. || Hai aggiunto un colore in più e tutto è diventato grigio.
art.paint_spill=La vaschetta si ribalta e uno schizzo finisce esattamente dove non volevi. Vernice sui vestiti, sulle scarpe, su di te. || Fai un passo indietro per ammirare l'opera e ci metti il piede dentro, nella vernice. || Una grossa ondata di vernice raggiunge prima la tua maglietta. Il dipinto sta bene. Tu no.
art.ruined_canvas=Una pennellata di troppo e l'intera tela è rovinata. Dici una parola che non sta nei libri d'arte. || La tela si strappa, la vernice cola e il lavoro di un'ora è perso. || Cerchi di sistemare un angolo e ne rompi altri tre.
art.mural_drips=La vernice sul muro cola in lunghe righe tristi, e un po' su di te. || Miri al muro e il muro divide con te. || Il murale esce un po' sciolto e tu esci un po' dipinto.
art.caught_tagging=Un vicino vede la tua opera. Segue una multa per graffiti abusivi. L'arte ha un prezzo. || Un passante la chiama vandalismo. La multa la chiama ${m}. || Il muro non era tuo da dipingere. Il comune manda il conto: ${m}.
art.art_confusing=La guardi a lungo. Lei ti guarda e non dice niente di utile. || Tutti dicono che è profonda. Tu vedi una banana e un lungo silenzio. || Annuisci pensieroso come si fa nelle gallerie, senza capire niente.
art.painting_sale=Un passante si innamora del tuo dipinto e lo paga ${m} sul posto. || Un collezionista sente parlare della tua opera e manda ${m} e un messaggio entusiasta. || Il tuo pezzo si vende per ${m}. Il tuo primo vero fan è uno sconosciuto.
art.art_praise=Un amico vede il dipinto e ti allunga ${m} «per il prossimo». || Qualcuno ne compra una piccola stampa per ${m}. Ufficialmente, è un mestiere.
art.fail=Non è venuto come l'avevi immaginato.
art.pass=Un lavoro solido.
spa.bonus=Caldo, tranquillo ed esattamente ciò che ti serviva. Esci con la sensazione di essere un'altra persona. || Una gran bella seduta. Muscoli che avevi dimenticato di avere dicono grazie. || Tutto il tuo corpo sospira, e anche tu.
spa.crit_success=Ogni nodo si scioglie in un colpo. Esci fluttuando, senza ossa, in pace e con circa tre centimetri in più. || Pura beatitudine. Il mondo rallenta, le spalle si abbassano e dimentichi cosa fosse lo stress. || Un trattamento perfetto. Potresti restare in questo preciso stato per una settimana.
spa.soft_fail=Va bene. Abbastanza rilassante, anche se non magico. || Piacevole, ma la testa è altrove. || Un trattamento decente. Ne hai fatti di migliori.
spa.crit_fail=Va tutto storto nel modo in cui può andare solo in una giornata alla spa. Esci con più tensione di quando sei entrato. || Quello che doveva essere rilassante diventa una piccola odissea. Il tuo povero corpo non capisce cosa l'abbia colpito. || Paghi per il relax e ricevi una storia che racconterai per anni.
spa.restless=Stai lì in orizzontale, ma la mente si rifiuta di spegnersi. Ogni pensiero è una lista di cose da fare. || Rilassarsi si rivela un lavoro duro. Oggi non è il tuo forte. || Il trattamento va bene. Il problema sei tu.
spa.tense_knot=Trovano un nodo che non sapevi di avere. Vedi le stelle e le stelle dicono ahi. || La tensione si nascondeva nelle spalle e reagisce. Esci con i dolori invece che con la pace. || Un pollice molto deciso trova esattamente il punto sbagliato e ci resta.
spa.too_hard=La pressione è decisamente troppa. Sorridi con educazione e valuti in silenzio una nuova vita. || Avevano detto massaggio profondo. Non avevano detto «fino all'osso». Hai male per ore. || Fa male in un modo che dovrebbe farti bene, e non ti convince.
spa.ticklish=I piedi soffrono il solletico molto più di quanto pensassi. Ridi, ti dimeni e quasi lanci i pesci fuori dall'acqua. || Il solletico è troppo. Ridacchi finché non è più rilassante per niente. || I pesci dottore sono molto entusiasti dei tuoi alluci. Nessuno l'ha detto agli alluci.
spa.fell_asleep=Ti addormenti durante il massaggio e ti svegli con una pozza di bava e zero dignità. || Un forte russare ti sveglia. La stanza è molto silenziosa. Hanno sentito tutti. || Ti assopisci, ti svegli di soprassalto e fai finta di aver solo riposato gli occhi.
spa.salt_sting=Il sale trova un graffietto che non sapevi di avere. Mantieni una faccia calma. A malapena. || Una sorpresa molto salata. Dici «mmm» e intendi «ahi». || Il bagno di sale punge più di quanto lenisca.
spa.aroma_allergy=Gli oli sono deliziosi, ma il tuo naso ha altre opinioni. Gli starnuti partono e non si fermano. || Rose, erbe e un'allergia improvvisissima. Esci con il naso rosso e un fazzoletto. || Una nuvola di profumo e uno starnuto ancora più grosso. Etciù.
spa.sauna_dizzy=Il caldo ti arriva alla testa. La stanza gira, le panche ondeggiano ed esci color aragosta. || Troppo caldo, troppo a lungo. Esci con le gambe di gelatina. || Ti ripeti che stai bene. La sauna non è d'accordo.
spa.sauna_overheat=Tiri troppo la corda nella sauna e la sauna vince. Il mondo diventa bianco e traballante e ti trascini fuori grondante. || Sudore, macchie davanti agli occhi e la netta sensazione che sia stato un errore. Il colpo di calore bussa educatamente, poi sfonda la porta. || Il caldo ha smesso di essere rilassante ed è diventato una minaccia. Arrivi a malapena alla porta.
spa.pushy_staff=Il terapista diventa chiacchierone esattamente nel momento sbagliato. Sorridi, e non ti rilassi. || Un professionista molto entusiasta parla per tutto il tempo. Il relax è difficile da trovare. || Il massaggio va bene. Il problema è il commento.
spa.fail=Non riesci proprio a rilassarti.
spa.pass=Un po' di sano relax.
mood_spouse.bonus=Uno sguardo, un sorriso, un «vieni qui» sussurrato. Il resto lo fa l'atmosfera. || {t} ride piano e ti attira a sé. Perfetto. || Tutto ciò che pesava un minuto fa è sparito. Qualcosa di caldo ha preso il suo posto.
mood_spouse.crit_success=L'atmosfera è perfetta prima ancora che qualcuno parli. Tu e {t} vi sciogliete l'uno nell'altro e il mondo intero si fa più quieto, più morbido, più caldo. || Tutto è giusto: la luce, il momento, la persona. Vi sentite di nuovo cotti come ai primi tempi. || Sembra la prima volta e la centesima, tutte insieme. Niente fa male, niente preoccupa, niente conta se non {t}.
mood_spouse.soft_fail=Il momento è bello, anche se un po' timido. Ci arrivate alla fine, tutti e due. || Un po' goffo, per lo più dolce. Lasci correre. || Non è proprio la scena da film, ma funziona.
mood_spouse.crit_fail=Provi a creare un po' di intimità, ma i piedi freddi hanno rovinato l'atmosfera. || Ti avvicini, inciampi in un cuscino e tutta la serata va per traverso. {t} ride e sospira allo stesso tempo. || Il grande momento romantico viene interrotto da uno stomaco molto rumoroso, e segue un triste silenzietto.
mood_spouse.cold_feet=Hai provato a creare un po' di intimità, ma i piedi freddi hanno rovinato l'atmosfera. || I tuoi piedi gelati toccano la gamba di {t}. Un urletto, un salto e l'atmosfera è andata. || Il romanticismo finisce nell'istante in cui le dita fredde incontrano un polpaccio caldo.
mood_spouse.cold_hands=Le mani sono gelate e {t} te lo fa sapere con voce acutissima. || Una mano fredda nel posto sbagliato al momento sbagliato. L'atmosfera lascia la stanza. || Tu lo fai con dolcezza. Le tue dita lo fanno con il ghiaccio.
mood_spouse.phone_buzzes=Un telefono vibra nel momento peggiore. Nessuno dei due riesce a non averlo sentito. || Una notifica. Poi un'altra. L'atmosfera ha lasciato la chat. || Qualcuno ha dimenticato di silenziare il telefono. Era di tutti e due.
mood_spouse.pet_interrupts=Una zampa, un miagolio e un tonfo. L'animaletto si è unito alla serata. || Il gatto salta sul letto esattamente al momento sbagliato. L'atmosfera non sopravvive. || Un grosso pubblico peloso osserva. Nessuno riesce a concentrarsi.
mood_spouse.giggle_fit=Provi a restare serio, {t} scoppia a ridacchiare e ora nessuno dei due riesce a smettere. Dolce, ma non proprio bollente. || La prima risata era uno sbuffo. La seconda ha chiuso l'atmosfera. Piangete entrambi dal ridere. || È partito romantico ed è finito in una crisi di risate. Resta un bel momento, solo diverso.
mood_spouse.fail=Provi a creare l'atmosfera. L'atmosfera ha altri piani.
mood_spouse.pass=L'atmosfera c'è. Nessuno ha bisogno di dire niente.
mood_lover.bonus=L'amore è un'avventura e ti stai godendo l'esperienza! || Una piccola scintilla emozionante tra te e {t}. Vi sentite più leggeri entrambi. || Il momento è dolce, un po' audace e molto divertente.
mood_lover.crit_success=L'amore è un'avventura e ti stai godendo ogni minuto. Anche {t} lo sente. || Tutto scatta. Uno sguardo, un tocco, un sorriso che dice tutto. || Non lo pianifichi, succede e basta. Ed è meraviglioso.
mood_lover.soft_fail=È un po' rigido, ma {t} lascia perdere. || Non proprio fluido, ma abbastanza dolce. || Un po' goffo. {t} sorride lo stesso.
mood_lover.crit_fail=Leggi il momento in modo completamente sbagliato. {t} ti guarda come se ti fosse spuntata una seconda testa. || L'atmosfera passa da zero a disastro. {t} ha bisogno di uscire dalla stanza. || La grande mossa cade nel vuoto nel modo più imbarazzante possibile.
mood_lover.slap=Ti avvicini per creare l'atmosfera, ma {t} la prende come un attacco e ti dà uno schiaffo! || Era un po' troppo audace. {t} ti molla uno schiaffo e il suono viaggia.
mood_lover.runaway={t} vede cosa sta per succedere, va nel panico e fugge dalla stanza. || Fai la tua mossa. Anche {t} ne fa una: verso la porta.
mood_lover.embarrassed={t} va in fiamme e non riesce a guardarti. Nemmeno tu. || Il momento diventa troppo. {t} si nasconde dietro le mani.
mood_lover.angry=A {t} non è piaciuto ciò che hai tentato. L'occhiataccia dice tutto. || Hai sbagliato i calcoli e {t} si assicura che tu lo sappia.
mood_lover.rejection={t} si ritrae. Un «no» educato e fermo resta sospeso nell'aria. || Non stasera. Non così. {t} fa un passo indietro.
mood_lover.sad={t} ci rimane male e lo senti anche tu. Il silenzio è pesante. || L'atmosfera muore in modo molto triste. {t} sospira e guarda altrove.
mood_lover.fight={t} è su tutte le furie e la discussione diventa una vera rissa. || Quella che era un'atmosfera è diventata un battibecco urlato e una spinta.
mood_lover.fail=Provi a creare l'atmosfera e {t} non è ancora in sintonia.
mood_lover.pass=Buona chimica.
romance.bonus={t} ride al momento giusto e si avvicina più di prima. Qualcosa sta iniziando. || Un bel momento. Tu e {t} vi guardate negli occhi un attimo di troppo, e a nessuno dei due dispiace. || Farfalle nello stomaco, reciproche. Te ne vai con una sensazione calda e frizzante.
romance.crit_success=Le parole escono esattamente giuste. {t} ti guarda come se avessi appeso la luna, poi chiede piano se domani hai un buco in agenda. || Tutto si allinea: il tempismo, il sorriso, il silenzio al posto giusto. {t} è un po' senza fiato e tu pure. || La tua parlantina non è mai stata così liscia. {t} arrossisce e la stanza sembra dieci gradi più calda.
romance.soft_fail=È carino, ma non scatta mai davvero la scintilla. Fate finta entrambi che sia scattata. || {t} sorride con educazione. È il tipo di sorriso che si fa a un cameriere. || Né un disastro né un momento. L'aria resta esattamente alla stessa temperatura.
romance.crit_fail=Dici una cosa così sbagliata che {t} controlla se stai bene. Non stai bene. || Il momento crolla al rallentatore. {t} ti fissa, tu fissi il pavimento, e il pavimento non aiuta. || Apri la bocca, ti cade fuori una frase ed è la peggiore disponibile. {t} se la ricorderà per anni.
romance.tongue_tied=L'avevi provato sotto la doccia. A voce alta sono solo suoni. || Il cervello esce dalla chat. Riesci a dire solo «quindi... ecco.» || {t} aspetta. Tu aspetti. Nessuno dice niente di romantico.
romance.turned_down={t} dice «credo che siamo meglio come amici» con voce gentilissima. Fa male lo stesso. || Un «no, grazie» educato. L'educazione è la parte peggiore. || A {t} dispiace davvero, il che in qualche modo peggiora tutto. Torni a casa con il cuore pesante.
romance.too_forward=Passi da zero a «allora, figli?» in una frase. {t} fa un passo indietro. || Era tanto, e di corsa. A {t} serve un minuto e un bicchiere d'acqua. || Hai saltato circa nove passaggi. {t} li ha notati tutti.
romance.cold_feet=Chiedi del matrimonio e {t} trova all'improvviso il soffitto molto interessante. || «Quindi, dove pensi che stia andando questa cosa?» cade come un mattone. L'atmosfera se ne va in silenzio. || {t} cambia argomento così in fretta che lascia i segni della frenata.
romance.sweaty_hands=Il tuo palmo è una palude. {t} resiste con coraggio e poi si asciuga la mano sui pantaloni. || Afferri la mano di {t}. È umida, tremante e dispiaciuta. || La stretta di mano dura esattamente il tempo che serve a entrambi per accorgersi di quanto siete appiccicosi.
romance.hand_yanked={t} ritira la mano come se fosse una padella rovente. Non è sottile. || Tendi la mano e {t} infila la sua in tasca. Il messaggio è chiaro. || La mano viene ritirata, con molta educazione e molta velocità. Ahi.
romance.slap=Cerchi la mano di {t}, ma {t} la prende nel modo sbagliato e ti molla uno schiaffo! || Troppo audace, davvero. {t} reagisce con uno schiaffo e il suono si sente lontano.
romance.cold_greeting=Il tuo saluto dolce cade come un calzino bagnato. {t} annuisce e continua a camminare. || Saluti {t} con tutto il tuo fascino. {t} risponde con un educato «hm». || Il saluto era un battito d'ali speranzoso. È caduto piatto sul pavimento.
romance.confession_declined=Chiedi, con il cuore in gola. {t} dice con dolcezza di no e il cuore in gola affonda. || {t} ti scarica con delicatezza, e «delicatezza» non è come la senti. || La tua grande domanda riceve un piccolo, gentile, devastante «non in quel modo».
romance.knockout={t} perde le staffe e tira un pugno. Arriva a segno e finisci a terra come un sacco di panni sporchi. || Quella mossa è stata la goccia. {t} sferra un colpo e la stanza si inclina. Ti svegli a fissare il soffitto.
romance.fight={t} ne ha abbastanza. Una spinta, una parola ad alta voce e all'improvviso siete in una rissa. || Era un passo di troppo. {t} si mette in guardia e ti si getta addosso a pugni stretti.
romance.police={t} ne ha avuto abbastanza e sta già chiamando. Ti sta arrivando una denuncia. || «Chiamo la polizia.» {t} sembra dire sul serio.
romance.butterflies=Le farfalle sono reciproche. Qualcosa cresce piano tra te e {t}. || Tu e {t} vi separate con un sorriso che non riuscite proprio a nascondere.
romance.swept_off_feet=È uno di quei momenti che ricorderete entrambi. {t} ha perso la testa e tu sei raggiante. || {t} ci è cascato del tutto. Senti un'ondata di calore che dura ore.
romance.fail=Punti al fascino e atterri dalle parti di «leggere un manuale ad alta voce». || Il piano era romantico. L'esecuzione era una trattativa con ostaggi.
romance.knockout_death=Il pugno di {t} arriva a segno e crolli a terra... e non ti svegli più. Fine. || Un colpo di {t}. Cadi, la stanza si fa silenziosa e non ti rialzi. Partono i titoli di coda.
conflict.bonus=Una battuta tagliente, detta bene. {t} sogghigna a malincuore. || Tieni la posizione e funziona. {t} te ne dà un po' di rispetto.
conflict.crit_success=Lo piazzi alla perfezione. {t} non ha replica e tutta la sala sa che hai vinto. || Una lezione magistrale. {t} apre la bocca, la richiude e annuisce con rispetto. || Il sangue freddo paga. {t} fa un passo indietro e tu ti senti un gigante.
conflict.soft_fail=Arriva piano. {t} scrolla le spalle e va avanti. || Non è il tuo momento più brillante, ma nessuno si fa male. || {t} non si scompone e la questione resta irrisolta.
conflict.crit_fail=Va così male che {t} non ha nemmeno bisogno di rispondere. Ci hanno pensato le tue stesse parole. || Il tuo grande momento ti si ritorce contro in modo spettacolare. Il silenzio che segue è assordante. || Hai tenuto la posizione fino a sbattere contro un muro. {t} guarda con grande interesse.
conflict.stiff=La stoccata è rigida e provata, e {t} la vede da lontano. || Cerchi di sembrare duro. Sembri una segreteria telefonica.
conflict.tease_backfires=La presa in giro non attacca e {t} risponde con qualcosa che fa male davvero. || Punzecchi {t} e la puntura morde te. || {t} non si diverte. A diventare rossa è la tua faccia.
conflict.ridicule_backfires=Il tuo sfottò viene rigirato così bene che quasi vorresti applaudire. Quasi. || {t} ride di te, a voce alta, e ora vorresti non aver iniziato. || Prendi in giro {t} e {t} ha già pronta una battuta migliore. Ahi.
conflict.stubborn=Ti impunti, e anche {t}. Non vince nessuno e l'atmosfera è rovinata. || Insistere a voce più alta non ti dà più ragione. {t} smette di ascoltare.
conflict.line_crossed=Tracci il confine, e passa proprio in mezzo ai sentimenti di {t}. || La verità è uscita un po' troppo onesta. {t} resta in silenzio e la stanza si raffredda. || L'hai detto chiaro e tondo. {t} l'ha sentito chiaro e tondo, e ora nessuno dei due riesce a guardare l'altro.
conflict.power_play_flops=La tua prova di forza fa un flop clamoroso. {t} ti smaschera davanti a tutti e ti costa caro. || A quanto pare {t} non si è fatto intimidire per niente. Brucia, in più di un modo. || Spingi per avere un vantaggio e finisci per pagare il privilegio.
conflict.shown_the_door={t} indica la porta. Capisci l'antifona e te ne vai con un po' di orgoglio ammaccato. || Chiedi a {t} di andarsene e {t} risponde con uno sguardo che scioglierebbe l'acciaio. || Il «per favore vattene» arriva male e ora fuori ci sei tu.
conflict.greeting_backfires=Il tuo saluto sgarbato riceve una risposta più sgarbata. Hai cominciato tu, quindi ora è roba tua. || {t} prende sul personale il saluto acido e lo restituisce con gli interessi. || Saluti {t} come un cattivo da film. {t} risponde restando nel personaggio.
conflict.belittle_backfires=Metti {t} in ridicolo davanti a tutti. Si scopre che {t} ha le ricevute. || La colpa ricade su di te, con tanto di appunti. || {t} resta calmo, ed è peggio. L'hanno visto tutti.
conflict.pent_up=Le parole escono più calde del previsto. A {t} non serviva tutto quello. || Sfoghi tutto, e una parte era destinata a qualcun altro. || I sentimenti erano veri. Il tempismo no.
conflict.extort_backfires=La tua minaccia si sgonfia a metà. {t} resta calmo e a sembrare colpevole sei tu. || L'estorsione va come vanno sempre le estorsioni. {t} è su tutte le furie e paghi tu. || {t} non batte ciglio. La multa sì.
conflict.caught_red_handed=Qualcuno ti ha visto. Tutti ti hanno visto. Fai finta di non aver mai messo piede lì. || Il tuo piano furtivo ha un testimone. Hai la faccia tutta rossa. || Il segreto era meno segreto di quanto speravi.
conflict.rumor_backfires=Il messaggio arriva alla persona sbagliata. Passi la serata a cancellare roba. || La voce si diffonde e poi ti torna indietro con qualche dettaglio in più. || A quanto pare il pettegolezzo riguardava l'amico di qualcuno. Ops.
conflict.prank_backfires=Lo scherzo cade su di te. Ridono tutti, ma non con te. || Alla battuta serviva un passaggio in più. L'hai saltato e paghi.
conflict.knockout={t} perde le staffe e tira un pugno. Arriva a segno e finisci a terra come un sacco di panni sporchi. || Quella è stata la goccia. {t} sferra un colpo e la stanza si inclina. Ti svegli a fissare il soffitto.
conflict.fight={t} ne ha abbastanza. Una spinta, una parola ad alta voce e all'improvviso siete in una rissa. || Hai tirato troppo la corda. {t} si mette in guardia e ti si getta addosso a pugni stretti.
conflict.police={t} ne ha avuto abbastanza e sta già chiamando. Ti sta arrivando una denuncia. || «Questa è molestia e chiamo la polizia.» {t} parla sul serio.
conflict.witty=La battuta è buona e {t} lo sa. Un sorriso a denti stretti e un po' più di rispetto. || Vinci lo scambio senza un graffio. {t} si scioglie un po'.
conflict.respect=Vinci la discussione in modo così pulito che {t} lo ammira davvero. La tua sicurezza brilla per un po'. || {t} si ritira con un cenno. Oggi hai guadagnato un rispetto vero.
conflict.fail=Puntavi all'audace e arrivi all'imbarazzante. || La battuta era buona. La consegna era uno starnuto.
conflict.knockout_death=Il pugno di {t} arriva a segno e crolli a terra... e non ti svegli più. Fine. || Un colpo di {t}. Cadi, la stanza si fa silenziosa e non ti rialzi. Partono i titoli di coda.
passion.bonus=Il vostro interesse comune accende una bella chiacchierata. {t} annuisce e ve ne andate con più energia. || Una bella chiacchierata su qualcosa che amate entrambi. {t} ne chiede ancora.
passion.crit_success=Si scopre che amate esattamente la stessa cosa. Tu e {t} parlate per ore senza accorgervene. || Due anime affini si trovano. {t} si illumina come una lampada, e anche tu. || L'argomento scatta alla perfezione. {t} vuole sapere tutto e tu racconti con piacere.
passion.soft_fail=Trovi qualcosa da dire, e anche {t}. Va bene. || Un terreno comune, ma poca scintilla. || L'argomento si spegne con educazione.
passion.crit_fail=Dici con sicurezza la cosa sbagliata sull'unico argomento a cui {t} tiene di più. Cala il silenzio. || La tua passione si rivela una passione molto diversa da quella di {t}. La conversazione non si riprende più. || Ti butti a capofitto su un argomento e {t} fa una smorfia. Non sai chi dei due sia più in imbarazzo.
passion.dull_topic=Vai avanti sull'argomento per dieci minuti. Lo sguardo di {t} si spegne verso il minuto tre. || Per te è affascinante. {t} controlla l'ora. || L'argomento è elettrizzante per te e per nessun altro nella stanza.
passion.hot_take=Lanci un'opinione molto audace e {t} non la prende bene. || La tua sparata raffredda la stanza in fretta. {t} non è d'accordo, a voce alta. || {t} prende l'argomento sul personale e ora è un dibattito.
passion.dance_stumble=Provi a mostrare un passo, inciampi nei tuoi stessi piedi e ti accartocci a terra. {t} fa una smorfia di solidarietà. || Il passo di danza richiede più spazio di quello che hai. Vince il pavimento. || Un passo troppo ambizioso e la gravità riscuote il suo.
passion.muscle_strain=Mostri un esercizio e qualcosa si strappa. {t} ti offre un cuscino e tanta comprensione. || L'entusiasmo supera il tuo riscaldamento. La schiena presenta reclamo. || Ti metti in posa troppo forte e stiri qualcosa che ti serviva.
passion.voice_cracks_song=Attacchi la nota alta con sicurezza. La nota non ricambia. || La voce si incrina così forte che {t} si guarda intorno per controllare i vetri. || Cantare insieme è bello finché non prendi tu il comando.
passion.off_key=L'accordo che suoni non è mai stato nella canzone. {t} fa finta, con garbo, che fosse una scelta creativa. || La tua chitarra è scordata e lo è anche tutta l'atmosfera. || Strimpelli con passione e con le note sbagliate.
passion.meat_debate=Inizi a parlare di carne e {t} ha opinioni forti sui tagli. Diventa un dibattito. || La discussione sulla bistecca si scalda. Al sangue e ben cotta non sono compatibili. || Dici «ben cotta» e {t} ti guarda come se avessi insultato la sua famiglia.
passion.recipe_war=La tua ricetta contro quella di {t}. Non vince nessuno, tutti hanno fame e sono un po' offesi. || Dici che l'ingrediente segreto è il burro. {t} dice che è la pazienza. La tensione sale. || Critichi la tecnica di {t}. Errore.
passion.no_common_ground=Condividi le tue cose preferite. {t} condivide le sue. Non hanno niente in comune. || I vostri gusti non potrebbero essere più lontani. La conversazione si spegne. || {t} chiede «aspetta, ti piace quella roba?» con un tono che ricorderai.
passion.shared_joy=Parlare di ciò che amate entrambi dà una sensazione calda e un legame più forte. || {t} ride e racconta una storia sua. Ora siete più vicini.
passion.kindred_spirits=Tu e {t} scoprite di essere fatti della stessa pasta. Oggi inizia una grande amicizia. || {t} sogghigna e dice «dove ti eri nascosto per tutta la mia vita?» Lo senti anche tu.
passion.fail=Pensavi di avere qualcosa in comune. Ne avevi meno di quanto credessi. || L'entusiasmo era vero. Le conoscenze no.
selfcare.bonus=Un bel momento con te stesso. Una ventata di freschezza e una quieta soddisfazione. || Ti ha fatto bene. Te ne vai con più leggerezza di quando sei arrivato.
selfcare.crit_success=Finisci sentendoti una persona nuova di zecca. Tutto è un po' più luminoso e molto più calmo. || Tempo ben speso per te. Risplendi e l'intera giornata sembra più leggera. || Uno di quei rari momenti in cui sei completamente in pace.
selfcare.soft_fail=Va bene. Non magico, ma va bene. || Niente di speciale, niente di sbagliato. Si va avanti. || Il momento passa senza molto da dire.
selfcare.crit_fail=Tutto va per traverso e finisci per sentirti peggio di quando hai cominciato. || Quello che doveva essere un momento di calma diventa un piccolo disastro.
selfcare.off_day=Ci provi, ma oggi il cuore non c'è. Segue un profondo sospiro. || Certi giorni anche rilassarsi è un lavoro duro.
selfcare.self_doubt=Tu e lo specchio vi fissate. Sbatti le palpebre per primo, e non con sicurezza. || Provi la frase sei volte. Peggiora ogni volta, chissà come. || Ti guardi e trovi solo cose da sistemare. Il discorso motivazionale non aiuta.
selfcare.mind_wanders=La mente si rifiuta di rallentare. Ogni pensiero è un pensiero diverso. || Ti siedi, respiri e ti ricordi di una mail che non hai mandato. Pace annullata. || La calma non arriva mai del tutto. Te ne vai con più agitazione di quando sei partito.
selfcare.bad_omen=La lettura è vaga, inquietante e un po' maleducata. Te ne vai con un brutto presentimento. || Il futuro sembra nuvoloso. Vorresti non aver chiesto. || Le carte o la sfera hanno brutte notizie dette con tono allegro. In qualche modo è peggio.
selfcare.bad_sleep=Ti giri, ti rigiri e lotti con il cuscino. Il mattino arriva troppo presto. || Dormi, tecnicamente. Non sembra proprio. || Ogni volta che stai per scivolare nel sonno, qualcosa sbatacchia. La stanchezza è la nuova normalità.
selfcare.nightmare=Un sogno stranissimo, con denti e un panino parlante. Ti svegli con il cuore in gola e senza energie. || L'incubo sembra del tutto reale. Ti metti a sedere al buio e ti serve un minuto. || Sogni di essere in ritardo per qualcosa. Ti svegli in ritardo, con la stanchezza addosso e senza sapere per cosa.
selfcare.firewood_boom=Getti il ceppo e il fuoco risponde con un BANG. Una palla di fuoco, una nuvola di fuliggine e all'improvviso sei la persona più sporca del parco. || La legna era umida, il fuoco era arrabbiato. Bum! Hai cenere dalla testa ai piedi. || Un ceppo di troppo. Il falò esplode in uno sbuffo di fumo e scintille e ne esci con l'aria di uno spazzacamino.
selfcare.dust_fizzles=Spargi la polvere magica e il fuoco starnutisce e basta. Non succede niente, a parte un po' di brillantini sulle scarpe. || La polvere scintilla per un secondo, poi si spegne con un tristissimo pop. || Forse oggi il fuoco non è in vena di magia.
selfcare.otherworldly_visitor=Le fiamme tremolano, si piegano e qualcosa con troppi occhi comincia a strisciare fuori dal fuoco. Ridi. Non riesci a smettere di ridere. È una risata molto nervosa. || Una forma sale nel fumo, ti guarda dritto e non dice niente. Stai bene. Stai benissimo. Ah. Ah ah ah. || Il fuoco sussurra il tuo nome con una voce che viene dal nulla. Rispondi con una risatina che non riconosci come tua.
selfcare.sparkler_burn=La stella filante sputa scintille ovunque. Una ti atterra sulla manica e sulla dignità. || La agiti con un po' troppo entusiasmo. Le scintille ti salutano a modo loro. || Si spegne in mano con un sibilo piccolissimo e molto maleducato.
selfcare.smoke_in_eyes=Il vento cambia e il fumo ti segue ovunque ti siedi. I tuoi occhi non perdoneranno mai il fuoco. || Ti sistemi e il fumo si sistema con te. Parte la tosse. || Il fuoco è caldo, il fumo no. Giri intorno al fuoco tre volte e ti segue.
selfcare.stubbed_toe=Gli dai un calcio forte. A lui non importa, al tuo alluce sì. || Sfogare la rabbia su un oggetto è bellissimo per un secondo. Poi l'alluce comincia a pulsare. || Vince l'oggetto. Saltelli in giro tenendoti il piede e l'orgoglio.
selfcare.sunburn=Ti appisoli al sole. A sera risplendi in un modo che nessuno aveva chiesto. || L'olio ha saltato un punto. Il punto ora è molto, molto rosso. || Troppo sole, poco buon senso. La tua pelle presenta reclamo.
selfcare.hammock_flip=L'amaca si ribalta e anche tu, dritto nella sabbia. || Ti sdrai con grande grazia e ti rialzi con molta meno. || Il lettino ha delle opinioni su come ti siedi. Vince lui.
selfcare.smoky_flue=La canna fumaria era chiusa e il salotto si prende una bella affumicata. Tossendo raggiungi la finestra più vicina. || Il fuoco scoppietta, il fumo va ovunque tranne su per il camino. Gli occhi bruciano. || Lo accendi, fa fumo. Lo sventoli, fa più fumo.
selfcare.backfire_soot=Il camino sputa una palla di fuliggine dritta su di te. Ora sei di un nero molto festivo. || WHOOMP! Uno scoppio di scintille e cenere, e il tappeto del camino non è l'unica cosa che sembra carbonizzata. || Il fuoco si accende con un botto e ne esci con l'aria di aver risalito il camino strisciando.
selfcare.ash_cloud=Spegni il fuoco e la cenere si alza in una grossa nuvola grigia. La scacci con dignità. || L'ultima brace fa il broncio e ti manda uno sbuffo di cenere dritto in faccia. || Il fuoco è spento. E lo è anche la tua piega.
selfcare.burnt_fingers=Tendi le mani un po' troppo vicino. Il fuoco ti brucia con educazione la punta di un dito. || Mani calde, poi mani bollenti, poi mani velocissime. || Il fuoco era più amichevole da un metro di distanza.
selfcare.blessing=La polvere magica sboccia in un caldo bagliore dorato. Per un momento senti tutto insieme: riposo, sazietà, pulizia e leggerezza. Il fuoco sorride. Probabilmente. || Le fiamme prendono il colore dell'alba e ti avvolgono. Quando svaniscono, tutti i dolori, le preoccupazioni e le malattie sono spariti. || Una morbida pioggia di scintille dorate e il mondo torna ad avere senso. Guarigione, freschezza e una quieta gioia.
selfcare.fail=Non è stata la tua sessione migliore con te stesso.
games.bonus=Una vittoria solida. Sei di ottimo umore e hai la battuta pronta. || Bella giocata. Ci sta un piccolo balletto della vittoria.
games.crit_success=Partita perfetta. Una folla di nessuno applaude e ti senti un campione lo stesso. || Precisione assoluta. Persino la macchina sembra colpita. || Oggi il gioco si piega alla tua volontà. Che scarica di adrenalina.
games.soft_fail=Perdi, ma era abbastanza vicina da essere divertente. || Oggi no. Andrà meglio al prossimo giro. || Un soffio e l'hai mancata. Non ha visto nessuno, quindi non conta.
games.crit_fail=Una sconfitta spettacolare. Valuti di trasferirti in un'altra città. || Tutto ciò che poteva andare storto va storto, nell'ordine più imbarazzante possibile.
games.so_close=Quasi. Ancora un pochino e sarebbe stata tua. || La manchi per un capello. Il capello non è impressionato.
games.sore_loser=Perdi, e non con grazia. Vengono dette diverse parole. || Dai la colpa alla macchina, al lag e a un piccolo soffio di vento.
games.claw_empty=La pinza si chiude sul nulla e il peluche ti sogghigna. Qualche moneta svanisce. || Allinei tutto alla perfezione. La pinza molla. Ovviamente.
games.dart_stray=Il dardo supera il bersaglio e trova un muro. Nessuno ha visto niente. || Miri al centro. Il dardo mira al pavimento.
games.gutter_ball=La palla rotola lentamente nel canale. La segui con lo sguardo fino in fondo. || Un tiro perfetto, se la pista fosse un metro più a sinistra.
games.air_ball=La palla manca tutto: canestro, tabellone e dignità. || Tiri, manchi e la palla rimbalza in un posto dove non andrai a cercarla.
games.button_mash=Pesti tutti i tasti insieme. Il personaggio fa qualcosa di strano e perde subito. || Il controller reagisce. E anche la sconfitta.
games.eats_coins=La macchina prende le monete e se le tiene. Non le dispiace. || Il cabinato mangia le monete senza un grazie. Lo schermo dice «game over» prima che tu inizi.
games.wild_throw=La palla supera le lattine, supera il chiosco e quasi finisce in mare. || Tiri con sicurezza. Le lattine restano perfettamente immobili. || Un gran tiro, ma da tutt'altra parte.
games.seesaw_bonk=L'altalena a bilico rimbalza e ti dà una botta dritta sul mento. || Cavalchi il cavallino un po' troppo forte e lui reagisce.
games.arcade_win=La macchina paga e qualche moneta ti cade in mano. || Un piccolo premio, un grande sorriso.
games.jackpot=Luci lampeggianti, campanelli e monete a pioggia. Non ti era mai capitata una fortuna così. || Jackpot! Tutta la sala giochi si gira a guardare.
games.fail=Il gioco vince questo round.
photo.bonus=Lo scatto è nitido, la luce è ottima e {t} viene benissimo. Una foto da tenere. || Una foto pulita e calda con un gran sorriso. Vorrai stamparla. || Inquadratura perfetta, tempismo perfetto. La foto cattura l'atmosfera esattamente.
photo.crit_success=Una foto così bella che si potrebbe incorniciare. {t} ne vuole una copia e una seconda di riserva. || Lo scatto è da rivista. Tu e {t} fissate lo schermo. || Catturi un momento così perfetto che sembra costruito. Gli dèi della fotografia approvano.
photo.soft_fail=La foto non è un granché, ma esiste. Dici che ne farai un'altra più tardi. || Uno scatto mediocre. {t} dice che va bene e lo pensa a metà. || È una foto. Si capisce cos'è. Tutto qui.
photo.crit_fail=La foto è un disastro sotto ogni punto di vista. {t} pretende che non venga mai mostrata. || Riesci a rovinare foto, luce e atmosfera in un colpo solo. Un capolavoro di fallimento. || La fotocamera fa cilecca, il flash parte male e lo scatto diventa maledetto. {t} chiede di cancellarlo.
photo.blurry=Premi lo scatto e la foto esce tutta sfocata. {t} dice «artistica» con faccia seria. || Lo scatto è mosso come un avvistamento di fantasmi. {t} propone di riprovare, magari con la mano più ferma. || Ottieni una foto perfetta di un nulla molto sfocato. {t} dice con garbo che ha carattere.
photo.blink=Cogli {t} a metà di un battito di ciglia. Nella foto sembra un sogno. || Il flash parte e {t} sbatte le palpebre nel momento esattamente sbagliato. Un bel ritratto di occhi chiusi. || Click. In foto {t} sembra mezzo addormentato. Si chiede di cancellarla, con fermezza.
photo.finger=Il dito copre metà dell'obiettivo e il dito è la star della foto. || Inquadri alla perfezione e catturi soprattutto il pollice. Un pollice con una luce splendida. || Nella foto c'è {t}, un bello sfondo e una macchia rosa nell'angolo: tu.
photo.phone_drop=Il selfie va bene finché il telefono non ti scivola di mano. {t} sobbalza al fracasso. || Ti allunghi per l'angolazione perfetta e il telefono salta via dalla mano. Il selfie è il pavimento. || A metà selfie il telefono fa un piccolo tuffo. {t} lo guarda, poi guarda te, e non dice niente.
photo.camera_shy={t} si copre il viso appena esce la fotocamera. La foto è una mano e un sorriso che non c'è. || Alzi la fotocamera e a {t} viene timidezza. Lo scatto è mezza faccia e molto rimpianto. || {t} si butta fuori dall'inquadratura all'ultimo secondo. La tua foto è un ritratto perfetto del muro.
photo.viral_pic=La foto che hai scattato diventa virale. Una pagina ne compra i diritti per ${m}. {t} pretende i crediti. || Qualcuno online adora il tuo scatto e manda ${m} per usarlo. La fotocamera del telefono ti ha appena pagato il pranzo. || Pubblichi la foto ed esplode. Un marchio la paga ${m}, e {t} vuole la sua parte.
tv.bonus=Capiti sul programma perfetto. Oggi è una bella giornata. || Il canale è esattamente di tuo gusto. Pura magia televisiva.
tv.crit_success=La TV si sintonizza con una chiarezza cristallina. Persino l'antenna applaude.
tv.soft_fail=L'immagine è sfocata ma la sistemi con una manata di lato.
tv.fire=La TV sibila, scoppietta e prende fuoco da sola. Lo streaming non è mai stato così bollente. || Il fumo esce da dietro la TV e poi va a fuoco tutto. Era troppo per un telecomando. || Premi un tasto e la TV risponde con le fiamme. Recensioni contrastanti.
tv.shock_break=Premi il pulsante di accensione. La TV scoppietta, sfrigola e muore in uno sbuffo di fumo, e la scossa residua ti trova comunque. || Un botto, un lampo, e la TV si spegne per sempre. La scossa è solo l'insulto finale. || Premi il telecomando e tutto l'apparecchio rinuncia alla vita, portandosi dietro il buonumore dei tuoi capelli.
tv.shock=Prendi il telecomando senza notare un filo che spunta. Ti becchi una bella scossa tostata. Chi l'avrebbe detto che le batterie fossero così potenti?! || Accendi la TV e il vecchio apparecchio morde. I capelli si rizzano e l'anima lascia per un attimo il corpo. || La TV crepita, scintilla e decide che sei la nuova antenna. Zzzzap! || Premi il pulsante di accensione. La TV preme a sua volta. Forte.
tv.fire_safe=La TV fa un minuscolo pop e tace. Meno male che era solo una scintilla... || Qualcosa fa bang dietro lo schermo. Piccolissimo, drammaticissimo. La TV sembra molto imbarazzata. || Un breve pop, poi silenzio. Meno male che non era niente di peggio.
tv.pass=La TV si accende con uno sfarfallio. Ti aspetta la prima serata.
shower.bonus=L'acqua arriva giusta. Potresti restare qui finché lo scaldabagno non si arrende. || Una doccia gloriosa. Esci come uno Zoi nuovo di zecca.
shower.crit_success=La doccia migliore della tua vita. Vapore, pressione perfetta e una canzone che quasi vorresti registrare.
shower.soft_fail=L'acqua è un po' tiepida, ma tiri dritto.
shower.crit_fail=Entri e il miscelatore ti tradisce. Non è fredda, è un ghiacciaio. L'anima se ne va dallo scarico. || I tubi gemono, l'acqua diventa artica e lanci una nota che non sapevi di avere.
shower.fail=Fai la doccia, ma il miscelatore si è rotto ed è gelida! Domani te ne pentirai. || L'acqua parte calda e poi, per dispetto, diventa ghiaccio. Salti fuori tremando.
shower.pass=Una doccia perfettamente normale. Niente è esploso, niente si è congelato.
housework.bonus=Splendente! La casa brilla e anche il tuo umore. || Pulire oggi dà una strana soddisfazione. Potresti fare tutta la casa.
housework.crit_success=La stanza scintilla come uno showroom. Persino i batuffoli di polvere applaudono.
housework.soft_fail=Qualche striscia e tanti borbottii, ma il lavoro è fatto.
housework.crit_fail=Un'inondazione, una scivolata e un elettrodomestico rotto in un colpo solo. Ci vuole talento per fallire così a fondo.
housework.slip=Metti il piede nel bagnato che hai appena lavato. Vince il pavimento e giri come in un programma di pattinaggio artistico. || Le pulizie vanno alla grande finché il piede non incontra una pozza di sapone. Wheeee... tonfo.
housework.frustrated=Strofini, spazzi, sospiri. Lo sporco ricresce per dispetto. || Ogni volta che pulisci un punto ne spuntano due nuovi. Hai finito di fingere calma.
housework.water_break=Giri il rubinetto una volta di troppo e il tubo cede. Acqua ovunque e il lavandino è spacciato. || Un sibilo sospetto, un pop e una fontana. L'impianto si è dimesso e il pavimento ora è un lago.
housework.break=Smanetti con la macchina e qualcosa dentro fa clunk. Poi silenzio. Fantastico. || Premi la cosa sbagliata e l'elettrodomestico muore con un triste ronzio.
housework.messy=In qualche modo il mocio era più sporco del pavimento e ha reso tutto ancora più sudicio. Sporcizia, sporcizia ovunque! || La spugna che hai preso era evidentemente una fattoria di polvere. Ora sembra che qui non venga nessuno dal 1987. || Scuoti lo spolverino e la stanza diventa più polverosa. La fisica ha delle domande. Anche tu. || L'aspirapolvere rutta tutto ciò che ha mai inghiottito. Complimenti, hai inventato la pulizia al contrario. || Strizzi lo straccio e in qualche modo piove polvere. Ogni mensola, ogni pavimento, ogni superficie. Persino le ragnatele hanno presentato reclamo. || La scopa ha starnutito. Ora è una tempesta di polvere. Pulire è stato un errore.
housework.sigh=Sospiri davanti al mucchio di faccende. Al mucchio di faccende non importa. || C'è sempre qualcosa di più sporco. Ti prendi un momento per piangere il tuo tempo libero.
housework.dust_allergy=Sollevi una nuvola di polvere che aspettava questo momento da anni. Etciù. Il naso presenta reclamo. || La scopa sveglia ogni batuffolo di polvere della casa. Starnutisci finché non ti si stappano le orecchie. || Una nuvola di vecchia polvere ti prende dritto nel naso. Ufficialmente, le tue stesse pulizie ti danno allergia.
housework.clean_house=Un'impennata di energia da pulizie e tutta la casa brilla in un colpo solo. Non è sopravvissuto un granello di polvere. || Trovi il ritmo perfetto. Ogni superficie e ogni pavimento sono immacolati. Ma chi sei? || Qualcosa scatta. Riordini tutta la casa in un unico, glorioso passaggio, batuffoli compresi.
repair.crit_success=Qualcosa scatta. Tutto ciò che qui era rotto torna in vita in un colpo solo e te ne vai come una leggenda delle riparazioni. || Le mani si muovono da sole. Quando posi l'attrezzo, qui non c'è più niente di rotto. Roba da eroi. || Una riparazione perfetta, poi un'altra, poi tutte. Ogni cosa rotta intorno ritorna a funzionare e la cassetta degli attrezzi applaude.
repair.soft_fail=La riparazione quasi funziona. Quasi. Fai un passo indietro e l'affare scrolla le spalle. || Stringi, giri e provi. Ancora non funziona. Sembra però un po' offeso. || Vicino, ma no. L'oggetto ha deciso di restare rotto ancora un po'.
repair.shock=Tocchi il filo sbagliato e il dispositivo ti dà un'opinione molto decisa. I capelli si rizzano in segno di applauso. || ZAP! La riparazione finisce con una scintilla, un urlo e odore di capelli bruciati. || Il manuale diceva «prima stacca la spina». Hai letto quella riga subito dopo la scintilla.
repair.sparks=Qualcosa dentro scoppietta, sfrigola e sbuffa un po' di fumo. Fai un passo indietro con una faccia molto prudente. || Una pioggia di scintille, odore di bruciato e un lungo silenzio. Decidi di non aver visto niente. || Il dispositivo ronza, scintilla una volta e si arrende. Non sai bene chi abbia perso questo round.
repair.flood=Allenti un tubo di troppo e l'acqua si unisce alla festa. Il pavimento ora è uno stagno. || La chiave scivola, il tubo cede e nasce una fontana. Splash. || Una piccola perdita diventa un problema per niente piccolo. Il pavimento è bagnato, e tu pure.
repair.soaked=Un getto d'acqua ti colpisce dritto in faccia. Ora fai ufficialmente parte dell'impianto idraulico. || Il tubo spruzza di lato e ti prendi tutto. Complimenti: pulizia totale e freddo polare. || Giri la valvola sbagliata e ti becchi una doccia gratis. Con tutti i vestiti addosso, ovviamente.
repair.fumble=Il cacciavite vince questo round. Lasci cadere tutto e dici qualche parolina. || Posi l'attrezzo per un secondo e sparisce. L'oggetto è ancora rotto e la tua pazienza no. || Ogni vite che tocchi rotola via. L'oggetto resta rotto e a te resta il nervoso.
repair.wrong_part=Ripari il pezzo sbagliato, con grande sicurezza. Il pezzo giusto è ancora rotto e ora sei a pezzi. || Sostituisci un pezzo che non andava sostituito. Il vero problema ti saluta dall'angolo. || Riparato! Beh, qualcosa. Non la cosa che era rotta.
repair.thumb=Il martello incontra il tuo pollice. Il pollice presenta reclamo formale. || Una piccola sbadataggine, un grande ahi. Ti tieni la mano e fai finta di niente. || Colpisci esattamente ciò che miravi, solo che era il tuo dito.
repair.flood_safe=Il tubo sputa una piccola pozza e poi ci ripensa. Pavimento bagnato, scarpe bagnate, ego asciutto. || Un po' d'acqua sgattaiola fuori e fa una pozzanghera. Niente che uno straccio non risolva, ma la fissi comunque. || Il tubo ruttisce un po' d'acqua sul pavimento. È solo una pozzanghera, ma è LA TUA pozzanghera.
repair.repair_all=Qualcosa scatta. Tutto ciò che qui era rotto torna in vita in un colpo solo e te ne vai come una leggenda delle riparazioni. || Le mani si muovono da sole. Quando posi l'attrezzo, qui non c'è più niente di rotto. Roba da eroi. || Una riparazione perfetta, poi un'altra, poi tutte. Ogni cosa rotta intorno ritorna a funzionare e la cassetta degli attrezzi applaude.
repair.shock_death=Allunghi la mano dentro il dispositivo... un lampo accecante è l'ultima cosa che vedi. Fine. || ZAP. Le luci tremolano, crolli e il manuale di riparazione si chiude da solo. Partono i titoli di coda. || Il filo sbagliato nel momento sbagliato. Il tuo talento per le riparazioni era notevole... per un po'. Fine.
laundry.bonus=I vestiti escono morbidi, caldi e profumano di prato primaverile. Piegarli è quasi divertente. || Un ciclo perfetto. Ogni calzino ha il suo gemello, e nessuno è rosa. || Il carico è immacolato e perfettamente asciutto. Ti senti del mestiere, in fatto di bucato.
laundry.crit_success=Perfezione del bucato. I bianchi sono più bianchi, i colori più vivi e pieghi come in un hotel. || Il ciclo finisce e i vestiti sembrano nuovi di zecca. Da qualche parte lì vicino un coro canticchia. || Ogni macchia sparita, ogni calzino accoppiato, ogni camicia scattante. Gli dèi del bucato sono soddisfatti.
laundry.soft_fail=Il carico esce un po' stropicciato e un po' umido, ma indossabile. || Qualche macchia sopravvive al ciclo. Decidi che è carattere. || Premi start, speri per il meglio e i vestiti escono più o meno a posto.
laundry.crit_fail=Ristretto, rosa, allagato e con un calzino in meno. Un capolavoro di disastri da bucato. || La macchina allaga, la camicia si restringe e il calzino rosso colpisce ancora. Ti guadagni una medaglia nel caos. || Un'alluvione di schiuma, un guardaroba rovinato e un calzino disperso in un solo ciclo. Impressionante, a modo suo.
laundry.shrunk=Lavi il tuo maglione preferito a caldo. Ora va bene a un orsetto minuscolo. || L'etichetta diceva lavaggio a freddo. L'hai letta dopo il ciclo. La camicia ora è un top corto. || Apri la macchina e tiri fuori i jeans. Ora sono formato bambola. La lavatrice è tutta soddisfatta.
laundry.pink=Un solo calzino rosso si infila tra i bianchi. Tutto ciò che possiedi ora è rosa. || Volevi camicie bianche e fresche. Hai ottenuto un tramonto rosato e una lezione su come dividere il bucato. || Il carico esce di un solo colore: salmone. Il tuo guardaroba entra in una nuova era audace.
laundry.lost_sock=Conti i calzini due volte. Uno è sparito di nuovo nella dimensione nascosta della macchina. || Sette calzini entrano, sei escono. La lavatrice fa collezione. || Un calzino solitario ti fissa dal cestello. Il suo gemello se n'è andato per sempre.
laundry.slip=Metti il piede su una scia di schiuma uscita dalla macchina. Vince il pavimento e giri come in un programma di pattinaggio artistico. || Una pozza di acqua saponata tende un'imboscata ai tuoi calzini. Wheee... tonfo. || Porti il cesto dritto su una chiazza bagnata. Il bucato vola e anche tu.
laundry.flood=Il tubo si stacca e la macchina allaga il pavimento. Sei in piedi in un lago pulitissimo. || Troppo detersivo, poco buon senso. Un'onda di schiuma invade la stanza e la macchina getta la spugna. || Un forte gorgoglio, un botto e una fontana di acqua saponata. La lavanderia ora è una piscina.
laundry.break=Premi un pulsante che non andava premuto. La macchina geme e si spegne. || Qualcosa dentro fa clunk, sferraglia e si ferma. Il cestello è bloccato a metà ciclo e il tuo umore pure. || La macchina trema, fa un po' di fumo e muore. È stato bello conoscerla.
laundry.burnout=La macchina urla, scintilla e butta fuori una fiammella fumosa prima di morire. Il giorno del bucato è annullato. || Fumo, scintille e una breve fiamma dal retro della macchina. Era una buona lavatrice. Era una lavatrice vecchia. || Qualcosa dentro si surriscalda e la macchina se ne va in uno sbuffo di fumo. I vestiti dovranno aspettare.
laundry.laundry_cash=Controlli il bucato e trovi ${m} piegati nella tasca dei vecchi pantaloni, un secondo prima che la macchina li trasformi in coriandoli. || Un mazzetto stropicciato di ${m} nei jeans che giuravi vuoti. La lavatrice si prende i jeans, tu i contanti. || Tasti ogni tasca prima del ciclo e trovi l'oro: ${m}. Il te di prima era un genio. Il te di adesso è ricco. || Mistero risolto: ecco dove erano finiti ${m}. Erano nascosti nei tuoi pantaloni da sempre. || Trovi ${m} in una tasca appena prima che parta la centrifuga. La macchina sembra delusa di essersi persa il colpo.
laundry.flood_safe=La macchina sferraglia, tossisce una nuvola di pelucchi e si arrende. Un solo batuffolo di polvere rotola fino ai tuoi piedi. || Un forte clunk, uno sbuffo triste e il cestello tace. Un piccolo sbuffo di polvere si posa vicino alle tue scarpe. || Il ciclo si inceppa e la macchina rutta un solo sbuffo grigio di pelucchi. Il pavimento riceve un minuscolo batuffolo e tu la colpa.
cooking.bonus=Il profumo è meraviglioso. Assaggi e annuisci come uno chef in TV. || Un pizzico di fortuna e il piatto viene perfetto.
cooking.crit_success=Un capolavoro. I ristoranti implorerebbero questa ricetta.
cooking.soft_fail=Non somiglia per niente alla foto, ma è commestibile. Probabilmente.
cooking.crit_fail=Fumo, scintille e il caos totale ai fornelli. Oggi hai inventato un nuovo livello di disastro in cucina.
cooking.burn=Afferri la padella rovente con spavalda sicurezza. Lei non è d'accordo. Saltelli sventolandoti la mano. || Il vapore ti prende e la padella ti prende. Cucinare è pericoloso, a quanto pare.
cooking.food_poison=Il piatto ha un odore sospetto, un sapore sospetto e il tuo stomaco comincia a pianificare un tour della vendetta. || Cucini con grande sicurezza e zero igiene. Lo stomaco manderà una recensione più tardi.
cooking.mess=Farina sul soffitto, sugo sul muro e una padella fumante. Dove è andata storta la ricetta? || La cucina sembra un campo di battaglia. L'unica vittima sei tu.
cooking.fire=Distogli lo sguardo per un secondo e la padella prende fuoco. La cucina ha opinioni sul tuo modo di cucinare. || Fiamme! I fornelli hanno deciso di farsi creativi e nessuna preparazione ti avrebbe salvato. || L'olio si fa ambizioso, la fiamma si alza e la tua cena diventa ufficialmente un pericolo d'incendio. Scappa!
cooking.explosion=Il forno fa un rumore che nessun forno dovrebbe fare. Poi uno più forte. La cena ora è una scena del crimine. || Là dentro qualcosa NON doveva essere riscaldato. La cucina risponde con un forte botto. || Premi start, il forno ci pensa su e poi esplode come un fuoco d'artificio.
cooking.appliance_break=Premi il pulsante e l'elettrodomestico fa bang, poi muore. La cena ora è da asporto. || Qualcosa scintilla dentro il forno. Ti giri per chiedere scusa ma è già andato.
cooking.takeout=La cena è una causa persa, quindi ordini da asporto. Arriva in fretta e costa ${m}. Cucinare è un viaggio. || Ammetti la sconfitta e chiami la pizzeria. ${m} dopo, sono tutti contenti. || L'allarme antincendio ci sta pensando, quindi consegna a domicilio. Totale: ${m}.
cooking.explosion_safe=Il forno fa un solo piccolo bang, poi tace. Scegli di chiamarlo condimento. || Un piccolo bang e un forno molto teatrale. Nessuno si fa male, solo offeso. || Il forno scoppietta una volta, forte. Meno male che era solo un piccolo boom.
cooking.fire_safe=La padella scoppietta come un petardo, urli e poi cala il silenzio. Meno male che era solo un piccolo pop... || I fornelli tossiscono un minuscolo bang e poi ci ripensano. Meno male che era solo un piccolo bang... || Un piccolo pop, uno sbuffo di niente e una cucina che sa di barbecue mai fatto.
dining.bonus=Il frigo ha esattamente ciò che volevi e ha un sapore ancora migliore dell'aspetto. Una piccola vittoria. || Temperatura perfetta, porzione perfetta. Mangi come se dovessi andare da qualche parte di importante. || Ogni boccone colpisce nel segno. Finisci persino il piatto senza una briciola.
dining.crit_success=Un pasto degno di applausi. Lecchi il piatto e nessuno può fermarti. || Uno chef piangerebbe. Tu lo mangi e basta. Pura gioia. || Il miglior boccone della settimana. Chiudi gli occhi e resti lì un momento.
dining.soft_fail=Un po' di sbrodolata, un piccolo ops. Pulisci il tavolo e fai finta di niente. || Il cibo è un po' strano ma lo finisci comunque. L'orgoglio è una salsa. || Quasi ti cade, lo riprendi e annuisci come se fosse il piano.
dining.crit_fail=Porti il piatto con sicurezza, poi con panico, poi non più. Il pavimento si prende il pasto e tu ti prendi il pavimento. || La ciotola decolla e la zuppa si prende il pavimento. Anche tu. Il pranzo ora è un aneddoto. || Uno starnuto, uno sversamento e l'atterraggio peggiore possibile. Il pasto e il tuo orgoglio sono ovunque.
dining.spill=La ciotola si ribalta e la cena finisce a terra. Il pavimento era già impolverato e ora è una scena. || Lasci cadere metà del pasto e si alza una nuvola di briciole e polvere. La cucina non è contenta. || Un'inclinazione goffa, un tonfo e un disastro si allarga sul pavimento. Le pulizie aspetteranno.
dining.burnt_tongue=Dai un morso prima che si raffreddi. La lingua presenta reclamo e anche gli occhi. || Troppo caldo, troppo in fretta. Ti sventoli la bocca come un piccolissimo drago. || Il primo boccone è lava. Il secondo è una cattiva idea. Lo mangi comunque.
dining.choke=Un boccone va di traverso. Tossisci, ansimi e ti riprendi con un cenno molto dignitoso. || Inali mezzo pasto e una parte vuole uscire. Acqua, subito. || Un colpo di tosse selvaggio, qualche lacrima e un pollice alzato. Stai bene. Il piatto ti giudica.
dining.food_coma=A metà piatto per oggi hai già dato. Le palpebre si arrendono per prime. || Un pasto pesante, un sospiro pesante e un lungo sguardo nel nulla. Il pisolino chiama. || Il cibo era ottimo. Il corpo ora è offline per manutenzione.
dining.bad_leftovers=Quell'avanzo profumava bene, che è una bugia che gli avanzi raccontano. Lo stomaco inizia a dissentire. || Mangi la cosa in fondo al frigo. Il frigo cercava di avvisarti. || Aveva un bell'aspetto e un buon sapore. Lo stomaco ha altre opinioni.
dining.machine_eats_coin=Il distributore prende la tua moneta e non ti dà niente, con sicurezza. || Premi il tasto. La macchina ronza, ci pensa e si tiene i tuoi soldi.
dining.fountain_splash=L'acqua salta più in alto del previsto. La tua maglietta ora fa parte della fontana. || Ti chini per un sorso e ti prendi una faccia piena di acqua gelata.
programming.bonus=Il codice compila al primo colpo. Sospetto, ma benvenuto. || Trovi la soluzione elegante e ti senti un mago.
programming.crit_success=Codice impeccabile, zero bug e una standing ovation da una stanza vuota.
programming.soft_fail=Gira, più o meno. I warning saranno un problema del te di domani.
programming.crit_fail=Fai un rm -rf di qualcosa che non dovevi e anche l'hardware si unisce alla festa. Crollo totale del sistema.
programming.stress=Il codice compila al quinto tentativo e si rompe al sesto. L'occhio ti trema a ritmo. || Un punto e virgola mancante ti ruba un'ora di vita. Qualcuno vuole un caffè?
programming.frustrated=Un minuto fa funzionava tutto. Non hai toccato niente. Ne hai la certezza assoluta. || Il bug sparisce, poi torna, poi è da un'altra parte. Sbatti il pugno sulla scrivania.
programming.shock_break=Un pop, un lampo e il computer si spegne con uno sbuffo di fumo. La scossa è solo l'insulto finale. || Premi invio e la macchina risponde. Volano scintille, letteralmente.
programming.crash=Lo schermo diventa blu, poi nero, poi morto. Tutto il lavoro non salvato se ne va con lui. || Il computer fa un piccolo sospiro e si chiude. Ne aveva avuto abbastanza.
programming.hack=Giuravi che il tuo software fosse inviolabile. Un hacker ti ha appena dimostrato il contrario e ha prelevato ${m} dal tuo conto. Nel biglietto c'è scritto «grazie del suggerimento». || La tua password supersicura era «password1». Qualcuno ha svuotato ${m} dal tuo conto prima che finissi il caffè. || Uno sconosciuto ha trovato la porta sul retro che avevi dimenticato di chiudere e si è servito di ${m}. Ottimo gioco di squadra con il te del passato.
programming.bounty=Trovi un bug critico in un'app famosa e lo segnali con garbo. Ti pagano una taglia di ${m}. Fai finta che fosse sempre stato il piano. || La tua pull request sistema una cosa che nessuno riusciva a sistemare da anni. I maintainer mandano ${m} e un ringraziamento lunghissimo. || Un'azienda legge il tuo pulito rapporto sull'exploit e ti accredita ${m}. La felpa col cappuccio è stata un buon investimento.
programming.freelance=Un cliente paga ${m} per un favore veloce. Ci sono voluti dieci minuti e tre anni di esperienza. || Sistemi il sito di uno sconosciuto in chat e insiste per mandarti ${m}. Chi sei tu per rifiutare? || Un lavoretto extra arriva nella casella e subito dopo ${m} arrivano sul conto.
logic.bonus=I pezzi vanno al loro posto. Ti senti davvero in gamba. || Individui la falla nell'argomentazione prima di chiunque altro. Una gioia silenziosa e compiaciuta. || Fatti, poi logica, poi una conclusione che segue davvero. Delizioso.
logic.crit_success=Ogni domanda risolta, ogni trucco scoperto. Potresti tenere un corso. || L'enigma si piega come carta. Ti appoggi indietro e la sedia scricchiola in segno di rispetto. || Un ragionamento perfetto, dall'inizio alla fine. Davvero brillante.
logic.soft_fail=Vicino, ma la logica ha un buco in cui ci passa un camion. || Ci sei quasi. «Quasi» sta facendo un sacco di lavoro qui. || La risposta è lì vicino. Non sai bene dove.
logic.crit_fail=Segui un'argomentazione molto convincente fino a un posto molto sbagliato. Crollo totale. || Tutto ciò in cui credevi tre minuti fa era sbagliato. E lo è anche ciò in cui credi adesso. || Sicurezza, una svista e un riavvio mentale completo. Ricominci da zero.
logic.headache=Troppe schede, troppi fatti. La testa comincia a pulsare. || Leggi lo stesso paragrafo sei volte e non diventa mai più facile. || Un dolore sordo dietro gli occhi dice che per oggi hai pensato abbastanza.
logic.rabbit_hole=Un link ha portato a un altro e ora nella tua testa sono le tre di notte. || Parti da una domanda semplice e finisci a leggere di formaggio medievale. || La ricerca è diventata interessante. La ricerca è diventata molto lunga.
logic.wrong_answer=Quanta sicurezza. La soluzione è stata più gentile del necessario. || Rispondi con sicurezza. La risposta è sbagliata con la stessa sicurezza. || Un'ipotesi audace, più audace che giusta.
logic.overthinking=Pensi così intensamente alla domanda che ti dimentichi quale fosse. || Più analizzi, meno ha senso. Pensare, ironicamente, fa male. || Costruisci una teoria perfetta e poi noti che partivi dal fatto sbagliato.
logic.argument=Spieghi la logica. {t} spiega perché è sbagliata. Ora state spiegando in due. || Il tuo argomento perfetto ha un buco che non avevi visto. {t} lo vede e non dice niente, a voce alta. || Vinci la discussione nella tua testa. A voce alta, la vince {t} con una frase.
logic.lost_thread=Parti con un punto chiaro e lo perdi a metà frase. {t} aspetta con garbo che torni. || La logica crolla a metà strada. Sbatti le palpebre verso {t} e dici «cosa stavo dicendo». || Un argomento impeccabile che si ferma impeccabilmente a metà. {t} annuisce come se avesse senso.
logic.pedantic=Correggi {t} su un minuscolo dettaglio. {t} ti guarda come se avessi mangiato l'ultimo biscotto. || Tecnicamente hai ragione. {t} ti fissa con l'energia di una porta chiusa. || Vinci un punto che non interessava a nessuno. {t} fa un lungo respiro.
logic.falls_asleep_reading=Il libro è così quieto. Chiudi gli occhi un attimo e ti svegli a pagina 40 con un segno sulla guancia. || Leggi tre righe, poi le parole cominciano a muoversi. Un pisolino è stato fatto.
logic.quiz_prize=Rispondi all'ultima domanda prima che il conduttore finisca di leggerla. Il premio è ${m} e un raro senso di superiorità. || Le tue conoscenze da quiz finalmente pagano: ${m}. Tutti quei fatti strani erano un investimento. || Risolvi l'indovinello in tempo record e un pop-up ti paga ${m}. Il Mensa non è raggiungibile per un commento.
finance.bonus=I numeri tornano e per una volta l'istinto ha ragione. Una piccola vittoria silenziosa. || Leggi il grafico come un libro e il grafico si comporta bene. Molto liscio. || Una mossa intelligente, una mano ferma e uno schermo verde. Ti fai un cenno di approvazione.
finance.crit_success=Ogni mossa va a segno. Il mercato ti adora e tu fingi modestia. || Compri basso, vendi alto e in qualche modo era tutto voluto. Leggendario. || Il grafico va in verticale a tuo favore. Chiudi il portatile come un cattivo da film.
finance.soft_fail=Niente di sconvolgente, solo un piccolo calo e molto strizzare gli occhi. || Chiudi in pareggio e lo chiami una lezione. Una lezione noiosissima. || Il mercato alza le spalle e anche tu.
finance.crit_fail=Vendi al minimo e compri al massimo, una doppietta rara. Il mercato se ne accorge. || Un clic sbagliato e tutto il piano va in rosso. Lo stomaco scende insieme al grafico. || Il grafico va in verticale, nella direzione sbagliata. Lo fissi come se ti dovesse delle scuse.
finance.bad_trade=Su questa operazione avevi certezze. Il grafico dissente, a voce alta. || La dritta veniva da uno sconosciuto molto sicuro di sé. Quello è stato il primo errore. || Resisti un po' troppo, poi vendi un po' troppo tardi. Un classico.
finance.panic=La linea scende e il cuore scende con lei. Aggiorni la pagina nove volte. || Numeri rossi ovunque. Respiri in un sacchetto di carta, figurativamente. || La mano ondeggia sopra il tasto vendi e trema. Il mercato non aspetta.
finance.rage=Dai al mercato nomi che un computer educato non dovrebbe sentire. || Sbatti il pugno sulla scrivania e il grafico continua a scendere. Maleducato. || Il tuo pugno e la scrivania hanno una breve riunione. Vince la scrivania.
finance.glitch=Il sito di trading va in crash nel secondo peggiore possibile. Anche il computer. || Un pop-up, una rotellina che gira e uno schermo bloccato. Il mercato ha preso in ostaggio la tua sessione. || La macchina si arrende sotto il peso delle tue cattive decisioni.
finance.scam=Un messaggio dice che hai vinto qualcosa. Ci clicchi. ${m} lasciano il conto in fretta e furia. || Un principe gentilissimo aveva bisogno di un piccolo favore. Il favore è costato ${m}. || L'investimento sembrava legittimo, con tanto di logo. Era solo un logo. ${m} sono spariti.
finance.lottery_counterfeit=Il biglietto è falso. Il tabaccaio è molto dispiaciuto e tu ci rimetti ${m}. || Un biglietto contraffatto, un sorriso allegro e ${m} andati. Quasi senti la stampante che ride. || I numeri sembrano giusti e la carta sembra sbagliata. Un falso molto convincente ti costa ${m}.
finance.lottery_washed=Il biglietto finisce in lavatrice con i jeans. Quel che resta sono coriandoli grigi e ${m} persi. || Trovi il biglietto nell'asciugatrice, ora una pallina di carta. Il premio resta non riscosso e il biglietto è costato ${m}. || Una tasca, una lavatrice e un biglietto fradicio. Giornata di pioggia, ${m} persi.
finance.lottery_old_draw=Festeggi per un minuto intero prima di accorgerti che era l'estrazione della settimana scorsa. Il biglietto è costato ${m} e così l'orgoglio. || I numeri sono perfetti. La data, purtroppo, no. ${m} per una lezione carissima. || Una grande vincita, qualche riga in piccolo e ${m} fuori dalle tue tasche. L'estrazione era della settimana scorsa.
finance.lottery_text_scam=Un SMS dice che hai vinto un premio e devi solo pagare una piccola commissione. La commissione è ${m}. Il premio non arriva mai. || Un messaggio amichevolissimo, un link che non dovevi cliccare e ${m} spariti. || «Riscuoti subito il tuo premio!» L'hai fatto. È costato ${m}.
finance.card_swallowed=La macchina inghiotte la carta e stampa una ricevuta che dice «buona fortuna». || Spunta una commissione nascosta. La fissi come se potesse cambiare.
finance.hidden_fee=Una piccola commissione che non avevi visto arrivare ti dà un piccolo morso ai soldi. || Ah, la «spesa di comodità». Comoda per qualcuno.
finance.lottery_dud=Gratti, speri, perdi. Il biglietto è un segnalibro carissimo. || Tre numeri coincidono. Su sei. Non quei tre.
finance.lottery_jackpot=Sei numeri, tutti tuoi. Leggi il biglietto tre volte, poi una volta ancora a voce alta. Il premio è ${m}. || I numeri si allineano uno dopo l'altro e il biglietto all'improvviso pesa molto. ${m} arrivano sul tuo conto. || Vinci ${m}. Cerchi la fregatura, non ne trovi e inizi a pianificare una festa molto responsabile.
finance.lottery_lucky=Un piccolo premio: ${m}. Non cambia la vita, ma basta per un altro biglietto. || Il biglietto paga ${m}. Lo chiami un segno e ignori con garbo le probabilità. || Due numeri uguali e ${m} per il disturbo. L'universo ti fa l'occhiolino.
finance.dividends=Un titolo che avevi dimenticato paga ${m}. Il te del passato ti saluta. || Arriva un minuscolo dividendo: ${m}. Non è molto, ma è tuo. || Il portafoglio titoli sputa ${m} come un gatto educato. Accetti il regalo.
finance.lottery_soft=Due numeri coincidono, uno è sbagliato di una cifra e gli altri non ci vanno nemmeno vicino. Il biglietto finisce nel cassetto della speranza. || Gratti con grande cerimonia. Niente. Gratti di nuovo, per sicurezza. || Non vincente. Il biglietto fa un suono piccolissimo e cortesissimo: «avrai più fortuna la prossima volta».
gaming.bonus=I riflessi sono pronti, la squadra è chiacchierona e il bottino è generoso. Una bella serata. || Chiami la mossa, il team ti segue e lo schermo dice VITTORIA. La sedia gira un po'. || Tutto scatta. La mira, il tempismo, lo snack. Sei tu il protagonista.
gaming.crit_success=Una partita impeccabile. La chat è in piedi e anche tu, a stento. || Vinci un match che nessuno credeva vincibile. Ti alzi e fai un piccolo giro d'onore. || Primo posto, zero morti e una clip da mandare a tutti.
gaming.soft_fail=Perdi il round ma mantieni la calma. Più o meno. || Una sconfitta di misura. Dai la colpa al lag e parti con un altro round. || Non il tuo match migliore, non il peggiore. Il controller sopravvive.
gaming.crit_fail=Chi è in squadra con te se ne va, la connessione se ne va, poi se ne va la corrente. Lo schermo diventa nero nel mezzo di una partita perfetta. || Sbrocchi così forte che la tastiera chiede un ordine restrittivo. Match perso, e anche di più. || Esci, rivincita, perdi, esci. Da qualche parte vola un controller. Nessuno ne va fiero.
gaming.rage_quit=Perdi per un bug che era chiaramente colpa del gioco. Sei la calma fatta persona. Anzi, per niente. || A cinque minuti dalla vittoria spunta un pop-up e chiude il match. Dici parole. || Il boss finale ti fa fuori in un colpo per la nona volta. La sedia assorbe la tua frustrazione.
gaming.burnout=Dopo tre ore piene gli occhi sono secchi e i pollici fanno male. Forse una pausa farebbe bene. || Avevi promesso un'ultima partita. Era sei partite fa. La schiena presenta reclamo. || Il gioco continua. Tu no. Un lungo sospiro e un lungo stiracchiamento.
gaming.crash=Il gioco si blocca, la ventola urla e lo schermo si spegne. Il computer ne ha abbastanza delle tue partite. || Troppe schede, troppe mod e un boss di troppo. La macchina si arrende. || Un forte pop dal case, poi silenzio. Il salvataggio è da qualche parte nell'aldilà.
gaming.pc_fire=Le ventole del PC urlano, una fiamma spunta dal case e tutto si spegne. Il tuo salvataggio ha avuto una bella vita. || Fumo, una fiammella e un computer morto. Forse era comunque ora di un upgrade. || La scheda video ha scelto la violenza: una fiamma, poi lo schermo nero. Nessuno ti incolpa. Tutti ti incolpano.
gaming.microtransaction=Tocchi un pulsante luccicante per vedere cosa fa. Fa un acquisto da ${m}. La spada è un cappello. || Una loot box si apre con fuochi d'artificio e un addebito di ${m}. Dentro: un trofeo minuscolo. || Il gioco offre un pacchetto iniziale per tempo limitato. Il tempo era adesso, il prezzo ${m}.
gaming.tournament=Chiudi l'ultimo round con un solo punto vita. Il montepremi paga ${m}. Urli in una stanza silenziosissima. || Un minuscolo torneo online, un minuscolo premio e una grande spinta all'ego: ${m} sono tuoi. || La tua squadra vince e tutti urlano in chat vocale. La vincita è ${m} e non ricordi niente del match.
gaming.stream_tips=Qualcuno che guarda il tuo stream manda ${m} e il messaggio «bella mossa». Fanno bene entrambi. || Chi ti guarda lascia ${m} per il clima. Lo ringrazi in diretta, due volte. || Un pubblico minuscolo, una mancia di ${m} e abbastanza fiducia per fare stream anche domani.
media.bonus=Il montaggio scorre, i colori risaltano e il file si esporta senza un solo errore. Magia. || Il tuo montaggio ha ritmo. Persino il b-roll sembra voluto. || Un render pulito, una timeline pulita e un cenno molto compiaciuto.
media.crit_success=Un capolavoro in divenire. Premi salva con una riverenza silenziosissima. || Il video sembra un vero film. Lo riguardi tre volte per sicurezza. || Ogni fotogramma è giusto, ogni taglio è perfetto. Ora sei un autore.
media.soft_fail=Si esporta, ma l'audio è leggermente fuori sincrono. Nessuno se ne accorgerà. Probabilmente. || Il colore è un po' sballato, il taglio un po' grezzo. Abbastanza buono, quasi. || Un tentativo decente. Il risultato finale dice «da migliorare».
media.crit_fail=Il software si mangia tre ore di lavoro e poi l'intero progetto. Nemmeno un backup. || Premi render e il computer risponde. Scintille, fumo e una stanza silenziosissima. || L'esportazione va in crash, il file si corrompe e la timeline è una mappa dei rimpianti.
media.render_crash=La barra del render arriva al 99 percento e la macchina si addormenta per sempre. || Il computer diventa rumoroso, caldo e poi molto, molto silenzioso. || La ventola urla, lo schermo sfarfalla e il progetto muore di morte infuocata.
media.corrupted=Il file si rifiuta di aprirsi. Ci provi nove volte. Si rifiuta nove volte. || Un solo clic sbagliato e la clip diventa statico verde. || Il progetto si è salvato come un file piccolissimo e rotto.
media.burnout=Otto ore di montaggio e la timeline sembra sempre uguale. Gli occhi non sono d'accordo con l'orologio. || Fissi gli stessi due secondi di girato per un'ora. Loro ti fissano di rimando. || La schiena dice no, gli occhi dicono no e la timeline dice forse domani.
media.bad_take=Guardi il montaggio finale e fai una smorfia. È andato storto un po' di tutto. || L'audio è basso, il video è buio e la battuta non fa ridere. || Da qualche parte tra l'idea e il video, l'idea si è persa.
media.copyright=Sul tuo video compare una segnalazione di copyright. La canzone erano «solo cinque secondi». La multa è ${m}. || Uno studio trova la clip che avevi «modificato abbastanza». I loro avvocati ti fatturano ${m}. || Il tuo capolavoro usa una colonna sonora famosissima senza permesso. ${m} se ne vanno in danni.
media.viral=Il tuo video esplode in una notte e arrivano gli introiti pubblicitari: ${m}. I commenti dicono «primo». Sempre. || Una clip che avevi quasi cancellato diventa virale. La piattaforma manda ${m} e il telefono non smette di vibrare. || Tutti condividono il tuo montaggio. Un marchio si infila con ${m} e un'email sospettosamente calorosa.
media.sponsor=Un piccolo marchio ama il tuo canale e manda ${m} per dirti che il tuo logo sta bene nell'angolo. || Uno sponsor paga ${m} per essere nominato otto secondi. Tu lo nomini nove. || Un codice sconto e ${m} per il disturbo. Il marketing con te funziona davvero.
music.bonus=Una melodia arriva dal nulla e si siede come se abitasse qui. Bello. || Gli accordi calzano come se ti stessero aspettando. Il ritmo è rilassato e sicuro. || Fischietti il ritornello e funziona e basta. Un motivetto da tenere.
music.crit_success=Un successo. Senti la folla cantare con te, e la folla sei solo tu. || La canzone si scrive da sola, poi si suona da sola, poi ti fa piangere un po'. Bellissima. || Il ritornello perfetto, il ritmo perfetto, il finale perfetto. Una vera bomba.
music.soft_fail=La melodia è carina, il resto no. La salvi come «bozza 14». || Un inizio decente con un centro molto incompiuto. || La canzone va da qualche parte, ma non in un bel posto.
music.crit_fail=Il brano suona come un gatto che cammina su un pianoforte in un tunnel. Tutti si tappano le orecchie. || Cancelli l'intera sessione per sbaglio. Il silenzio è molto istruttivo. || La canzone è terribile, e poi in qualche modo peggiora. Un nuovo record.
music.off_key=Fai una nota con cui il resto della canzone non è d'accordo. A voce alta. || Da qualche parte tra la strofa e il ritornello, la tonalità è cambiata senza avvisarti. || Una nota sbagliata, una lunga pausa e una smorfia molto sincera.
music.block=Fissi una traccia vuota per un'ora. Vince la traccia vuota. || Ogni idea suona come qualcosa che hai già sentito. Perché l'hai già sentita. || L'ispirazione si è presa il giorno libero e non ha lasciato un biglietto.
music.lost_file=Il progetto si chiude senza salvare. La tua canzone vola via come un palloncino. || Un clic sbagliato cancella la parte migliore del brano. Era la parte bella. || Il file di salvataggio si rivela vuoto. Il tuo genio è sparito, in modo molto silenzioso.
music.studio_bill=Lo studio ti prenota per una sessione rapida. Il conto è ${m}, con un addebito per una sedia su cui non ti sei mai seduto. || Noleggi un microfono più bello per l'atmosfera. L'atmosfera costa ${m}. || Un turnista disdice all'ultimo e tiene la caparra: ${m}. L'assolo di chitarra era immaginario comunque.
music.string_snaps=Una corda di chitarra si spezza con un botto e ti frusta in faccia. Brucia, e brucia anche l'orgoglio. || La corda fa «twang» in un modo che non dovrebbe.
music.dropped_stick=Una bacchetta ti vola di mano e atterra in un posto sfortunato. || Colpisci il ritmo. La bacchetta colpisce il pavimento. Il ritmo è andato.
music.sticky_keys=I tasti ti combattono. Ogni accordo esce leggermente sbagliato, e con tanta sicurezza. || Le dita si incrociano e il risultato suona come un gatto che cammina su una tastiera.
music.dj_scratch=Lo scratch è forte, sbagliato e molto orgoglioso di sé. || Premi il tasto sbagliato e il brano si ferma di colpo. Il silenzio è brutale.
music.royalties=Il tuo brano passa in un bar da qualche parte e arrivano i diritti: ${m}. La rockstar che hai dentro si drizza. || Una serie licenzia la tua melodia e manda ${m}. La canticchi tra te per il resto della giornata. || Arriva un assegno dallo streaming con ${m}. Decine di ascoltatori. Forse centinaia. Ok, forse tuo cugino.
music.tips=Un amico apprezza così tanto la tua demo che ti manda ${m}. Sostieni l'arte. || Un ascoltatore manda ${m} con il messaggio «ancora, per favore». Ubbidisci subito. || Qualcuno lascia ${m} nel tuo cappello virtuale. È, tecnicamente, un cappello.
performance.bonus=Il ritmo prende il sopravvento e centri ogni battuta. La sala è tua. || Scivoli nella coreografia come se la coreografia fosse nata con te.
performance.crit_success=Una standing ovation, in una stanza da una persona. Risplendi comunque.
performance.soft_fail=Sbagli un passo o due ma tieni il ritmo. Nessuno se n'è accorto. Probabilmente.
performance.crit_fail=Scivoli, giri e atterri in uno splash di vergogna. Persino il ritmo si prende un minuto di silenzio.
performance.embarrassed=Le mosse sono audaci, il tempismo no. Ti blocchi a metà passo e fai finta che la musica si sia fermata. || Tutti guardano, e non nel modo giusto. Saluti con imbarazzo e lasci il palco.
performance.stage_fright=Il riflettore ti colpisce e le gambe dimenticano tutto. Senti solo il tuo battito. || Entri in scena e il ritmo esce. Da qualche parte un pubblico di zero persone ti giudica.
performance.sad=Balli come se nessuno ti guardasse, poi ti accorgi che nessuno lo faceva. Segue un sospiro sommesso. || La musica finisce e anche la tua sicurezza. Forse un altro giorno.
performance.fined=Un vicino presenta un esposto per rumore e il comune ti multa di ${m}. L'arte, come sempre, ha un prezzo. || Un ispettore dice che il tuo numero richiede un permesso. È vero. La multa è ${m}. || Qualcuno chiama le autorità per la tua esibizione. La multa costa ${m}, e lo spettacolo continua in spirito.
performance.flat_note=La prima nota è bellissima. La seconda è da un'altra parte. {t} sorride e sopporta. || Miri al cuore e colpisci un altro tasto. {t} applaude con garbo lo sforzo. || La serenata prende una nota che farebbe abbaiare il cane, se ci fosse un cane. {t} annuisce con coraggio.
performance.forgot_lyrics=Dimentichi le parole a metà canzone. {t} aspetta, a mani giunte, con uno sguardo dolce. || Il testo ti svanisce dalla testa. Fischietti un po' e fai finta che fosse voluto. || Ti blocchi nel ritornello. {t} sorride e ti suggerisce a labbra la riga successiva.
performance.too_loud=Canti così forte che {t} sobbalza. Forse l'hanno sentito anche i vicini. || La serenata è appassionata e assolutamente assordante. {t} si copre un orecchio con garbo. || Troppo volume, poco controllo. {t} vorrebbe che la canzone finisse, ma con dolcezza.
performance.mic_feedback=Il microfono urla in un loop di feedback. Tutti si tappano le orecchie. || Un fischio acuto, un silenzio stordito e un saluto di scuse.
performance.joke_dies=Arriva la battuta finale. Nessuno ride. Un grillo sì. || Racconti la battuta alla perfezione. Il pubblico consegna il silenzio.
performance.cracked_voice=La voce si incrina sulla nota alta e continua un po' più del dovuto. || La nota acuta era un'idea audace. È finita in un rantolo.
performance.knockout={t} perde le staffe e tira un pugno. Arriva a segno e finisci a terra come un sacco di panni sporchi. || Quella battuta è stata la goccia. {t} sferra un colpo e la stanza si inclina. Ti svegli a fissare il soffitto. || {t} avvampa e ti colpisce in pieno. La tua dignità lascia l'edificio prima che tu tocchi terra.
performance.fight={t} ne ha abbastanza. Una spinta, una parola ad alta voce e all'improvviso siete in una rissa. || Era un passo di troppo. {t} si mette in guardia e ti si getta addosso a pugni stretti. || {t} la prende molto sul personale e risponde a suon di pugni. Chi la fa, l'aspetti.
performance.police={t} ne ha avuto abbastanza e sta già chiamando. Ti sta arrivando una denuncia. || {t} ti fissa per un secondo e dice: «Chiamo la polizia.» Sembra proprio che dica sul serio. || È andata male. {t} presenta denuncia contro di te prima ancora che finisca di scusarti.
performance.big_tip=Un passante lascia ${m} nel tuo cappello e non dice niente. Il silenzio è il complimento. || La folla impazzisce e uno sconosciuto lascia ${m}. Ti inchini, poi li conti due volte. || Nessun talent scout si presenta, ma ${m} sì. Te li prendi.
performance.busking_tips=Qualche moneta diventa ${m} a fine canzone. Qualcuno ha persino applaudito. || Un bambino lascia ${m} nel tuo cappello e scappa via. Un minuscolo mecenate. || Il cappello è più pesante di stamattina: ${m}. I piccioni applaudono.
performance.knockout_death=Il pugno di {t} arriva a segno e crolli a terra... e non ti svegli più. Fine. || Un colpo di {t}. Cadi, la stanza si fa silenziosa e non ti rialzi. Partono i titoli di coda. || {t} sferra un solo pugno. È, purtroppo, l'ultima cosa che noti. Fine.
dance.bonus=Parte il beat e il corpo sa già dove andare. Fluido, senza sforzo, un po' compiaciuto. || Esegui ogni mossa come se la coreografia fosse scritta solo per te. || Qualcuno lì vicino inizia a battere le mani a tempo. Fai finta di niente e aggiungi un giro.
dance.crit_success=Ritmo puro. Persino i mobili sembrano ondeggiare. || Fai una mossa così pulita che quasi applaudi te stesso. || La sala si zittisce per un secondo, poi parte il finale. Status di leggenda.
dance.soft_fail=Sbagli un passo o due ma tieni il ritmo. Nessuno se n'è accorto. Probabilmente. || Un piccolo inciampo, un rapido strascico e vai avanti come se fosse coreografato. || Il tempismo va alla deriva per qualche battuta, poi ritrova la strada.
dance.crit_fail=Ti butti in un giro e il pavimento si butta nel vincere. Gravità 1, tu 0. || Il piede va da una parte, il resto di te non è d'accordo. L'atterraggio non è aggraziato. || La mossa nella tua testa sembrava ottima. La stanza l'ha vista e ora non può più dimenticarla.
dance.puddle_slip=Una pozzanghera sospetta aspetta sulla pista. La trovi con un giro. || Lanci la mossa grossa, il piede trova una pozza e il resto è una danza di un altro tipo. || Nessuno ha visto quella pozza. Tutti stanno per vedere te dentro.
dance.embarrassed=Le mosse sono audaci, il tempismo no. Ti blocchi a metà passo e fai finta che la musica sia cambiata. || Prendi la posa per il gran finale e la canzone va avanti senza di te. || Qualcuno guarda, e non nel modo giusto. Saluti con imbarazzo e lo chiami arte.
dance.exhausted=Dopo tre canzoni le gambe presentano reclamo. Per te è finita, e anche la batteria. || L'entusiasmo c'era. La resistenza si è presa la serata libera. || Balli finché le ginocchia non prendono la parola, poi ti siedi e rifletti sulle tue scelte.
dance.sad=Balli come se nessuno ti guardasse, poi ti accorgi che nessuno lo faceva. Segue un sospiro sommesso. || La musica finisce e anche la tua sicurezza. Forse un altro giorno. || La pista è vuota. Per un attimo, anche tu.
dance.stepped_on=Pesti il piede di {t} con la grazia di un pianoforte che cade. Far finta che non abbia fatto male richiede sforzo. || Il ballo va bene fino al terzo passo. {t} saltella su un piede e ci ride su, più o meno. || Due piedi sinistri, i tuoi e i suoi. {t} dice «colpa mia» e sapete entrambi che non è vero.
dance.dizzy=Il giro è troppo veloce e la stanza si inclina. Tu e {t} vi cadete addosso, tra giramenti di testa e risate. || Giri, il mondo continua a girare e perdi l'equilibrio. {t} ti afferra, o ci prova. || Gira che ti rigira finché il terreno sparisce. {t} geme, senza mollare la presa.
dance.dip_dropped=Il casquè va storto e {t} ti scivola dalle braccia. Una caduta elegante, tecnicamente. || Ti pieghi nel casquè, {t} si piega via e il pavimento si prende entrambi. Ballare con la gravità. || A metà casquè la presa cede. {t} finisce a terra e dice «ahi» in due sillabe.
dance.in_sync=Tu e {t} vi muovete come una cosa sola. Il ritmo scatta e tra voi cresce un po' di calore. || Ogni passo si allinea. {t} sorride come per dire che ne valeva la pena. || Un giro perfettamente a tempo, una risata condivisa. Tu e {t} finite il ballo più vicini di quando avete iniziato.
dating.bonus=Il tuo profilo riceve una bella reazione e una risposta divertente. Per niente male. || La chat scorre, le battute funzionano e qualcuno dice di apprezzare il tuo senso dell'umorismo. || Un match, una risata e un piano promettente. Arrossisci davanti allo schermo.
dating.crit_success=Un match perfetto, una chat fantastica e un appuntamento che sembra un film. Risplendi. || Tre persone rispondono insieme e sono tutte deliziose. Che problema da avere. || La foto, la bio e il tempismo sono tutti perfetti. Internet ti adora.
dating.soft_fail=Un paio di risposte educate e nessuna scintilla. Il profilo merita un'altra occhiata. || Fai match con qualcuno e la chat muore dopo «ciao». || L'app ti mostra qualche faccia. Nessuna ricambia il saluto.
dating.crit_fail=Mandi un messaggio alla persona sbagliata, il messaggio sbagliato e la foto sbagliata. Tutto insieme. || Il tuo profilo viene segnalato da qualcuno con cui hai fatto match. In qualche modo è colpa tua. || Disastro totale: un refuso nel tuo nome, una foto sfocata e una risposta che dice «chi?».
dating.ghosted=La chat andava così bene, poi l'altra persona è sparita. Nemmeno un saluto. || Compaiono tre puntini, scompaiono e non tornano più. Li fissi comunque. || Hanno letto il messaggio e l'hanno lasciato lì. Il silenzio è assordante.
dating.catfish=Le foto erano molto diverse dalla persona. Molto diverse. Specie diversa, perfino. || Il match affascinante si rivela un bot con un copione molto buono. || Il profilo diceva «alto, divertente, onesto». La chat diceva «mandami una carta regalo».
dating.awkward=Il tuo primo messaggio era una battuta lunghissima che richiedeva molte spiegazioni. || Rispondi «haha» in un modo che esce molto triste. || Una frase di abbordaggio da brividi, inviata con una sicurezza indifendibile.
dating.typo=La correzione automatica trasforma un messaggio dolce in qualcosa di profondamente sfortunato. || Premi invio, poi vedi il refuso. Il refuso è nella prima parola. || Un piccolo errore, una differenza di significato enorme. Questo te lo ricorderai.
medicine.bonus=La medicina agisce in fretta e la testa ovattata si libera. Ti senti quasi un'altra persona. || Dose giusta, momento giusto. Il naso si libera e anche l'umore. || La pillola fa il suo lavoro in silenzio. Decidi di fidarti di più delle pillole.
medicine.crit_success=Dose perfetta, tempismo perfetto. Ti senti meglio di prima di ammalarti. || La medicina fa effetto come in un montaggio da film. Volano fazzoletti, parte la musica, la guarigione è servita. || Trattamento da manuale. Da qualche parte un dottore prova uno strano senso di orgoglio.
medicine.soft_fail=Scuoti il flacone, sospiri e fai finta di darti da fare. || Decidi che il raffreddore non è poi così grave. Il raffreddore non è d'accordo. || Metti via la medicina per dopo. Dopo è molto lontano.
medicine.crit_fail=Prendi il flacone sbagliato. L'etichetta diceva «per piante». Ti senti molto fogliame. || La pillola rotola sotto il divano e ne prendi un'altra lì accanto. Audace. Non furbo. || Prendi una medicina pensata per tutt'altro. Il tuo corpo presenta reclamo formale.
medicine.wrong_dose=Strizzi gli occhi sull'etichetta, tiri a indovinare e sbagli. La medicina non è quel tipo di gioco. || Ne prendi un po' troppo poca, poi un po' troppa. Il raffreddore resta e ti senti strano. || Le istruzioni erano chiare e non ne hai letta una. Il raffreddore è ancora qui.
medicine.side_effects=La medicina non risolve niente e ti fa venire sonno. Complimenti: un raffreddore con il mal di testa. || Allo stomaco la pillola non piace. Al raffreddore non importa. || Leggi gli effetti collaterali dopo averla presa. Erano più di quanti pensassi.
mourning.bonus=Un abbraccio lungo e caldo. {t} lascia uscire un respiro che sembra trattenuto da tutto il giorno. || Non dici molto, e non serve. {t} si appoggia a te e la stanza si fa un po' più quieta.
mourning.crit_success=Stringi {t} e le parole smettono di contare. Piangete, ridete un po' e per la prima volta oggi sembra sopportabile. || {t} si sfalda tra le tue braccia e tu lo permetti. Alla fine siete entrambi più leggeri di quando avete iniziato. || Certi abbracci dicono ciò che nient'altro può. Questo dice tutto, e il peso su entrambi si alleggerisce in un colpo.
mourning.soft_fail=L'abbraccio è rigido e breve. {t} annuisce con educazione e la perdita pesa un po' di più di prima. || Dai a {t} una pacca sulla schiena come a uno sconosciuto alla fermata dell'autobus. Entrambi sentite il vuoto. || Le braccia ci sono ma le parole no. Il silenzio dopo è lungo e triste.
mourning.crit_fail=Non molli la presa un attimo di troppo, dici esattamente la cosa sbagliata e {t} piange ancora più forte. Anche tu. || L'abbraccio diventa una gara di singhiozzi del tipo sbagliato. Il dolore ora è più pesante, e diviso in parti uguali. || Le intenzioni sono buone, davvero. Esce la cosa peggiore che potevi dire. {t} resta in silenzio, e anche tu.
mourning.fail=Dici «condoglianze» come se le leggessi da un biglietto. {t} ti ringrazia e nessuno dei due si sente meglio. || L'abbraccio arriva nel momento sbagliato e il dolore si fa solo più forte. Nessuno sa dove mettere le mani. || Cerchi di consolare {t} e finisci per ricordare a entrambi tutto ciò che manca.
mourning.pass=Un bell'abbraccio. Non risolve niente, ma aiuta. || Stringi {t} per un po'. Certe cose sono più facili quando qualcun altro ne porta una parte.
sink.bonus=L'acqua esce calda al primo colpo. Qualcuno lassù ti vuole bene. || Le mani escono così pulite che cigolano. I chirurghi sarebbero gelosi. || Pressione perfetta, temperatura perfetta. Un piccolo miracolo in bagno.
sink.crit_success=Mani, viso, denti, tutto immacolato. Lo specchio applaude. || Il lavandino si comporta così bene che meriterebbe una medaglia.
sink.soft_fail=L'acqua è tiepida e il sapone quasi finito, ma ce la fai. || Un po' di schizzi, tanti borbottii, e di pulizia ce n'è abbastanza.
sink.crit_fail=Guarda che disastro hai combinato. Attento a dove metti i piedi, non scivolare! || Giri il rubinetto e tutto il lavandino si arrende. Acqua ovunque, dignità da nessuna parte. || Il tubo emette un gemito, un pop e un geyser. Il bagno ora è una piscina.
sink.flood=Guarda che disastro hai combinato. Attento a dove metti i piedi, non scivolare! || Il rubinetto si stacca e l'acqua va ovunque. Occhio alla pozza, genio. || Uno schiocco, un sibilo, una fontana. Il lavandino è rotto e c'è una pozza proprio sotto i tuoi piedi.
sink.frustrated=Lotti con il rubinetto finché non si arrende. Calma: zero. || Ogni volta che giri la manopola peggiora. Fulmini i tubi come se ti dovessero dei soldi.
sink.splash=Ti schizzi dritto in faccia e vorresti riavvolgere di un minuto. || Il rubinetto spruzza di lato e ti inzuppa la maglietta. Molto elegante.
sink.slip=Metti il piede sul bagnato che hai appena fatto. La gravità presenta reclamo. || Il pavimento è scivoloso, i calzini sono scivolosi e anche la tua fortuna.
sink.fail=Il rubinetto sputacchia, tossisce e ti spruzza in faccia. Maleducato. || L'acqua diventa fredda, poi calda, poi di nuovo fredda. Il lavandino ha una personalità. || Combatti con il rubinetto e il rubinetto vince.
sink.pass=Una lavata normale, noiosa e perfettamente funzionale.
toilet.bonus=Tutto funziona. Sono le piccole vittorie che contano. || Una visita impeccabile. Il trono di porcellana approva.
toilet.crit_success=Uno sciacquone così fluido che dovrebbe stare in un catalogo. || Una visita perfetta. Il bagno profuma come una spa.
toilet.soft_fail=Servono due scarichi, ma funziona. Nessuno ha visto niente. || Un po' rumoroso, un po' lento, e hai finito.
toilet.crit_fail=Il water gorgoglia in un modo che sembra costoso. Attento a dove metti i piedi! || Qualcosa è andato storto con l'impianto mentre eri impegnato. Calma e non scivolare. || Un orribile gorgoglio e una pozza sospetta che si allarga ai tuoi piedi. Te ne vai con grande dignità.
toilet.overflow=Il water ha gorgogliato in modo sinistro e ora l'acqua si sta allargando. Attento a dove metti i piedi, non scivolare! || C'è una pozza ai tuoi piedi. Fai come se non stesse succedendo niente. || La tazza ha sputato un'onda a sorpresa. Ora sei in piedi in una pozza e cerchi di sembrare dignitoso.
toilet.clog=Premi il pulsante e lo scarico gorgoglia, ci pensa su e si arrende. Fissi la tazza in silenzio. || Lo sciacquone non fa niente. Riprovi, e riprovi. Il water ha scelto la violenza.
toilet.gross=Chiunque sia stato qui prima di te ha lasciato una sorpresa. Il tuo stomaco non gradisce. || Guardi nella tazza, te ne penti e distogli lo sguardo velocissimo.
toilet.embarrassed=Hai quasi la certezza che qualcuno abbia sentito. Fai finta che fossero i tubi. || La porta non era chiusa a chiave. Nessuno ha bisogno di parlarne.
toilet.fail=Lo scarico è debole e il water fa un rumore sconveniente. Fai finta di niente. || La tavoletta è fredda, la carta è finita e la giornata parte male.
toilet.pass=Missione compiuta. Niente è esploso.
